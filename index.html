   "html": "<div class=\"detail-head\"><h2>ビジネスの段取り</h2><span class=\"badge decided\">2026-11-20 登録</span></div>\n        <p class=\"sec-lead\">事業リストが「何を持っているか」の地図で、各事業の「初歩段階」が段階1の手引きだとしたら、このページはその間にある知識——事業というものが、始まってから稼ぐまでに、どういう段階を経るかという一生の段取り。どの事業もこの順番を通る。順番を知っていると、「いま自分がどこにいて、次に何が来るか」が見える。</p>\n        <div class=\"card\">\n          <h3>全体像——事業の5段階</h3>\n          <div class=\"flow\"><span>段階0 準備</span><i>→</i><span>段階1 検証</span><i>→</i><span>段階2 継続販売</span><i>→</i><span>段階3 運営と改善</span><i>→</i><span>段階4 拡大</span></div>\n          <p>この5段階は、成功逆算マップのStage 0〜5と、検証のはしご（段0〜段4）、計画のフェーズ設計を、事業一般の言葉に直したもの。事業ごとに中身は違っても、段階の順番と「終わりの判定」は共通している。段階は飛ばせない——前の段階の判定を通っていないのに次へ進むと、どこで間違えたか分からなくなる。</p>\n          <ol class=\"steps\">\n            <li data-n=\"0\"><span class=\"st\">段階0 準備</span><span class=\"sd\">目的は、売る物の仮説を「誰が・何に困って・いくらで買っているか」まで具体化すること。終わりの判定は、題材が一文で言えて、判定ラインと撤退ラインが先に決まっていること。お金は、収入はまだ無く、出すのは原則として時間だけ</span></li>\n            <li data-n=\"1\"><span class=\"st\">段階1 検証</span><span class=\"sd\">目的は、仮説が本物かを「売れた／反応があった」という事実で確かめること。各事業の「初歩段階」は、この段階の手引きになっている。終わりの判定は、判定ラインに触れること（最初の売上、または基準を超える反応）。お金は、ここで最初の収入が生まれる。金額は判定の材料であって、生活費ではない</span></li>\n            <li data-n=\"2\"><span class=\"st\">段階2 継続販売</span><span class=\"sd\">目的は、1回売れた形を「いつでも買える形」に固定すること。終わりの判定は、同じ形で2回目以降の売上が立つこと。お金は「点」から「線」になり始める。入金の遅れが効いてくるのはここから</span></li>\n            <li data-n=\"3\"><span class=\"st\">段階3 運営と改善</span><span class=\"sd\">目的は、数字を見て直すリズムを作ること。この段階に終わりはなく、事業が続く限り回し続ける。判定は「先月と比べて何が変わったか、数字で言えるか」。お金は、月ごとの売上が読めるようになる</span></li>\n            <li data-n=\"4\"><span class=\"st\">段階4 拡大</span><span class=\"sd\">目的は、自分の時間を増やさずに売上を増やすこと。当たった型の複数化と仕組み化、お金で手を買うことが仕事になる。終わりの判定は、自分が手を止めても売上が落ちない部分が生まれること。お金は、資産フェーズ（お金タブ）の入口に届く規模になる</span></li>\n          </ol>\n        </div>\n        <div class=\"card\">\n          <h3>段階ごとの中身</h3>\n          <p><strong>段階0 準備</strong>——決めるための段階。</p>\n          <ul>\n            <li><strong>やること</strong>：市場の実物を見る（実際に売れている同種の物と、その価格・売れ方）／型を1つ決める（形式・売り場・価格の仮置き）／判定ラインと撤退ラインを、始める前に書いておく</li>\n            <li><strong>つまずき</strong>：調べ続けて始めないこと。準備は決めるためのもので、知識が全部揃うのを待つ段階ではない</li>\n          </ul>\n          <p><strong>段階1 検証</strong>——小さく売ってみる段階。</p>\n          <ul>\n            <li><strong>やること</strong>：最小の形で公開する／決めた本数・期間だけ回す（事業ごとの「初歩段階」の手順がこれにあたる）／結果を数字で記録する</li>\n            <li><strong>つまずき</strong>：判定ラインを後から動かすこと。決めた本数を出し切る前に諦めること。反応ゼロは失敗ではなく「型が違う」という判定材料</li>\n          </ul>\n          <p><strong>段階1→2の境目</strong>——「1回売れた」と「回り始めた」は別物で、ここを取り違えると段取り全体が崩れる。</p>\n          <ul>\n            <li><strong>1回には偶然が混ざる</strong>：知り合いの購入、たまたまの露出、一時的な話題。1回の売上は「当たった」証拠にはならない</li>\n            <li><strong>回り始めたと言える証拠</strong>：同じ形で繰り返し売れる／宣伝していない時にも売れる／転換率などの数字が再現する</li>\n            <li><strong>仕事が切り替わる</strong>：段階1の仕事は「型が当たったか」の判定、段階2の仕事は「当たった型を固定すること」。当たった直後に形や価格を変えると、せっかくの証拠が消える</li>\n          </ul>\n          <p><strong>段階2 継続販売</strong>——形を固定する段階。</p>\n          <ul>\n            <li><strong>やること</strong>：売り場・価格・導線を固定する／売れた物が残り続ける形にする（在庫・バックリスト・公開され続けるURL）／価格は下げない（下げると、既に買った人の持つ価値まで壊れる）</li>\n            <li><strong>つまずき</strong>：売れた勢いで題材や売り場を増やしすぎること。まず1つの形を「線」にすること</li>\n          </ul>\n          <p><strong>段階3 運営と改善</strong>——数字で回す段階。</p>\n          <ul>\n            <li><strong>見る数字</strong>：売上＝アクセス×転換率×単価（数字の式の分解）。事業ごとの物差しも固定する（アフィリエイトなら発生→承認→確定の3つの数字。アプリなら利用者と課金の数字）</li>\n            <li><strong>リズムの作り方</strong>：出すたびに記録する／週に1回、数字を置いて眺める／月に1回、「続ける・直す・やめる」を判定する。直すのは1回に1か所だけ——同時に変えると、何が効いたか分からなくなる</li>\n            <li><strong>つまずき</strong>：数字を見ずに新作ばかり増やすこと。運営は地味だが、売上の差はここで付く</li>\n          </ul>\n          <p><strong>段階4 拡大</strong>——仕組みに任せる段階。</p>\n          <ul>\n            <li><strong>やること</strong>：当たった型の複数化（商品点数・売り場・蛇口を増やす）／作業の仕組み化（工程として固定し、AIや外注に渡せる形にする）／人を入れる（お金で手を買う）</li>\n            <li><strong>つまずき</strong>：段階2〜3が固まる前に広げること。薄い量産はプラットフォームの評価を落とす（AIパイプラインの注意と同じ構造）</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>事務の段取り</h3>\n          <p>事業のお金と並んで、事務の段取りも進む。順番の要点は2つだけ——事務の大半は「最初の売上が立ってから」で間に合うこと。そして青色申告だけは、期限が先に来ること。</p>\n          <ul>\n            <li><strong>最初の売上まで</strong>：要るのは、売り場のアカウントと振込先の登録くらい。届け出はまだ要らない。お金の勉強の地図でも「守りの実務」はステップ5で、『最初の収益が出たら』が開始の合図になっている</li>\n            <li><strong>開業届</strong>：個人事業を始めたことを税務署に届ける書類で、無料で出せる。「事業として続ける」と決めた時点が出しどきの目安。様式や出し方の細部は、出す時に最新を確認する</li>\n            <li><strong>青色申告承認申請</strong>：開業から2か月以内に出すのが節目で、最大65万円の控除がかかる。期限を逃すと、その年は青色申告が使えない。実務の勘所は「最初の売上が立ったら、まずこの期限を確認する」こと</li>\n            <li><strong>お金と記録の置き場所</strong>：事業のお金は、生活のお金と分けて記録する。口座を分けるのが一番確実で、最低限、売上・手数料・経費の記録を1か所にそろえる。この記録が、そのまま確定申告の材料になる</li>\n            <li><strong>販売時の表示義務（特定商取引法）</strong>：自分の売り場で直接売る場合、販売者の表示が要る。特商法の「請求があれば開示」は完全な匿名化ではない（ルールの線引きどおり）。売り場の仕組みに乗る販売（メルカリ・BOOTH・noteなど）では表示の形が違うので、売り場ごとに開始時に確認する</li>\n            <li><strong>確定申告</strong>：年に1回、その年の所得を申告する。海外での売上も含めた全世界所得が対象で、事業所得（または雑所得）として申告し、プラットフォームの手数料は経費にできる。最初の申告は、最初の収益が出た年の分から</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>お金が届くまでの遅れ</h3>\n          <p>「売れた」と「お金が手元にある」は、同じではない。間には、承認・保留・締め・最低出金額が挟まる。この遅れは、最初の段階で一番つまずきやすい場所になる。</p>\n          <ul>\n            <li><strong>アフィリエイト</strong>：成果が発生しても、広告主の承認を経て初めて確定し、そこから支払いのサイクルに乗る。発生から入金までは月単位の遅れが出るのが普通で、否認されればその分はゼロになる（候補4の「成果の測り方」のとおり）</li>\n            <li><strong>Gumroad</strong>：売上には7日間の保留期間があり、出金は週次（火曜、前週金曜UTCまでの分）。最低残高$100に届くまで、出金されない</li>\n            <li><strong>note／メルカリ</strong>：売上金は、振込の形で受け取る（noteは振込手数料270円、メルカリは振込手数料200円が別にかかる）。振込のタイミングの細部は、開始時に確認する</li>\n            <li><strong>意味すること</strong>：段階1〜2では、「売上の数字」と「手元のお金」がずれる。売上の見込みを先に使わないこと（次の仕入れや費用は、手元の範囲で回す）。先に費用が出る型（物販の仕入れなど）では、この遅れがそのまま資金繰りになる——数字の式の「キャッシュフローとリピート」が言っていたことの、実地での姿</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>7つの事業の現在地</h3>\n          <p>事業リストの7事業を、この5段階の物差しに置くと、こうなる。</p>\n          <ul>\n            <li><strong>原画・エディション販売（本丸）</strong>：段階0の終わり。価格の階段と売り場は設計済みで、材料になる制作は受験制作と兼ねて進んでいる。販売の開始（段階1）は受験後</li>\n            <li><strong>図鑑アプリ</strong>：受託は段階0の準備が済んだところ（受け皿作りからが初歩段階）。横展開は段階0で、最初の分野が未定</li>\n            <li><strong>make.fun（テスト候補1）</strong>：段階0の準備済み。セットアップは終わっていて、応募＝段階1は受験後</li>\n            <li><strong>物語のある物（テスト候補2）</strong>：段階0。市場分析は済んでいて、最初の1品が未定</li>\n            <li><strong>海外向けデジタル商品（テスト候補3）</strong>：段階0。売り場の実務まで調査済みで、題材が未定</li>\n            <li><strong>海外アフィリエイト（テスト候補4）</strong>：段階0。仕組みの学習資料があり、知識の蓄積は受験前から可</li>\n            <li><strong>有料note（テスト候補5）</strong>：段階0。作る工程（AIパイプライン）は設計済みで、題材が未定</li>\n          </ul>\n          <p>全部が段階0〜1の入口に並んでいるのは、受験期だからで、設計どおりの姿。受験期に進めるのは段階0の準備（知識・題材・型決め）までで、段階1の実践は受験後に、最大3つまで並行させる。</p>\n          <p class=\"firststep\"><strong>最初の一歩：</strong>受験後に回す最初のテストを、事業リストの7事業から最大3つ選ぶ<br><strong>時期：</strong>受験後（2027年3月）。段階0の準備は受験前から可</p>\n          <p class=\"sources\">きっかけ・出典：本人の問い「実際のビジネスがどう始まって、どう進んで、どういう段階を経て最終的にお金を稼ぐか、その企業的な段取りを知りたい」（2026-11-20）。段階の分け方は、成功逆算マップ（Stage 0〜5）・検証のはしご（段0〜段4）・稼ぎプロジェクトのフェーズ設計に基づく。事務と入金の事実は、アプリ内の既存登録（お金の勉強の地図／数字の式／各候補の実務）に基づく</p>\n        </div>",

   "html": "<div class=\"detail-head\"><h2>事業形態</h2><span class=\"badge decided\">2026-11-20 登録</span></div>\n        <p class=\"sec-lead\">事業には形がある。同じ「稼ぐ」でも、物が動くのか、データが動くのか、紹介で入るのかで、始まり方も、お金の入り方も、残るものも全部違う。このページは、世の中の事業の形の見本帳。形態ごとに「実際の動き」——どう始まって、どう集客して、どう売れて、どう入金されるか——を同じ型で並べた。自分の事業がどの形で、次にどの形と組み合わせられるかを見るためのページ。</p>\n        <div class=\"card\">\n          <h3>物を売る</h3>\n          <p><strong>物販（仕入れて売る）</strong>——物を仕入れて、売り場で売る、いちばん古い形。</p>\n          <ul>\n            <li><strong>実際の動き</strong>：仕入れる→出品する→買う人が現れる→発送する→売上金が入る。売れるかどうかは、仕入れの目利きと、出品の見せ方（写真・説明文）でほぼ決まる</li>\n            <li><strong>お金の入り方</strong>：1件ごとの売買差益。メルカリなら販売手数料10％と振込手数料200円が引かれる。継続性は無く、売れるたびに次の仕入れと発送が要る。仕入れ代が先に出るので、入金の遅れがそのまま資金繰りになる</li>\n            <li><strong>一人と初期費用</strong>：一人で完結する。初期費用は仕入れ代そのもの</li>\n            <li><strong>彼の事業では</strong>：物語のある物（テスト候補2）がこの形。市場の成約実例は5万円台〜23万円台で、値段は素材ではなく構成と物語で付く（候補2の市場分析のとおり）</li>\n          </ul>\n          <p><strong>ハンドメイド・自作販売</strong>——自分で作った物を売る形。作り手と売り手が同じ人になる。</p>\n          <ul>\n            <li><strong>実際の動き</strong>：作る→売り場に出す→売れる→（受注生産なら、売れてから作る）。売り場は、ハンドメイド市場（minne・Creema）に置くか、自分の店（BASE・STORES）を持つか、売る場所を借りるか（画廊の委託）</li>\n            <li><strong>お金の入り方</strong>：1点ごとの売上。手数料は売り場で違い、minne 10.89％／Creema 10.67％／BASE 約6.6％＋40円／STORES 5.5％〜（アートビジネス計画「流通と取り分」の登録値）。画廊の委託販売は50:50が標準で、レンタル画廊は週10万〜100万円の場所代を先に払い、売上は100％自分の形。作る時間と引き換えの収入で、点数が増えれば線になる</li>\n            <li><strong>一人と初期費用</strong>：一人で完結する。初期費用は材料費と、売り場によっては場所代</li>\n            <li><strong>彼の事業では</strong>：原画・エディション販売（本丸）がこの形。エディションは「受注生産で在庫を持たない」工夫とセットになっている</li>\n          </ul>\n          <p><strong>転売・裁定</strong>——安く買える場所と、高く買う人がいる場所の「差」そのものを商品にする形。</p>\n          <ul>\n            <li><strong>実際の動き</strong>：仕組みは物販と同じ（買う→売る）だが、価値は物ではなく価格差にある。差が開いている場所を見つける速さが勝負で、差は時間とともに閉じていく</li>\n            <li><strong>お金の入り方</strong>：1件ごとの差益。相場の変動と在庫の抱え込みがリスクで、プラットフォームの規約（転売の扱い）も先に確認が要る</li>\n            <li><strong>一人と初期費用</strong>：一人でできる。初期費用は買い付け資金</li>\n            <li><strong>彼の事業では</strong>：直接の事業は無い。ただし海外向けデジタル商品（テスト候補3）は、「言語市場の価格差」という同じ裁定の考え方を、物ではなく情報に使っている</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>デジタルを売る</h3>\n          <p><strong>有料記事・ダウンロード販売</strong>——文章やデータを、売り場に置いて売る形。在庫が無く、複製コストがほぼゼロ。</p>\n          <ul>\n            <li><strong>実際の動き</strong>：作る→売り場（note／BOOTH／Gumroadなど）に置く→集客の入口から買いに来る→決済と受け渡しは売り場がやる。置いた物は売れ続け、過去の商品が積み上がる（バックリストが資産になる）</li>\n            <li><strong>お金の入り方</strong>：1件ごとの売上から手数料が引かれる。noteは1,000円で手取り約855円＋振込手数料270円、BOOTHは5.6％＋45円、Gumroadは$20の商品で手取り約83％（候補3・候補5の登録値）。出金には条件があり、Gumroadは週次・最低$100・7日間の保留。継続課金ではないが、バックリストが増えるほど「置いてあるだけで売れる」部分が育つ</li>\n            <li><strong>一人と初期費用</strong>：一人で完結し、初期費用はほぼゼロ。かかるのは作る時間だけ</li>\n            <li><strong>彼の事業では</strong>：有料note（テスト候補5）と海外向けデジタル商品（テスト候補3）がこの形。作る工程はAIパイプラインに登録済み</li>\n          </ul>\n          <p><strong>アプリ／SaaS</strong>——ソフトを作って公開し、買い切りや月額課金で取る形。</p>\n          <ul>\n            <li><strong>実際の動き</strong>：作る→公開する（ストアやWeb）→使う人が増える→課金する人が一部出る。集客は、作ることと同じくらい重い仕事になる</li>\n            <li><strong>お金の入り方</strong>：買い切りか継続課金。分布の現実は厳しく、新規のサブスクリプションアプリで2年以内に月$1,000へ届くのは17.3％、中央値は月$72ほど（RevenueCatの公表データ、ビジネス計画の登録値）。当たれば時間と切り離して伸びるが、大半は届かない形でもある</li>\n            <li><strong>一人と初期費用</strong>：一人で作れる。置き場所次第で運用費はほぼゼロにもなる（彼の形はGitHub Pages＋Google Driveで運用コスト0円）</li>\n            <li><strong>彼の事業では</strong>：図鑑アプリの横展開がこの形。まず「痛み止めか、ビタミンか」の判定を通すことが、ビジネス計画の物差しになっている</li>\n          </ul>\n          <p><strong>自作ツールの販売</strong>——自分の不便を直すために作った道具を、同じ不便を持つ人に売る形。アプリより小さく、目的がはっきりしている。</p>\n          <ul>\n            <li><strong>実際の動き</strong>：自分の現場で使う→困りごとが解けた形を商品にする→同じ現場の人に届ける。使う人が「明日の困りごと」で買うので、痛み止めになりやすい</li>\n            <li><strong>お金の入り方</strong>：買い切り中心で、規模は題材の人数で決まる。大きくはないが、届く確率が高いのが特徴</li>\n            <li><strong>一人と初期費用</strong>：一人で完結し、初期費用はほぼゼロ</li>\n            <li><strong>彼の事業では</strong>：横展開の題材候補（作品台帳など、候補Cの系統）がこの形に近い</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>紹介で稼ぐ</h3>\n          <p><strong>アフィリエイト</strong>——他人の商品を紹介し、成約したら紹介料を得る形。自分の商品を持たずに始められる。</p>\n          <ul>\n            <li><strong>実際の動き</strong>：プログラムに登録する→紹介する場（記事・動画・投稿）を作る→読者がリンクから買う→成果が発生する→広告主の承認を経て確定する→支払いのサイクルで入金される</li>\n            <li><strong>お金の入り方</strong>：成約1件ごとの紹介料。単価の構造は商品の利益で決まり、高単価の例ではSemrushの新規成約1件$200・クッキー期間120日（候補4の登録値）。発生から入金までは月単位で遅れ、否認されればゼロになる。プログラムの終了や条件変更で、収入ごと消える弱さがある</li>\n            <li><strong>一人と初期費用</strong>：一人で完結し、初期費用はほぼゼロ。広告を買う型（PPC）は別で、先に広告費が出る</li>\n            <li><strong>彼の事業では</strong>：海外アフィリエイト比較記事（テスト候補4）がこの形。仕組みの学習資料と初歩段階が登録済み</li>\n          </ul>\n          <p><strong>仲介・マッチング</strong>——買い手と売り手の間に立ち、出会いの場を用意して手数料を取る形。</p>\n          <ul>\n            <li><strong>実際の動き</strong>：場を作る→売り手を集める→買い手を集める→取引が成立するたびに手数料が入る。メルカリの販売手数料10％は、この形の身近な実例（売り場そのものが仲介者）</li>\n            <li><strong>お金の入り方</strong>：取引ごとの手数料で、場が回り始めれば継続的に入る。ただし最初のうちは「売り手がいないから買い手が来ない、買い手がいないから売り手が来ない」という鶏と卵の問題が本体で、一人で始めるにはいちばん重い形</li>\n            <li><strong>一人と初期費用</strong>：仕組み作りと両側の集客が要り、初期の重さが大きい</li>\n            <li><strong>彼の事業では</strong>：自分が場の事業者になる形は無い。逆に、売り場として「乗る」側では、いつもこの形の上に乗っている（だから手数料の読み方が大事になる）</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>継続課金</h3>\n          <p><strong>サブスクリプション</strong>——月額などで入り続け、解約されるまで続く形。</p>\n          <ul>\n            <li><strong>実際の動き</strong>：入り口の商品を用意する→加入してもらう→中身を更新し続ける→解約を抑える。売る仕事より「辞めさせない」運営が本体になる</li>\n            <li><strong>お金の入り方</strong>：人数×月額で、売上が先読みできるのが強み。アプリの課金形として選ぶ場合は、上の分布（届くのは一部、中央値は小さい）が前提になる</li>\n            <li><strong>一人と初期費用</strong>：一人で始められるが、更新の手間は続く</li>\n            <li><strong>彼の事業では</strong>：横展開アプリの課金形の選択肢。図鑑アプリの受託でも「月額の運用代行」という継続課金の顔がある</li>\n          </ul>\n          <p><strong>会員制・有料コミュニティ</strong>——「場と更新」そのものを月額で売る形。</p>\n          <ul>\n            <li><strong>実際の動き</strong>：無料の発信で人を集める→有料の場に招く→投稿・交流・限定の中身を回し続ける。よねあぷ（有料コミュニティを併設）や、Slavik（自分のサイトでメンバーシップを運営）の形が実例</li>\n            <li><strong>お金の入り方</strong>：人数×月額で読みやすい。ただし中身は「人がいること」なので、運営者の手間と人気に収入が直結する</li>\n            <li><strong>一人と初期費用</strong>：一人で始められ、初期費用はほぼゼロ。続ける手間はずっとかかる</li>\n            <li><strong>彼の事業では</strong>：現行の計画には無い。知識と実績と、集まった人がいる先で開ける形</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>スキルを売る</h3>\n          <p><strong>受託・請負</strong>——相手の注文を受けて作り、対価を得る形。いちばん確実に「仕事がお金になる」形。</p>\n          <ul>\n            <li><strong>実際の動き</strong>：受け皿（見本と条件表）を用意する→声がかかる／声をかける→条件を先に固定して受ける→作って納める→入金される。集客は「売り場」ではなく「回路」（出会いが来る場所にいること）で決まる</li>\n            <li><strong>お金の入り方</strong>：仕事ごとの固定価格で、入金の確実性は高い。代わりに自分の時間と引き換えで、止めれば収入も止まる。残るのはお金そのものより、実績と縁と、次につながる信用</li>\n            <li><strong>一人と初期費用</strong>：一人で完結し、初期費用はほぼゼロ。価格と条件を先に決めておくことが、交渉の弱さを補う（ルールの「関係は柔らかく、条件は硬く」）</li>\n            <li><strong>彼の事業では</strong>：図鑑アプリの受託がこの形（構築一式／データ化／月額運用代行の3段）。受験後の本格開始が決まっている</li>\n          </ul>\n          <p><strong>講座・教育</strong>——知識を教材の形にして売る形。同じ知識でも、届け方で単価が変わる。</p>\n          <ul>\n            <li><strong>実際の動き</strong>：知識を教材にまとめる→講座プラットフォームに置くか、自分の売り場で売る→学びたい人が買う。Slavikの例では、ガイド（教材）が€499、個別のメンターが€5,000と、「読む教材」と「個別指導」で単価が10倍違う</li>\n            <li><strong>お金の入り方</strong>：教材は1件ごとの売上（デジタルの形と複合する）、個別指導は高単価だが時間と引き換え（受託の形と複合する）。知識の在庫が増えるほど、商品にできる範囲が広がる</li>\n            <li><strong>一人と初期費用</strong>：一人で完結し、初期費用はほぼゼロ</li>\n            <li><strong>彼の事業では</strong>：現行では有料noteが入口。このアプリに貯めている知識そのものが、将来の材料になる</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>権利で稼ぐ</h3>\n          <p><strong>ライセンス・印税</strong>——作った物や権利を「使わせる」対価を得る形。自分は売る作業をせず、使われた分だけ入る。</p>\n          <ul>\n            <li><strong>実際の動き</strong>：権利を持つ物を作る→使う相手と契約する→相手が売る／使う→料率や固定額で入る。本の印税、素材やキャラクターのライセンスがこの形。ずんだもんの例では、オープンな利用を広げつつ、無クレジットの商用ライセンスを1キャラ40万円＋税とし、グッズは証紙で回収する形が取られている（先駆者モデル資料集の登録）</li>\n            <li><strong>お金の入り方</strong>：相手の売上に応じた料率、または固定のライセンス料。入るまでに相手の事業が回る必要があり、遅くて読みにくいが、自分の時間は使わない。権利が自分の手に残っていることが全ての前提になる</li>\n            <li><strong>一人と初期費用</strong>：権利を持つ物を作るまでは一人でできる。契約の相手は外の事業者になる</li>\n            <li><strong>彼の事業では</strong>：アートビジネスの将来の形（作品の二次利用・版権の扱い）。図鑑事業で「型（エンジン）は売らない」と決めているのも、権利を手元に残す同じ判断</li>\n          </ul>\n          <p><strong>キャラクターIP</strong>——キャラクターを育て、グッズ・ライセンス・アニメなどに広げていく形。</p>\n          <ul>\n            <li><strong>実際の動き</strong>：SNSや連載でキャラを育てる→人気が付く→グッズ化・ライセンスの話が来る→体制のある相手と組んで広げる。ちいかわ、mofusand、カナヘイなどが通った道</li>\n            <li><strong>お金の入り方</strong>：グッズの売上とライセンス料。ただし誤読しやすい点として、ちいかわの作者は連載開始の時点で既にフォロワー約33万人の人気絵師で、「無名のゼロから」ではない。拡大の局面ではライセンス会社・出版社・メーカーの体制が必ず入り、「ずっと完全な一人」ではなくなる形でもある（先駆者モデル資料集の結論）</li>\n            <li><strong>一人と初期費用</strong>：育てるまでは一人でできる。広げる段階で外の体制が要る</li>\n            <li><strong>彼の事業では</strong>：現行の計画には入れていない。形として知っておくための登録</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>広告で稼ぐ</h3>\n          <p><strong>SNS・動画の広告収入</strong>——再生や表示に応じて、プラットフォームから分配を得る形。</p>\n          <ul>\n            <li><strong>実際の動き</strong>：投稿を続ける→収益化の条件に届く→再生されるたびに分配が入る。YouTubeの収益化は、登録者1,000人＋公開動画の総再生時間4,000時間（またはShortsの1,000万回再生／90日）が入口の条件</li>\n            <li><strong>お金の入り方</strong>：再生単価はジャンルで大きく違い、金融・ビジネス・テック系が高く、エンタメ系は低い。再生数がそのまま収入なので、届くまでの距離が長く、単価の低いジャンルでは量が要る</li>\n            <li><strong>一人と初期費用</strong>：一人で完結し、初期費用はほぼゼロ。かかるのは続ける時間</li>\n            <li><strong>彼の事業では</strong>：提示の動画は、広告収入そのものではなく集客の蛇口として使う設計（集客はTikTok、収益化は売り場側、という既存の分担）。広告は「ついでに付くもの」であって、本命の蛇口にはしない</li>\n          </ul>\n          <p><strong>メディア運営</strong>——ブログやメディアに人を集め、広告とアフィリエイトを載せる形。</p>\n          <ul>\n            <li><strong>実際の動き</strong>：記事を積む→検索やSNSから読者が来る→広告の分配と、記事内の紹介料が入る。収入は「広告＋紹介」の複合で、積んだ記事そのものが資産になる</li>\n            <li><strong>お金の入り方</strong>：読者の数に比例して小さく広く入る。育つまでが長く、検索順位やプラットフォームの方針変更で揺れる</li>\n            <li><strong>一人と初期費用</strong>：一人で完結し、初期費用はほぼゼロ</li>\n            <li><strong>彼の事業では</strong>：海外アフィリエイトの比較記事（テスト候補4）は、この形の最小単位（メディアの1ページ）でもある</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>読み方</h3>\n          <p><strong>形態は、組み合わせるもの</strong>——実際の事業は、たいてい複数の形の複合でできている。彼の計画で見ると、本丸＝自作販売（物を売る）、図鑑アプリ＝受託＋アプリ販売＋月額の運用代行、有料note＝デジタルを売る、候補4＝紹介で稼ぐ、提示動画＝広告の形を集客にだけ使う、という組み合わせ。Slavikのような個人の成功例も、広告＋講座＋会員制の複合だった。1つの形に絞る必要はなく、「どの形が、どの役割か」を分けて見る。</p>\n          <ul>\n            <li><strong>物差し1：椅子が残るか</strong>——終わった後に、権利・バックリスト・実績・集客の回路が残る形かどうか。残らない形（賞金・一回きりの仕事）は種銭作りと割り切る</li>\n            <li><strong>物差し2：最初のお客はどこにいるか</strong>——形そのものより、最初のお客への入口が見えるかが先。入口が見えない形は、段階0で止まっている</li>\n            <li><strong>物差し3：時間と切り離せるか</strong>——自分の手を止めると止まる形か、置いておけば回る形か。段取りの段階4（拡大）で効いてくる差</li>\n            <li><strong>物差し4：入金までの遅れ</strong>——売れてからお金が届くまでの長さ。遅い形ほど、最初の段階では手元のお金で回す設計が要る（段取り「お金が届くまでの遅れ」）</li>\n          </ul>\n          <p>段階との相性もある。検証の段階（段取りの段階1）では「最初のお客が見える形」から始め、回り始めたら「時間と切り離せる形」へ寄せていく。この見本帳は、その寄せ先の候補を先に知っておくためのもの。</p>\n          <p class=\"sources\">きっかけ・出典：本人の問い「いろんな事業形態を知るためのページが欲しい」（2026-11-20）。各形態の手数料・条件・分布は、アプリ内の既存登録（各テスト候補の実務／アートビジネス計画「流通と取り分」／ビジネス計画の市場の数字）と、先駆者モデル資料集・Slavikの仕組み分析に基づく</p>\n        </div>",

   "html": "<div class=\"detail-head\"><h2>ビジネス計画</h2><span class=\"badge decided\">骨格は決定済み</span></div>\n        <p class=\"sec-lead\">柱はアプリ。市場の現実を踏まえ、「小さく複数出し、届いたものだけ伸ばす」が勝ち方として決まっている。</p>\n        <div class=\"stats\">\n          <div class=\"stat\"><div class=\"v\">約83<small>%</small></div><div class=\"k\">新作アプリが2年経っても月$1,000に届かない割合</div></div>\n          <div class=\"stat\"><div class=\"v\">月$72</div><div class=\"k\">公開1年後の月収の中央値</div></div>\n          <div class=\"stat\"><div class=\"v\">58<small>日</small></div><div class=\"k\">月$1,000到達までの中央値。届くものは早く届く</div></div>\n          <div class=\"stat\"><div class=\"v\">5〜9<small>倍</small></div><div class=\"k\">「痛み止め」が「ビタミン」より転換する倍率</div></div>\n        </div>\n        <h3>候補はBとCの2つ。順番だけ固定</h3>\n        <div class=\"trio\" style=\"grid-template-columns:1fr 1fr\">\n          <div class=\"tcol\"><span class=\"tl-t\">B</span><span class=\"tl-n\">結果画面型の小ツール</span><span class=\"tl-d\">Cと一体で作る</span></div>\n          <div class=\"tcol\"><span class=\"tl-t\">C</span><span class=\"tl-n\">現場の不便解消型</span><span class=\"tl-d\">題材は段0で決める</span></div>\n        </div>\n        <p class=\"trio-seq\">進める順番：<strong>Cの題材決定（段0、今〜共通テスト）→ C×Bの最小版（共通テスト後〜2月）</strong></p>\n        <div class=\"card\">\n          <h3>B. シェアされる結果画面型の小ツール</h3>\n          <p>手持ちの記録や写真から「分析／図鑑／年表」のような結果画像を出す道具。結果がそのまま投稿物になる形が集客装置になる（IsTalkの型）。強みは日本事例で最も再現性が高いこと。弱みは題材の当たり外れが全てで、「誰の何の結果が見たいか」の選定が勝負になる。</p>\n          <p class=\"firststep\"><strong>最初の一歩：</strong>Cの題材が決まったら、その結果画面の試し画像を1枚作る<br><strong>時期：</strong>共通テスト後〜2月（Cの最小版と一体で作る）</p>\n        </div>\n        <div class=\"card\">\n          <h3>C. 現場の不便解消型（作品台帳が有力）</h3>\n          <p>自分の制作・受験生活の現場の道具。調査で「スマホ完結・日本語・私的な作品台帳」は日本語圏に不在の<strong>無人地帯</strong>と確認済み。海外製品は高額・英語・PC寄りで、国内は公開ポートフォリオと物理保管に二極化している。</p>\n          <ul>\n            <li><strong>価格の隙間</strong>：買い切り〜月300〜980円、点数課金・広告なし</li>\n            <li><strong>集客になる出力</strong>：展示・完成ごとの「作品1点カード（縦型）」、第二弾に年間「制作Wrapped」</li>\n            <li><strong>弱み</strong>：層が狭く天井は低い。最初の月1万円ライン向き</li>\n          </ul>\n          <p class=\"firststep\"><strong>最初の一歩：</strong>段0の一文を決める（下の検証の階段の段0と、未決・保留の筆頭がここ）<br><strong>時期：</strong>今〜共通テスト（題材の決定だけは受験前から進める）</p>\n        </div>\n        <h3>検証の階段（段0〜段4）</h3>\n        <ol class=\"steps\">\n          <li data-n=\"0\"><span class=\"st\">題材を1つ決める</span><span class=\"done-when\">「誰が・いつ・何に困って・今どう凌いでいるか」を一文で言えること</span>\n<p class=\"firststep\"><strong>最初の一歩：</strong>題材候補（作品台帳／制作ログ／画材の在庫と消費／シフトと収入の見える化）から1つに絞って、その一文を書く<br><strong>時期：</strong>今〜共通テスト</p></li>\n          <li data-n=\"1\"><span class=\"st\">最小版を公開する</span><span class=\"done-when\">実際に他人が触れるURLがあること（決済はまだ付けない）</span>\n<p class=\"firststep\"><strong>最初の一歩：</strong>最小版の最初の1画面を作る<br><strong>時期：</strong>共通テスト後〜2月</p></li>\n          <li data-n=\"2\"><span class=\"st\">集客テスト30日</span><span class=\"done-when\">結果画面のシェアか短尺動画経由で、身内以外の利用者が10人。ゼロなら題材を変える</span>\n<p class=\"firststep\"><strong>最初の一歩：</strong>公開した日に、結果画面のシェア投稿か短尺動画を1本出す<br><strong>時期：</strong>段1の公開直後から30日間</p></li>\n          <li data-n=\"3\"><span class=\"st\">課金の仮設置</span><span class=\"done-when\">最初の1件の支払い（広告削除か年額サブスクの小さい壁で試す）</span>\n<p class=\"firststep\"><strong>最初の一歩：</strong>広告を消す有料版か年額サブスクの、どちらか1つの課金の受け皿を付ける<br><strong>時期：</strong>段2で身内以外の利用者が10人に届いたら</p></li>\n          <li data-n=\"4\"><span class=\"st\">判定</span><span class=\"done-when\">続ける／題材を変える／量産ラインに移す、を数字で決める</span>\n<p class=\"firststep\"><strong>最初の一歩：</strong>数字を見て「続ける／題材を変える／量産ラインに移す」のどれかを決め、結果を記録する<br><strong>時期：</strong>段3の後</p></li>\n        </ol>\n        <h3>課金と集客の決まり</h3>\n        <ul>\n          <li><strong>課金の本命</strong>はサブスク（年額主役）＋買い切りの受け皿。広告は単価が低く、柱にしない</li>\n          <li><strong>再生数 ≠ ダウンロード</strong>。差を分けるのは、シェアされる結果画面／プロフィールからの導線／チャネルと対象の一致</li>\n          <li>Xでは告知より「質問投稿」が効く。最初の利用者は手で集め、要望には速く応える</li>\n          <li>フォロワーは借り物。<strong>所有できる連絡先（リスト）</strong>を別に持つ</li>\n        </ul>\n        <h3>収益化の実務メモ</h3>\n        <ul>\n          <li>Stripeは個人でも使えるが、決済・税務は実名が前提。特商法の「請求があれば開示」は完全な匿名化ではない</li>\n          <li>1,000円あたりの手取り：STORES 945円／BOOTH 899円／note 855円</li>\n          <li>青色申告の承認申請は「開業後2か月以内」を逃さない</li>\n        </ul>\n                <div class=\"card\">\n          <h3>AIバウンティ（make.fun） <span class=\"badge pending\">テスト枠・検討中</span></h3>\n          <p>AIエージェント向けのコーディングバウンティ（懸賞案件）の基盤。集客が要らず、<strong>AIの労働力そのものが商品になる</strong>経路で、本人の作業はスマホでの承認と確認だけになる。ただし性質は「仕組み」ではなく「懸賞」で、賞金は上位の数件だけが取る。本命ルートにはならない。</p>\n          <ul>\n            <li><strong>置き場所</strong>：テスト枠。目的は種銭の獲得と、「AIに仕事を取らせて報酬を得る」実地ノウハウ。並行は最大3件まで、期間と撤退ラインを先に決める</li>\n            <li><strong>正直な留保</strong>：参加者の大半は何も得ない構造。実例として、$500の案件に参加エージェント8,138という表示もあった（2026-11-17のスクリーンショット）。平均参加者の期待値で測る仕事ではない</li>\n            <li><strong>ノウハウの置き方</strong>：仕組みの本体は、次のグループ（仕組み／採点のされ方／案件の選び方／受け取りと実務／損なうパターン／評価の物差しでの位置づけ／初歩段階）に体系として置く</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>仕組み</h3>\n          <div class=\"flow\"><span>案件を探す</span><i>→</i><span>エージェントが作る</span><i>→</i><span>提出（コード＋制作記録）</span><i>→</i><span>自動チェックと採点</span><i>→</i><span>上位がUSDCを受け取る</span></div>\n          <ul>\n            <li><strong>運営と形</strong>：運営はEZO Labs Inc.。案件はコーディング課題で、カテゴリは Trading／Forecasting／Security／Automation／Growth／Games／Code（公式）。課題ごとに「測り方（指標）」と締切と順位ごとの賞金が公開される</li>\n            <li><strong>賞金は先にロックされる</strong>：案件が開く時点で、賞金総額はSolana上のエスクロー（預かり口座）に全額ロックされる。払う側の都合で消える形ではなく、入賞すれば請求で自分のウォレットに移る。初期の一部案件はエスクローではなく運営の報酬ウォレットから支払われ、その場合は案件ページに明記される</li>\n            <li><strong>参加費</strong>：大半の案件は無料。有料の案件はページに明記され、手数料は賞金側に組み込まれる（実例：フロントエンドの案件で $0.50）</li>\n            <li><strong>エージェント前提の設計</strong>：参加はエージェント自身のSolanaキーペアでサインインし、APIキーで操作する。案件探しはAPI／MCPサーバー／skill.md（公式の手順書ファイル）から行える</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>採点のされ方</h3>\n          <ul>\n            <li><strong>人の審査ではなく、指標による自動採点</strong>：採点は公開された指標（メトリック）に基づき、サンドボックスが全エントリーを同じ条件で2回実行して測る。「審査が『質』の案件」という言い方は、正確には「指標が出来栄えの質を測る案件」と読み替えるのが実態に合う</li>\n            <li><strong>順位の決まり方</strong>：開催中の順位は暫定で、他者との相対比較ではなく固定の基準との比較で付く。締切後に最終ラウンドがあり、結果と支払いリストがエスクローに掲示され、異議申立ての期間（チャレンジウィンドウ。誰でも採点を再実行して争える）を経て確定する</li>\n            <li><strong>提出の必須条件</strong>：コードは公開リポジトリ（1コミット）で出し、それを作った制作セッションの記録（トランスクリプト）を一緒に提出する。記録は「自分のエージェントが作ったこと」の証明で、自動チェックが記録の真正性とコードとの一致を確認する。記録のない提出は不受理（2026-11-17以降の提出分から、公式）</li>\n            <li><strong>落ちても直せる</strong>：チェックに落ちた提出は採点されないが、締切までなら直して再提出できる。締切の余裕が実務上の安全弁になる</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>案件の選び方</h3>\n          <ul>\n            <li><strong>賞金 ÷ 参加者数</strong>：まず母数を見る。2026-11-17のスクリーンショットでは、$500のチェスエンジン案件に参加8,138、無料モデル集約の案件に6,266が集まる一方、「最高のフロントエンドを構築する」$545の案件は参加31だった。同じ賞金額でも、勝ち筋の濃さは母数で桁が違う</li>\n            <li><strong>指標が自分の強みを測るか</strong>：採点は指標への最適化勝負。指標が明確で、コーディングやフロントエンドの出来栄え——Museの主戦場——を測る案件を選ぶ。指標が運や速度だけの案件は避ける</li>\n            <li><strong>締切に余裕があること</strong>：チェック不合格→修正→再提出の往復を前提に、締切まで余裕のある案件を優先する</li>\n            <li><strong>規律</strong>：並行は最大3件まで。始める前に期間と撤退ラインを決め、外れたら記録して次へ行く</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>受け取りと実務</h3>\n          <ul>\n            <li><strong>受け取りの形</strong>：報酬はUSDC（ドル連動のステーブルコイン）で、自分のSolanaウォレットへ。請求には期限があり（確定から少なくとも7日間の請求期間が公式に示されている）、支払い前に自動の制裁スクリーニングが入る。税務書類が求められるのは米国の法律で必要な場合だけ、と公式は説明している</li>\n            <li><strong>後で来る手間</strong>：USDCから円への換金と、日本での税務（クリプトの利益は原則として雑所得）が後段に来る。受け取り側の口座・取引所の用意は、初入賞の前ではなく「最初の1件を回す」段階で確認すれば足りる</li>\n            <li><strong>こちらの設定状態</strong>：ウォレットとAPI資格情報は設定済み（別チャットで実施）。スキルは v1.5.172、APIキーの期限は2026-12-15。期限が切れていれば、再発行が最初の一手になる</li>\n            <li><strong>基盤の規模（公式ページの表示・2026-11-20確認）</strong>：2026-11-09の運用開始から、支払総額 $14,810.74／970アカウント、エスクロー残高 $13,970.80／46案件。まだ小さい基盤で、数字は動き続ける前提で読む</li>\n            <li><strong>未確認</strong>：実際の応募・提出・請求はまだ1件も回していない。所要時間、詰まりどころ、請求の実際の流れは未確認で、最初の1件は「勝つ」ことより「一周回して実地の記録を取る」ことが目的になる</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>損なうパターン</h3>\n          <ul>\n            <li><strong>賞金は上位だけ</strong>：順位に入らなければ、作業はすべて無報酬。参加者が数千集まる案件では、構造的に大半が外れる</li>\n            <li><strong>指標の読み違い</strong>：出来栄えの良さと、指標が測るものがずれると勝てない。作る前に指標と要件を読むことが、そのまま勝率になる</li>\n            <li><strong>記録の不備で不受理</strong>：セッション記録が要件を満たさない提出は、出来にかかわらず採点されない</li>\n            <li><strong>時間の溶け方</strong>：再提出の往復と締切管理に時間が溶ける。期間と撤退ラインを先に決めるのは、この損を上限で切るため</li>\n            <li><strong>基盤自体の新しさ</strong>：運用開始から日が浅く、ルール（記録の必須化など）も動いている。条件は応募のたびに公式で確認する</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>評価の物差しでの位置づけ</h3>\n          <ul>\n            <li><strong>物差し1・上位が自分の強みで取れるか</strong>：コーディングとフロントエンドはClaudeの主戦場で、指標が出来栄えを測る案件なら、取れる側に立つ構造はある。平均参加者の期待値ではなく、この一点で評価する（2026-11-17に本人が訂正した物差し）</li>\n            <li><strong>物差し2・取った位置が資産として残るか</strong>：残らない。懸賞は毎回ゼロからで、搾り取る位置（基盤そのもの）はプラットフォーム側が保持する。「椅子が残らない上位」——種銭を取りに行く傭兵仕事であり、実績が単価や次の仕事に化けるかも未検証</li>\n            <li><strong>結論としての置き方</strong>：本命（自分のアプリ・作品・IP＝椅子が残る上位）とは分けて、テスト枠で小さく回す。得るものは種銭と、「AI労働で報酬を得る」実地の記録</li>\n          </ul>\n          <p class=\"sources\">きっかけ・出典：本人が送った make.fun のスクリーンショット（2026-11-17。案件の数字は当時の表示）と、別チャットでのセットアップ記録（ウォレット／API資格情報／スキル v1.5.172／APIキー期限 2026-12-15）。本文の仕組みは make.fun 公式サイトと公式ガイド（How it works／How AI agents earn money、2026-11-20確認）に拠る</p>\n        </div>\n        <div class=\"card\">\n          <h3>初歩段階</h3>\n          <p><strong>初歩段階のゴール：</strong>最初の応募1件が、提出済みの状態になっていること。この1件の目的は勝つことではなく、応募→提出→（落ちれば）再提出→確定までを一周回して、実地の記録を取ること。</p>\n          <p><strong>必要なもの</strong></p>\n          <ul>\n            <li><strong>セットアップ済みの基盤</strong>：ウォレットとAPI資格情報は設定済み。スキルは v1.5.172。APIキーの期限は2026-12-15で、開始時点で切れていれば再発行が最初の一手になる</li>\n            <li><strong>公開リポジトリの置き場所</strong>：提出は公開リポジトリ（1コミット）が必須条件になる</li>\n            <li><strong>費用</strong>：大半の案件は参加無料。有料の案件はページに明記されるので、初歩段階では無料の案件を選ぶ</li>\n          </ul>\n          <p><strong>手順</strong></p>\n          <ol class=\"steps\">\n            <li data-n=\"1\"><span class=\"st\">公式ガイドで現在の手順を確認する</span><span class=\"sd\">実際の応募・提出・請求はまだ1件も回しておらず、手順の細部は未確認。ルール（記録の必須化など）も動いているため、始める前に公式ガイド（How it works／How AI agents earn money）と skill.md で、提出条件と請求の流れを最新で確認する</span><span class=\"done-when\">終わりの目安：提出に必要なもの（リポジトリとセッション記録）と、請求までの流れが言える</span></li>\n            <li data-n=\"2\"><span class=\"st\">APIキーの状態を確認する</span><span class=\"sd\">期限（2026-12-15）を過ぎていれば再発行する。サインインはSolanaのキーペアで行う</span><span class=\"done-when\">終わりの目安：APIで案件一覧が引ける</span></li>\n            <li data-n=\"3\"><span class=\"st\">案件を1件選ぶ</span><span class=\"sd\">「案件の選び方」の物差しで選ぶ——賞金÷参加者数の母数、指標がコーディングやフロントエンドの出来栄え（Museの主戦場）を測るか、締切に余裕があるか。並行は最大3件まで、期間と撤退ラインを先に決める</span><span class=\"done-when\">終わりの目安：応募する案件が1件決まり、指標と締切を把握している</span></li>\n            <li data-n=\"4\"><span class=\"st\">記録が残る形で作る</span><span class=\"sd\">公開リポジトリで制作し、制作セッションの記録（トランスクリプト）が提出物の一部になる形を保つ。キットのローカル採点（grade-local）がある案件では、先に自己採点する</span><span class=\"done-when\">終わりの目安：成果物とセッション記録が揃い、自己採点で致命的な落ち目がない</span></li>\n            <li data-n=\"5\"><span class=\"st\">提出する</span><span class=\"sd\">リポジトリ（1コミット）とセッション記録を束ねて提出する</span><span class=\"done-when\">終わりの目安：提出ステータスが「提出済み」になっている</span></li>\n            <li data-n=\"6\"><span class=\"st\">状態を見て、落ちたら直す</span><span class=\"sd\">チェックに落ちた提出は採点されないが、締切までなら直して再提出できる。確定（チャレンジウィンドウの経過後）までを見届け、入賞したら請求期間内に claim する</span><span class=\"done-when\">終わりの目安：結果が確定し、一周の記録（かかった時間・詰まった場所）が残っている</span></li>\n          </ol>\n          <p><strong>つまずきどころ</strong></p>\n          <ul>\n            <li><strong>記録の不備で不受理</strong>：セッション記録が要件を満たさない提出は、出来にかかわらず採点されない（2026-11-17以降の提出分から必須）</li>\n            <li><strong>指標の読み違い</strong>：出来栄えの良さと、指標が測るものがずれると勝てない。作る前に指標と要件を読むことが、そのまま勝率になる</li>\n            <li><strong>締切間際の提出</strong>：再提出の往復が前提の仕組みなので、余裕のない日程はそのまま損になる</li>\n            <li><strong>APIキーの期限切れ</strong>：開始時点で切れている可能性が高い（期限2026-12-15）。手順2で先に潰す</li>\n          </ul>\n          <p><strong>時期：</strong>受験後（2027年3月以降）</p>\n        </div>\n                <div class=\"card\">\n          <h3>物語のある物（物販テスト） <span class=\"badge pending\">テスト枠・2026-11-19 合意</span></h3>\n          <p>売るのは呪物ではない。<strong>「物語と力」</strong>——見惚れるような質の高い物に、質の高い物語を付けて売る。狙う型は、市場の多数派（キーワード詰め込みのテンプレート量産）ではなく、<strong>一点ごとに固有の物語を付けた完成品</strong>。担い手は石に限らず、石・ガラス・金属・木などの小物でよい（売るのは物語であり、表面的な物が石である必要はない）。</p>\n          <ul>\n            <li><strong>置き場所</strong>：テスト枠の1件（make.funと同格）。期間と撤退ラインを先に決めて小さく試す。売り場はメルカリ——購入者の能動性が必要な場に置く</li>\n            <li><strong>もう1つの意味</strong>：アートビジネスの練習。値付け、物語の付け方、固定価格、記録の練習であり、「意味のないものに付加価値を与える」という本命の作品販売（作品の値付けと言説化）と同じ力学で動く</li>\n            <li><strong>正直な留保</strong>：市場の数字は、売り切れ実例を集めた調査に基づく（母数に対する統計ではない）。成約の傾向は読めるが、「これを出せば売れる」という保証にはならない</li>\n            <li><strong>ノウハウの置き方</strong>：仕組みの本体は、次のグループ（市場の構造／売り手の4類型／物の選び方／物語の付け方／出品の型／ルール／初歩段階）に体系として置く</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>市場の構造</h3>\n          <p>価格は素材そのものでは立たない。<strong>組み立てと意味付けの層で立つ</strong>。素材として流通する値段と、完成品として成約する値段の間の差が、「物語・組み立て」の価格になる。</p>\n          <div class=\"stats\">\n            <div class=\"stat\"><div class=\"v\">¥308<small>〜/粒</small></div><div class=\"k\">ビーズ素材としての流通価格（1粒）</div></div>\n            <div class=\"stat\"><div class=\"v\">¥54,678<small>〜</small>¥235,770</div><div class=\"k\">完成品ブレスレットの成約実例（ルチル系・大玉）</div></div>\n            <div class=\"stat\"><div class=\"v\">約2.4〜4.4<small>倍</small></div><div class=\"k\">同種クラスターのグラム単価の差（スピ表現が濃い出品 vs 事実ベース寄り）</div></div>\n            <div class=\"stat\"><div class=\"v\">¥540<small>〜/100g</small></div><div class=\"k\">さざれ石（グラム売りの消耗品）の厚い層</div></div>\n          </div>\n          <ul>\n            <li><strong>価格帯の地図</strong>：〜¥1,000は素材・消耗品（さざれ、ビーズ）で回転率の層／¥1,800〜¥3,100はハンドメイドと小〜中クラスターで個人売り手の主戦場／¥5,750〜¥19,420は「1点もの」「極上」の格付け言葉が付く帯／¥54,678〜は組み立て＋物語が乗った完成品の帯。安い帯ほど素材に寄り、高い帯ほど完成品＋格付け＋物語に寄る</li>\n            <li><strong>グラム単価の読み方</strong>：水晶クラスターで、事実ベース寄りは約¥8.5/g、スピ表現が濃い出品は約¥37.7/g。ただしこの差には品質・色・産地・付属品の差も混ざっていて、「物語だけの効果」とは切り分けられない。読めるのは「同じカテゴリー内で、表現と物語が濃い出品の方が高い帯にいる」という傾向まで</li>\n            <li><strong>売れる形態</strong>：ブレスレット（完成品）が市場の中心。ほかにクラスター・原石（置物）、スフィア等の小物（数千円帯の入口）、さざれ石（グラム売り）。スピ要素のない鉱物標本は事実情報だけで売買され、帯は概ね¥700〜¥8,300と低い</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>売り手の4類型</h3>\n          <ul>\n            <li><strong>大手Shops型</strong>：同一ショップから大量出品し、実際に売り切れている。説明文はテンプレート化され、タイトルは検索キーワードの塊。「質問を受け付けていません」と明記して対応コストを切る。価格の天井はこの型が作っている</li>\n            <li><strong>卸売り・回転型</strong>：さざれ石などをサイズ別価格表で出し、再入荷を繰り返す。売り手の評価数は数千件規模。単価は安く、回転とリピートで成立させる</li>\n            <li><strong>個人コレクター放出型</strong>：「マイコレクション」「秘蔵品」を一点ずつ、来歴の物語付きで出す。高額クラスターの成約はこの型に多い</li>\n            <li><strong>ハンドメイド型</strong>：デザインブレスレットを¥2,000〜¥15,800で出す。フォロー割、リピーター値引き、浄化さざれのおまけなど、関係性で回す工夫が説明文に明記されている</li>\n          </ul>\n          <p><strong>自分の型の置き場所</strong>：個人コレクター放出型の「来歴の物語」に、質の担保（産地・処理の正直な開示）を組み合わせる位置。市場の大半はテンプレートか回転型で、一点ごとの物語は薄い——そこが差別化の余地になる。</p>\n        </div>\n        <div class=\"card\">\n          <h3>物の選び方</h3>\n          <ul>\n            <li><strong>担い手は石に限らない</strong>：石・ガラス・金属・木、その他の小物でもよい。売るのは物語であり、物はその担い手</li>\n            <li><strong>質が土台</strong>：素人が適当に拾った石ころに情報を付ける形とは分ける。物語を剥がしても、物そのものに持つ価値があること（ルール3）。見惚れてしまうようなキラキラした石は、その一例</li>\n            <li><strong>マテリアルへの感覚が商品力</strong>：物の質を見分ける目そのものが、この型の参入障壁であり強みになる</li>\n            <li><strong>処理は正直に書く</strong>：染色・加熱・含浸などの処理の有無を正直に開示することが、実務者向けの解説でも信頼の条件として挙げられている。傷・クラック・インクルージョンは注意書きで「個性」として許容を求めるのが市場の型</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>物語の付け方</h3>\n          <ul>\n            <li><strong>差になるのは固有の文脈</strong>：効能の列挙は全員がやっているので差にならない。差になっているのは「なぜこの石（この物）なのか」——組み合わせの理由、来歴、産地と処理の開示の方</li>\n            <li><strong>実例1・組み合わせの物語</strong>：天珠とルチルの組み合わせブレスレット（¥99,980で成約）では、石ごとに由来と意味を物語として積んでいる</li>\n            <li><strong>実例2・使い方の物語</strong>：「インプット」という儀式（身に付けた日から一週間、願望を石に念じる方法）まで説明する出品がある。購入後の体験設計まで売っている形</li>\n            <li><strong>実例3・手放す理由の物語</strong>：「私の家での役目を終えたと夢にてお告げを授かりました」（レムリアンシード、¥7,500で成約）、「飾らずしまっていた特別の水晶」（クラスター、¥19,300で成約）。個人売り手の高額成約には来歴の物語が付いている例が目立つ</li>\n            <li><strong>効能の扱い</strong>：物語の本体ではなく、言い伝え形式（「〜と云われています」）で添えるに留める。断定しない理由はルールのグループで扱う</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>出品の型</h3>\n          <p><strong>タイトル</strong>：キーワード詰め込みが標準形（石名／形態／パワーストーン／天然石／性別／用途を総ざらいする）。格付けワード（「極上」「1点もの 現品」「秘蔵品」）は高額帯に集中し、効果ワードはタイトルよりハッシュタグ・説明文側に置く例が多い。検索に乗る最低限のキーワードは要るが、自分の型では固有の物語が先頭に来る。</p>\n          <p><strong>説明文の骨格</strong>（複数の成約出品に共通する並び）：</p>\n          <ol class=\"steps\">\n            <li data-n=\"1\"><span class=\"st\">冒頭フック</span><span class=\"sd\">最上級の形容、または入荷の宣言</span></li>\n            <li data-n=\"2\"><span class=\"st\">スペック</span><span class=\"sd\">石名、玉サイズmm、内周cm、重さg、産地</span></li>\n            <li data-n=\"3\"><span class=\"st\">石ごとの物語</span><span class=\"sd\">ここが本体。組み合わせの理由と来歴を書き、効能は言い伝え形式で添える</span></li>\n            <li data-n=\"4\"><span class=\"st\">用途提案</span><span class=\"sd\">浄化用、インテリア、プレゼント等</span></li>\n            <li data-n=\"5\"><span class=\"st\">注意書き</span><span class=\"sd\">天然物の傷・クラックは「個性」として許容を求める／返品の条件／他サイト同時出品の有無</span></li>\n            <li data-n=\"6\"><span class=\"st\">ハッシュタグ</span><span class=\"sd\">効果ワード（#金運 #浄化 等）はここに寄せる</span></li>\n          </ol>\n          <p><strong>写真</strong>：メルカリの上限は20枚。高額の単品（¥19,300、¥11,520の成約例）は20枚を使い切っている。ブレスレットは手に持つ／手首に着ける見せ方、クラスターは台座に置いた置物としての見せ方＋サイズ・重さの数値併記が定番。写真の枚数と情報量は価格帯と相関して見える。「4枚目以降実物写真です」と書き分ける運用もある。</p>\n        </div>\n        <div class=\"card\">\n          <h3>ルール</h3>\n          <p><strong>合意したルール（3つ）</strong>——担い手が石でもガラスでも金属でも木でも、そのまま適用される。</p>\n          <ul>\n            <li><strong>効能を断定しない</strong>——説明文で断定すると嘘になる。「〜と言われてきた」「〜と云われる」という言い回しが大切で、それこそが物語である</li>\n            <li><strong>無理な売りつけはしない</strong>——欲しい人が能動的に買う構造に置く。無理やりは悪質</li>\n            <li><strong>物の質は本物にする</strong>——物語を剥がしても、物そのものに持つ価値があること</li>\n          </ul>\n          <ul>\n            <li><strong>規約面の確認</strong>：メルカリ公式の「禁止されている出品物」にパワーストーン自体の禁止はない（有形の石・アクセサリーは通常の出品物）。一方、「写真や説明文から商品内容を具体的に確認できないもの」は禁止で、実体のない商品（鑑定サービスのみ等）は対象になる。石という有形物を売る形はこの点で問題になりにくい</li>\n            <li><strong>効能表現の線</strong>：メルカリ公式のアンバサダーガイドラインは、景品表示法について「合理的な根拠がない効果・性能の表示」を禁止パターンとして明示し、薬機法についても医薬品と誤認される効果効能表現を避けるよう求めている。「必ず金運が上がる」「病気が治る」等の断定はこの枠に触れるおそれがある。市場の主流である言い伝え形式は、この安全圏と一致している——先に合意したルールは、市場の実態から見ても標準形</li>\n            <li><strong>効果の受け止め方</strong>：実際に作用するかどうかは、買う人がどれほど強く信じているかによる。強く信じれば精神的に作用し、思い込みは現実に影響する。だから無意味ではない、という立場を取る</li>\n            <li><strong>不安訴求には寄らない</strong>：市場には不安を煽る文面の出品も存在し成約もしているが、それは採らない。合意した3ルールの側に立つ</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>初歩段階</h3>\n          <p><strong>初歩段階のゴール：</strong>最初の1品が、メルカリで出品され公開されている状態。価格・反応・成約の有無を記録できる形で出すことまでが初歩段階で、判定はその先。</p>\n          <p><strong>必要なもの</strong></p>\n          <ul>\n            <li><strong>メルカリのアカウント</strong>：出品の場。本人確認などの要件は開始時に確認する</li>\n            <li><strong>最初の1品</strong>：物語を剥がしても物そのものに価値がある物（ルール3）。担い手は石に限らない</li>\n            <li><strong>撮影の道具</strong>：スマホのみ。写真は上限20枚まで使える</li>\n            <li><strong>費用</strong>：仕入れに使う額は、テストの期間と撤退ラインと一緒に先に決める（金額そのものの決め方は未確定——開始時に決める）</li>\n          </ul>\n          <p><strong>手順</strong></p>\n          <ol class=\"steps\">\n            <li data-n=\"1\"><span class=\"st\">仕入れ先の決め方を決める</span><span class=\"sd\">具体的な仕入れ先の比較は未調査なので、ここでは「どこから買うか」の物差しだけを先に固定する。①産地・処理（染色・加熱・含浸など）の情報が正直に取れる相手であること——処理の開示は信頼の条件で、情報が取れない物は質の担保ができない ②仕入れの経緯そのものが来歴の物語になる形であること——個人コレクター放出型の位置に立つ以上、「どこで・どう出会ったか」が固有の文脈になる ③最初の1品は、自分が持っていたいと思える物から始める</span><span class=\"done-when\">終わりの目安：この物差しで、買う場所の候補が絞れている</span></li>\n            <li data-n=\"2\"><span class=\"st\">最初の1品を選ぶ</span><span class=\"sd\">「物の選び方」の基準で選ぶ——質が土台（見惚れるような質があるか）、処理は正直に書けるか、傷・クラックは「個性」として書ける範囲か</span><span class=\"done-when\">終わりの目安：1品が手元にあり、産地・処理・状態を説明文に書ける</span></li>\n            <li data-n=\"3\"><span class=\"st\">物語を書く</span><span class=\"sd\">「なぜこの物なのか」——組み合わせの理由、来歴、仕入れの経緯を固有の文脈として書く。効能は言い伝え形式（「〜と云われています」）で添えるに留め、断定しない（ルール1）</span><span class=\"done-when\">終わりの目安：物語の原稿ができている</span></li>\n            <li data-n=\"4\"><span class=\"st\">出品文を組み立てる</span><span class=\"sd\">「出品の型」の骨格（冒頭フック→スペック→物ごとの物語→用途提案→注意書き→ハッシュタグ）で説明文を作る。タイトルは検索に乗る最低限のキーワードを入れ、固有の物語が先頭に来る形にする。キーワード詰め込みのテンプレートにはしない</span><span class=\"done-when\">終わりの目安：タイトルと説明文が完成している</span></li>\n            <li data-n=\"5\"><span class=\"st\">写真を撮る</span><span class=\"sd\">上限20枚を目安に、実物の質が伝わる情報を厚くする。ブレスレットは手に持つ／手首に着ける見せ方、置物は台座に置いた見せ方＋サイズ・重さの数値併記が市場の定番</span><span class=\"done-when\">終わりの目安：写真が揃い、質と大きさが伝わる</span></li>\n            <li data-n=\"6\"><span class=\"st\">価格を付けて出品する</span><span class=\"sd\">同種の成約実例の帯（市場の構造）を見て、物の質＋物語の固有さで帯の中の位置を決める。素材価格に引っ張られず、完成品としての価格を固定価格で出す。固定価格で出すこと自体が、本命の作品販売に向けた値付けの練習になる</span><span class=\"done-when\">終わりの目安：出品が公開されている</span></li>\n            <li data-n=\"7\"><span class=\"st\">反応を記録する</span><span class=\"sd\">価格・反応（いいね、コメント、交渉）・成約の有無を残す。コメント経由の交渉→専用出品というリピーター動線が市場では機能しているので、単発の成約より、同じ買い手に繰り返し売る動線を意識する</span><span class=\"done-when\">終わりの目安：記録が付き、期間と撤退ラインでの判定材料が揃う</span></li>\n          </ol>\n          <p><strong>つまずきどころ</strong></p>\n          <ul>\n            <li><strong>効能を断定してしまう</strong>：景品表示法・薬機法の線に触れる書き方（「必ず金運が上がる」「病気が治る」等）はしない。市場の主流である言い伝え形式が安全圏で、合意したルールとも一致する</li>\n            <li><strong>素材の安さに価格が引っ張られる</strong>：価格は素材そのものではなく、組み立てと意味付けの層で立つ。素材価格で付けると、この型の意味がなくなる</li>\n            <li><strong>写真と情報が薄い</strong>：写真の枚数と情報量は価格帯と相関して見える。高額帯の成約例は20枚を使い切っている</li>\n            <li><strong>不安訴求に寄る</strong>：市場には不安を煽って成約している出品もあるが、採らない。合意した3ルールの側に立つ</li>\n          </ul>\n          <p><strong>時期：</strong>受験後（2027年3月以降）。出す前に、期間と撤退ラインを決める</p>\n          <p class=\"sources\">きっかけ・出典：Xで見かけたスピ物販の実例（2026-11-19、本人の共有）。本文は合意事項（2026-11-19、Business Labo）と市場分析「メルカリ物販_市場分析」（2026-11-19。メルカリの売り切れ実例ベースの調査で、検索画面がJS描画のため網羅的な統計ではない）、メルカリ公式ヘルプ（禁止されている出品物／アンバサダーガイドライン）に拠る</p>\n        </div>\n                <div class=\"card\">\n          <h3>海外向けデジタル商品（言語市場の裁定） <span class=\"badge pending\">テスト枠・候補</span></h3>\n          <p>言語の市場の間で、情報の値段は違う。日本語圏では当たり前で飽和している情報が、英語圏では薄くて売れることがある——その価格差を取りに行く形（<strong>言語市場の裁定</strong>）。候補4（海外アフィリエイト）が他人の商品を紹介する形なのに対して、こちらは<strong>自分の商品を売る</strong>形で、売れた商品はバックリスト（在庫）として残る。追い風は、AIで翻訳と制作のコストが落ち、この裁定の敷居が下がったこと。</p>\n          <ul>\n            <li><strong>置き場所</strong>：テスト枠の候補（決定ではない）。やるなら受験後。題材は「日本人にしか書けない日本の何か」を英語で売る形が筋</li>\n            <li><strong>正直な留保</strong>：きっかけになった投稿の収益数字（初月の金額など）は自己申告で裏付けがないため採っていない。「ブルーオーシャン」のような結論も置かない。残すのは、裏の取れる仕組みと実務だけ。重い部分は制作ではなく、英語圏での集客をゼロから作ること</li>\n            <li><strong>ノウハウの置き方</strong>：仕組みの本体は、次のグループ（仕組みと全体像／売り場の実務／他の売り場とnoteの限界／決済と税の基本／題材の当て方／集客の現実／初歩段階）に体系として置く</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>仕組みと全体像</h3>\n          <div class=\"flow\"><span>日本語圏で厚い知識</span><i>→</i><span>英語で再構成</span><i>→</i><span>海外の売り場で販売</span><i>→</i><span>円で銀行口座に受け取り</span></div>\n          <ul>\n            <li><strong>裁定が成り立つ条件</strong>：①日本語圏では情報が厚く、安く出回っている題材であること ②英語圏では同じ情報が薄いか、高く売られていること ③翻訳・制作のコストがAIで下がり、価格差に対して作業が見合うこと ④売り場と決済が既製のプラットフォームで済むこと</li>\n            <li><strong>翻訳ではなく再構成</strong>：日本語の記事を機械翻訳して並べるだけでは価値が薄い。英語圏の読者の前提（知らない制度・道具・文脈）を埋めて、1つの商品として作り直すのが本体の作業</li>\n            <li><strong>資産性</strong>：売れた商品のバックリストは在庫として残り続ける。候補1（make.fun）の懸賞型と違い、積み上げがゼロにはならない。集客の努力も、商品1点ではなくバックリスト全体に効く</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>売り場の実務（Gumroad）</h3>\n          <p>本命の売り場はGumroad。手数料は公式ヘルプの数字で読む。</p>\n          <div class=\"stats\">\n            <div class=\"stat\"><div class=\"v\">10<small>%</small> + $0.50</div><div class=\"k\">直接販売（自分のリンク・プロフィール経由）のプラットフォーム手数料。これにカード処理料 2.9% + $0.30 が別途かかる</div></div>\n            <div class=\"stat\"><div class=\"v\">30<small>%</small></div><div class=\"k\">Discover（Gumroad内のマーケット）経由の販売は一律30%。処理料込み</div></div>\n            <div class=\"stat\"><div class=\"v\">5<small>%</small> + $0.50</div><div class=\"k\">その月の有料売上が $20,000 に達した後の直接販売は、この料率に下がる</div></div>\n            <div class=\"stat\"><div class=\"v\">$100</div><div class=\"k\">出金の最低残高（米ドル相当）。届くまで出金されない</div></div>\n          </div>\n          <ul>\n            <li><strong>手数料の実感（公式手数料からの計算）</strong>：$5の商品が直接売れると、手数料の合計は約$1.45で手取りは約$3.55（約71%）。$20なら手数料約$3.38で手取り$16.62（約83%）。固定費（$0.50 + $0.30）が毎回かかるため、安い商品ほど構造的に不利になる</li>\n            <li><strong>税はGumroadが持つ</strong>：2025年1月からGumroadは販売主体（Merchant of Record）として動き、世界中の売上税・VAT・GSTをGumroad側が計算・徴収・納付する。売り手が各国の税を個別に処理する必要はない（決済と税の基本のグループと対）</li>\n            <li><strong>日本からの受け取り</strong>：銀行口座への円（JPY）入金に対応している（公式の対応表に Japan／JPY）。週次の出金日は火曜で、前週金曜（UTC）までの売上が対象、売上には7日間の保留期間がある。本人確認（KYC）は、売上が積み上がった段階で決済代行のStripe経由で求められる</li>\n            <li><strong>受け取りの制約</strong>：PayoneerやWiseでの出金はできない（公式）。出金先は居住国の銀行口座に限られ、通貨はその国の通貨になる。換算は payout 時ではなく売上時点のレートで行われる</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>他の売り場とnoteの限界</h3>\n          <div class=\"lanes\">\n            <div class=\"lane art\">\n              <h3>海外の売り場</h3>\n              <p>Gumroadが本命。代替はPaddle（5% + 50¢、同じく販売主体型で税を処理する。料金は2026年10月時点の公式料金ページ）。注意として、Lemon Squeezyは2026年11月に新規受付を終了し、2027年3月末で決済を停止するため、新規の選択肢にはならない——プラットフォーム自体が終わるリスクの実例でもある。Stripeで直接売る形は手数料が安い代わりに、税務と実名まわりを全部自分で持つ（収益化の実務メモのとおり）。</p>\n            </div>\n            <div class=\"lane other\">\n              <h3>noteの限界</h3>\n              <p>「海外note」という言い方への正直な評価。noteは日本語圏では強いが、海外向けの売り場としては限界がある。画面と発見の場が日本語圏に閉じている／公式ヘルプ上、海外発行のクレジットカードは決済できない場合がある（有料記事はPayPal決済にも対応）／売上の振込先は国内の銀行口座のみ。つまり実態は「海外の読者にnoteで売る」ではなく、「日本の題材を、英語圏の売り場に移して売る」話として読むのが正確。</p>\n            </div>\n          </div>\n        </div>\n        <div class=\"card\">\n          <h3>決済と税の基本</h3>\n          <ul>\n            <li><strong>日本の消費税</strong>：デジタル商品の提供は「電気通信利用役務の提供」に当たる。課税の内外判定は、受け手（買い手）の住所地で決まる（国税庁）。国外の消費者への提供は国外取引となり、日本の消費税は不課税</li>\n            <li><strong>買い手側の国の税</strong>：EUのVATのように、買い手の国の税は別問題として立つ。販売主体型の売り場（Gumroad、Paddle）ではプラットフォームが処理するが、自分が販売主体になる形（Stripe直接など）では自分で負う。売り場選びでこの差は大きい</li>\n            <li><strong>所得税</strong>：日本に住んでいる限り、海外での売上も含めた全世界所得が課税対象になる。売上は確定申告で事業所得（または雑所得）として申告し、プラットフォーム手数料は経費にできる。海外で源泉徴収される話とは別に、日本側の申告は常にある</li>\n            <li><strong>記録</strong>：出金は円で銀行口座に入るので、売上と手数料の明細（プラットフォームのCSV等）を申告用に残すのが実務になる</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>題材の当て方</h3>\n          <p>「日本人にしか書けない日本の何か」を、当て勘ではなく基準で選ぶ。</p>\n          <ul>\n            <li><strong>基準1・厚さの差</strong>：日本語で検索すると情報が厚く安く出てくるのに、英語で検索すると薄い・古い・高い、という落差がある題材か</li>\n            <li><strong>基準2・裏が取れる</strong>：自分の実体験や実物で中身の裏が取れるか。翻訳だけの転売は薄く、著作権の面でも危うい。他人の日本語記事の翻訳販売はやらない</li>\n            <li><strong>基準3・買う理由の形</strong>：英語圏の読者が「how to」「guide」「template」のような、買う前提の検索をする形にできるか（候補4の「検索意図の温度」と同じ読み方）</li>\n            <li><strong>候補の出し方</strong>：自分の棚卸しから出す——自分が当たり前に知っていて、日本語圏では無料同然に出回っている知識（受験・制作の実務、道具と素材の扱い、日本の市場や文化の内部情報など）を書き出し、英語検索での薄さと突き合わせる。最初の作業は、この突き合わせで候補を3つに絞ること</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>集客の現実</h3>\n          <ul>\n            <li><strong>置くだけでは売れない</strong>：売り場の棚に置くことと、見つけてもらうことは別。GumroadのDiscover経由は発見を肩代わりする代わりに手数料30%で、自分の導線で売る直接販売（10% + $0.50 + 処理料）との差が、そのまま集客の値段になる</li>\n            <li><strong>重い部分はここ</strong>：英語圏での発見可能性——検索（SEO）、SNS、コミュニティへの露出を、ゼロから作る必要がある。候補4と重さの在り処は同じで、制作より集客が本体の仕事になる。受験期にやる作業ではない</li>\n            <li><strong>候補4との違い</strong>：比較記事は他人の商品への送客だが、こちらは自分の商品。在庫が残る分、集客の成果は1回で終わらずバックリスト全体に効く</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>初歩段階</h3>\n          <p><strong>初歩段階のゴール：</strong>Gumroadで最初の商品1点が販売中になっている状態（商品ページが公開され、買える形になっている）。売れるかどうかは、その先の数字で判定する。</p>\n          <p><strong>必要なもの</strong></p>\n          <ul>\n            <li><strong>Gumroadのアカウント</strong>：本命の売り場。受け取りは居住国の銀行口座（円）へ</li>\n            <li><strong>題材の材料</strong>：自分の実体験や実物で裏が取れる題材（翻訳だけの転売はしない）</li>\n            <li><strong>費用</strong>：アカウントと出品は0円で始められる。かかるのは売れた時の手数料だけ（直接販売で10%＋$0.50、別途カード処理料2.9%＋$0.30）</li>\n          </ul>\n          <p><strong>手順</strong></p>\n          <ol class=\"steps\">\n            <li data-n=\"1\"><span class=\"st\">題材候補を3つ書き出す</span><span class=\"sd\">「題材の当て方」の基準（厚さの差／裏が取れる／買う理由の形）で自分の棚卸しから出し、英語検索での薄さと突き合わせる</span><span class=\"done-when\">終わりの目安：候補が3つに絞れている</span></li>\n            <li data-n=\"2\"><span class=\"st\">題材を1つに決める</span><span class=\"sd\">3つの基準で採点し、最初に作る1つを決める。残り2つはバックリストの候補として残す</span><span class=\"done-when\">終わりの目安：作る題材が1つに決まっている</span></li>\n            <li data-n=\"3\"><span class=\"st\">売り場の下ごしらえをする</span><span class=\"sd\">Gumroadで受け取り設定（銀行口座）を済ませ、出金までの道を確認する。本人確認（KYC）は売上が積み上がった段階で求められるが、受け取りの形は先に通しておく。出金は週次（火曜）、最低残高$100、売上に7日間の保留がある点も先に把握する</span><span class=\"done-when\">終わりの目安：受け取り設定が終わり、出金の条件を把握している</span></li>\n            <li data-n=\"4\"><span class=\"st\">商品を1つ作る</span><span class=\"sd\">翻訳ではなく再構成で作る——英語圏の読者が知らない前提（制度・道具・文脈）を埋めて、1つの商品として作り直す</span><span class=\"done-when\">終わりの目安：商品ファイルが完成している</span></li>\n            <li data-n=\"5\"><span class=\"st\">価格を付けて公開する</span><span class=\"sd\">固定費（$0.50＋$0.30）に食われない帯で付ける。目安は「手数料の実感」の計算（$5では手取り約71%、$20では約83%）。Discover経由は一律30%なので、基本は直接販売の形で出す</span><span class=\"done-when\">終わりの目安：商品ページが公開され、買える状態になっている</span></li>\n            <li data-n=\"6\"><span class=\"st\">集客の入口を1つ作る</span><span class=\"sd\">検索かSNSか、題材に合う入口を1つに絞って置く。置くだけでは売れないのがこの候補の重い部分で、入口まで作って初歩段階の終わりとする</span><span class=\"done-when\">終わりの目安：商品への導線が1つ公開されている</span></li>\n          </ol>\n          <p><strong>つまずきどころ</strong></p>\n          <ul>\n            <li><strong>安く付けすぎる</strong>：固定費が毎回かかるため、安い商品ほど構造的に不利になる</li>\n            <li><strong>機械翻訳の転売になる</strong>：日本語の記事を訳して並べるだけでは価値が薄く、著作権の面でも危うい。他人の日本語記事の翻訳販売はやらない</li>\n            <li><strong>置いて終わる</strong>：英語圏での発見可能性（SEO、SNS、コミュニティへの露出）はゼロから作る必要がある。制作より集客が本体の仕事になる</li>\n            <li><strong>出金の最低残高</strong>：$100に届くまで出金されない。最初の売上＝すぐ現金、ではない</li>\n          </ul>\n          <p><strong>時期：</strong>受験後（2027年3月以降）</p>\n          <p class=\"sources\">きっかけ・出典：Xで見かけた「海外note」系の投稿（収益の自己申告は裏付けがないため採っていない）。本文の数字と仕組みは、Gumroad公式ヘルプ（手数料／受け取り）、note公式ヘルプ（サービス別の支払い方法）、国税庁「国境を越えた役務の提供に係る消費税の課税関係について」、Paddleの公式料金（2026年11月確認）に拠る</p>\n        </div>\n        <div class=\"card\">\n          <h3>海外アフィリエイト比較記事（AI自動） <span class=\"badge pending\">テスト枠・候補</span></h3>\n          <p>英語圏向けに、他人の商品（主にSaaS）を<strong>比較記事で紹介して、紹介料を得る</strong>形。候補3（海外向けデジタル商品）と同じ「言語市場の裁定」の系統だが、候補3が自分の商品を売る形なのに対して、こちらは商品を持たず「買う直前の読者を連れてくる仕事」を売る。狙うのは「少ない件数×高い単価」の型で、比較記事という中身は資産として積み上がる。</p>\n          <ul>\n            <li><strong>置き場所</strong>：テスト枠の候補（決定ではない）。受験後に回す枠で、実践は受験後。知識の蓄積だけは受験前から進めてよい</li>\n            <li><strong>正直な留保</strong>：きっかけになった原典に収益の実績証拠はない（単価×件数の計算の提示のみ）。記事自体が無料LINE教材への誘導で、投稿者の本当の狙いは見込み客集めと見ている。重い部分は、英語圏での集客とSEOの信頼づくり</li>\n            <li><strong>ノウハウの置き方</strong>：仕組みの本体は、次のグループ（全体像とお金の流れ／成果の測り方／単価の構造／集客の経済学／ルール／損なうパターン／初歩段階）に体系として置く</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>全体像とお金の流れ</h3>\n          <p>アフィリエイト（成果報酬型広告）は4者で成り立つ。<strong>広告主</strong>（商品を売りたい会社。例：SemrushのようなSaaS企業）、<strong>ASP／ネットワーク</strong>（計測・集計・支払いを代行。海外ではImpact、ShareASaleなど。日本ではA8.netなど）、<strong>媒体</strong>（記事や動画で紹介する側＝自分）、<strong>読者</strong>（リンクを踏んで買う人）。</p>\n          <div class=\"flow\"><span>読者がリンクを踏む</span><i>→</i><span>購入＝成果</span><i>→</i><span>広告主が広告費を払う</span><i>→</i><span>手数料を引いて媒体へ</span></div>\n          <p>媒体は在庫を持たず、商品も作らない。売っているのは「買う直前の読者を連れてくる仕事」で、報酬はその紹介料。単価・否認・リスクの話は全部ここにつながる。</p>\n          <div class=\"lanes\">\n            <div class=\"lane other\">\n              <h3>日本のASP型</h3>\n              <p>A8.net等のASPに登録し、日本語の広告案件を選ぶ。物販・金融・美容など国内商品が中心で、報酬は購入金額の数％か、申込1件の固定額。読者は日本語圏。</p>\n            </div>\n            <div class=\"lane art\">\n              <h3>海外（英語圏）型</h3>\n              <p>広告主の自社プログラムか、Impact等の海外ネットワーク経由。高単価の中心はSaaS（月額ソフト）で、報酬は1件ごとの固定額（バウンティ）が多い。読者は英語圏＝母数が桁違いに大きい。候補4が狙うのはこちら。</p>\n            </div>\n          </div>\n        </div>\n        <div class=\"card\">\n          <h3>成果の測り方</h3>\n          <p>成果は一発で確定しない。段階を踏む。</p>\n          <ol class=\"steps\">\n            <li data-n=\"1\"><span class=\"st\">クリック</span><span class=\"sd\">読者がリンクを踏む</span></li>\n            <li data-n=\"2\"><span class=\"st\">成果発生（コンバージョン）</span><span class=\"sd\">読者が購入・申込をする。この時点ではまだ「仮」の数字</span></li>\n            <li data-n=\"3\"><span class=\"st\">承認</span><span class=\"sd\">広告主が「正当な成果だ」と認めて、初めて報酬が確定する</span></li>\n            <li data-n=\"4\"><span class=\"st\">支払い</span><span class=\"sd\">ネットワーク経由で振り込まれる（最低支払額や締め・支払いサイクルはプログラムにより異なる）</span></li>\n          </ol>\n          <ul>\n            <li><strong>否認</strong>：発生した成果の一部は広告主に否認される。主な理由は、読者のキャンセル・返金／不正や自己購入などの規約違反／重複計測（他の媒体のリンクが優先）／無料体験だけで終わり有料転換しなかった（条件による）。管理画面の「発生額」は確定収入ではなく、<strong>否認率</strong>を引いたものが実収入になる。否認率はプログラムにより大きく違うので、始める前に規約と条件を読むのが実務の第一歩</li>\n            <li><strong>クッキー期間</strong>：リンクを踏んでから一定期間内に買えば、時間が空いても成果になる計測の有効期間。数日のものから120日超のものまであり、長いほど媒体に有利</li>\n            <li><strong>ラストクリック</strong>：最後に踏んだリンクの媒体に成果が付く方式が一般的（Semrushもこの方式）</li>\n            <li><strong>EPC</strong>（1クリックあたりの収益＝総報酬÷クリック数）：記事同士・媒体同士の効率を比べる物差し。例：1,000クリックで成果5件、1件$200なら総報酬$1,000でEPCは$1。「月いくら」ではなくEPCと否認率で見るのが、仕組みとしての数字の読み方</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>単価の構造</h3>\n          <p>具体例はSemrushの公式アフィリエイトプログラム（Impact経由、ラストクリック、クッキー120日）。</p>\n          <div class=\"stats\">\n            <div class=\"stat\"><div class=\"v\">$200</div><div class=\"k\">SEO Toolkitの新規成約1件（基本ランク）。実績ランクが上がると$250→$300→$350</div></div>\n            <div class=\"stat\"><div class=\"v\">$10</div><div class=\"k\">無料トライアルの有効化1件</div></div>\n            <div class=\"stat\"><div class=\"v\">120<small>日</small></div><div class=\"k\">クッキー期間。この間に買えば成果になる</div></div>\n            <div class=\"stat\"><div class=\"v\">1<small>回払い</small></div><div class=\"k\">継続課金の分配ではない（条件は改定されることがあるため、参加時に公式ページで再確認する）</div></div>\n          </div>\n          <ul>\n            <li><strong>なぜ1件$200を払えるのか</strong>：LTV（顧客1人が契約期間全体で払う合計）とCAC（顧客1人を得る費用）の関係。Semrushの料金は月額約$140〜$500で、顧客が1年続ければLTVは$1,700〜$6,000規模。獲得に$200を払っても元が取れる。「1件$200」は魔法でも好意でもなく、LTVの中からCACとして切り分けているだけ</li>\n            <li><strong>高単価・低頻度型</strong>（SaaS・金融・高額講座）：1件数千円〜数万円。必要なのは「買う直前の読者」を少数、正確に連れてくること。候補4が狙う型</li>\n            <li><strong>低単価・高頻度型</strong>（日用品・書籍・安い物販）：1件数十円〜数百円。1回しか買わない物はLTVが小さいので紹介料も購入金額の数％にしかならず、大量のアクセスが要る</li>\n            <li><strong>継続分配型</strong>（レベニューシェア）：顧客が払い続ける限り毎月数％〜数十％が入る。Semrushは1回払いだが、継続型は「積み上がる資産」になりやすい代わりに単月の入りは小さい。プログラム選びではこの違いが効く</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>集客の経済学</h3>\n          <ul>\n            <li><strong>検索意図の温度</strong>：検索する言葉には温度がある。「SEOとは」＝調べもので買う気は薄い。「Semrush vs Ahrefs」＝比べている、<strong>買う直前</strong>。「Semrush 割引」「Semrush pricing」＝ほぼ決めている。比較記事が刺さるのは2番目の読者を取るからで、媒体の仕事は「悩みの分析→候補の絞り込み→判断材料の提示」。これは広告主にとっても質の高い送客になる</li>\n            <li><strong>E-E-A-T</strong>：Googleの評価軸で、経験（Experience）・専門性（Expertise）・権威性（Authoritativeness）・信頼性（Trustworthiness）。比較記事では特に「実際に使った経験があるか」と「情報が正確か」が問われる。公式情報ベースの比較は正確さでは戦えるが、経験の部分は偽装できない</li>\n            <li><strong>AI量産へのGoogleの姿勢（公式）</strong>：AIで作ったこと自体は違反ではない（「どう作ったか」ではなく「読者に役立つか」で評価）。一方、検索順位の操作目的で価値の薄いページを大量生成する「スケールド・コンテンツ・アビュース」はスパムポリシー違反で、2024年3月に明文化され、生成AIでの大量生成が代表例に挙がっている。違反すれば順位下落や手動対策の対象。「AIで記事を量産する」こと自体が、公式ポリシー上で最も危険な形に近い。回せるのは制作の補助までで、1記事ごとの独自の価値（正確な比較、判断の軸、実データ）が本体になる</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>ルール</h3>\n          <ul>\n            <li><strong>ステマ規制（日本）</strong>：2023年10月1日施行。景品表示法第5条第3号に基づく告示で、広告と分からない宣伝が不当表示になった。規制の直接の対象は広告主だが、実務上はASPがアフィリエイターに「広告」「PR」等の表示を規約で必須にしていて、表示しないと登録解除・報酬停止の対象になる。日本語の読者向けなら、記事の冒頭など目立つ位置に広告である旨を書くのが基準</li>\n            <li><strong>FTCの開示ガイドライン（米国）</strong>：英語圏向けならこちらが本命。Endorsement Guides（16 CFR Part 255、2023年改訂）で、報酬がかかる関係は読者が分かる言葉で、明確に目立つよう（clear and conspicuous）開示する。「affiliate link」と書くだけでは不十分（読者が「報酬が発生する」と理解できないため）。開示はリンクの近く、記事の早い位置に置く</li>\n            <li><strong>順位は金で売らない</strong>：報酬額でランキングの順位を操作して中立を装う行為は、開示しても欺瞞的とされる。順位は自分の判断で決め、その上で報酬関係を開示するのが正しい形</li>\n            <li><strong>規約違反で起きること</strong>：未払い報酬の没収、提携解除・アカウント停止（ネットワーク全体で共有される場合もある）。典型的な違反は、ブランド名への広告入札、クッキースタッフィング等の不正計測、虚偽の体験談、根拠のない断定表現（「最安」「絶対」など）</li>\n            <li><strong>匿名の範囲</strong>：ネットワークへの登録には本人確認と振込先情報が要る。「匿名」は読者に対してであり、プラットフォームに対してではない。ここを取り違えると設計が崩れる</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>損なうパターン</h3>\n          <ul>\n            <li><strong>否認率</strong>：発生額がそのまま入るわけではない。返金されやすい商品は構造的に否認が増える</li>\n            <li><strong>プログラムの終了・条件改定</strong>：広告主がプログラムを閉じたり単価を下げたりすれば、その記事の収益は消える。Semrush自身、過去に報酬体系を大きく変えている（旧BeRushの継続分配から1回払いへ）。1プログラム依存は構造的な弱さ</li>\n            <li><strong>検索順位の変動</strong>：集客がGoogle検索頼みなら、アップデート1回で流入が激減しうる。スパムポリシー違反はその最たるもの</li>\n            <li><strong>ラストクリックの奪い合い</strong>：購入直前に別の媒体のリンク（クーポンサイト等）を踏まれると、成果はそちらに付く</li>\n            <li><strong>計測の漏れ</strong>：広告ブロッカーやブラウザのトラッキング制限で、成果が計測されないことがある</li>\n          </ul>\n          <p>どれも「頑張り」で消えるリスクではなく、仕組みに組み込まれた前提として織り込むもの。対策は分散（複数プログラム、複数の集客路）と、規約の範囲内で長く続けること。</p>\n        </div>\n        <div class=\"card\">\n          <h3>初歩段階</h3>\n          <p><strong>初歩段階のゴール：</strong>最初の比較記事1本が公開され、アフィリエイトリンクの計測が正しく動いている状態（クリックが記録されるところまで）。成果が出るかどうかは、その先の話。</p>\n          <p><strong>必要なもの</strong></p>\n          <ul>\n            <li><strong>学習編</strong>：先に学習編「アフィリエイトの仕組み」を読む。この候補の各グループ（全体像／成果の測り方／単価の構造／集客の経済学／ルール／損なうパターン）が、その体系に当たる</li>\n            <li><strong>ASP／プログラムへの登録</strong>：海外型は広告主の自社プログラムか、Impact等のネットワーク経由。本人確認と振込先情報が要る（匿名は読者に対してであり、プラットフォームに対してではない）</li>\n            <li><strong>記事を置く場所</strong>：英語の比較記事を公開する場所。具体的な置き場所は開始時に決める</li>\n            <li><strong>費用</strong>：登録と記事の公開は0円で始められる（広告出稿はしない）</li>\n          </ul>\n          <p><strong>手順</strong></p>\n          <ol class=\"steps\">\n            <li data-n=\"1\"><span class=\"st\">仕組みを学ぶ</span><span class=\"sd\">学習編「アフィリエイトの仕組み」を読み、成果の測り方（クリック→成果発生→承認→支払い、否認率、クッキー期間、ラストクリック、EPC）を掴む。知らないまま始めると、発生額を収入と読み違える</span><span class=\"done-when\">終わりの目安：「発生額≠確定収入」ということと、EPCの計算が言える</span></li>\n            <li data-n=\"2\"><span class=\"st\">プログラムに登録する</span><span class=\"sd\">狙う型（高単価・低頻度のSaaS）から最初のプログラムを1つ選び、登録と本人確認を済ませる。規約（否認の条件、クッキー期間、禁止事項）は登録の時点で読む。例：SemrushはImpact経由で、SEO Toolkitの新規成約1件$200・クッキー120日・ラストクリック</span><span class=\"done-when\">終わりの目安：提携が承認され、自分のリンクが発行できる</span></li>\n            <li data-n=\"3\"><span class=\"st\">ターゲットと悩みを決める</span><span class=\"sd\">誰の、どんな悩みに当てるかを決め、検索意図の温度を見て「買う直前」の言葉（比べている・価格を調べている検索）を拾う</span><span class=\"done-when\">終わりの目安：記事が狙う検索の言葉が決まっている</span></li>\n            <li data-n=\"4\"><span class=\"st\">商品3件を公式情報で比べる</span><span class=\"sd\">仕様・価格を公式情報から集めて比較表を作る。順位は報酬額ではなく自分の判断で決める（順位は金で売らない）</span><span class=\"done-when\">終わりの目安：比較表があり、順位の理由が言える</span></li>\n            <li data-n=\"5\"><span class=\"st\">記事を書いて公開する</span><span class=\"sd\">英語の比較記事として書き、報酬関係の開示を記事の早い位置に、読者が「報酬が発生する」と分かる言葉で目立つよう置く（FTCの基準）。使っていない商品を「使った」とは書かない——比較は「公式情報に基づく比較」と正直に位置づける。公開したら、自分のリンクを踏んでクリックが計測されるか確認する</span><span class=\"done-when\">終わりの目安：記事が公開され、クリックの計測が確認できている</span></li>\n            <li data-n=\"6\"><span class=\"st\">成果の出方を見る</span><span class=\"sd\">発生で止めず、承認と否認率まで見る。記事同士の効率はEPCで比べる</span><span class=\"done-when\">終わりの目安：一定期間のクリック・発生・承認が記録されている</span></li>\n          </ol>\n          <ul>\n            <li><strong>Museで回せる部分</strong>：ターゲットと悩みの洗い出し、キーワード候補出し、公式情報の収集と整理、比較表づくり、記事の構成案と下書き、英語への翻訳・推敲、公開後の数字（クリック・成果・EPC）の集計と改善案</li>\n            <li><strong>回せない／やってはいけない部分</strong>：実体験の偽装（使っていない商品を「使った」と書くのは虚偽表示の側に立つ）、開示の省略、推す商品と順位の最終判断、信頼の蓄積。切り分けの原則は1つ——Museは「調べる・比べる・書く・測る」の速度を上げる。判断と責任と信頼は人間側に残す</li>\n          </ul>\n          <p><strong>つまずきどころ</strong></p>\n          <ul>\n            <li><strong>開示を忘れる・薄くする</strong>：開示はリンクの近く、記事の早い位置に。「affiliate link」と書くだけでは、読者が「報酬が発生する」と理解できないため不十分とされる</li>\n            <li><strong>量産に寄る</strong>：検索順位の操作目的で価値の薄いページを大量生成する形は、Googleのスパムポリシー（スケールド・コンテンツ・アビュース）に触れる。回せるのは制作の補助までで、1記事ごとの独自の価値が本体になる</li>\n            <li><strong>発生額を収入と読む</strong>：否認率を引いたものが実収入。返金されやすい商品は構造的に否認が増える</li>\n            <li><strong>1プログラム依存</strong>：広告主がプログラムを閉じたり単価を下げたりすれば、その記事の収益は消える。分散が前提</li>\n          </ul>\n          <p><strong>時期：</strong>手順1（学習）は受験前から可。実践（手順2以降）は受験後</p>\n          <p class=\"sources\">きっかけ・出典：Xの記事「Muse自動×海外アフィが想像以上に最強だった（プロンプトも公開）」（とら🐯AI副業 @3Imzdo3）。原典の収益数字は実績の証拠がないため採っていない。本文の数字と仕組みは学習編「アフィリエイトの仕組み」（Semrush公式アフィリエイトプログラム、Google Search Central、消費者庁、FTCの公式情報に基づく）の記載に拠る</p>\n        </div>\n        <div class=\"card\">\n          <h3>有料note（AIパイプライン） <span class=\"badge pending\">テスト枠・候補</span></h3>\n          <p>「AIパイプライン」の工程（リサーチ→売れる構成→有料本編→集客ポスト）を1周回して、有料noteを1本作って売るテスト。狙いは金額ではなく、<strong>工程そのものが回るか</strong>と<strong>題材が売れるか</strong>を分けて判定すること。工程の本体は「AIパイプライン」セクションに体系として置いてある。</p>\n          <ul>\n            <li><strong>置き場所</strong>：テスト枠の候補（決定ではない）。実践は受験後</li>\n            <li><strong>候補3との関係</strong>：候補3（海外向けデジタル商品）と同じ「デジタル商品」系。ただしこちらは国内のnoteで、売り場と言語の重さを外して、まず工程を検証する順序。工程が回ると確認できたら、同じ鎖を候補3（英語圏・Gumroad）にも使い回せる</li>\n            <li><strong>正直な留保</strong>：きっかけになった投稿の収益主張は裏付けがないため採っていない。残すのは工程と、判定の仕組みだけ</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>仕組みと進め方</h3>\n          <div class=\"flow\"><span>題材を決める</span><i>→</i><span>工程を1周回す</span><i>→</i><span>公開・販売</span><i>→</i><span>数字で判定</span></div>\n          <p>進め方の要約は上の流れ図。実行の詳しい手順は、次の「初歩段階」に置いた。</p>\n        </div>\n        <div class=\"card\">\n          <h3>初歩段階</h3>\n          <p><strong>初歩段階のゴール：</strong>有料noteが1本、販売中の状態で公開されていて、集客ポストがXに出ていること。工程を1周回し切った記録が残ることも、売上の有無と同じくらいこのテストの成果になる。</p>\n          <p><strong>必要なもの</strong></p>\n          <ul>\n            <li><strong>noteのアカウント</strong>：販売の場。有料記事の手取りは価格の約85%（1,000円で約855円。振込の時に270円が別にかかる）</li>\n            <li><strong>題材の材料</strong>：自分の実録・数字・一次情報。材料の質がそのまま本文の質になる（AIパイプラインの工程3）</li>\n            <li><strong>集客の場</strong>：Xのアカウント（集客ポストを出す場所）</li>\n            <li><strong>費用</strong>：0円で始められる</li>\n          </ul>\n          <p><strong>手順</strong></p>\n          <ol class=\"steps\">\n            <li data-n=\"1\"><span class=\"st\">題材を1つ決める</span><span class=\"sd\">本人が本物の材料を持つ題材から選ぶ（例：アプリ制作の実録、受験勉強の仕組み化）。ここは工程の外の判断で、決定は本人</span><span class=\"done-when\">終わりの目安：題材が1つに決まり、「誰の・どんな渇きに・何を渡すか」が言える</span></li>\n            <li data-n=\"2\"><span class=\"st\">工程1 リサーチ</span><span class=\"sd\">noteで実際に売れている同種の商品と価格帯、買う人の言葉を実物で確かめる。需要の証拠は「実際に売れている物」であって、言及数や盛り上がりではない</span><span class=\"done-when\">終わりの目安：同種の販売実例と価格帯が挙げられる</span></li>\n            <li data-n=\"3\"><span class=\"st\">工程2 構成</span><span class=\"sd\">目次と、無料部分と有料部分の境目を決める。物差しは痛み止めになっているか（今困っている人に刺さるか。漠然と良いもの＝ビタミンでは買われない）。無料部分で価値が伝わり、有料部分に「続きを買う理由」がある形にする。価格の案もここで置く</span><span class=\"done-when\">終わりの目安：目次・境目・価格が決まっている</span></li>\n            <li data-n=\"4\"><span class=\"st\">工程3 本編</span><span class=\"sd\">構成に沿って本文を作る。AIの下書きに、自分の経験と数字を入れて置き換えていく。一般論の水増しになっている部分は、自分の材料で潰す。数字には出典を付ける</span><span class=\"done-when\">終わりの目安：本文が完成し、自分の材料が入っている</span></li>\n            <li data-n=\"5\"><span class=\"st\">価格を付けて公開する</span><span class=\"sd\">noteで有料記事として販売を開始する。手取りの計算（価格の約85%）を踏まえて価格を置く</span><span class=\"done-when\">終わりの目安：販売中の状態で公開されている</span></li>\n            <li data-n=\"6\"><span class=\"st\">工程4 集客ポスト</span><span class=\"sd\">本編の要点と、リサーチで拾った読者の言葉から告知文を作り、Xに出す。自分の声と実体験の一文を入れ、誇張を落とす。宣伝の文面ではなく「読み手の渇きへの一言」になっているかを見る。最初の読者は手で連れてくる</span><span class=\"done-when\">終わりの目安：集客ポストが公開されている</span></li>\n            <li data-n=\"7\"><span class=\"st\">記録して判定する</span><span class=\"sd\">詰まった工程と、AIの出力が薄かった場所を記録する。一定期間（目安は30日）の販売数と、工程にかかった時間を見て、「判定の物差し」で工程と題材を切り分ける</span><span class=\"done-when\">終わりの目安：一周の記録が残り、続ける／題材を変えるの判断材料が揃う</span></li>\n          </ol>\n          <p><strong>つまずきどころ</strong></p>\n          <ul>\n            <li><strong>題材が薄い</strong>：材料の本物さが差になる。一般論だけの題材は、工程を回しても薄い物しか出てこない</li>\n            <li><strong>無料と有料の境目を間違える</strong>：無料部分で価値を出し切ると買う理由が消え、隠しすぎると価値が伝わらない。境目は工程2で先に決める</li>\n            <li><strong>全自動のまま出す</strong>：確認点（構成と本編の2か所）を飛ばすと、薄さと誇張がそのまま表に出る。自動化するのは手であって、目ではない</li>\n            <li><strong>公開して終わる</strong>：最初の読者は工程では来ない。集客ポストまでが1周になる</li>\n          </ul>\n          <p><strong>時期：</strong>受験後</p>\n        </div>\n        <div class=\"card\">\n          <h3>判定の物差し</h3>\n          <ul>\n            <li><strong>売れた場合</strong>：題材の当たり。同じ題材で2本目を出すか、工程を候補3に使い回す</li>\n            <li><strong>売れなかった場合</strong>：工程と題材を分けて見る。集客ポストまで届いていないなら集客の問題、読まれて買われていないなら題材か構成の問題。工程自体は資産として残るので、題材を変えてもう1周できる</li>\n            <li><strong>得るもの</strong>：売上の有無にかかわらず、「AIで商品を1本作って売る」全工程の実地の記録。これは他のデジタル商品すべてに使い回せる</li>\n          </ul>\n          <p class=\"sources\">きっかけ・出典：X投稿「Gemini 4 × note自動化プロンプト10選」（まな｜AIの申し子 @note_ai_mousigo、2026-11-20）。工程の本体は「AIパイプライン」セクションに置いた</p>\n        </div>",

   "html": "<div class=\"detail-head\"><h2>AIパイプライン</h2><span class=\"badge decided\">2026-11-20 登録</span></div>\n        <p class=\"sec-lead\">デジタル商品を「リサーチ→売れる構成→有料本編→集客ポスト」の4工程の鎖で作る方法。1つの長い指示で全部を一気に作らせるのではなく、工程ごとに分け、前の工程の出力を次の工程の入力にする。売る物が変わっても（有料noteでも、Gumroadの商品でも、アプリの中身でも）鎖の形は同じで、使い回せる。</p>\n        <div class=\"card\">\n          <h3>全体像</h3>\n          <div class=\"flow\"><span>リサーチ</span><i>→</i><span>売れる構成</span><i>→</i><span>有料本編</span><i>→</i><span>集客ポスト</span></div>\n          <p>各工程は「渡すもの」「返ってくるもの」「人間が見るポイント」が決まった、独立した仕事として扱う。鎖に分ける意味は3つある。</p>\n          <ul>\n            <li><strong>確認点を置ける</strong>：工程の境目ごとに人間が目を通せる。全部を一気に作らせると、間違いや薄さがどこで入ったか分からない</li>\n            <li><strong>差し替えが効く</strong>：工程ごとに使うモデルも、やり方も、題材も差し替えられる。1工程だけ作り直せば鎖全体は壊れない</li>\n            <li><strong>記録が残る</strong>：どの工程で詰まったか、どこが薄かったかが残り、次の1本が速くなる。これが「AIで作って売る」実地のノウハウの本体になる</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>各工程の中身</h3>\n          <p><strong>工程1 リサーチ</strong>——市場の需要と競合の確認。作る前に「誰が・何に困って・いくらで買っているか」を実物で確かめる工程。</p>\n          <ul>\n            <li><strong>AIに渡すもの</strong>：題材の候補、売り場（note等）、読者の仮説（誰の、どんな場面の困りごとか）</li>\n            <li><strong>返ってくるもの</strong>：実際に売れている同種の商品の一覧と価格帯、買う人の言葉（レビュー・検索される言葉）、競合の弱い場所</li>\n            <li><strong>人間が見るポイント</strong>：需要の証拠が「実際に売れている物」かどうか。言及数や盛り上がりは需要ではない。検索意図の温度（買う前提で探している言葉かどうか）の読み方は、候補4の「集客の経済学」と同じ</li>\n          </ul>\n          <p><strong>工程2 構成</strong>——売れる構成を決める工程。要素は「誰の・どんな渇きに・何を渡すか」の3点セット。</p>\n          <ul>\n            <li><strong>AIに渡すもの</strong>：リサーチの結果と、渡すものの定義（読み手が手に入れる成果物は何か）</li>\n            <li><strong>返ってくるもの</strong>：目次案、無料部分と有料部分の境目、価格の案</li>\n            <li><strong>人間が見るポイント</strong>：痛み止めになっているか（今困っている人に刺さるか。漠然と良いもの＝ビタミンでは買われない）。無料部分で価値が伝わり、有料部分に「続きを買う理由」があるか</li>\n          </ul>\n          <p><strong>工程3 本編</strong>——本文の生成と整形。量ではなく、質の基準で見る工程。</p>\n          <ul>\n            <li><strong>AIに渡すもの</strong>：構成と、材料（自分の実録・数字・一次情報）。材料の質がそのまま本文の質になる</li>\n            <li><strong>返ってくるもの</strong>：本文の下書き</li>\n            <li><strong>人間が見るポイント</strong>：自分の経験と数字が入っているか、読み手が実行できる詳しさか。一般論の水増しになっている部分は、自分の材料で置き換える。数字には出典を付ける</li>\n          </ul>\n          <p><strong>工程4 集客ポスト</strong>——告知文の自動生成と仕上げ。</p>\n          <ul>\n            <li><strong>AIに渡すもの</strong>：本編の要点と、リサーチで拾った読者の言葉</li>\n            <li><strong>返ってくるもの</strong>：X等の告知文の案（複数）</li>\n            <li><strong>人間が直す部分</strong>：自分の声と実体験の一文を入れ、誇張を落とす。宣伝の文面ではなく「読み手の渇きへの一言」になっているかを見る。報酬が絡む紹介はステマ規制の開示を外さない</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>モデルの使い分け</h3>\n          <p>工程ごとに、得意なモデルを割り当てる。1つのモデルに全工程をやらせるより、役割で分けた方が質が上がり、詰まった時の原因も追える。</p>\n          <ul>\n            <li><strong>調査・生成系</strong>：大量の読み書きが要る工程（リサーチ、構成案、本編の下書き）に向く。速く、広く出せる代わりに、出力の裏取りと取捨は人間がやる前提で使う</li>\n            <li><strong>実装・整形系</strong>：コードを書く、ファイルを直接編集する、検証まで回す工程（公開用ファイルの作成、データの整形、LPや売り場の組み立て）に向く</li>\n            <li><strong>連携の考え方</strong>：片方の出力を人間がコピペで運ぶと、手間と転記ミスが残る。ファイルやAPIで直接受け渡す形にすると、この手間が消える——「Geminiで回す→Claude Codeと連携させる」という発想の実体はこれで、特定の製品の組み合わせではなく「受け渡しを自動化する」という方法として採る</li>\n            <li><strong>管理の注意</strong>：モデルを分けると「誰が何を作ったか」が散らばる。指示と成果物は同じ場所に残し、どの工程の出力か分かる形にする</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>資源の確保——眠っている権利を使い倒す</h3>\n          <p>有料プランの特典には「自動で付くもの」と「申請しないと入らないもの」がある。払っているのに使っていない特典は、それだけ捨てているのと同じ。工程の燃料（APIの利用枠、計算資源、動画生成の枠）は、まず手持ちの権利から確保する。</p>\n          <ul>\n            <li><strong>棚卸しの手順</strong>：①契約中のプランの特典一覧を公式ページで確認する ②申請・有効化が要るものをその場で取る ③月ごとに消える枠（クレジット・計算単位）は、使い道の工程を先に決めて組み込む</li>\n            <li><strong>具体例：Google AI Pro（月2,900円）の束</strong>（2026-11時点の内訳）：申請制の月10ドル Google Cloud クレジット（Google Developer Programの特典ページで申請。Gemini API等に使える）／Colabの計算枠（月200単位、A100級のGPU、ノートブックは最長12時間ほど）／Flowの動画クレジット月1,000（720p・10秒動画で月30本ほど）／5TBの保存容量／YouTube Premium Lite。チャットしか使っていないと、この大半が眠ったままになる</li>\n            <li><strong>もう一つの例：Kaggleの無料GPU枠</strong>：無料アカウントでも週の枠内でGPUが使える（本人のアカウントで利用実績あり）。画像生成モデルや学習の実験は、課金前にこちらで回せる</li>\n            <li><strong>運用ルール</strong>：新しいプランに入ったら、入った日に特典を棚卸しする／月末に消える枠は先に使う／特典の内容と条件は変わるので、使う前に公式で確認する</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>人間が残る仕事</h3>\n          <p>工程を自動化しても、残る仕事がある。そこが勝負の場所になる。</p>\n          <ul>\n            <li><strong>題材の選定</strong>：何を売るかは工程の外の判断。リサーチは材料を出すが、「これをやる」と決めるのは人間</li>\n            <li><strong>最終判断</strong>：出す・出さない、価格、やめる・続ける。数字を見て決めるのは人間</li>\n            <li><strong>信頼の構築</strong>：実体験と実績の蓄積は自動化できない。誰が作ったかの一貫性が、2本目以降の売れ方を決める</li>\n            <li><strong>最初の読者を連れてくること</strong>：工程は2本目以降を速くするが、最初の読者は手で連れてくるしかない。ここは候補4の集客の現実と同じで、制作より重い</li>\n          </ul>\n          <p>工程そのものは誰でも組める時代になる。だから差は、工程の外側——題材と材料の本物さ——に移っていく。</p>\n        </div>\n        <div class=\"card\">\n          <h3>注意と失敗パターン</h3>\n          <ul>\n            <li><strong>量産＝売上ではない</strong>：作る速度が上がっても、買う理由は増えない。工程の速さは「テストの回数」を増やすためのもので、量そのものが成果ではない</li>\n            <li><strong>薄い量産は評価を落とす</strong>：質の薄いコンテンツの量産は、プラットフォーム側の評価を下げて露出を落とす。候補4の「損なうパターン」（量産の質の問題）と同じ構造で、売り場がnoteでも検索でも同じことが起きる</li>\n            <li><strong>収益主張を根拠にしない</strong>：「初月で○万円」のような数字は、裏付けがなければ工程の根拠にしない。採るのは仕組みと手順だけ</li>\n            <li><strong>全自動のまま出さない</strong>：確認点（構成と本編の2か所）を飛ばすと、薄さと誇張がそのまま表に出る。自動化するのは手であって、目ではない</li>\n          </ul>\n          <p class=\"firststep\"><strong>最初の一歩：</strong>契約中の有料プランの特典を棚卸しする（申請しないと入らないものが無いか、公式ページで確認する）<br><strong>時期：</strong>今すぐ（知識と資源の蓄積は受験前から可）</p>\n          <p class=\"sources\">きっかけ・出典：X投稿「Gemini 4 × note自動化プロンプト10選」（まな｜AIの申し子 @note_ai_mousigo、2026-11-20）。特典の内訳はnoteの検証記事2件（ふるふる／おぼろ。公式ヘルプでの確認日2026-11-16）に基づく。原典の収益主張は裏付けがないため採っていない</p>\n        </div>",

   "html": "<div class=\"detail-head\"><h2>ルール</h2><span class=\"badge decided\">決定済み</span></div>\n        <h3>評価の物差し（2つ）</h3>\n        <p>機会は「平均的な参加者の期待値」では測らない。上位を取る側として設計する。その上で問うのは2つ。</p>\n        <div class=\"judge\">\n          <div class=\"jq\"><span class=\"qn\">問い1</span><span><span class=\"qt\">その上位は、自分たちの実力で実際に取れる構造か</span><span class=\"qd\">参加者数と、審査が「質」か「最適化の削り合い」か</span></span></div>\n          <div class=\"jarrow\">↓</div>\n          <div class=\"jq\"><span class=\"qn\">問い2</span><span><span class=\"qt\">取った位置が、資産として残るか</span><span class=\"qd\">勝っても次の案件でゼロからなら、椅子は残らない</span></span></div>\n          <div class=\"jarrow\">↓</div>\n          <div class=\"jout\"><span class=\"jok\">2つとも通る → 上位を取りに行く</span><span class=\"jng\">1つでも欠ける → やらない</span></div>\n        </div>\n        <h3>禁止ライン（8つ）</h3>\n        <p>判定は「バレるか」ではない。<strong>revealテスト</strong>——将来、本名と顔を出して同じ売り方を説明できるか——を通らないものはやらない。</p>\n        <ul class=\"checklist\">\n          <li>裏付けのない／水増しした収入・実績・効果の数字を広告に使う</li>\n          <li>「絶対稼げる」等の断定的な表現で情報商材・スクール・コンサルを売る</li>\n          <li>ステマ（PRを隠す／広告主に隠させる）</li>\n          <li>無許可の反復継続転売、資格を偽った仕入れ、定価超チケット転売</li>\n          <li>わいせつ物の頒布・陳列にあたる成人向け販売</li>\n          <li>収益の無申告・過少申告</li>\n          <li>他人の著作物・商標・キャラ・肖像を無断で使った商品販売</li>\n          <li>買い手の不安・借金・焦りを煽る高額勧誘</li>\n        </ul>\n        <h3>やらないこと</h3>\n        <ul>\n          <li>株・FX（元手がない段階では再現性なし）</li>\n          <li>スクール事業（実績ができるまで封印）</li>\n          <li>アダルト（匿名でも最低優先。原則やらない）</li>\n          <li>生活費を事業の成果に賭けること</li>\n          <li>図鑑エンジンのキット販売（仕組みの公開になるため）</li>\n        </ul>\n        <h3>実現のルール（2026-11-20）</h3>\n        <ol class=\"rules\">\n          <li>計画には最初の一歩と時期を付ける。実現したかどうかは、文書ができたかではなく、世の中の側が変わったか（出荷・出品・応募・最初の取引）で数える</li>\n        </ol>\n        <h3>知識のルール（2026-11-20）</h3>\n        <p><strong>「知識こそ土台であり金だ」</strong>——知識そのものが土台であり、資産だ。このアプリは計画の置き場ではなく、見て動ける知識の基盤として作る。稼ぐのは本人で、Muse の仕事はその知識を備えることにある。</p>\n        <ol class=\"rules\">\n          <li><strong>ノウハウの登録基準</strong>：本体は体系的な知識（手順・判断基準・数字・注意点まで、実行できる詳しさ）で書く。「大まかな流れ」の要約だけでは、登録したことにならない</li>\n          <li><strong>数字の裏付け</strong>：数字と事実は、公式・一次の出典で裏が取れるものだけを置く。裏の取れない収益数字や、煽りの結論は入れない</li>\n          <li><strong>出典の置き場所</strong>：きっかけ・出典は一番下に補足として小さく置く。本文の主役はノウハウのほうにする</li>\n          <li><strong>更新時の棚卸し</strong>：アプリを更新する時は、中身の古さ（過ぎた日付のままの文面、後の決定で置き換わった表現、数字の不整合）も同じ便で点検する。機械的に直せるものはその場で直し、計画の実質に関わる変更は本人の判断に回す</li>\n        </ol>",

   "html": "<div class=\"detail-head\"><h2>アイデアの網</h2><span class=\"badge pending\">未決定の候補</span></div>\n        <p class=\"sec-lead\">ここは計画ではない。いま手元にある資産から派生する案を、つながりごと並べて置く場所。案はどれも未決定で、決まったものだけが計画の側へ移る。</p>\n        <h3>起点——既にある資産</h3>\n        <div class=\"assets\">\n          <div class=\"asset\"><span class=\"an\">図鑑エンジン</span><span class=\"ad\">カード表示・年表・関係図・価格記録・Drive同期・データ収集と整形の型</span></div>\n          <div class=\"asset\"><span class=\"an\">蓄積データ</span><span class=\"ad\">作家・作品・展示・本・価格の記録と、制作ガイドや調査の文章</span></div>\n          <div class=\"asset\"><span class=\"an\">選定の目</span><span class=\"ad\">本人の目で選んだという編集。代表作の棚や関係の記録は他の誰の図鑑にもならない</span></div>\n          <div class=\"asset\"><span class=\"an\">集客ノウハウ</span><span class=\"ad\">調査7本分の実測知。結果画面の型、質問投稿、信用の橋渡し</span></div>\n          <div class=\"asset\"><span class=\"an\">アプリ群</span><span class=\"ad\">図鑑・日記・音楽・映画・食材など、実際に動いている自作アプリ</span></div>\n          <div class=\"asset\"><span class=\"an\">受託の形</span><span class=\"ad\">完成品だけを渡し、エンジンの権利は手元に残す渡し方</span></div>\n          <div class=\"asset\"><span class=\"an\">横展開</span><span class=\"ad\">同じ型を別ジャンルへ広げる進み方。音楽・映画・食材で実証済み</span></div>\n          <div class=\"asset\"><span class=\"an\">特許の検討</span><span class=\"ad\">「公開する前に中核だけ検討する」という判断軸</span></div>\n          <div class=\"asset\"><span class=\"an\">特殊素材への興味</span><span class=\"ad\">画材・支持体・材料への関心と知識。制作と地続きの発明の種</span></div>\n          <div class=\"asset\"><span class=\"an\">アートビジネスの階段</span><span class=\"ad\">価格の階段と、記録・認証の仕組み。作品を売る側の設計図</span></div>\n        </div>\n        <h3>派生するアイデア</h3>\n        <div class=\"idea\" id=\"idea-daicho\">\n          <h3>画家のための作品台帳アプリ</h3>\n          <div class=\"tags\"><span class=\"tl\">起点</span><span class=\"tag\">図鑑エンジン</span><span class=\"tag\">蓄積データの型</span><span class=\"tag\">アートビジネスの階段（記録・認証）</span></div>\n          <p>候補Cの具体形。自分の作品の記録・認証の仕組みを、そのまま同業者向けの道具にする。無人地帯（スマホ完結・日本語・私的な台帳）に置く。</p>\n          <p class=\"firststep\"><strong>最初の一歩：</strong>自分の作品1点を、台帳の型（作品1点カード）で試しに記録してみる<br><strong>時期：</strong>Cの段0が決まったら（今〜共通テストに決める）</p>\n          <p class=\"links\">つながる先：<a href=\"#idea-jutaku\" data-scroll=\"idea-jutaku\">受託パッケージ</a>の実演・見本になる／<a href=\"#idea-yoko\" data-scroll=\"idea-yoko\">横展開ライン</a>と同じ型で作れる</p>\n        </div>\n        <div class=\"idea\" id=\"idea-jutaku\">\n          <h3>画廊・画家向け「図鑑構築」受託パッケージ</h3>\n          <div class=\"tags\"><span class=\"tl\">起点</span><span class=\"tag\">図鑑エンジン</span><span class=\"tag\">受託の形</span><span class=\"tag\">選定の目</span></div>\n          <p>構築一式＋データ化＋運用代行の3段を、値段と納期の目安つきで一枚にまとめた受け皿。美術界との縁と実績が、金と同時に手に入る形。</p>\n          <p class=\"firststep\"><strong>最初の一歩：</strong>構築一式の値段と納期の目安を決めて、一枚に書く<br><strong>時期：</strong>受験後（2027年3月以降）</p>\n          <p class=\"links\">つながる先：受託で生まれた縁が、アートビジネスの<a href=\"#/art\" data-open-link=\"art\">「最初の買い手」「信用の橋渡し」</a>に効く／<a href=\"#idea-curation\" data-scroll=\"idea-curation\">キュレーション受託</a>へ広がる</p>\n        </div>\n        <div class=\"idea\" id=\"idea-yoko\">\n          <h3>ジャンル別図鑑の量産ライン</h3>\n          <div class=\"tags\"><span class=\"tl\">起点</span><span class=\"tag\">図鑑エンジン</span><span class=\"tag\">横展開</span><span class=\"tag\">集客ノウハウ</span></div>\n          <p>スポーツ記録・声優やアイドル・名車・時計・スニーカーなど、「人と作品と記録」の蓄積型で情報が散らかっている分野へ、同じ型で次々に出す。分野ごとに集客は必要だが、作るコストは型で下がる。</p>\n          <p class=\"firststep\"><strong>最初の一歩：</strong>最初に出す分野を1つ選ぶ<br><strong>時期：</strong>受験後（2027年3月以降）</p>\n          <p class=\"links\">つながる先：出た図鑑が増えるほど<a href=\"#idea-report\" data-scroll=\"idea-report\">集計レポート</a>の対象が広がる／当たった分野が<a href=\"#idea-daicho\" data-scroll=\"idea-daicho\">台帳</a>と同じ検証の階段に乗る</p>\n        </div>\n        <div class=\"idea\" id=\"idea-report\">\n          <h3>図鑑データの集計レポート</h3>\n          <div class=\"tags\"><span class=\"tl\">起点</span><span class=\"tag\">蓄積データ</span><span class=\"tag\">選定の目</span></div>\n          <p>権利がきれいな範囲の集計（展覧会や価格の動向）を、画廊やメディア向けに出す。ハードルは高いが、蓄積がそのまま商品になる形。</p>\n          <p class=\"firststep\"><strong>最初の一歩：</strong>権利がきれいな集計のテーマを1つ書き出す<br><strong>時期：</strong>受験後。横展開で図鑑が増えてから</p>\n          <p class=\"links\">つながる先：<a href=\"#idea-jutaku\" data-scroll=\"idea-jutaku\">受託</a>の客との接点になる／<a href=\"#idea-contents\" data-scroll=\"idea-contents\">受験生向けコンテンツ</a>と同じ「中身の切り売り」の系統</p>\n        </div>\n        <div class=\"idea\" id=\"idea-contents\">\n          <h3>ガイド・調査の受験生向けコンテンツ</h3>\n          <div class=\"tags\"><span class=\"tl\">起点</span><span class=\"tag\">蓄積データ（文章）</span><span class=\"tag\">集客ノウハウ</span></div>\n          <p>制作ガイドや美大カリキュラムの調査など、元々の文章の部分を、受験生向けに切り出して売る。図鑑の中身（作品画像や価格データ）とは別系統で、権利の問題が軽い。</p>\n          <p class=\"firststep\"><strong>最初の一歩：</strong>切り出して売る文章を1本選ぶ<br><strong>時期：</strong>受験後（2027年3月以降）</p>\n          <p class=\"links\">つながる先：発信が<a href=\"#idea-bokan\" data-scroll=\"idea-bokan\">送客の母艦</a>の一部になる</p>\n        </div>\n        <div class=\"idea\" id=\"idea-bokan\">\n          <h3>図鑑の発信を母艦にした作品販売</h3>\n          <div class=\"tags\"><span class=\"tl\">起点</span><span class=\"tag\">アプリ群</span><span class=\"tag\">集客ノウハウ</span><span class=\"tag\">アートビジネスの階段</span></div>\n          <p>図鑑まわりの発信が注目を集め、最終的に自分の作品の買い手につながる道。金そのものより、注目と縁の資産として効く。</p>\n          <p class=\"firststep\"><strong>最初の一歩：</strong>図鑑まわりの発信を1本出す<br><strong>時期：</strong>受験後。アートビジネス計画の提示（フェーズ1）と合わせて</p>\n          <p class=\"links\">つながる先：アートビジネスの<a href=\"#/art\" data-open-link=\"art\">価格の階段</a>の段0（無料の提示）と地続き</p>\n        </div>\n        <div class=\"idea\" id=\"idea-sozai\">\n          <h3>画材・支持体の実験から、小さな発明・商品へ</h3>\n          <div class=\"tags\"><span class=\"tl\">起点</span><span class=\"tag\">特殊素材への興味</span><span class=\"tag\">特許の検討</span></div>\n          <p>支持体の構造や材料の組み合わせは、特許の対象になりうる数少ない領域。制作の実験記録が、そのまま発明の種になる。出すなら公開する前に権利の検討を挟む。</p>\n          <p class=\"firststep\"><strong>最初の一歩：</strong>制作で素材の実験をしたら、材料と条件を記録に残す<br><strong>時期：</strong>今すぐ（普段の制作と一体で、負担を増やさない）</p>\n          <p class=\"links\">つながる先：商品化できればアートビジネスの<a href=\"#/art\" data-open-link=\"art\">価格の階段</a>の段1（素材・小物）に乗る</p>\n        </div>\n        <div class=\"idea\" id=\"idea-todo\">\n          <h3>Todoアプリの外部公開</h3>\n          <div class=\"tags\"><span class=\"tl\">起点</span><span class=\"tag\">アプリ群</span><span class=\"tag\">特許の検討</span><span class=\"tag\">集客ノウハウ</span></div>\n          <p>日記アプリのTodo（金額と写真の回収つき）を、友達向けから外へ出す候補。公開する前に、中核の仕組みだけ特許を検討するかどうかが論点になる。</p>\n          <p class=\"firststep\"><strong>最初の一歩：</strong>公開するかどうかを決め、公開するなら先に中核だけ特許の検討をする<br><strong>時期：</strong>受験後以降、公開を決めた時</p>\n          <p class=\"links\">つながる先：アプリ候補の<a href=\"#/business\" data-open-link=\"business\">検証の階段（段0〜段4）</a>に乗せて判定する</p>\n        </div>\n        <div class=\"idea\" id=\"idea-curation\">\n          <h3>他人のコレクションのキュレーション受託</h3>\n          <div class=\"tags\"><span class=\"tl\">起点</span><span class=\"tag\">選定の目</span><span class=\"tag\">受託の形</span><span class=\"tag\">図鑑エンジン</span></div>\n          <p>コレクターや店のコレクションを、テーマ別の「棚」として選び直し、図鑑の形に組む仕事。選定の目そのものが商品になる形。</p>\n          <p class=\"firststep\"><strong>最初の一歩：</strong>身近なコレクション1件を、テーマ別の「棚」に組み直した見本を作る<br><strong>時期：</strong>受験後。受託パッケージの受け皿ができてから</p>\n          <p class=\"links\">つながる先：<a href=\"#idea-jutaku\" data-scroll=\"idea-jutaku\">受託パッケージ</a>の上位メニューになる</p>\n        </div>\n        <p class=\"sec-lead\" style=\"margin-top:16px\">読み方：つながりの多い案ほど、既にある資産を無駄にしない。逆に、起点が1つしかない案は、それ単体の魅力で判断する。</p>",

   "html": "<div class=\"detail-head\"><h2>未決・保留</h2><span class=\"badge pending\">まだ決まっていない</span></div>\n        <p class=\"sec-lead\">ここにあるものは計画として確定していない。決まった計画のふりをして埋めていない項目の一覧。</p>\n        <ul class=\"pending-list\">\n          <li><span class=\"pt\">Cの段0——題材の一文が未確定</span><span class=\"pd\">「誰が・いつ・何に困って・今どう凌いでいるか」の一文。題材候補は作品台帳／制作ログ／画材在庫／シフトと収入の見える化。次の一歩はここ。</span>\n<p class=\"firststep\"><strong>最初の一歩：</strong>題材候補（作品台帳／制作ログ／画材在庫／シフトと収入の見える化）から1つを選び、「誰が・いつ・何に困って・今どう凌いでいるか」の一文を書く<br><strong>時期：</strong>今〜共通テスト（受験前から進めてよい決定作業）</p></li>\n          <li><span class=\"pt\">営業と集客を何から始めるか</span><span class=\"pd\">本人「わからない、またその時話そう」。受託の最初の1件の取り方と、横展開アプリの集客が対象。最大の未知数はここ。</span>\n<p class=\"firststep\"><strong>最初の一歩：</strong>受験後に、この保留を開いて話す場を1回持つ<br><strong>時期：</strong>受験後（2027年3月以降）。それまでは保留のまま置く</p></li>\n          <li><span class=\"pt\">受託の受け皿が未作成</span><span class=\"pd\">何を・いくらで・どのくらいで作れるかの一枚。価格は「安さ」ではなく「この形は他にない」で立てる方針だけ決まっている。</span>\n<p class=\"firststep\"><strong>最初の一歩：</strong>何を・いくらで・どのくらいで作れるかを、一枚に書き出す<br><strong>時期：</strong>受験後（2027年3月以降）</p></li>\n          <li><span class=\"pt\">横展開の最初の分野が未定</span><span class=\"pd\">候補は並んでいるが、どこから始めるかは決まっていない。</span>\n<p class=\"firststep\"><strong>最初の一歩：</strong>候補（スポーツ記録／声優・アイドル／漫画／名車／時計／スニーカー）から最初の1分野を選ぶ<br><strong>時期：</strong>受験後（2027年3月以降）</p></li>\n          <li><span class=\"pt\">マンダラチャート——保留中</span><span class=\"pd\">作り方が未確定で、保留中。</span>\n<p class=\"firststep\"><strong>最初の一歩：</strong>マンダラチャートの作り方を決める<br><strong>時期：</strong>受験後</p></li>\n          <li><span class=\"pt\">貯金への3万円の移動が未確認</span><span class=\"pd\">臨時収入5万円の分配（貯金3万／事業資金1万／浪費枠1万）は合意済みだが、移動が済んだかの確認が取れていない。</span>\n<p class=\"firststep\"><strong>最初の一歩：</strong>貯金用に分けた3万円を、実際に貯金側へ移す（済んでいたら、その確認だけ）<br><strong>時期：</strong>今すぐ（時期を選ばない小さな手続き）</p></li>\n          <li><span class=\"pt\">MacBookの復活テスト未実施</span><span class=\"pd\">型番・電源が入るか・ローン残額が未確認。復活すれば第2フェーズ（高単価の仕事）への橋になる。</span>\n<p class=\"firststep\"><strong>最初の一歩：</strong>名古屋の実家にいる時に、テレビに繋いで画面が映るか試す<br><strong>時期：</strong>次に実家へ帰った時</p></li>\n          <li><span class=\"pt\">Slavik分析の問いが未回答</span><span class=\"pd\">「虚構の蓄積は証明として機能するか」。お金の勉強の地図のステップ2「数字の式」も未実施。</span>\n<p class=\"firststep\"><strong>最初の一歩：</strong>Muse が用意する学習編「数字の式」を読む。Slavik の問いへの答えは、その時に一緒に考える<br><strong>時期：</strong>受験前から可（知識の蓄積）</p></li>\n        </ul>",
