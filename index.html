   "title": "図鑑事業",
   "meta": "美術＝受託／他ジャンル＝横展開。キット販売はしない。特許の結論",
   "badgeClass": "decided",
   "badgeText": "2026-11-19 決定",
   "html": "<div class=\"detail-head\"><h2>図鑑事業<\/h2><span class=\"badge decided\">2026-11-19 決定<\/span><\/div>\n        <p class=\"sec-lead\">図鑑アプリの仕組み（エンジン）は分野を選ばない。金の変え方は、分野によって2つに分けることが決まった。<\/p>\n        <div class=\"branch2\">\n          <div class=\"b-src\">図鑑の仕組み（エンジン）<\/div>\n          <div class=\"b-stem\"><\/div>\n          <div class=\"b-bar\"><\/div>\n          <div class=\"b-cols\">\n            <div class=\"b-col art\"><span class=\"b-t\">美術分野<\/span><span class=\"b-v\">受託<\/span><span class=\"b-d\">画廊・画家・美術団体から構築を受ける<\/span><\/div>\n            <div class=\"b-col other\"><span class=\"b-t\">他ジャンル<\/span><span class=\"b-v\">横展開<\/span><span class=\"b-d\">自前アプリとして売り出す<\/span><\/div>\n          <\/div>\n        <\/div>\n        <div class=\"lanes\">\n          <div class=\"lane art\">\n            <h3>美術分野 ＝ 受託<\/h3>\n            <p>画廊・画家・美術団体などの「自分たちの図鑑が欲しいけど作れない」側から、構築を受ける。狙いは<strong>金＋美術界との縁＋実績<\/strong>の3つ同時。<\/p>\n            <ul>\n              <li><strong>客の像<\/strong>：自分の全作品のアーカイブが欲しい画家本人／小さい画廊・美術団体／ファンコミュニティ／専門店／小さい博物館・資料館／コレクター<\/li>\n              <li><strong>売る物の3段<\/strong>：構築一式（データ整形込み）／点数単位のデータ化／月額の運用代行<\/li>\n              <li><strong>条件<\/strong>：渡すのは完成したアプリだけ。エンジンの権利は翔万に残す。データの権利は発注側に置く<\/li>\n              <li><strong>始動<\/strong>：納期のある他人の仕事なので、本格始動は受験後<\/li>\n            <\/ul>\n            <p class=\"firststep\"><strong>最初の一歩：<\/strong>受託の受け皿（何を・いくらで・どのくらいで作れるかの一枚）を作る<br><strong>時期：<\/strong>受験後（2027年3月以降）に本格始動<\/p>\n          <\/div>\n          <div class=\"lane other\">\n            <h3>他ジャンル ＝ 横展開<\/h3>\n            <p>ジャンルごとの図鑑を自前アプリとして売り出し、アプリ収入の階段に乗せる。名前のリスクがない分野で、匿名のまま展開できる。<\/p>\n            <ul>\n              <li><strong>実装済みの証明<\/strong>：音楽／映画／食材<\/li>\n              <li><strong>効く分野の条件<\/strong>：「人と作品と記録」の蓄積型で、ファンが深く調べたくて、既存の情報が散らかっている場所<\/li>\n              <li><strong>候補<\/strong>：スポーツ記録（野球選手・力士）／声優・アイドル／漫画／名車／時計／スニーカー<\/li>\n            <\/ul>\n            <p class=\"firststep\"><strong>最初の一歩：<\/strong>候補の中から、最初に出す分野を1つ決める<br><strong>時期：<\/strong>受験後（2027年3月以降）<\/p>\n          <\/div>\n        <\/div>\n        <h3>決まっている線引き<\/h3>\n        <ul>\n          <li><strong>エンジンのキット販売はしない<\/strong>。仕組みを公開することになるため。売るのは完成品であって、作り方ではない<\/li>\n          <li><strong>アプリは動く時にAIを呼ばない<\/strong>。AIが働くのは作る時とデータを揃える時だけ。だから他人が使っても自分のAIアカウントは減らず、運営費もゼロのまま渡せる<\/li>\n          <li><strong>唯一無二性の堀は3つ<\/strong>：データの深さと正確さ／本人の目による選定／元々の文章（ガイド・調査）。コードは真似できても、この3つは年月がかかる<\/li>\n        <\/ul>\n        <div class=\"note\">\n          <h3 style=\"margin-top:0\">特許についての結論<\/h3>\n          <p>今のアプリ群の大半は特許化が難しい。理由は3つ——進歩性の壁（既存技術の組み合わせと判断されやすい）、既に公開済み（救済は本人の公開から1年以内）、ソフトウェア単体では対象になりにくい。日記アプリのTodo（金額と写真の自動回収）も、ほしい物リスト等の先行例が大きく単体では厳しい見立て。<\/p>\n          <p>図鑑の独自性は仕組みの新しさではなく、データの量・編集・選定の蓄積にある。守りは著作権と「真似に同じ年月がかかる」という事実の側。特許の正しい出番は、自分の商品・仕組みを外に出す時に、<strong>公開する前に<\/strong>中核だけ検討すること。<\/p>\n          <p class=\"firststep\"><strong>最初の一歩：<\/strong>自分の商品・仕組みを次に外に出す時、公開前に特許の検討を1回挟む<br><strong>時期：<\/strong>公開の直前、その都度<\/p>\n        <\/div>",
   "updated_at": "2026-11-20T14:42:01+09:00"
  },

   "meta": "資産10件を起点に、派生するアイデア9件をつながりごと並べた場所",
   "badgeClass": "pending",
   "badgeText": "未決定の候補",
   "html": "<div class=\"detail-head\"><h2>アイデアの網<\/h2><span class=\"badge pending\">未決定の候補<\/span><\/div>\n        <p class=\"sec-lead\">ここは計画ではない。いま手元にある資産から派生する案を、つながりごと並べて置く場所。案はどれも未決定で、決まったものだけが計画の側へ移る。<\/p>\n        <h3>起点——既にある資産<\/h3>\n        <div class=\"assets\">\n          <div class=\"asset\"><span class=\"an\">図鑑エンジン<\/span><span class=\"ad\">カード表示・年表・関係図・価格記録・Drive同期・データ収集と整形の型<\/span><\/div>\n          <div class=\"asset\"><span class=\"an\">蓄積データ<\/span><span class=\"ad\">作家・作品・展示・本・価格の記録と、制作ガイドや調査の文章<\/span><\/div>\n          <div class=\"asset\"><span class=\"an\">選定の目<\/span><span class=\"ad\">本人の目で選んだという編集。代表作の棚や関係の記録は他の誰の図鑑にもならない<\/span><\/div>\n          <div class=\"asset\"><span class=\"an\">集客ノウハウ<\/span><span class=\"ad\">調査7本分の実測知。結果画面の型、質問投稿、信用の橋渡し<\/span><\/div>\n          <div class=\"asset\"><span class=\"an\">アプリ群<\/span><span class=\"ad\">図鑑・日記・音楽・映画・食材など、実際に動いている自作アプリ<\/span><\/div>\n          <div class=\"asset\"><span class=\"an\">受託の形<\/span><span class=\"ad\">完成品だけを渡し、エンジンの権利は手元に残す渡し方<\/span><\/div>\n          <div class=\"asset\"><span class=\"an\">横展開<\/span><span class=\"ad\">同じ型を別ジャンルへ広げる進み方。音楽・映画・食材で実証済み<\/span><\/div>\n          <div class=\"asset\"><span class=\"an\">特許の検討<\/span><span class=\"ad\">「公開する前に中核だけ検討する」という判断軸<\/span><\/div>\n          <div class=\"asset\"><span class=\"an\">特殊素材への興味<\/span><span class=\"ad\">画材・支持体・材料への関心と知識。制作と地続きの発明の種<\/span><\/div>\n          <div class=\"asset\"><span class=\"an\">アートビジネスの階段<\/span><span class=\"ad\">価格の階段と、記録・認証の仕組み。作品を売る側の設計図<\/span><\/div>\n        <\/div>\n        <h3>派生するアイデア<\/h3>\n        <div class=\"idea\" id=\"idea-daicho\">\n          <h3>画家のための作品台帳アプリ<\/h3>\n          <div class=\"tags\"><span class=\"tl\">起点<\/span><span class=\"tag\">図鑑エンジン<\/span><span class=\"tag\">蓄積データの型<\/span><span class=\"tag\">アートビジネスの階段（記録・認証）<\/span><\/div>\n          <p>候補Cの具体形。自分の作品の記録・認証の仕組みを、そのまま同業者向けの道具にする。無人地帯（スマホ完結・日本語・私的な台帳）に置く。<\/p>\n          <p class=\"firststep\"><strong>最初の一歩：<\/strong>自分の作品1点を、台帳の型（作品1点カード）で試しに記録してみる<br><strong>時期：<\/strong>Cの段0が決まったら（今〜共通テストに決める）<\/p>\n          <p class=\"links\">つながる先：<a href=\"#idea-jutaku\" data-scroll=\"idea-jutaku\">受託パッケージ<\/a>の実演・見本になる／<a href=\"#idea-yoko\" data-scroll=\"idea-yoko\">横展開ライン<\/a>と同じ型で作れる<\/p>\n        <\/div>\n        <div class=\"idea\" id=\"idea-jutaku\">\n          <h3>画廊・画家向け「図鑑構築」受託パッケージ<\/h3>\n          <div class=\"tags\"><span class=\"tl\">起点<\/span><span class=\"tag\">図鑑エンジン<\/span><span class=\"tag\">受託の形<\/span><span class=\"tag\">選定の目<\/span><\/div>\n          <p>構築一式＋データ化＋運用代行の3段を、値段と納期の目安つきで一枚にまとめた受け皿。美術界との縁と実績が、金と同時に手に入る形。<\/p>\n          <p class=\"firststep\"><strong>最初の一歩：<\/strong>構築一式の値段と納期の目安を決めて、一枚に書く<br><strong>時期：<\/strong>受験後（2027年3月以降）<\/p>\n          <p class=\"links\">つながる先：受託で生まれた縁が、アートビジネスの<a href=\"#\/art\" data-open-link=\"art\">「最初の買い手」「信用の橋渡し」<\/a>に効く／<a href=\"#idea-curation\" data-scroll=\"idea-curation\">キュレーション受託<\/a>へ広がる<\/p>\n        <\/div>\n        <div class=\"idea\" id=\"idea-yoko\">\n          <h3>ジャンル別図鑑の量産ライン<\/h3>\n          <div class=\"tags\"><span class=\"tl\">起点<\/span><span class=\"tag\">図鑑エンジン<\/span><span class=\"tag\">横展開<\/span><span class=\"tag\">集客ノウハウ<\/span><\/div>\n          <p>スポーツ記録・声優やアイドル・名車・時計・スニーカーなど、「人と作品と記録」の蓄積型で情報が散らかっている分野へ、同じ型で次々に出す。分野ごとに集客は必要だが、作るコストは型で下がる。<\/p>\n          <p class=\"firststep\"><strong>最初の一歩：<\/strong>最初に出す分野を1つ選ぶ<br><strong>時期：<\/strong>受験後（2027年3月以降）<\/p>\n          <p class=\"links\">つながる先：出た図鑑が増えるほど<a href=\"#idea-report\" data-scroll=\"idea-report\">集計レポート<\/a>の対象が広がる／当たった分野が<a href=\"#idea-daicho\" data-scroll=\"idea-daicho\">台帳<\/a>と同じ検証の階段に乗る<\/p>\n        <\/div>\n        <div class=\"idea\" id=\"idea-report\">\n          <h3>図鑑データの集計レポート<\/h3>\n          <div class=\"tags\"><span class=\"tl\">起点<\/span><span class=\"tag\">蓄積データ<\/span><span class=\"tag\">選定の目<\/span><\/div>\n          <p>権利がきれいな範囲の集計（展覧会や価格の動向）を、画廊やメディア向けに出す。ハードルは高いが、蓄積がそのまま商品になる形。<\/p>\n          <p class=\"firststep\"><strong>最初の一歩：<\/strong>権利がきれいな集計のテーマを1つ書き出す<br><strong>時期：<\/strong>受験後。横展開で図鑑が増えてから<\/p>\n          <p class=\"links\">つながる先：<a href=\"#idea-jutaku\" data-scroll=\"idea-jutaku\">受託<\/a>の客との接点になる／<a href=\"#idea-contents\" data-scroll=\"idea-contents\">受験生向けコンテンツ<\/a>と同じ「中身の切り売り」の系統<\/p>\n        <\/div>\n        <div class=\"idea\" id=\"idea-contents\">\n          <h3>ガイド・調査の受験生向けコンテンツ<\/h3>\n          <div class=\"tags\"><span class=\"tl\">起点<\/span><span class=\"tag\">蓄積データ（文章）<\/span><span class=\"tag\">集客ノウハウ<\/span><\/div>\n          <p>制作ガイドや美大カリキュラムの調査など、元々の文章の部分を、受験生向けに切り出して売る。図鑑の中身（作品画像や価格データ）とは別系統で、権利の問題が軽い。<\/p>\n          <p class=\"firststep\"><strong>最初の一歩：<\/strong>切り出して売る文章を1本選ぶ<br><strong>時期：<\/strong>受験後（2027年3月以降）<\/p>\n          <p class=\"links\">つながる先：発信が<a href=\"#idea-bokan\" data-scroll=\"idea-bokan\">送客の母艦<\/a>の一部になる<\/p>\n        <\/div>\n        <div class=\"idea\" id=\"idea-bokan\">\n          <h3>図鑑の発信を母艦にした作品販売<\/h3>\n          <div class=\"tags\"><span class=\"tl\">起点<\/span><span class=\"tag\">アプリ群<\/span><span class=\"tag\">集客ノウハウ<\/span><span class=\"tag\">アートビジネスの階段<\/span><\/div>\n          <p>図鑑まわりの発信が注目を集め、最終的に自分の作品の買い手につながる道。金そのものより、注目と縁の資産として効く。<\/p>\n          <p class=\"firststep\"><strong>最初の一歩：<\/strong>図鑑まわりの発信を1本出す<br><strong>時期：<\/strong>受験後。アートビジネス計画の提示（フェーズ1）と合わせて<\/p>\n          <p class=\"links\">つながる先：アートビジネスの<a href=\"#\/art\" data-open-link=\"art\">価格の階段<\/a>の段0（無料の提示）と地続き<\/p>\n        <\/div>\n        <div class=\"idea\" id=\"idea-sozai\">\n          <h3>画材・支持体の実験から、小さな発明・商品へ<\/h3>\n          <div class=\"tags\"><span class=\"tl\">起点<\/span><span class=\"tag\">特殊素材への興味<\/span><span class=\"tag\">特許の検討<\/span><\/div>\n          <p>支持体の構造や材料の組み合わせは、特許の対象になりうる数少ない領域。制作の実験記録が、そのまま発明の種になる。出すなら公開する前に権利の検討を挟む。<\/p>\n          <p class=\"firststep\"><strong>最初の一歩：<\/strong>制作で素材の実験をしたら、材料と条件を記録に残す<br><strong>時期：<\/strong>今すぐ（普段の制作と一体で、負担を増やさない）<\/p>\n          <p class=\"links\">つながる先：商品化できればアートビジネスの<a href=\"#\/art\" data-open-link=\"art\">価格の階段<\/a>の段1（素材・小物）に乗る<\/p>\n        <\/div>\n        <div class=\"idea\" id=\"idea-todo\">\n          <h3>Todoアプリの外部公開<\/h3>\n          <div class=\"tags\"><span class=\"tl\">起点<\/span><span class=\"tag\">アプリ群<\/span><span class=\"tag\">特許の検討<\/span><span class=\"tag\">集客ノウハウ<\/span><\/div>\n          <p>日記アプリのTodo（金額と写真の回収つき）を、友達向けから外へ出す候補。公開する前に、中核の仕組みだけ特許を検討するかどうかが論点になる。<\/p>\n          <p class=\"firststep\"><strong>最初の一歩：<\/strong>公開するかどうかを決め、公開するなら先に中核だけ特許の検討をする<br><strong>時期：<\/strong>受験後以降、公開を決めた時<\/p>\n          <p class=\"links\">つながる先：アプリ候補の<a href=\"#\/business\" data-open-link=\"business\">検証の階段（段0〜段4）<\/a>に乗せて判定する<\/p>\n        <\/div>\n        <div class=\"idea\" id=\"idea-curation\">\n          <h3>他人のコレクションのキュレーション受託<\/h3>\n          <div class=\"tags\"><span class=\"tl\">起点<\/span><span class=\"tag\">選定の目<\/span><span class=\"tag\">受託の形<\/span><span class=\"tag\">図鑑エンジン<\/span><\/div>\n          <p>コレクターや店のコレクションを、テーマ別の「棚」として選び直し、図鑑の形に組む仕事。選定の目そのものが商品になる形。<\/p>\n          <p class=\"firststep\"><strong>最初の一歩：<\/strong>身近なコレクション1件を、テーマ別の「棚」に組み直した見本を作る<br><strong>時期：<\/strong>受験後。受託パッケージの受け皿ができてから<\/p>\n          <p class=\"links\">つながる先：<a href=\"#idea-jutaku\" data-scroll=\"idea-jutaku\">受託パッケージ<\/a>の上位メニューになる<\/p>\n        <\/div>\n        <p class=\"sec-lead\" style=\"margin-top:16px\">読み方：つながりの多い案ほど、既にある資産を無駄にしない。逆に、起点が1つしかない案は、それ単体の魅力で判断する。<\/p>",
   "updated_at": "2026-11-20T13:49:32+09:00"

   "meta": "Cの段0、営業と集客、受託の受け皿など、まだ決まっていない項目の一覧",

   "badgeText": "まだ決まっていない",
   "html": "<div class=\"detail-head\"><h2>未決・保留<\/h2><span class=\"badge pending\">まだ決まっていない<\/span><\/div>\n        <p class=\"sec-lead\">ここにあるものは計画として確定していない。決まった計画のふりをして埋めていない項目の一覧。<\/p>\n        <ul class=\"pending-list\">\n          <li><span class=\"pt\">Cの段0——題材の一文が未確定<\/span><span class=\"pd\">「誰が・いつ・何に困って・今どう凌いでいるか」の一文。題材候補は作品台帳／制作ログ／画材在庫／シフトと収入の見える化。次の一歩はここ。<\/span>\n<p class=\"firststep\"><strong>最初の一歩：<\/strong>題材候補（作品台帳／制作ログ／画材在庫／シフトと収入の見える化）から1つを選び、「誰が・いつ・何に困って・今どう凌いでいるか」の一文を書く<br><strong>時期：<\/strong>今〜共通テスト（受験前から進めてよい決定作業）<\/p><\/li>\n          <li><span class=\"pt\">営業と集客を何から始めるか<\/span><span class=\"pd\">本人「わからない、またその時話そう」。受託の最初の1件の取り方と、横展開アプリの集客が対象。最大の未知数はここ。<\/span>\n<p class=\"firststep\"><strong>最初の一歩：<\/strong>受験後に、この保留を開いて話す場を1回持つ<br><strong>時期：<\/strong>受験後（2027年3月以降）。それまでは保留のまま置く<\/p><\/li>\n          <li><span class=\"pt\">受託の受け皿が未作成<\/span><span class=\"pd\">何を・いくらで・どのくらいで作れるかの一枚。価格は「安さ」ではなく「この形は他にない」で立てる方針だけ決まっている。<\/span>\n<p class=\"firststep\"><strong>最初の一歩：<\/strong>何を・いくらで・どのくらいで作れるかを、一枚に書き出す<br><strong>時期：<\/strong>受験後（2027年3月以降）<\/p><\/li>\n          <li><span class=\"pt\">横展開の最初の分野が未定<\/span><span class=\"pd\">候補は並んでいるが、どこから始めるかは決まっていない。<\/span>\n<p class=\"firststep\"><strong>最初の一歩：<\/strong>候補（スポーツ記録／声優・アイドル／漫画／名車／時計／スニーカー）から最初の1分野を選ぶ<br><strong>時期：<\/strong>受験後（2027年3月以降）<\/p><\/li>\n          <li><span class=\"pt\">投稿001 v3——Kling生成・選別待ち<\/span><span class=\"pd\">アートビジネス Phase 1 の第1段。マンダラチャートも保留中。<\/span>\n<p class=\"firststep\"><strong>最初の一歩：<\/strong>Kling で v3 のカットを生成し、使うカットを選別する（本人の作業）<br><strong>時期：<\/strong>受験後（アートビジネス計画のフェーズ1と連動）<\/p><\/li>\n          <li><span class=\"pt\">貯金への3万円の移動が未確認<\/span><span class=\"pd\">臨時収入5万円の分配（貯金3万／事業資金1万／浪費枠1万）は合意済みだが、移動が済んだかの確認が取れていない。<\/span>\n<p class=\"firststep\"><strong>最初の一歩：<\/strong>貯金用に分けた3万円を、実際に貯金側へ移す（済んでいたら、その確認だけ）<br><strong>時期：<\/strong>今すぐ（時期を選ばない小さな手続き）<\/p><\/li>\n          <li><span class=\"pt\">MacBookの復活テスト未実施<\/span><span class=\"pd\">型番・電源が入るか・ローン残額が未確認。復活すれば第2フェーズ（高単価の仕事）への橋になる。<\/span>\n<p class=\"firststep\"><strong>最初の一歩：<\/strong>名古屋の実家にいる時に、テレビに繋いで画面が映るか試す<br><strong>時期：<\/strong>次に実家へ帰った時<\/p><\/li>\n          <li><span class=\"pt\">Slavik分析の問いが未回答<\/span><span class=\"pd\">「虚構の蓄積は証明として機能するか」。学習カリキュラム第2回「数字の式」も未実施。<\/span>\n<p class=\"firststep\"><strong>最初の一歩：<\/strong>Muse が用意する学習編「数字の式」を読む。Slavik の問いへの答えは、その時に一緒に考える<br><strong>時期：<\/strong>受験前から可（知識の蓄積）<\/p><\/li>\n        <\/ul>",
   "updated_at": "2026-11-20T13:49:32+09:00"

   "title": "ルール",
   "meta": "評価の物差し2つ、禁止ライン8つ、やらないこと",

   "badgeText": "決定済み",
   "html": "<div class=\"detail-head\"><h2>ルール<\/h2><span class=\"badge decided\">決定済み<\/span><\/div>\n        <h3>評価の物差し（2つ）<\/h3>\n        <p>機会は「平均的な参加者の期待値」では測らない。上位を取る側として設計する。その上で問うのは2つ。<\/p>\n        <div class=\"judge\">\n          <div class=\"jq\"><span class=\"qn\">問い1<\/span><span><span class=\"qt\">その上位は、自分たちの実力で実際に取れる構造か<\/span><span class=\"qd\">参加者数と、審査が「質」か「最適化の削り合い」か<\/span><\/span><\/div>\n          <div class=\"jarrow\">↓<\/div>\n          <div class=\"jq\"><span class=\"qn\">問い2<\/span><span><span class=\"qt\">取った位置が、資産として残るか<\/span><span class=\"qd\">勝っても次の案件でゼロからなら、椅子は残らない<\/span><\/span><\/div>\n          <div class=\"jarrow\">↓<\/div>\n          <div class=\"jout\"><span class=\"jok\">2つとも通る → 上位を取りに行く<\/span><span class=\"jng\">1つでも欠ける → やらない<\/span><\/div>\n        <\/div>\n        <h3>禁止ライン（8つ）<\/h3>\n        <p>判定は「バレるか」ではない。<strong>revealテスト<\/strong>——将来、本名と顔を出して同じ売り方を説明できるか——を通らないものはやらない。<\/p>\n        <ul class=\"checklist\">\n          <li>裏付けのない／水増しした収入・実績・効果の数字を広告に使う<\/li>\n          <li>「絶対稼げる」等の断定的な表現で情報商材・スクール・コンサルを売る<\/li>\n          <li>ステマ（PRを隠す／広告主に隠させる）<\/li>\n          <li>無許可の反復継続転売、資格を偽った仕入れ、定価超チケット転売<\/li>\n          <li>わいせつ物の頒布・陳列にあたる成人向け販売<\/li>\n          <li>収益の無申告・過少申告<\/li>\n          <li>他人の著作物・商標・キャラ・肖像を無断で使った商品販売<\/li>\n          <li>買い手の不安・借金・焦りを煽る高額勧誘<\/li>\n        <\/ul>\n        <h3>やらないこと<\/h3>\n        <ul>\n          <li>株・FX（元手がない段階では再現性なし）<\/li>\n          <li>スクール事業（実績ができるまで封印）<\/li>\n          <li>アダルト（匿名でも最低優先。原則やらない）<\/li>\n          <li>生活費を事業の成果に賭けること<\/li>\n          <li>図鑑エンジンのキット販売（仕組みの公開になるため）<\/li>\n        <\/ul>\n        <h3>実現のルール（2026-11-20）<\/h3>\n        <ol class=\"rules\">\n          <li>計画には最初の一歩と時期を付ける。実現したかどうかは、文書ができたかではなく、世の中の側が変わったか（出荷・出品・応募・最初の取引）で数える<\/li>\n        <\/ol>",

/* swipe-back (zukan thresholds): engage on a right-dominant drag,
   the detail follows the finger, the list parallaxes underneath */
(function(){
  var st = null;
  document.addEventListener('touchstart', function(e){
    if(!detailOpen || vtBusy || st || e.touches.length !== 1) return;
    if(e.target && e.target.closest && e.target.closest('#pillnav')) return; /* pill drags belong to the pill itself */
    var t = e.touches[0];
    st = { sx: t.clientX, sy: t.clientY, dx: 0, dy: 0, engaged: false, lastX: t.clientX, lastT: Date.now(), vx: 0, y: window.scrollY || 0 };
  }, { passive: true });
  document.addEventListener('touchmove', function(e){
    if(!st) return;
    var t = e.touches[0];
    st.dx = t.clientX - st.sx;
    st.dy = t.clientY - st.sy;
    var now = Date.now(), dt = now - st.lastT;
    if(dt > 0){ st.vx = (t.clientX - st.lastX) / dt; st.lastX = t.clientX; st.lastT = now; }
    if(!st.engaged){
      if(st.dx > 12 && Math.abs(st.dx) > Math.abs(st.dy) * 1.25) engageSwipe();
      else if(Math.abs(st.dy) > 14 && Math.abs(st.dy) >= Math.abs(st.dx)){ st = null; return; }
      else return;
    }
    paintSwipe();
  }, { passive: true });
  function engageSwipe(){
    var H = hdrH();
    listView.classList.remove('hidden');
    detailView.classList.add('vt-fixed');
    detailView.style.top = (H - st.y) + 'px';
    detailView.style.height = '100dvh';
    detailView.style.zIndex = '26';
    document.body.classList.add('vt-run');
    window.scrollTo(0, listScrollY);
    listView.style.transform = 'translateX(-26%)';
    st.engaged = true;
    paintSwipe();
  }
  function paintSwipe(){
    var W = window.innerWidth || 1;
    var pr = Math.min(1, Math.max(0, st.dx) / W);
    detailView.style.transform = 'translateX(' + Math.max(0, st.dx) + 'px)';
    listView.style.transform = 'translateX(' + (-26 * (1 - pr)) + '%)';
  }
  document.addEventListener('touchend', function(){
    if(!st) return;
    var s = st; st = null;
    if(!s.engaged) return;
    var W = window.innerWidth || 1;
    finishSwipe(s, s.dx > W * 0.35 || (s.dx > 56 && s.vx > 0.3));
  }, { passive: true });
  document.addEventListener('touchcancel', function(){
    if(st && st.engaged){ var s = st; st = null; finishSwipe(s, false); }
    else st = null;
  }, { passive: true });
  function finishSwipe(s, commit){
    var target = commit ? (window.innerWidth + 24) : 0;
    var dur = commit ? 240 : 200;
    var fromList = listView.style.transform || 'translateX(-26%)';
    var ad = detailView.animate([{ transform: 'translateX(' + Math.max(0, s.dx) + 'px)' }, { transform: 'translateX(' + target + 'px)' }], { duration: dur, easing: VT_EASE });
    var al = listView.animate([{ transform: fromList }, { transform: 'translateX(0px)' }], { duration: dur, easing: VT_EASE });
    var done = false;
    function teardown(){
      if(done) return;
      done = true;
      try{ ad.cancel(); }catch(e){}
      try{ al.cancel(); }catch(e){}
      detailView.classList.remove('vt-fixed');
      detailView.style.top = ''; detailView.style.height = ''; detailView.style.zIndex = ''; detailView.style.transform = '';
      listView.style.transform = '';
      document.body.classList.remove('vt-run');
      if(commit){
        detailView.classList.add('hidden');
        current = null; detailOpen = false;
        window.scrollTo(0, listScrollY);
        try{ history.pushState({ view: 'home' }, '', '#/'); }catch(e){}
      } else {
        listView.classList.add('hidden');
        window.scrollTo(0, s.y || 0);
      }
    }
    ad.onfinish = teardown;
    setTimeout(teardown, 420);
  }
})();

/* ---------- toast (the zukan app's, ported) ---------- */
function toast(msg, ms){
  var t = $('toast'); if(!t) return;
  $('toastmsg').textContent = msg;
  var act = $('toastact'); act.classList.add('hidden'); act.onclick = null;
  t.classList.add('on');

/* ---------- fetch with timeout + content hash (the zukan app's
   fetchT / syncHashOfStr, ported verbatim) ---------- */
function fetchT(url, opts, ms){
  return new Promise(function(resolve, reject){
    var ctl = null;
    try{ ctl = new AbortController(); }catch(e){}
    var to = setTimeout(function(){ try{ if(ctl) ctl.abort(); }catch(e){} reject(new Error('通信がタイムアウトしました')); }, ms || 30000);
    var o = Object.assign({}, opts || {}); if(ctl) o.signal = ctl.signal;
    fetch(url, o).then(function(r){ clearTimeout(to); resolve(r); }, function(e){ clearTimeout(to); reject(e); });
  });
}
function syncHashOfStr(s){
  var h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for(var i = 0; i < s.length; i++){ var ch = s.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return s.length + ':' + (h2 >>> 0).toString(16) + (h1 >>> 0).toString(16);
}
function sleepMs(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

/* ---------- relay transport (the zukan app's, ported) ----------
   The relay spec is frozen (ping/stat/get/put + a filename
   pattern); bizplan.json matches the pattern, so the relay works
   for this app with NO relay-side change. getSince is NOT used:
   server-side it only splits the artists / exhibitions keys and
   returns every other root key (here: sections, home) wholesale,
   so stat + get is equivalent and simpler.
   The config lives in this app's own key. When it is absent, the
   zukan app's same-origin config is adopted read-only, so a
   device that already runs Arcanum's relay needs no new setup
   here. The secret is never embedded in this file. */
var LS_RELAY = 'bizplan.relay';
var RELAY_URL_DEFAULT = 'https://script.google.com/macros/s/AKfycbziV1Wpv7AWSUJJgaKyRzFeBR81Td4CjryGGuq4avt1xAo-e2mbeyS2vBpCuqx4_KI/exec';
function relayCfgInfo(){
  var own = null;
  try{ own = JSON.parse(localStorage.getItem(LS_RELAY) || 'null'); }catch(e){}
  if(own && own.disabled) return null;
  if(own && own.secret) return { url: own.url || RELAY_URL_DEFAULT, secret: own.secret, adopted: false };
  try{
    var z = JSON.parse(localStorage.getItem('zukan.relay') || 'null');
    if(z && z.secret) return { url: z.url || RELAY_URL_DEFAULT, secret: z.secret, adopted: true };
  }catch(e){}
  return null;
}
function relayCfg(){ var i = relayCfgInfo(); return i ? { url: i.url, secret: i.secret } : null; }
function relayReady(){ return !!relayCfg(); }
async function relayCall(op, name, content, extra){
  var c = relayCfg(); if(!c) throw new Error('中継が未設定です');
  var body = JSON.stringify(Object.assign({ secret: c.secret, op: op, name: name, content: content }, extra || {}));
  var healed = false;
  for(;;){
    var res = await fetchT(c.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body }, 60000);
    if(!res.ok) throw new Error('中継 HTTP ' + res.status);
    var text = await res.text();
    var ctype = (res.headers && res.headers.get) ? (res.headers.get('content-type') || '') : '';
    var trimmed = text.replace(/^\s+/, '');
    /* sentinel self-heal (zukan v27.11 B): a body opening with the
       relay's doGet text — or any non-JSON text/plain body — proves
       the POST was re-driven as a GET in the redirect chain.
       Re-issue the POST once, silently, right here. */
    var sentinel = trimmed.indexOf('Muse relay is alive') === 0 || (/^text\/plain/i.test(ctype) && trimmed.charAt(0) !== '{');
    if(sentinel && !healed){ healed = true; continue; }
    var j = null;
    try{ j = JSON.parse(text); }catch(e){}
    if(!j || typeof j !== 'object' || typeof j.ok === 'undefined'){
      /* envelope discipline (zukan v27.11 A): a body that is not
         the JSON envelope is a transport error — never surfaced
         raw to the user. */
      var err = new Error('中継の応答が正しく届きませんでした');
      err.code = 'RELAY_BAD_BODY';
      throw err;
    }
    if(!j.ok) throw new Error('中継エラー：' + ((j && j.error) || 'unknown'));
    return j;
  }
}
function relaySave(url, secret){

}

/* ---------- GIS token (popup only — never a redirect on iOS) --- */
function waitGis(){
  return new Promise(function(res, rej){
    var n = 0;
    var iv = setInterval(function(){
      if(window.google && google.accounts && google.accounts.oauth2){ clearInterval(iv); res(); }
      else if(++n > 40){ clearInterval(iv); rej(new Error('gis-timeout')); }
    }, 250);
  });
}
/* the token lives in sessionStorage with its expiry (the zukan
   app's storeToken), so an in-session reload does not need a new
   GIS round-trip */
function storeToken(tok, expiresInSec){
  accessToken = tok;
  tokenExp = Date.now() + (expiresInSec ? expiresInSec * 1000 : 3000000);
  try{ sessionStorage.setItem('bizplan.token', tok); sessionStorage.setItem('bizplan.tokenExp', String(tokenExp)); }catch(e){}
}
function tokenFromSession(){
  if(accessToken && Date.now() < tokenExp - 30000) return accessToken;
  try{
    var t = sessionStorage.getItem('bizplan.token'), x = Number(sessionStorage.getItem('bizplan.tokenExp') || 0);
    if(t && Date.now() < x - 30000){ accessToken = t; tokenExp = x; return t; }
  }catch(e){}
  return null;
}
function clearToken(){
  accessToken = null; tokenExp = 0;
  try{ sessionStorage.removeItem('bizplan.token'); sessionStorage.removeItem('bizplan.tokenExp'); }catch(e){}
}
function requestToken(interactive){
  return new Promise(function(res, rej){
    waitGis().then(function(){
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: 'https://www.googleapis.com/auth/drive.file',
        callback: function(resp){
          if(resp && resp.access_token){ storeToken(resp.access_token, resp.expires_in); res(accessToken); }
          else rej(new Error('no-token'));
        },
        error_callback: function(err){ rej(new Error(err && err.type ? err.type : 'gis-error')); }
      });
      /* the zukan v5.71.2 rule: an explicit connect ALWAYS shows
         the account chooser — he holds two Google accounts, and a
         silent pick once synced the wrong account's Drive */
      tokenClient.requestAccessToken({ prompt: interactive ? 'select_account' : '' });
    }).catch(rej);
  });
}
function getValidToken(interactive){
  var t = tokenFromSession();
  if(t) return Promise.resolve(t);
  return requestToken(interactive);
}
/* silent reconnect (the zukan app's): only on a device that has
   connected before, throttled to one silent attempt a minute,
   and a failure never becomes an error state */
var silentTryAt = 0;
function trySilentReconnect(){
  if(!isConnected() || relayReady()) return;
  if(tokenFromSession()) return;
  var now = Date.now();
  if(now - silentTryAt < 60000) return;
  silentTryAt = now;
  requestToken(false).then(function(){ appSync(false); }).catch(function(){});
}
function connectDrive(){
  getValidToken(true).then(function(){
    setConnected(true); syncError = null;
    renderSyncStatus();
    appSync(true);
  }).catch(function(){
    syncError = 'connect';
    renderSyncStatus();
  });
}
function disconnectDrive(){
  clearToken(); fileId = null;
  setConnected(false); syncError = null;
  renderSyncStatus();
}

/* ---------- Drive (GIS) primitives ---------- */
function driveFetch(url, opts){
  return getValidToken(false).then(function(token){
    var headers = Object.assign({}, (opts && opts.headers) || {}, { 'Authorization': 'Bearer ' + token });
    return fetchT(url, Object.assign({}, opts || {}, { headers: headers }), 60000);
  }).then(function(res){
    if(res.status === 401){ clearToken(); throw new Error('auth-401'); }
    if(!res.ok) throw new Error('drive-' + res.status);
    return res;
  });
}
function ensureFileId(){
  if(fileId) return Promise.resolve(fileId);
  var q = encodeURIComponent("name='" + FILE_NAME + "' and trashed=false");
  return driveFetch('https://www.googleapis.com/drive/v3/files?q=' + q + '&fields=files(id,name)&spaces=drive')
    .then(function(res){ return res.json(); })
    .then(function(j){
      if(j.files && j.files.length){ fileId = j.files[0].id; return fileId; }
      return driveFetch('https://www.googleapis.com/drive/v3/files', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: FILE_NAME, mimeType: 'application/json' })
      }).then(function(cres){ return cres.json(); }).then(function(cj){
        fileId = cj.id;
        /* first connect: create the file with the current plan content */
        return uploadData(DATA).then(function(){ return fileId; });
      });
    });
}
function remoteStampGIS(){
  return ensureFileId().then(function(id){
    return driveFetch('https://www.googleapis.com/drive/v3/files/' + id + '?fields=modifiedTime');
  }).then(function(res){ return res.json(); }).then(function(j){ return j && j.modifiedTime ? String(j.modifiedTime) : null; });
}
function normalizeData(j){
  if(!j || !Array.isArray(j.sections) || !j.home) return null;
  return j;
}
function downloadData(){
  return ensureFileId()
    .then(function(id){ return driveFetch('https://www.googleapis.com/drive/v3/files/' + id + '?alt=media'); })
    .then(function(res){ return res.text(); })
    .then(function(text){
      if(!text || !text.trim()) return null;
      return normalizeData(JSON.parse(text));
    });
}
function uploadData(data){
  return ensureFileId().then(function(id){
    var payload = clone(data);
    payload.updatedAt = nowISO();
    return driveFetch('https://www.googleapis.com/upload/drive/v3/files/' + id + '?uploadType=media', {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
  });
}

/* ---------- merge (the zukan app's rules, scaled to this shape)
   Per section id the newer updated_at wins wholesale; home
   likewise. Convergence: a local-only section whose id was in
   the last landed server set is treated as deleted on the
   server and dropped (deletions propagate); a local-only section
   the server set has never contained is kept and counted
   pending — it may be a brand-new local record whose upload has
   not landed yet, and dropping it would lose data. */
function mergeData(local, remote){
  if(!remote) return { data: local, changed: false, pending: local.sections.length + 1, dropped: 0 };
  var known = knownIdsLoad();
  var remoteById = {};
  remote.sections.forEach(function(s){ remoteById[s.id] = s; });
  var seen = {}, mergedSections = [], pending = 0, dropped = 0;
  local.sections.forEach(function(ls){
    seen[ls.id] = true;
    var rs = remoteById[ls.id];
    if(!rs){
      if(known && known.indexOf(ls.id) >= 0){ dropped++; return; }
      mergedSections.push(ls); pending++;
    }
    else if((ls.updated_at || '') > (rs.updated_at || '')){ mergedSections.push(ls); pending++; }
    else mergedSections.push(rs);
  });
  remote.sections.forEach(function(rs){ if(!seen[rs.id]) mergedSections.push(rs); });
  var home = local.home, homePending = 0;
  if(((remote.home && remote.home.updated_at) || '') > (local.home.updated_at || '')) home = remote.home;
  else if((local.home.updated_at || '') > ((remote.home && remote.home.updated_at) || '')) homePending = 1;
  pending += homePending;
  var merged = { version: 1, updatedAt: local.updatedAt, home: home, sections: mergedSections };
  return { data: merged, changed: JSON.stringify(merged) !== JSON.stringify(local), pending: pending, dropped: dropped };
}

/* ---------- plan-change notifications ----------
   The zukan app's registration-notification mechanism, adapted:
   whenever new data lands, section ids / updated_at are diffed
   against the last landed snapshot; new and advanced sections
   become notifications (burst cap 8 + one summary, store cap
   60 — the zukan numbers). The first snapshot seeds silently. */
var LS_PNOTIFS = 'bizplan.planNotifs', LS_STAMPS = 'bizplan.knownStamps';
function planNotifsLoad(){ try{ var a = JSON.parse(localStorage.getItem(LS_PNOTIFS) || '[]'); return Array.isArray(a) ? a : []; }catch(e){ return []; } }
function planNotifsSave(a){ try{ localStorage.setItem(LS_PNOTIFS, JSON.stringify(a.slice(0, 60))); }catch(e){} }
function stampsLoad(){ try{ return JSON.parse(localStorage.getItem(LS_STAMPS) || 'null'); }catch(e){ return null; } }
function stampsSave(data){
  var m = { home: (data.home && data.home.updated_at) || '' };
  (data.sections || []).forEach(function(s){ m[s.id] = s.updated_at || ''; });
  try{ localStorage.setItem(LS_STAMPS, JSON.stringify(m)); }catch(e){}
}
function detectPlanChanges(after){
  var prev = stampsLoad();
  stampsSave(after);
  if(!prev) return; /* first snapshot: seed silently, no flood */
  var fresh = [];
  (after.sections || []).forEach(function(s){
    if(!(s.id in prev)) fresh.push({ sectionId: s.id, title: s.title || s.id, kind: 'new' });
    else if((s.updated_at || '') > prev[s.id]) fresh.push({ sectionId: s.id, title: s.title || s.id, kind: 'updated' });
  });
  if(((after.home && after.home.updated_at) || '') > (prev.home || '')) fresh.push({ sectionId: '', title: 'ホーム（目標・前提）', kind: 'updated' });
  if(!fresh.length) return;
  var at = nowISO();
  var mk = function(f){ return { id: 'pn' + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36), sectionId: f.sectionId, title: f.title, kind: f.kind, at: at, seen: false }; };
  var entries = fresh.slice(0, 8).map(mk);
  if(fresh.length > 8) entries.push({ id: 'pnsum' + Date.now().toString(36), summary: true, count: fresh.length - 8, members: fresh.slice(8).map(function(f){ return { sectionId: f.sectionId, title: f.title, kind: f.kind }; }), at: at, seen: false });
  planNotifsSave(entries.concat(planNotifsLoad()));
  refreshBell();
}
function planUnseenCount(){ return planNotifsLoad().filter(function(n){ return !n.seen; }).length; }
function planMarkSeen(id){
  var a = planNotifsLoad(), ch = false;

/* v3.0.6: the panel's すべて既読 — every stored notification at

function planMarkAllSeen(){
  var a = planNotifsLoad(), ch = false;
  a.forEach(function(n){ if(!n.seen){ n.seen = true; ch = true; } });

}

/* ---------- update history (the zukan app's changelog mechanism,
   ported): changelog.json sits beside the app, fetched cache-free;
   entries carry { v, at, notes[] }; the seen set is seeded so
   only the newest entry starts as NEW; expanding an entry — or
   its 確認した button — is what marks it seen. */
var LS_CHANGELOG = 'bizplan.changelog', LS_CHANGELOG_SEEN = 'bizplan.changelogSeen';
var changelogData = null, changelogOpen = {};
function changelogCacheLoad(){ try{ return JSON.parse(localStorage.getItem(LS_CHANGELOG) || 'null'); }catch(e){ return null; } }
function fetchChangelog(){
  fetch('changelog.json?cv=' + Date.now(), { cache: 'no-store' }).then(function(r){ return r.ok ? r.json() : null; }).then(function(j){
    if(j && Array.isArray(j.entries)){
      changelogData = j;
      try{ localStorage.setItem(LS_CHANGELOG, JSON.stringify(j)); }catch(e){}
      refreshBell();
      if(notifOpen && bellTab === 'history') renderUpdateList();
    }
  }).catch(function(){});
}
function changelogEntryKey(e){ return String(e.v || '') + '|' + String(e.at || ''); }
function changelogSeenLoad(entries){
  try{ var d = JSON.parse(localStorage.getItem(LS_CHANGELOG_SEEN) || 'null'); if(Array.isArray(d)) return d; }catch(e){}
  if(!entries || !entries.length) return [];
  var sorted = entries.slice().sort(function(a, b){ return (Date.parse(b.at || '') || 0) - (Date.parse(a.at || '') || 0); });
  var seed = sorted.slice(1).map(changelogEntryKey);
  try{ localStorage.setItem(LS_CHANGELOG_SEEN, JSON.stringify(seed)); }catch(e){}
  return seed;
}
function changelogUnseenCount(){
  var d = changelogData || changelogCacheLoad();
  if(!d || !d.entries.length) return 0;
  var raw = null;
  try{ raw = JSON.parse(localStorage.getItem(LS_CHANGELOG_SEEN) || 'null'); }catch(e){}
  if(!Array.isArray(raw)) return 1; /* unseeded: only the newest entry will be NEW */
  var s = {};
  raw.forEach(function(k){ s[k] = true; });
  return d.entries.filter(function(e){ return !s[changelogEntryKey(e)]; }).length;
}
function changelogMarkSeen(k){
  var d = changelogData || changelogCacheLoad();
  var seen = changelogSeenLoad(d ? d.entries : null);
  if(seen.indexOf(k) >= 0) return;
  seen.push(k);
  try{ localStorage.setItem(LS_CHANGELOG_SEEN, JSON.stringify(seen)); }catch(e){}
  refreshBell();
}
/* v3.0.6: the history tab's すべて既読 — the single-item 確認した
   applied to every entry, stored in the same seen set. */
function changelogMarkAllSeen(){
  var d = changelogData || changelogCacheLoad();
  if(!d || !d.entries.length) return;
  var seen = changelogSeenLoad(d.entries), have = {}, ch = false;
  seen.forEach(function(k){ have[k] = true; });
  d.entries.forEach(function(e){
    var k = changelogEntryKey(e);
    if(!have[k]){ seen.push(k); ch = true; }
  });
  if(ch){ try{ localStorage.setItem(LS_CHANGELOG_SEEN, JSON.stringify(seen)); }catch(e){} }
  refreshBell();
  if(notifOpen && bellTab === 'history') renderUpdateList();
}
function notifWhen(iso){
  var t = Date.parse(iso || ''); if(isNaN(t)) return '';
  var d = new Date(t);
  return d.getFullYear() + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getDate()).padStart(2, '0');
}

/* ---------- sync core (the zukan app's rules) ----------
   One queue: every sync runs through queueSync, so two syncs
   never overlap (the old flag simply dropped concurrent runs).
   A timed-out attempt retries exactly once after 1.5s. A write
   is built only on the fresh download of the same run, and the
   totals guard is a VETO, not an error (zukan v14.1): if the
   merged result would shrink the server file, the upload is
   dropped, the merged state is adopted locally, and a note is
   attached — no error, no retry loop. When the server stamp and
   the local hash both match the last landed sync, the download
   is skipped entirely (the zukan B shortcut). */
var syncQueue = Promise.resolve();
function queueSync(task){
  var p = syncQueue.then(task, task);
  syncQueue = p.then(function(){}, function(){});
  return p;
}
function isTimeoutErr(e){
  var m = String((e && e.message) || e || '');
  return /タイムアウト|abort|network|failed to fetch/i.test(m) || (e && e.code === 'RELAY_BAD_BODY');
}
function appSync(manual){
  return queueSync(function(){ return syncFlow(manual); });
}
async function syncFlow(manual){
  if(!relayReady() && !isConnected()){ if(manual) connectDrive(); return; }
  syncRunning = true; syncError = null; renderSyncStatus();
  try{
    await syncOnce();
  }catch(e1){
    if(isTimeoutErr(e1)){
      await sleepMs(1500);
      try{ await syncOnce(); }
      catch(e2){ syncError = String((e2 && e2.message) || e2); appendSyncLine('同期', '失敗しました：' + syncError, true); }
    } else {
      syncError = String((e1 && e1.message) || e1);
      appendSyncLine('同期', '失敗しました：' + syncError, true);
    }
  }
  syncRunning = false;
  renderSyncStatus();
}
async function syncOnce(){
  syncNote = '';
  if(relayReady()) await syncViaRelay();
  else await syncViaGIS();
  lastSyncAt = Date.now();
}
function adoptMerged(m){
  if(m.changed){
    DATA = m.data; saveCache(); renderHome();
    if(current && detailOpen){ $('detailBody').innerHTML = (current === HOME_ID) ? homeDetailHTML() : ((sectionById(current) || {}).html || ''); decorateLadder(); decorateGoalPick(); }
    detectPlanChanges(DATA);
  }
  pendingCount = m.pending;
}
function guardTripped(m, remote){ return m.data.sections.length < remote.sections.length; }
async function syncViaRelay(){
  var st = await relayCall('stat', FILE_NAME);
  var meta = syncMetaLoad();
  if(st.exists && meta && String(meta.stamp) === String(st.updated) && meta.hash === syncHashOfStr(JSON.stringify(DATA))){
    pendingCount = 0; /* stamp + local hash unchanged: skip the download */
    return;
  }
  if(!st.exists){
    var seedPayload = clone(DATA); seedPayload.updatedAt = nowISO();
    await relayCall('put', FILE_NAME, JSON.stringify(seedPayload));
    DATA.updatedAt = seedPayload.updatedAt; saveCache();
    var st2 = await relayCall('stat', FILE_NAME);
    syncMetaSave({ stamp: String(st2.updated), hash: syncHashOfStr(JSON.stringify(DATA)) });
    knownIdsSave(dataIds());
    stampsSave(DATA);
    pendingCount = 0;
    appendSyncLine('同期', '中継で bizplan.json を作成しました');
    return;
  }
  var g = await relayCall('get', FILE_NAME);
  var remote = null;
  try{ remote = normalizeData(JSON.parse(g.content)); }catch(e){}
  if(!remote) throw new Error('サーバのデータを読み取れませんでした');
  var m = mergeData(DATA, remote);
  if(guardTripped(m, remote)){
    syncNote = 'サーバの最新に合わせ直しました';
    adoptMerged(m);
    pendingCount = 0;
    knownIdsSave(remote.sections.map(function(s){ return s.id; }));
    syncMetaSave({ stamp: String(g.updated), hash: syncHashOfStr(JSON.stringify(DATA)) });
    appendSyncLine('同期', '古い送信を止めて、サーバの最新に合わせました');
    return;
  }
  adoptMerged(m);
  var remoteChanged = JSON.stringify(m.data) !== JSON.stringify({ version: 1, updatedAt: remote.updatedAt, home: remote.home, sections: remote.sections });
  if(remoteChanged || m.pending > 0){
    var payload = clone(m.data); payload.updatedAt = nowISO();
    await relayCall('put', FILE_NAME, JSON.stringify(payload));
    DATA.updatedAt = payload.updatedAt; saveCache();
    pendingCount = 0;
    var st3 = await relayCall('stat', FILE_NAME);
    syncMetaSave({ stamp: String(st3.updated), hash: syncHashOfStr(JSON.stringify(DATA)) });
  } else {
    syncMetaSave({ stamp: String(g.updated), hash: syncHashOfStr(JSON.stringify(DATA)) });
  }
  knownIdsSave(dataIds());
  appendSyncLine('同期', '完了しました（中継）');
}
async function syncViaGIS(){
  var meta = syncMetaLoad();
  var stamp = null;
  try{ stamp = await remoteStampGIS(); }catch(e){ stamp = null; }
  if(stamp && meta && String(meta.stamp) === String(stamp) && meta.hash === syncHashOfStr(JSON.stringify(DATA))){
    pendingCount = 0; /* stamp + local hash unchanged: skip the download */
    return;
  }
  var remote = await downloadData();
  if(!remote){
    /* ensureFileId has just created the file with our own data */
    knownIdsSave(dataIds());
    stampsSave(DATA);
    pendingCount = 0;
    return;
  }
  var m = mergeData(DATA, remote);
  if(guardTripped(m, remote)){
    syncNote = 'サーバの最新に合わせ直しました';
    adoptMerged(m);
    pendingCount = 0;
    knownIdsSave(remote.sections.map(function(s){ return s.id; }));
    appendSyncLine('同期', '古い送信を止めて、サーバの最新に合わせました');
    return;
  }
  adoptMerged(m);
  var remoteChanged = JSON.stringify(m.data) !== JSON.stringify({ version: 1, updatedAt: remote.updatedAt, home: remote.home, sections: remote.sections });
  if(remoteChanged || m.pending > 0){
    await uploadData(m.data);
    pendingCount = 0;
    DATA.updatedAt = nowISO(); saveCache();
  }
  var stamp2 = null;
  try{ stamp2 = await remoteStampGIS(); }catch(e){}
  syncMetaSave({ stamp: stamp2 ? String(stamp2) : null, hash: syncHashOfStr(JSON.stringify(DATA)) });
  knownIdsSave(dataIds());
  appendSyncLine('同期', '完了しました');
}

  function kill(){ if(done) return; done = true; try{ v.remove(); }catch(e){} }
  v.addEventListener('click', kill);
  if(reducedMotion()){ kill(); return; }
  setTimeout(kill, 900);
})();
if(relayReady()){ appSync(false); }
else if(isConnected()){
  if(tokenFromSession()) appSync(false);
  else trySilentReconnect();
}
</script>
