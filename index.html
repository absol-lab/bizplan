<style>
  button, [role="button"], select, summary, input:not([type="checkbox"], [type="radio"]) { min-height: 2rem; }
  :root{
    --bg:#f7f6f2; --surface:#ffffff; --surface-2:#efede6;
    --ink:#1d1a16; --ink-2:#4c463e; --muted:#7a7367; --line:#ddd7ca;
    --accent:#b23a26; --accent-ink:#ffffff; --accent-soft:#f6e3dd;
    --gold:#8a6d1f; --gold-soft:#f1e9d2; --radius:12px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#16140f; --surface:#201d17; --surface-2:#29251d;
      --ink:#ece7db; --ink-2:#c9c2b2; --muted:#9a927f; --line:#3a352a;
      --accent:#e0704f; --accent-ink:#1c0f0a; --accent-soft:#3d241c;
      --gold:#c9a94e; --gold-soft:#38300f;
    }
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  html,body{touch-action:manipulation}
  @media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} }
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",-apple-system,sans-serif;font-size:16px;line-height:1.75;-webkit-text-size-adjust:100%}
  body.locked{overflow:hidden}
  h1,h2,h3,.serif{font-family:"Shippori Mincho B1","Hiragino Mincho ProN",serif}
  p{margin:0 0 .9em} strong{font-weight:700}
  ul{margin:0 0 .9em;padding-left:1.25em} li{margin-bottom:.35em} li:last-child{margin-bottom:0}
  .wrap{max-width:880px;margin:0 auto;padding:0 16px 72px}

  /* launch veil: plain black, fades only (standing rule) */
  #veil{position:fixed;inset:0;background:#000;z-index:300;pointer-events:none;opacity:1;transition:opacity .45s ease}
  #veil.off{opacity:0}

  /* sync bar: compact, top of home */
  #syncbar{font-size:12.5px;color:var(--muted);padding:10px 2px 9px;border-bottom:1px solid var(--line);cursor:pointer;line-height:1.5;-webkit-tap-highlight-color:transparent}
  #syncbar .sbhint{text-decoration:underline;text-underline-offset:3px}
  #syncbar .err{color:var(--accent);font-weight:700}

  /* ===== home head ===== */
  .home-head{padding:26px 0 6px}
  .theme{font-family:"Shippori Mincho B1","Hiragino Mincho ProN",serif;font-weight:800;font-size:clamp(30px,7.5vw,44px);line-height:1.3;letter-spacing:.02em;margin:0 0 10px}
  .theme-sub{color:var(--ink-2);font-size:15px;margin-bottom:20px}
  .goal-row{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}
  .goal{flex:1 1 220px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px 10px}
  .goal .g-label{font-size:13px;color:var(--muted)}
  .goal .g-num{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:32px;line-height:1.2}
  .goal .g-num small{font-size:16px;font-weight:600}
  .goal .g-note{font-size:13px;color:var(--ink-2)}
  .goal.main{border-top:4px solid var(--accent)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{font-size:13px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;color:var(--ink-2)}

  /* ===== size toggle ===== */
  .controls{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 14px;padding-top:16px;border-top:1px solid var(--line)}
  .count{font-size:13px;color:var(--muted);font-weight:700}
  .size-tabs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px}
  .size-tabs button{border:0;background:transparent;color:var(--ink-2);font:inherit;font-size:14px;font-weight:700;line-height:1;padding:9px 18px;border-radius:999px;cursor:pointer;min-height:38px}
  .size-tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
  .size-tabs button:active{opacity:.85}

  /* ===== card grid (zukan home) ===== */
  .grid{display:grid;gap:14px}
  .grid.size-large{grid-template-columns:1fr;--thumb-h:188px;--card-title:21px}
  .grid.size-medium{grid-template-columns:repeat(2,1fr);--thumb-h:128px;--card-title:17px}
  .grid.size-small{grid-template-columns:repeat(3,1fr);--thumb-h:84px;--card-title:14px;gap:10px}
  @media (min-width:700px){
    .grid.size-large{grid-template-columns:repeat(2,1fr)}
    .grid.size-medium{grid-template-columns:repeat(3,1fr)}
    .grid.size-small{grid-template-columns:repeat(4,1fr)}
  }
  .entry-card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-decoration:none;color:var(--ink);text-align:left;padding:0;font:inherit;cursor:pointer;width:100%}
  .entry-card:active{border-color:var(--accent)}
  .thumb{height:var(--thumb-h);display:flex;align-items:center;justify-content:center;position:relative;flex:none}
  .thumb .thumb-char{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:calc(var(--thumb-h)*.42);line-height:1}
  .thumb .thumb-num{position:absolute;top:10px;left:12px;font-size:11px;font-weight:700;letter-spacing:.12em;opacity:.65}
  .thumb .thumb-tag{position:absolute;bottom:10px;right:10px;font-size:11px;font-weight:700;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--ink-2)}
  .grid.size-small .thumb-tag{display:none}
  .thumb.t-schedule{background:#ede6d6;color:#4c3f22}
  .thumb.t-business{background:var(--accent-soft);color:var(--accent)}
  .thumb.t-art{background:#2b2620;color:#ece7db}
  .thumb.t-zukan{background:var(--gold-soft);color:var(--gold)}
  .thumb.t-ideas{background:#e9e4d8;color:#5c5340}
  .thumb.t-pending{background:var(--surface);color:var(--gold);box-shadow:inset 0 0 0 2px var(--gold);border-bottom:1.5px dashed var(--gold)}
  .thumb.t-rules{background:var(--surface-2);color:var(--ink)}
  @media (prefers-color-scheme: dark){
    .thumb.t-schedule{background:#35301f;color:#d8cba3}
    .thumb.t-art{background:#ece7db;color:#2b2620}
    .thumb.t-ideas{background:#2e2a20;color:#c9c2b2}
  }
  .card-body{padding:13px 14px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
  .grid.size-small .card-body{padding:9px 10px 9px;gap:4px}
  .card-body h2{font-size:var(--card-title);font-weight:800;margin:0;line-height:1.4}
  .card-body .meta{font-size:13px;color:var(--ink-2);line-height:1.6;margin:0}
  .grid.size-small .meta{display:none}
  .card-body .badge{align-self:flex-start;margin-top:auto}
  .grid.size-small .badge{font-size:10.5px;padding:1px 7px}

  .badge{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:2px 9px;white-space:nowrap}
  .badge.decided{background:var(--accent);color:var(--accent-ink)}
  .badge.pending{background:transparent;color:var(--gold);border:1.5px dashed var(--gold)}
  .badge.now{background:var(--accent-soft);color:var(--accent)}

  /* ===== detail (slide-in panel) ===== */
  #view-detail{position:fixed;inset:0;background:var(--bg);z-index:50;overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateX(100%);visibility:hidden;transition:transform .34s cubic-bezier(.25,.9,.3,1),visibility 0s linear .34s}
  #view-detail.open{transform:translateX(0);visibility:visible;transition:transform .34s cubic-bezier(.25,.9,.3,1)}
  .back-pill{position:fixed;top:calc(12px + env(safe-area-inset-top));left:14px;z-index:60;display:inline-flex;align-items:center;gap:7px;background:var(--surface);color:var(--ink);border:1.5px solid var(--ink);border-radius:999px;padding:10px 20px 10px 16px;font:inherit;font-size:15px;font-weight:700;line-height:1;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.14);min-height:44px}
  .back-pill:active{background:var(--accent-soft)}
  .detail-wrap{padding-top:70px}
  .detail-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  .detail-head h2{font-size:26px;font-weight:800;margin:0;line-height:1.35}
  .sec-lead{color:var(--ink-2);margin-bottom:14px}
  h3{font-size:18px;font-weight:700;margin:26px 0 8px;line-height:1.45}
  h3:first-of-type{margin-top:14px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 10px;margin-bottom:14px}
  .card h3{margin-top:0}

  .steps{list-style:none;margin:6px 0 14px;padding:0}
  .steps li{position:relative;padding:0 0 20px 46px;margin:0}
  .steps li::before{content:attr(data-n);position:absolute;left:0;top:1px;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
  .steps li::after{content:"";position:absolute;left:14.5px;top:36px;bottom:2px;width:2px;background:var(--line)}
  .steps li:last-child{padding-bottom:4px}
  .steps li:last-child::after{display:none}
  .steps .st{font-weight:700;display:block}
  .steps .sd{color:var(--ink-2);font-size:14.5px;display:block}
  .steps .done-when{font-size:13px;color:var(--muted);display:block;margin-top:2px}
  .steps .done-when::before{content:"完了条件：";font-weight:700}

  .ladder{list-style:none;margin:6px 0 14px;padding:0}
  .ladder li{display:flex;align-items:baseline;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
  .ladder li:last-child{border-bottom:none}
  .ladder .amt{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:20px;min-width:112px}
  .ladder .bar{height:8px;border-radius:4px;background:var(--accent);flex:none;align-self:center}
  .ladder .what{color:var(--ink-2);font-size:14px}

  .stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
  @media (min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 14px 10px}
  .stat .v{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:24px;line-height:1.25}
  .stat .v small{font-size:14px;font-weight:600}
  .stat .k{font-size:13px;color:var(--muted);margin-top:2px}

  .parts{list-style:none;margin:6px 0 14px;padding:0}
  .parts li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
  .parts li:last-child{border-bottom:none}
  .parts .pn{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;margin-top:2px}
  .parts .pb{flex:1}
  .parts .pt{font-weight:700}
  .parts .pd{color:var(--ink-2);font-size:14.5px;display:block}
  .status{flex:none;font-size:12px;font-weight:700;border-radius:4px;padding:3px 8px;margin-top:4px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
  .status.gap{background:var(--gold-soft);color:var(--gold)}

  table.plan{width:100%;border-collapse:collapse;margin:6px 0 16px;font-size:14.5px}
  table.plan th,table.plan td{text-align:left;vertical-align:top;padding:10px;border-bottom:1px solid var(--line)}
  table.plan th{font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
  table.plan td.price{font-weight:700;white-space:nowrap}
  @media (max-width:560px){
    table.plan thead{display:none}
    table.plan tr{display:block;padding:10px 0;border-bottom:1px solid var(--line)}
    table.plan td{display:block;border-bottom:none;padding:2px 0}
    table.plan td.price{font-size:16px}
    table.plan td::before{content:attr(data-l);font-size:12px;color:var(--muted);font-weight:700;display:block}
    table.plan td.price::before{display:none}
  }

  .lanes{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:14px}
  @media (min-width:640px){.lanes{grid-template-columns:1fr 1fr}}
  .lane{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 10px}
  .lane h3{margin-top:0}
  .lane.art{border-top:4px solid var(--accent)}
  .lane.other{border-top:4px solid var(--gold)}

  .pending-list{list-style:none;margin:6px 0 14px;padding:0}
  .pending-list li{background:var(--surface);border:1.5px dashed var(--gold);border-radius:var(--radius);padding:14px 16px 8px;margin-bottom:10px}
  .pending-list .pt{font-weight:700;display:block}
  .pending-list .pd{color:var(--ink-2);font-size:14.5px;display:block}

  .rules{list-style:none;margin:6px 0 14px;padding:0;counter-reset:rule}
  .rules li{counter-increment:rule;position:relative;padding:8px 0 8px 40px;border-bottom:1px solid var(--line)}
  .rules li:last-child{border-bottom:none}
  .rules li::before{content:counter(rule);position:absolute;left:2px;top:9px;font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:17px;color:var(--accent)}
  .note{background:var(--surface-2);border-radius:var(--radius);padding:14px 16px 6px;margin-bottom:14px;font-size:14.5px}

  .assets{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 18px}
  @media (min-width:640px){.assets{grid-template-columns:repeat(3,1fr)}}
  .asset{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px 8px}
  .asset .an{font-weight:700;font-size:15px;display:block}
  .asset .ad{font-size:13px;color:var(--ink-2);display:block}
  .idea{background:var(--surface);border:1.5px dashed var(--gold);border-radius:var(--radius);padding:16px 18px 10px;margin-bottom:12px;scroll-margin-top:84px}
  .idea h3{margin:0 0 6px;font-size:17px}
  .idea p{font-size:14.5px;color:var(--ink-2)}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
  .tags .tl{font-size:12px;font-weight:700;color:var(--muted);width:100%}
  .tag{font-size:12.5px;background:var(--gold-soft);color:var(--gold);border-radius:999px;padding:3px 10px;font-weight:700}
  .idea .links{font-size:13.5px;color:var(--ink-2);margin-bottom:8px}
  .idea .links a{color:var(--accent);text-decoration:underline;text-underline-offset:3px;padding:4px 2px;display:inline-block}
  .sources{font-size:12.5px;color:var(--muted);margin-top:30px;line-height:1.7}
  .flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-weight:700;font-size:15px;margin-bottom:12px}
  .flow span{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px}
  .flow i{color:var(--accent);font-style:normal}
  .verline{font-size:12px;color:var(--muted);margin-top:14px}
  .verline button{background:none;border:0;color:var(--muted);font:inherit;font-size:12px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px 2px;min-height:0}
  [hidden]{display:none !important}
</style>
</head>

<div id="veil"></div>

<div class="wrap">
  <div id="view-home">
    <div id="syncbar" role="button" tabindex="0" aria-label="同期状態"></div>
    <div class="home-head">
      <p class="theme" id="homeTheme"></p>

        <button type="button" role="tab" data-size="size-small" aria-selected="false">小</button>
      </div>
    </div>

    <div class="grid size-medium" id="cardGrid"></div>

    <p class="sources" id="homeSources"></p>
    <p class="verline">アートビジネス＆ビジネス計画 v<span id="verText"></span><span id="discWrap" hidden> ・ <button type="button" id="discBtn">Drive接続を解除</button></span></p>
  </div>
</div>

<div id="view-detail" hidden>
  <button type="button" class="back-pill" id="backBtn">← 一覧に戻る</button>
  <div class="wrap detail-wrap">
    <article class="detail" id="detailBody"></article>
  </div>
</div>

   "html": "<div class=\"detail-head\"><h2>時期と順番<\/h2><span class=\"badge decided\">決定済み<\/span><\/div>\n        <p class=\"sec-lead\">受験を軸に、やる順番は固定されている。並行開発はしない。<\/p>\n        <ol class=\"steps\">\n          <li data-n=\"1\"><span class=\"st\">今 〜 共通テスト（2027年1月16・17日）<\/span><span class=\"sd\">候補A（単語原木）を自分用に育てる。並行するのは候補Cの題材決定（段0）まで。<\/span><\/li>\n          <li data-n=\"2\"><span class=\"st\">共通テスト後 〜 2月<\/span><span class=\"sd\">候補C×B（現場の不便解消 × シェアされる出力）の最小版を公開し、集客テスト30日。<\/span><\/li>\n          <li data-n=\"3\"><span class=\"st\">受験後<\/span><span class=\"sd\">候補Aの一般公開版を調整・公開。図鑑事業の受託を本格始動させる。<\/span><\/li>\n        <\/ol>\n        <h3>アプリ収入の階段<\/h3>\n        <ul class=\"ladder\">\n          <li><span class=\"amt\">月1万円<\/span><span class=\"bar\" style=\"width:14%\"><\/span><span class=\"what\">最初の「バイト以外の金が入る」状態<\/span><\/li>\n          <li><span class=\"amt\">月5〜10万円<\/span><span class=\"bar\" style=\"width:34%\"><\/span><span class=\"what\">小さな仕組みが回り始める帯<\/span><\/li>\n          <li><span class=\"amt\">月30万円前後<\/span><span class=\"bar\" style=\"width:58%\"><\/span><span class=\"what\">年360万円ペース。同年代の平均年収に並ぶ水準<\/span><\/li>\n          <li><span class=\"amt\">年600万円<\/span><span class=\"bar\" style=\"width:84%\"><\/span><span class=\"what\">第1チェックポイント（全体設計に接続）<\/span><\/li>\n        <\/ul>",
   "updated_at": "2026-11-19T13:32:00+09:00"
  },
  {
   "id": "business",

   "char": "業",
   "tag": "候補A〜C",

   "title": "ビジネス計画",
   "meta": "アプリ候補A・B・C、検証の段0〜段4、市場の現実の数字、テスト枠2件（make.fun／物語のある物）",
   "badgeClass": "decided",
   "badgeText": "骨格は決定済み",
   "html": "<div class=\"detail-head\"><h2>ビジネス計画<\/h2><span class=\"badge decided\">骨格は決定済み<\/span><\/div>\n        <p class=\"sec-lead\">柱はアプリ。市場の現実を踏まえ、「小さく複数出し、届いたものだけ伸ばす」が勝ち方として決まっている。<\/p>\n        <div class=\"stats\">\n          <div class=\"stat\"><div class=\"v\">約83<small>%<\/small><\/div><div class=\"k\">新作アプリが2年経っても月$1,000に届かない割合<\/div><\/div>\n          <div class=\"stat\"><div class=\"v\">月$72<\/div><div class=\"k\">公開1年後の月収の中央値<\/div><\/div>\n          <div class=\"stat\"><div class=\"v\">58<small>日<\/small><\/div><div class=\"k\">月$1,000到達までの中央値。届くものは早く届く<\/div><\/div>\n          <div class=\"stat\"><div class=\"v\">5〜9<small>倍<\/small><\/div><div class=\"k\">「痛み止め」が「ビタミン」より転換する倍率<\/div><\/div>\n        <\/div>\n        <h3>候補は3つともやる。順番だけ固定<\/h3>\n        <div class=\"card\">\n          <h3>A. 単語原木（一般公開版） <span class=\"badge now\">自分用に走行中<\/span><\/h3>\n          <p>英語の単語暗記が続かない痛みへの道具。育成×図鑑の形で、「変身の実感」と「卒業した単語の図鑑」というシェアできる成果物を持つ。既にv1が走っているのが強み。弱みは学習アプリ市場の激戦。<\/p>\n        <\/div>\n        <div class=\"card\">\n          <h3>B. シェアされる結果画面型の小ツール<\/h3>\n          <p>手持ちの記録や写真から「分析／図鑑／年表」のような結果画像を出す道具。結果がそのまま投稿物になる形が集客装置になる（IsTalkの型）。強みは日本事例で最も再現性が高いこと。弱みは題材の当たり外れが全てで、「誰の何の結果が見たいか」の選定が勝負になる。<\/p>\n        <\/div>\n        <div class=\"card\">\n          <h3>C. 現場の不便解消型（作品台帳が有力）<\/h3>\n          <p>自分の制作・受験生活の現場の道具。調査で「スマホ完結・日本語・私的な作品台帳」は日本語圏に不在の<strong>無人地帯<\/strong>と確認済み。海外製品は高額・英語・PC寄りで、国内は公開ポートフォリオと物理保管に二極化している。<\/p>\n          <ul>\n            <li><strong>価格の隙間<\/strong>：買い切り〜月300〜980円、点数課金・広告なし<\/li>\n            <li><strong>集客になる出力<\/strong>：展示・完成ごとの「作品1点カード（縦型）」、第二弾に年間「制作Wrapped」<\/li>\n            <li><strong>弱み<\/strong>：層が狭く天井は低い。最初の月1万円ライン向き<\/li>\n          <\/ul>\n        <\/div>\n        <h3>検証の階段（段0〜段4）<\/h3>\n        <ol class=\"steps\">\n          <li data-n=\"0\"><span class=\"st\">題材を1つ決める<\/span><span class=\"done-when\">「誰が・いつ・何に困って・今どう凌いでいるか」を一文で言えること<\/span><\/li>\n          <li data-n=\"1\"><span class=\"st\">最小版を公開する<\/span><span class=\"done-when\">実際に他人が触れるURLがあること（決済はまだ付けない）<\/span><\/li>\n          <li data-n=\"2\"><span class=\"st\">集客テスト30日<\/span><span class=\"done-when\">結果画面のシェアか短尺動画経由で、身内以外の利用者が10人。ゼロなら題材を変える<\/span><\/li>\n          <li data-n=\"3\"><span class=\"st\">課金の仮設置<\/span><span class=\"done-when\">最初の1件の支払い（広告削除か年額サブスクの小さい壁で試す）<\/span><\/li>\n          <li data-n=\"4\"><span class=\"st\">判定<\/span><span class=\"done-when\">続ける／題材を変える／量産ラインに移す、を数字で決める<\/span><\/li>\n        <\/ol>\n        <h3>課金と集客の決まり<\/h3>\n        <ul>\n          <li><strong>課金の本命<\/strong>はサブスク（年額主役）＋買い切りの受け皿。広告は単価が低く、柱にしない<\/li>\n          <li><strong>再生数 ≠ ダウンロード<\/strong>。差を分けるのは、シェアされる結果画面／プロフィールからの導線／チャネルと対象の一致<\/li>\n          <li>Xでは告知より「質問投稿」が効く。最初の利用者は手で集め、要望には速く応える<\/li>\n          <li>フォロワーは借り物。<strong>所有できる連絡先（リスト）<\/strong>を別に持つ<\/li>\n        <\/ul>\n        <h3>収益化の実務メモ<\/h3>\n        <ul>\n          <li>Stripeは個人でも使えるが、決済・税務は実名が前提。特商法の「請求があれば開示」は完全な匿名化ではない<\/li>\n          <li>1,000円あたりの手取り：STORES 945円／BOOTH 899円／note 855円<\/li>\n          <li>青色申告の承認申請は「開業後2か月以内」を逃さない<\/li>\n        <\/ul>\n        <div class=\"card\">\n          <h3>AIバウンティ（make.fun） <span class=\"badge pending\">テスト枠・検討中<\/span><\/h3>\n          <p>集客が要らず、AIの労働力そのものが商品になる経路。ただし性質は「仕組み」ではなく「懸賞」で、本命ルートにはならない。位置づけはテスト枠：目的は種銭の獲得と、AIに仕事を取らせて報酬を得る実地ノウハウ。<\/p>\n          <ul>\n            <li><strong>規律<\/strong>：並行は最大3件まで。期間と撤退線を先に決める。外れたら記録して次へ<\/li>\n            <li><strong>選ぶ基準<\/strong>：賞金÷参加者数がましで、締切に余裕があるもの。審査が「質」の案件を優先する<\/li>\n            <li><strong>注意<\/strong>：受け取りはUSDC／Solanaウォレット側で、換金と税務の手間が後で来る<\/li>\n          <\/ul>\n        <\/div>\n        <div class=\"card\">\n          <h3>物語のある物（物販テスト） <span class=\"badge pending\">テスト枠・2026-11-19 合意<\/span><\/h3>\n          <p>売るのは呪物ではない。<strong>「物語と力」<\/strong>——見惚れるような質の高い物に、質の高い物語を付けて売る。make.funと同格のテスト枠として、期間と撤退ラインを先に決めて小さく試す。<\/p>\n          <p><strong>担い手は石に限らない。<\/strong>売るのは物語そのものであり、表面的な物が石である必要はない。担い手は石・ガラス・金属・木などの小物でもよい。見惚れてしまうようなキラキラした石はその一例にすぎない。<\/p>\n          <ul>\n            <li><strong>狙う層<\/strong>：スピ層<\/li>\n            <li><strong>売り場<\/strong>：メルカリ。購入者の能動性が必要な場に置く<\/li>\n            <li><strong>物の土台<\/strong>：素人が適当に拾った石ころや小物に情報を付ける形とは分ける。物自体の質が土台で、マテリアルへの感覚そのものが商品力になる<\/li>\n          <\/ul>\n          <p><strong>合意したルール（3つ）<\/strong>——担い手が石でもガラスでも金属でも木でも、何であれそのまま適用される。<\/p>\n          <ul>\n            <li><strong>効能を断定しない<\/strong>——説明文で断定すると嘘になる。「〜と言われてきた」「〜と云われる」という言い回しが大切で、それこそが物語である<\/li>\n            <li><strong>無理な売りつけはしない<\/strong>——欲しい人が能動的に買う構造に置く。無理やりは悪質<\/li>\n            <li><strong>物の質は本物にする<\/strong>——物語を剥がしても、物そのものに持つ価値があること<\/li>\n          <\/ul>\n          <p><strong>位置づけ——アートビジネスの練習。<\/strong>値付け、物語の付け方、固定価格、記録の練習であり、「意味のないものに付加価値を与える」という、本命の作品販売（作品の値付けと言説化）と同じ力学で動く。<\/p>\n          <p>効果の受け止め方についての考え：実際に作用するかどうかは、買う人がどれほど強く信じているかによる。強く信じれば精神的に作用し、思い込みは現実に影響する。だから無意味ではない、という立場を取る。<\/p>\n        <\/div>",
   "updated_at": "2026-11-19T13:32:00+09:00"
  },

   "id": "art",
   "num": "03",
   "char": "画",
   "tag": "管の6部品",
   "themeClass": "t-art",
   "title": "アートビジネス計画",
   "meta": "設計原則、ビジネスの管、価格の階段、フェーズ0〜3、現実の数字",
   "badgeClass": "decided",
   "badgeText": "設計済み",
   "html": "<div class=\"detail-head\"><h2>アートビジネス計画<\/h2><span class=\"badge decided\">設計済み<\/span><\/div>\n        <p class=\"sec-lead\">天才の偶然売れではなく、計画的にいく。ただし計画は表に見せない——表に出るのは作品と物語だけ。<\/p>\n        <h3>設計原則（4つ）<\/h3>\n        <ol class=\"rules\">\n          <li><strong>計画は裏、表は作品と物語だけ<\/strong>——計算・検証・価格の設計は裏側に置く。名前を守る構造でもある<\/li>\n          <li><strong>関係は柔らかく、条件は硬く<\/strong>——値段・エディション数・権利の条件は先に固定し、その場の交渉に性格を持ち込まない<\/li>\n          <li><strong>視覚言語の同一性<\/strong>——集客の動画も、売る物も、本命の絵画も、同じモチーフ・同じ世界で通す<\/li>\n          <li><strong>reveal-ready<\/strong>——原画・日付・制作記録を残し、将来本名に接続できる来歴を最初から作る<\/li>\n        <\/ol>\n        <h3>ビジネスの管（6つの部品）<\/h3>\n        <div class=\"flow\"><span>制作<\/span><i>→<\/i><span>提示<\/span><i>→<\/i><span>取引<\/span><i>→<\/i><span>記録・認証<\/span><i>→<\/i><span>評価<\/span><i>→<\/i><span>次の制作<\/span><\/div>\n        <p>「作品を作って売る」だけでは金にならない。管のどれが欠けても止まる。いまの不足は <strong>3・4・5<\/strong> で、ここがビジネスの実体部分。<\/p>\n        <ul class=\"parts\">\n          <li><span class=\"pn\">1<\/span><div class=\"pb\"><span class=\"pt\">作品（質）<\/span><span class=\"pd\">個人でしか生み出せない質の高いもの。全ての前提<\/span><\/div><span class=\"status\">制作中<\/span><\/li>\n          <li><span class=\"pn\">2<\/span><div class=\"pb\"><span class=\"pt\">物語<\/span><span class=\"pd\">作家と世界の物語。買い手は絵と一緒に物語を買う<\/span><\/div><span class=\"status\">設計中（顔のない男）<\/span><\/li>\n          <li><span class=\"pn\">3<\/span><div class=\"pb\"><span class=\"pt\">価格の階段<\/span><span class=\"pd\">「買える層」の設計。高額一点だけでは取引が発生しない<\/span><\/div><span class=\"status gap\">未設計<\/span><\/li>\n          <li><span class=\"pn\">4<\/span><div class=\"pb\"><span class=\"pt\">最初の買い手<\/span><span class=\"pd\">「市場」ではなく具体的な少数。SNSの蓄積＋身近な評価者<\/span><\/div><span class=\"status gap\">未着手<\/span><\/li>\n          <li><span class=\"pn\">5<\/span><div class=\"pb\"><span class=\"pt\">記録・認証<\/span><span class=\"pd\">エディション番号、制作年、原画データ、販売記録。来歴が将来の価格の土台になる<\/span><\/div><span class=\"status gap\">仕組み化が課題<\/span><\/li>\n          <li><span class=\"pn\">6<\/span><div class=\"pb\"><span class=\"pt\">見せる場と頻度<\/span><span class=\"pd\">作品が人の目に触れる回数と場所。質×露出でしか評価は生まれない<\/span><\/div><span class=\"status\">TikTok設計中<\/span><\/li>\n        <\/ul>\n        <h3>価格の階段<\/h3>\n        <p>一点ものの高額作品だけを置くと、欲しい人の99%が買えずに去る。階段を作ると、各段が次の段の買い手を育てる。<strong>原則：値段は下げない。<\/strong>下の段を増やして買える人を増やすのであって、同じ物の値段を割って売らない。<\/p>\n        <table class=\"plan\">\n          <thead><tr><th>段<\/th><th>価格帯<\/th><th>形<\/th><th>役割<\/th><\/tr><\/thead>\n          <tbody>\n            <tr><td data-l=\"段\">0<\/td><td class=\"price\" data-l=\"価格帯\">無料<\/td><td data-l=\"形\">動画・投稿（世界観の提示）<\/td><td data-l=\"役割\">集客と物語の蓄積<\/td><\/tr>\n            <tr><td data-l=\"段\">1<\/td><td class=\"price\" data-l=\"価格帯\">数百〜数千円<\/td><td data-l=\"形\">デジタル素材、描き文字、小プリント<\/td><td data-l=\"役割\">最初の取引。買う体験を作る<\/td><\/tr>\n            <tr><td data-l=\"段\">2<\/td><td class=\"price\" data-l=\"価格帯\">1万〜5万円<\/td><td data-l=\"形\">エディション作品（番号・記録つき）<\/td><td data-l=\"役割\">本命の入口。来歴が始まる<\/td><\/tr>\n            <tr><td data-l=\"段\">3<\/td><td class=\"price\" data-l=\"価格帯\">10万円〜<\/td><td data-l=\"形\">原画、大判エディション<\/td><td data-l=\"役割\">評価と価格の頂点。供給は絞る<\/td><\/tr>\n            <tr><td data-l=\"段\">4<\/td><td class=\"price\" data-l=\"価格帯\">契約<\/td><td data-l=\"形\">ライセンス（グッズ・コラボ）<\/td><td data-l=\"役割\">自分の手を離れて回る層。権利は渡さず貸す<\/td><\/tr>\n          <\/tbody>\n        <\/table>\n        <h3>フェーズ<\/h3>\n        <ol class=\"steps\">\n          <li data-n=\"0\"><span class=\"st\">土台（今ここ）<\/span><span class=\"sd\">制作ラインを維持する（受験制作がそのまま作品蓄積になる）。世界観と視覚言語を1つに絞る。記録の型を決める：作品ごとに原画ファイル／制作日／タイトル／技法を残す。<\/span><\/li>\n          <li data-n=\"1\"><span class=\"st\">提示と最初の取引<\/span><span class=\"sd\">投稿001（v3）を出し、30本検証で「提示の型」を1つ当てる。並行して既存ドローイングからエディション1点をBOOTHに受注生産で出す。<\/span><span class=\"done-when\">最初の1件の取引（金額は問わない）と、提示の型の当たり1つ<\/span><\/li>\n          <li data-n=\"2\"><span class=\"st\">階段を組む<\/span><span class=\"sd\">当たった型を連載化し、フォロワーの蓄積を始める。エディションの点数を増やし段2を常設にする。売上の実績に応じてバイトを段階的に減らす。<\/span><span class=\"done-when\">月10万円の売上ラインが見えること<\/span><\/li>\n          <li data-n=\"3\"><span class=\"st\">権利の層<\/span><span class=\"sd\">ライセンス・コラボの打診を受ける側に立つ（自分から売り込まない。条件はこちらが決める）。原画の価格帯を上げる。供給は絞ったまま。<\/span><span class=\"done-when\">年600万円ペース（第1チェックポイント）<\/span><\/li>\n        <\/ol>\n        <h3>現実の数字<\/h3>\n        <div class=\"stats\">\n          <div class=\"stat\"><div class=\"v\">4,000〜5,000<small>円/号<\/small><\/div><div class=\"k\">号単価（学生・無名）。実績が積めれば8,000〜15,000円/号<\/div><\/div>\n          <div class=\"stat\"><div class=\"v\">50 : 50<\/div><div class=\"k\">画廊委託の標準的な取り分<\/div><\/div>\n          <div class=\"stat\"><div class=\"v\">約239<small>万円<\/small><\/div><div class=\"k\">美術家の平均年収。半数が200万円未満<\/div><\/div>\n          <div class=\"stat\"><div class=\"v\">上限360<small>万円<\/small><\/div><div class=\"k\">ポーラの在外研修助成。募集は毎年10〜11月<\/div><\/div>\n        <\/div>\n        <p>数字が示す標準形は「安定した枠 ＋ 作品販売 ＋ 公募・助成」の複合。作品販売一本では立たない。<\/p>\n        <h3>画家の集客の実態<\/h3>\n        <ul>\n          <li>決定的なのはフォロワー数ではなく、<strong>一貫した作風の継続投稿<\/strong>と、著名な作家・コレクターの購入と推薦による<strong>信用の橋渡し<\/strong><\/li>\n          <li>SNSは発見と身辺調査の道具。価格は非公開・問い合わせ制が原則で、直販は入口に限定する<\/li>\n          <li>失敗側の教訓：投機バブルは崩壊した（若手市場は2021年比で約3分の1に縮小）<\/li>\n        <\/ul>\n        <h3>時間の設計<\/h3>\n        <ul>\n          <li><strong>制作と集客を分けない<\/strong>。制作過程そのものが集客素材になる<\/li>\n          <li>販売は受注生産＋プラットフォームに寄せ、在庫・発送・交渉の時間を消す<\/li>\n          <li>運営時間に上限を置く。順番は制作 → 運営。制作時間が残り物にならないようにする<\/li>\n          <li>Phase 2で売上が立つまで、事業に生活費を背負わせない（焦りが作風と価格を壊すため）<\/li>\n        <\/ul>",
   "updated_at": "2026-11-19T13:32:00+09:00"
  },
  {

   "title": "図鑑事業",
   "meta": "美術＝受託／他ジャンル＝横展開。キット販売はしない。特許の結論",
   "badgeClass": "decided",
   "badgeText": "2026-11-19 決定",
   "html": "<div class=\"detail-head\"><h2>図鑑事業<\/h2><span class=\"badge decided\">2026-11-19 決定<\/span><\/div>\n        <p class=\"sec-lead\">図鑑アプリの仕組み（エンジン）は分野を選ばない。金の変え方は、分野によって2つに分けることが決まった。<\/p>\n        <div class=\"lanes\">\n          <div class=\"lane art\">\n            <h3>美術分野 ＝ 受託<\/h3>\n            <p>画廊・画家・美術団体などの「自分たちの図鑑が欲しいけど作れない」側から、構築を受ける。狙いは<strong>金＋美術界との縁＋実績<\/strong>の3つ同時。<\/p>\n            <ul>\n              <li><strong>客の像<\/strong>：自分の全作品のアーカイブが欲しい画家本人／小さい画廊・美術団体／ファンコミュニティ／専門店／小さい博物館・資料館／コレクター<\/li>\n              <li><strong>売る物の3段<\/strong>：構築一式（データ整形込み）／点数単位のデータ化／月額の運用代行<\/li>\n              <li><strong>条件<\/strong>：渡すのは完成したアプリだけ。エンジンの権利は翔万に残す。データの権利は発注側に置く<\/li>\n              <li><strong>始動<\/strong>：納期のある他人の仕事なので、本格始動は受験後<\/li>\n            <\/ul>\n          <\/div>\n          <div class=\"lane other\">\n            <h3>他ジャンル ＝ 横展開<\/h3>\n            <p>ジャンルごとの図鑑を自前アプリとして売り出し、アプリ収入の階段に乗せる。名前のリスクがない分野で、匿名のまま展開できる。<\/p>\n            <ul>\n              <li><strong>実装済みの証明<\/strong>：音楽／映画／食材<\/li>\n              <li><strong>効く分野の条件<\/strong>：「人と作品と記録」の蓄積型で、ファンが深く調べたくて、既存の情報が散らかっている場所<\/li>\n              <li><strong>候補<\/strong>：スポーツ記録（野球選手・力士）／声優・アイドル／漫画／名車／時計／スニーカー<\/li>\n            <\/ul>\n          <\/div>\n        <\/div>\n        <h3>決まっている線引き<\/h3>\n        <ul>\n          <li><strong>エンジンのキット販売はしない<\/strong>。仕組みを公開することになるため。売るのは完成品であって、作り方ではない<\/li>\n          <li><strong>アプリは動く時にAIを呼ばない<\/strong>。AIが働くのは作る時とデータを揃える時だけ。だから他人が使っても自分のAIアカウントは減らず、運営費もゼロのまま渡せる<\/li>\n          <li><strong>唯一無二性の堀は3つ<\/strong>：データの深さと正確さ／本人の目による選定／元々の文章（ガイド・調査）。コードは真似できても、この3つは年月がかかる<\/li>\n        <\/ul>\n        <div class=\"note\">\n          <h3 style=\"margin-top:0\">特許についての結論<\/h3>\n          <p>今のアプリ群の大半は特許化が難しい。理由は3つ——進歩性の壁（既存技術の組み合わせと判断されやすい）、既に公開済み（救済は本人の公開から1年以内）、ソフトウェア単体では対象になりにくい。日記アプリのTodo（金額と写真の自動回収）も、ほしい物リスト等の先行例が大きく単体では厳しい見立て。<\/p>\n          <p>図鑑の独自性は仕組みの新しさではなく、データの量・編集・選定の蓄積にある。守りは著作権と「真似に同じ年月がかかる」という事実の側。特許の正しい出番は、自分の商品・仕組みを外に出す時に、<strong>公開する前に<\/strong>中核だけ検討すること。<\/p>\n        <\/div>",
   "updated_at": "2026-11-19T13:32:00+09:00"
  },

   "title": "アイデアの網",
   "meta": "資産10件を起点に、派生するアイデア9件をつながりごと並べた場所",
   "badgeClass": "pending",
   "badgeText": "未決定の候補",
   "html": "<div class=\"detail-head\"><h2>アイデアの網<\/h2><span class=\"badge pending\">未決定の候補<\/span><\/div>\n        <p class=\"sec-lead\">ここは計画ではない。いま手元にある資産から派生する案を、つながりごと並べて置く場所。案はどれも未決定で、決まったものだけが計画の側へ移る。<\/p>\n        <h3>起点——既にある資産<\/h3>\n        <div class=\"assets\">\n          <div class=\"asset\"><span class=\"an\">図鑑エンジン<\/span><span class=\"ad\">カード表示・年表・関係図・価格記録・Drive同期・データ収集と整形の型<\/span><\/div>\n          <div class=\"asset\"><span class=\"an\">蓄積データ<\/span><span class=\"ad\">作家・作品・展示・本・価格の記録と、制作ガイドや調査の文章<\/span><\/div>\n          <div class=\"asset\"><span class=\"an\">選定の目<\/span><span class=\"ad\">本人の目で選んだという編集。代表作の棚や関係の記録は他の誰の図鑑にもならない<\/span><\/div>\n          <div class=\"asset\"><span class=\"an\">集客ノウハウ<\/span><span class=\"ad\">調査7本分の実測知。結果画面の型、質問投稿、信用の橋渡し<\/span><\/div>\n          <div class=\"asset\"><span class=\"an\">アプリ群<\/span><span class=\"ad\">図鑑・日記・音楽・映画・食材など、実際に動いている自作アプリ<\/span><\/div>\n          <div class=\"asset\"><span class=\"an\">受託の形<\/span><span class=\"ad\">完成品だけを渡し、エンジンの権利は手元に残す渡し方<\/span><\/div>\n          <div class=\"asset\"><span class=\"an\">横展開<\/span><span class=\"ad\">同じ型を別ジャンルへ広げる進み方。音楽・映画・食材で実証済み<\/span><\/div>\n          <div class=\"asset\"><span class=\"an\">特許の検討<\/span><span class=\"ad\">「公開する前に中核だけ検討する」という判断軸<\/span><\/div>\n          <div class=\"asset\"><span class=\"an\">特殊素材への興味<\/span><span class=\"ad\">画材・支持体・材料への関心と知識。制作と地続きの発明の種<\/span><\/div>\n          <div class=\"asset\"><span class=\"an\">アートビジネスの階段<\/span><span class=\"ad\">価格の階段と、記録・認証の仕組み。作品を売る側の設計図<\/span><\/div>\n        <\/div>\n        <h3>派生するアイデア<\/h3>\n        <div class=\"idea\" id=\"idea-daicho\">\n          <h3>画家のための作品台帳アプリ<\/h3>\n          <div class=\"tags\"><span class=\"tl\">起点<\/span><span class=\"tag\">図鑑エンジン<\/span><span class=\"tag\">蓄積データの型<\/span><span class=\"tag\">アートビジネスの階段（記録・認証）<\/span><\/div>\n          <p>候補Cの具体形。自分の作品の記録・認証の仕組みを、そのまま同業者向けの道具にする。無人地帯（スマホ完結・日本語・私的な台帳）に置く。<\/p>\n          <p class=\"links\">つながる先：<a href=\"#idea-jutaku\" data-scroll=\"idea-jutaku\">受託パッケージ<\/a>の実演・見本になる／<a href=\"#idea-yoko\" data-scroll=\"idea-yoko\">横展開ライン<\/a>と同じ型で作れる<\/p>\n        <\/div>\n        <div class=\"idea\" id=\"idea-jutaku\">\n          <h3>画廊・画家向け「図鑑構築」受託パッケージ<\/h3>\n          <div class=\"tags\"><span class=\"tl\">起点<\/span><span class=\"tag\">図鑑エンジン<\/span><span class=\"tag\">受託の形<\/span><span class=\"tag\">選定の目<\/span><\/div>\n          <p>構築一式＋データ化＋運用代行の3段を、値段と納期の目安つきで一枚にまとめた受け皿。美術界との縁と実績が、金と同時に手に入る形。<\/p>\n          <p class=\"links\">つながる先：受託で生まれた縁が、アートビジネスの<a href=\"#/art\" data-open-link=\"art\">「最初の買い手」「信用の橋渡し」<\/a>に効く／<a href=\"#idea-curation\" data-scroll=\"idea-curation\">キュレーション受託<\/a>へ広がる<\/p>\n        <\/div>\n        <div class=\"idea\" id=\"idea-yoko\">\n          <h3>ジャンル別図鑑の量産ライン<\/h3>\n          <div class=\"tags\"><span class=\"tl\">起点<\/span><span class=\"tag\">図鑑エンジン<\/span><span class=\"tag\">横展開<\/span><span class=\"tag\">集客ノウハウ<\/span><\/div>\n          <p>スポーツ記録・声優やアイドル・名車・時計・スニーカーなど、「人と作品と記録」の蓄積型で情報が散らかっている分野へ、同じ型で次々に出す。分野ごとに集客は必要だが、作るコストは型で下がる。<\/p>\n          <p class=\"links\">つながる先：出た図鑑が増えるほど<a href=\"#idea-report\" data-scroll=\"idea-report\">集計レポート<\/a>の対象が広がる／当たった分野が<a href=\"#idea-daicho\" data-scroll=\"idea-daicho\">台帳<\/a>と同じ検証の階段に乗る<\/p>\n        <\/div>\n        <div class=\"idea\" id=\"idea-report\">\n          <h3>図鑑データの集計レポート<\/h3>\n          <div class=\"tags\"><span class=\"tl\">起点<\/span><span class=\"tag\">蓄積データ<\/span><span class=\"tag\">選定の目<\/span><\/div>\n          <p>権利がきれいな範囲の集計（展覧会や価格の動向）を、画廊やメディア向けに出す。ハードルは高いが、蓄積がそのまま商品になる形。<\/p>\n          <p class=\"links\">つながる先：<a href=\"#idea-jutaku\" data-scroll=\"idea-jutaku\">受託<\/a>の客との接点になる／<a href=\"#idea-contents\" data-scroll=\"idea-contents\">受験生向けコンテンツ<\/a>と同じ「中身の切り売り」の系統<\/p>\n        <\/div>\n        <div class=\"idea\" id=\"idea-contents\">\n          <h3>ガイド・調査の受験生向けコンテンツ<\/h3>\n          <div class=\"tags\"><span class=\"tl\">起点<\/span><span class=\"tag\">蓄積データ（文章）<\/span><span class=\"tag\">集客ノウハウ<\/span><\/div>\n          <p>制作ガイドや美大カリキュラムの調査など、元々の文章の部分を、受験生向けに切り出して売る。図鑑の中身（作品画像や価格データ）とは別系統で、権利の問題が軽い。<\/p>\n          <p class=\"links\">つながる先：発信が<a href=\"#idea-bokan\" data-scroll=\"idea-bokan\">送客の母艦<\/a>の一部になる<\/p>\n        <\/div>\n        <div class=\"idea\" id=\"idea-bokan\">\n          <h3>図鑑の発信を母艦にした作品販売<\/h3>\n          <div class=\"tags\"><span class=\"tl\">起点<\/span><span class=\"tag\">アプリ群<\/span><span class=\"tag\">集客ノウハウ<\/span><span class=\"tag\">アートビジネスの階段<\/span><\/div>\n          <p>図鑑まわりの発信が注目を集め、最終的に自分の作品の買い手につながる道。金そのものより、注目と縁の資産として効く。<\/p>\n          <p class=\"links\">つながる先：アートビジネスの<a href=\"#/art\" data-open-link=\"art\">価格の階段<\/a>の段0（無料の提示）と地続き<\/p>\n        <\/div>\n        <div class=\"idea\" id=\"idea-sozai\">\n          <h3>画材・支持体の実験から、小さな発明・商品へ<\/h3>\n          <div class=\"tags\"><span class=\"tl\">起点<\/span><span class=\"tag\">特殊素材への興味<\/span><span class=\"tag\">特許の検討<\/span><\/div>\n          <p>支持体の構造や材料の組み合わせは、特許の対象になりうる数少ない領域。制作の実験記録が、そのまま発明の種になる。出すなら公開する前に権利の検討を挟む。<\/p>\n          <p class=\"links\">つながる先：商品化できればアートビジネスの<a href=\"#/art\" data-open-link=\"art\">価格の階段<\/a>の段1（素材・小物）に乗る<\/p>\n        <\/div>\n        <div class=\"idea\" id=\"idea-todo\">\n          <h3>Todoアプリの外部公開<\/h3>\n          <div class=\"tags\"><span class=\"tl\">起点<\/span><span class=\"tag\">アプリ群<\/span><span class=\"tag\">特許の検討<\/span><span class=\"tag\">集客ノウハウ<\/span><\/div>\n          <p>日記アプリのTodo（金額と写真の回収つき）を、友達向けから外へ出す候補。公開する前に、中核の仕組みだけ特許を検討するかどうかが論点になる。<\/p>\n          <p class=\"links\">つながる先：アプリ候補の<a href=\"#/business\" data-open-link=\"business\">検証の階段（段0〜段4）<\/a>に乗せて判定する<\/p>\n        <\/div>\n        <div class=\"idea\" id=\"idea-curation\">\n          <h3>他人のコレクションのキュレーション受託<\/h3>\n          <div class=\"tags\"><span class=\"tl\">起点<\/span><span class=\"tag\">選定の目<\/span><span class=\"tag\">受託の形<\/span><span class=\"tag\">図鑑エンジン<\/span><\/div>\n          <p>コレクターや店のコレクションを、テーマ別の「棚」として選び直し、図鑑の形に組む仕事。選定の目そのものが商品になる形。<\/p>\n          <p class=\"links\">つながる先：<a href=\"#idea-jutaku\" data-scroll=\"idea-jutaku\">受託パッケージ<\/a>の上位メニューになる<\/p>\n        <\/div>\n        <p class=\"sec-lead\" style=\"margin-top:16px\">読み方：つながりの多い案ほど、既にある資産を無駄にしない。逆に、起点が1つしかない案は、それ単体の魅力で判断する。<\/p>",
   "updated_at": "2026-11-19T13:32:00+09:00"

   "meta": "Cの段0、営業と集客、受託の受け皿など、まだ決まっていない項目の一覧",

   "badgeText": "まだ決まっていない",
   "html": "<div class=\"detail-head\"><h2>未決・保留<\/h2><span class=\"badge pending\">まだ決まっていない<\/span><\/div>\n        <p class=\"sec-lead\">ここにあるものは計画として確定していない。決まった計画のふりをして埋めていない項目の一覧。<\/p>\n        <ul class=\"pending-list\">\n          <li><span class=\"pt\">Cの段0——題材の一文が未確定<\/span><span class=\"pd\">「誰が・いつ・何に困って・今どう凌いでいるか」の一文。題材候補は作品台帳／制作ログ／画材在庫／シフトと収入の見える化。次の一歩はここ。<\/span><\/li>\n          <li><span class=\"pt\">営業と集客を何から始めるか<\/span><span class=\"pd\">本人「わからない、またその時話そう」。受託の最初の1件の取り方と、横展開アプリの集客が対象。最大の未知数はここ。<\/span><\/li>\n          <li><span class=\"pt\">受託の受け皿が未作成<\/span><span class=\"pd\">何を・いくらで・どのくらいで作れるかの一枚。価格は「安さ」ではなく「この形は他にない」で立てる方針だけ決まっている。<\/span><\/li>\n          <li><span class=\"pt\">横展開の最初の分野が未定<\/span><span class=\"pd\">候補は並んでいるが、どこから始めるかは決まっていない。<\/span><\/li>\n          <li><span class=\"pt\">投稿001 v3——Kling生成・選別待ち<\/span><span class=\"pd\">アートビジネス Phase 1 の第1段。マンダラチャートも保留中。<\/span><\/li>\n          <li><span class=\"pt\">貯金への3万円の移動が未確認<\/span><span class=\"pd\">臨時収入5万円の分配（貯金3万／事業資金1万／浪費枠1万）は合意済みだが、移動が済んだかの確認が取れていない。<\/span><\/li>\n          <li><span class=\"pt\">MacBookの復活テスト未実施<\/span><span class=\"pd\">型番・電源が入るか・ローン残額が未確認。復活すれば第2フェーズ（高単価の仕事）への橋になる。<\/span><\/li>\n          <li><span class=\"pt\">Slavik分析の問いが未回答<\/span><span class=\"pd\">「虚構の蓄積は証明として機能するか」。学習カリキュラム第2回「数字の式」も未実施。<\/span><\/li>\n        <\/ul>",
   "updated_at": "2026-11-19T13:32:00+09:00"
  },
  {
   "id": "rules",

   "char": "律",
   "tag": "禁止8つ",
   "themeClass": "t-rules",
   "title": "ルール",
   "meta": "評価の物差し2つ、禁止ライン8つ、やらないこと",
   "badgeClass": "decided",
   "badgeText": "決定済み",
   "html": "<div class=\"detail-head\"><h2>ルール<\/h2><span class=\"badge decided\">決定済み<\/span><\/div>\n        <h3>評価の物差し（2つ）<\/h3>\n        <p>機会は「平均的な参加者の期待値」では測らない。上位を取る側として設計する。その上で問うのは2つ。<\/p>\n        <ol class=\"rules\">\n          <li>その上位は、自分たちの実力で実際に取れる構造か（参加者数と、審査が「質」か「最適化の削り合い」か）<\/li>\n          <li>取った位置が、資産として残るか（勝っても次の案件でゼロからなら、椅子は残らない）<\/li>\n        <\/ol>\n        <h3>禁止ライン（8つ）<\/h3>\n        <p>判定は「バレるか」ではない。<strong>revealテスト<\/strong>——将来、本名と顔を出して同じ売り方を説明できるか——を通らないものはやらない。<\/p>\n        <ol class=\"rules\">\n          <li>裏付けのない／水増しした収入・実績・効果の数字を広告に使う<\/li>\n          <li>「絶対稼げる」等の断定的な表現で情報商材・スクール・コンサルを売る<\/li>\n          <li>ステマ（PRを隠す／広告主に隠させる）<\/li>\n          <li>無許可の反復継続転売、資格を偽った仕入れ、定価超チケット転売<\/li>\n          <li>わいせつ物の頒布・陳列にあたる成人向け販売<\/li>\n          <li>収益の無申告・過少申告<\/li>\n          <li>他人の著作物・商標・キャラ・肖像を無断で使った商品販売<\/li>\n          <li>買い手の不安・借金・焦りを煽る高額勧誘<\/li>\n        <\/ol>\n        <h3>やらないこと<\/h3>\n        <ul>\n          <li>株・FX（元手がない段階では再現性なし）<\/li>\n          <li>スクール事業（実績ができるまで封印）<\/li>\n          <li>アダルト（匿名でも最低優先。原則やらない）<\/li>\n          <li>生活費を事業の成果に賭けること<\/li>\n          <li>図鑑エンジンのキット販売（仕組みの公開になるため）<\/li>\n        <\/ul>",

try{
  var s = JSON.parse(localStorage.getItem(LS_SET) || 'null');
  if(s && s.size) settings.size = s.size;
}catch(e){}
function saveSettings(){ try{ localStorage.setItem(LS_SET, JSON.stringify(settings)); }catch(e){} }

/* ---------- rendering ---------- */
function renderHome(){
  $('homeTheme').textContent = DATA.home.theme || '';
  $('homeThemeSub').innerHTML = DATA.home.themeSubHtml || '';
  var g = '';
  (DATA.home.goals || []).forEach(function(goal){
    g += '<div class="goal' + (goal.main ? ' main' : '') + '"><div class="g-label">' + esc(goal.label) +
      '</div><div class="g-num">' + (goal.numHtml || '') + '</div><div class="g-note">' + esc(goal.note) + '</div></div>';
  });
  $('homeGoals').innerHTML = g;
  var c = '';
  (DATA.home.chips || []).forEach(function(chip){ c += '<span class="chip">' + esc(chip) + '</span>'; });
  $('homeChips').innerHTML = c;
  $('homeSources').textContent = DATA.home.sources || '';
  $('cardCount').textContent = '全' + DATA.sections.length + '件';
  var html = '';
  DATA.sections.forEach(function(sec){
    html += '<a href="#/' + esc(sec.id) + '" class="entry-card" data-open="' + esc(sec.id) + '">' +
      '<div class="thumb ' + esc(sec.themeClass) + '"><span class="thumb-num">' + esc(sec.num) + '</span>' +
      '<span class="thumb-char">' + esc(sec.char) + '</span><span class="thumb-tag">' + esc(sec.tag) + '</span></div>' +
      '<div class="card-body"><h2>' + esc(sec.title) + '</h2><p class="meta">' + esc(sec.meta) + '</p>' +
      '<span class="badge ' + esc(sec.badgeClass) + '">' + esc(sec.badgeText) + '</span></div></a>';
  });
  $('cardGrid').innerHTML = html;
  applySize();
}
function applySize(){
  $('cardGrid').className = 'grid ' + settings.size;
  var tabs = document.querySelectorAll('.size-tabs button');
  for(var i=0;i<tabs.length;i++) tabs[i].setAttribute('aria-selected', tabs[i].getAttribute('data-size') === settings.size ? 'true' : 'false');
}

/* ---------- navigation (slide) ---------- */
var detailView = $('view-detail'), current = null, detailOpen = false;
function openDetail(id, push){
  var sec = sectionById(id);
  if(!sec) return;
  current = id;
  $('detailBody').innerHTML = sec.html;
  detailView.hidden = false;
  /* force reflow so the slide transition runs from translateX(100%) */
  void detailView.offsetWidth;
  detailView.classList.add('open');
  detailView.scrollTop = 0;
  detailOpen = true;
  document.body.classList.add('locked');
  if(push){ try{ history.pushState({view:id}, '', '#/' + id); }catch(e){} }
}
function showHome(push){
  current = null;
  detailView.classList.remove('open');
  detailOpen = false;
  document.body.classList.remove('locked');
  setTimeout(function(){ if(!detailOpen) detailView.hidden = true; }, 360);
  if(push){ try{ history.pushState({view:'home'}, '', '#/'); }catch(e){} }
}
document.addEventListener('click', function(e){
  var open = e.target.closest ? e.target.closest('[data-open]') : null;
  if(open){ e.preventDefault(); openDetail(open.getAttribute('data-open'), true); return; }
  var ol = e.target.closest ? e.target.closest('[data-open-link]') : null;
  if(ol){ e.preventDefault(); openDetail(ol.getAttribute('data-open-link'), true); return; }
  var sc = e.target.closest ? e.target.closest('[data-scroll]') : null;
  if(sc){
    e.preventDefault();
    var t = document.getElementById(sc.getAttribute('data-scroll'));
    if(t) t.scrollIntoView({behavior:'smooth', block:'start'});
  }
});
$('backBtn').addEventListener('click', function(){ showHome(true); });
var tabs = document.querySelectorAll('.size-tabs button');
for(var ti=0; ti<tabs.length; ti++){
  tabs[ti].addEventListener('click', function(){
    settings.size = this.getAttribute('data-size');
    saveSettings();
    applySize();
  });
}
window.addEventListener('popstate', function(){
  var m = (location.hash || '').match(/^#\/(\w+)$/);
  if(m && sectionById(m[1])) openDetail(m[1], false); else if(detailOpen) showHome(false);
});
/* edge swipe-back on the detail panel */
(function(){
  var sx = 0, sy = 0, tracking = false;
  detailView.addEventListener('touchstart', function(e){
    if(e.touches.length === 1 && e.touches[0].clientX < 28){ sx = e.touches[0].clientX; sy = e.touches[0].clientY; tracking = true; }
    else tracking = false;
  }, {passive:true});
  detailView.addEventListener('touchend', function(e){
    if(!tracking) return;
    tracking = false;
    var t = e.changedTouches[0];
    if(t.clientX - sx > 70 && Math.abs(t.clientY - sy) < 60) showHome(true);
  }, {passive:true});
})();

/* ---------- Google Drive sync (GIS popup, drive.file) ---------- */
var accessToken = null, tokenExp = 0, tokenClient = null, fileId = null;
var syncRunning = false, syncError = null, lastSyncAt = 0, pendingCount = 0;

function isConnected(){ try{ return localStorage.getItem(LS_CONN) === '1'; }catch(e){ return false; } }
function setConnected(v){ try{ v ? localStorage.setItem(LS_CONN, '1') : localStorage.removeItem(LS_CONN); }catch(e){} }

function renderSyncStatus(){
  var html;
  if(syncRunning) html = '同期中…';
  else if(syncError) html = '<span class="err">同期エラー</span> ・ 未同期' + pendingCount + '件 ・ <span class="sbhint">タップで再試行</span>';
  else if(!isConnected()) html = 'Drive未接続（端末内のデータを表示中） ・ <span class="sbhint">タップで接続</span>';
  else if(pendingCount > 0) html = '未同期の変更' + pendingCount + '件 ・ <span class="sbhint">タップで同期</span>';
  else if(lastSyncAt){
    var d = new Date(lastSyncAt);
    html = '同期済み（' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') + '）';
  }
  else html = '接続済み ・ <span class="sbhint">タップで同期</span>';
  $('syncbar').innerHTML = html;
  $('discWrap').hidden = !isConnected();
}
$('syncbar').addEventListener('click', function(){
  if(syncRunning) return;
  if(!isConnected() || (syncError && !accessToken)){ connectDrive(); return; }
  appSync(true);
});
$('discBtn').addEventListener('click', function(){ disconnectDrive(); });

function waitGis(){
  return new Promise(function(res, rej){
    var n = 0;
    var iv = setInterval(function(){
      if(window.google && google.accounts && google.accounts.oauth2){ clearInterval(iv); res(); }
      else if(++n > 40){ clearInterval(iv); rej(new Error('gis-timeout')); }
    }, 250);
  });
}
function requestToken(interactive){
  return new Promise(function(res, rej){
    waitGis().then(function(){
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: 'https://www.googleapis.com/auth/drive.file',
        callback: function(resp){
          if(resp && resp.access_token){
            accessToken = resp.access_token;
            tokenExp = Date.now() + (resp.expires_in ? resp.expires_in * 1000 : 3000000);
            res(accessToken);
          } else rej(new Error('no-token'));
        },
        error_callback: function(err){ rej(new Error(err && err.type ? err.type : 'gis-error')); }
      });
      tokenClient.requestAccessToken({ prompt: interactive ? 'consent' : '' });
    }).catch(rej);
  });
}
function getValidToken(interactive){
  if(accessToken && Date.now() < tokenExp - 30000) return Promise.resolve(accessToken);
  return requestToken(interactive);
}
function connectDrive(){
  getValidToken(true).then(function(){
    setConnected(true); syncError = null;
    renderSyncStatus();
    appSync(true);
  }).catch(function(){
    syncError = 'connect';
    renderSyncStatus();
  });
}
function disconnectDrive(){
  accessToken = null; tokenExp = 0; fileId = null;
  setConnected(false); syncError = null;
  renderSyncStatus();
}
function driveFetch(url, opts){
  return getValidToken(false).then(function(token){
    var headers = Object.assign({}, (opts && opts.headers) || {}, { 'Authorization': 'Bearer ' + token });
    return fetch(url, Object.assign({}, opts || {}, { headers: headers }));
  }).then(function(res){
    if(res.status === 401){ accessToken = null; tokenExp = 0; throw new Error('auth-401'); }
    if(!res.ok) throw new Error('drive-' + res.status);
    return res;
  });
}
function ensureFileId(){
  if(fileId) return Promise.resolve(fileId);
  var q = encodeURIComponent("name='" + FILE_NAME + "' and trashed=false");
  return driveFetch('https://www.googleapis.com/drive/v3/files?q=' + q + '&fields=files(id,name)&spaces=drive')
    .then(function(res){ return res.json(); })
    .then(function(j){
      if(j.files && j.files.length){ fileId = j.files[0].id; return fileId; }
      return driveFetch('https://www.googleapis.com/drive/v3/files', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: FILE_NAME, mimeType: 'application/json' })
      }).then(function(cres){ return cres.json(); }).then(function(cj){
        fileId = cj.id;
        /* first connect: create the file with the current plan content */
        return uploadData(DATA).then(function(){ return fileId; });
      });
    });
}
function normalizeData(j){
  if(!j || !Array.isArray(j.sections) || !j.home) return null;
  return j;
}
function downloadData(){
  return ensureFileId()
    .then(function(id){ return driveFetch('https://www.googleapis.com/drive/v3/files/' + id + '?alt=media'); })
    .then(function(res){ return res.text(); })
    .then(function(text){
      if(!text || !text.trim()) return null;
      return normalizeData(JSON.parse(text));
    });
}
function uploadData(data){
  return ensureFileId().then(function(id){
    var payload = clone(data);
    payload.updatedAt = nowISO();
    return driveFetch('https://www.googleapis.com/upload/drive/v3/files/' + id + '?uploadType=media', {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
  });
}
/* item-level merge: per section id, the newer updated_at wins; home likewise.
   Union only — the merged result never holds fewer sections than either side. */
function mergeData(local, remote){
  if(!remote) return { data: local, changed: false, pending: local.sections.length + 1 };
  var remoteById = {};
  remote.sections.forEach(function(s){ remoteById[s.id] = s; });
  var seen = {}, mergedSections = [], pending = 0;
  local.sections.forEach(function(ls){
    seen[ls.id] = true;
    var rs = remoteById[ls.id];
    if(!rs){ mergedSections.push(ls); pending++; }
    else if((ls.updated_at || '') > (rs.updated_at || '')){ mergedSections.push(ls); pending++; }
    else mergedSections.push(rs);
  });
  remote.sections.forEach(function(rs){ if(!seen[rs.id]) mergedSections.push(rs); });
  var home = local.home, homePending = 0;
  if((remote.home && remote.home.updated_at || '') > (local.home.updated_at || '')) home = remote.home;
  else if((local.home.updated_at || '') > ((remote.home && remote.home.updated_at) || '')) homePending = 1;
  pending += homePending;
  var merged = { version: 1, updatedAt: local.updatedAt, home: home, sections: mergedSections };
  return { data: merged, changed: JSON.stringify(merged) !== JSON.stringify(local), pending: pending };
}
function appSync(manual){
  if(syncRunning) return;
  if(!isConnected()){ if(manual) connectDrive(); return; }
  syncRunning = true; syncError = null; renderSyncStatus();
  getValidToken(false)
    .then(function(){ return downloadData(); })
    .then(function(remote){
      var m = mergeData(DATA, remote);
      /* write guard: never upload a result with fewer sections than the fresh remote */
      if(remote && m.data.sections.length < remote.sections.length) throw new Error('merge-guard');
      var remoteChanged = !!remote && JSON.stringify(m.data) !== JSON.stringify({ version: 1, updatedAt: remote.updatedAt, home: remote.home, sections: remote.sections });
      if(m.changed){
        DATA = m.data; saveCache(); renderHome();
        if(current) $('detailBody').innerHTML = (sectionById(current) || {}).html || '';
      }
      pendingCount = m.pending;
      if(!remote || remoteChanged || m.pending > 0){
        return uploadData(m.data).then(function(){
          pendingCount = 0;
          DATA.updatedAt = nowISO(); saveCache();
        });
      }
    })
    .then(function(){
      lastSyncAt = Date.now();
      syncRunning = false;
      renderSyncStatus();
    })
    .catch(function(e){
      syncError = String(e && e.message || e);
      syncRunning = false;
      renderSyncStatus();
    });
}
/* token watchdog: silently re-acquire an expired token and re-sync */
setInterval(function(){
  if(isConnected() && (!accessToken || Date.now() >= tokenExp - 30000) && !syncRunning){
    getValidToken(false).then(function(){ appSync(false); }).catch(function(){});
  }
}, 30000);
document.addEventListener('visibilitychange', function(){
  if(!document.hidden && isConnected()) appSync(false);
});

/* ---------- boot ---------- */
$('verText').textContent = APP_VERSION;
renderHome();
renderSyncStatus();
var initial = (location.hash || '').match(/^#\/(\w+)$/);
if(initial && sectionById(initial[1])){
  $('detailBody').innerHTML = sectionById(initial[1]).html;
  detailView.hidden = false;
  detailView.style.transition = 'none';
  detailView.classList.add('open');
  detailOpen = true; current = initial[1];
  document.body.classList.add('locked');
  requestAnimationFrame(function(){ detailView.style.transition = ''; });
}
requestAnimationFrame(function(){ setTimeout(function(){ $('veil').classList.add('off'); }, 120); });
if(isConnected()){
  getValidToken(false).then(function(){ appSync(false); }).catch(function(){ renderSyncStatus(); });
}
</script>
