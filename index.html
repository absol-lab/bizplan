   "html": "<div class=\"detail-head\"><h2>ビジネス計画</h2><span class=\"badge decided\">骨格は決定済み</span></div>\n        <p class=\"sec-lead\">柱はアプリ。市場の現実を踏まえ、「小さく複数出し、届いたものだけ伸ばす」が勝ち方として決まっている。</p>\n        <div class=\"stats\">\n          <div class=\"stat\"><div class=\"v\">約83<small>%</small></div><div class=\"k\">新作アプリが2年経っても月$1,000に届かない割合</div></div>\n          <div class=\"stat\"><div class=\"v\">月$72</div><div class=\"k\">公開1年後の月収の中央値</div></div>\n          <div class=\"stat\"><div class=\"v\">58<small>日</small></div><div class=\"k\">月$1,000到達までの中央値。届くものは早く届く</div></div>\n          <div class=\"stat\"><div class=\"v\">5〜9<small>倍</small></div><div class=\"k\">「痛み止め」が「ビタミン」より転換する倍率</div></div>\n        </div>\n        <h3>候補はBとCの2つ。順番だけ固定</h3>\n        <div class=\"trio\" style=\"grid-template-columns:1fr 1fr\">\n          <div class=\"tcol\"><span class=\"tl-t\">B</span><span class=\"tl-n\">結果画面型の小ツール</span><span class=\"tl-d\">Cと一体で作る</span></div>\n          <div class=\"tcol\"><span class=\"tl-t\">C</span><span class=\"tl-n\">現場の不便解消型</span><span class=\"tl-d\">題材は段0で決める</span></div>\n        </div>\n        <p class=\"trio-seq\">進める順番：<strong>Cの題材決定（段0、今〜共通テスト）→ C×Bの最小版（共通テスト後〜2月）</strong></p>\n        <div class=\"card\">\n          <h3>B. シェアされる結果画面型の小ツール</h3>\n          <p>手持ちの記録や写真から「分析／図鑑／年表」のような結果画像を出す道具。結果がそのまま投稿物になる形が集客装置になる（IsTalkの型）。強みは日本事例で最も再現性が高いこと。弱みは題材の当たり外れが全てで、「誰の何の結果が見たいか」の選定が勝負になる。</p>\n          <p class=\"firststep\"><strong>最初の一歩：</strong>Cの題材が決まったら、その結果画面の試し画像を1枚作る<br><strong>時期：</strong>共通テスト後〜2月（Cの最小版と一体で作る）</p>\n        </div>\n        <div class=\"card\">\n          <h3>C. 現場の不便解消型（作品台帳が有力）</h3>\n          <p>自分の制作・受験生活の現場の道具。調査で「スマホ完結・日本語・私的な作品台帳」は日本語圏に不在の<strong>無人地帯</strong>と確認済み。海外製品は高額・英語・PC寄りで、国内は公開ポートフォリオと物理保管に二極化している。</p>\n          <ul>\n            <li><strong>価格の隙間</strong>：買い切り〜月300〜980円、点数課金・広告なし</li>\n            <li><strong>集客になる出力</strong>：展示・完成ごとの「作品1点カード（縦型）」、第二弾に年間「制作Wrapped」</li>\n            <li><strong>弱み</strong>：層が狭く天井は低い。最初の月1万円ライン向き</li>\n          </ul>\n          <p class=\"firststep\"><strong>最初の一歩：</strong>段0の一文を決める（下の検証の階段の段0と、未決・保留の筆頭がここ）<br><strong>時期：</strong>今〜共通テスト（題材の決定だけは受験前から進める）</p>\n        </div>\n        <h3>検証の階段（段0〜段4）</h3>\n        <ol class=\"steps\">\n          <li data-n=\"0\"><span class=\"st\">題材を1つ決める</span><span class=\"done-when\">「誰が・いつ・何に困って・今どう凌いでいるか」を一文で言えること</span>\n<p class=\"firststep\"><strong>最初の一歩：</strong>題材候補（作品台帳／制作ログ／画材の在庫と消費／シフトと収入の見える化）から1つに絞って、その一文を書く<br><strong>時期：</strong>今〜共通テスト</p></li>\n          <li data-n=\"1\"><span class=\"st\">最小版を公開する</span><span class=\"done-when\">実際に他人が触れるURLがあること（決済はまだ付けない）</span>\n<p class=\"firststep\"><strong>最初の一歩：</strong>最小版の最初の1画面を作る<br><strong>時期：</strong>共通テスト後〜2月</p></li>\n          <li data-n=\"2\"><span class=\"st\">集客テスト30日</span><span class=\"done-when\">結果画面のシェアか短尺動画経由で、身内以外の利用者が10人。ゼロなら題材を変える</span>\n<p class=\"firststep\"><strong>最初の一歩：</strong>公開した日に、結果画面のシェア投稿か短尺動画を1本出す<br><strong>時期：</strong>段1の公開直後から30日間</p></li>\n          <li data-n=\"3\"><span class=\"st\">課金の仮設置</span><span class=\"done-when\">最初の1件の支払い（広告削除か年額サブスクの小さい壁で試す）</span>\n<p class=\"firststep\"><strong>最初の一歩：</strong>広告を消す有料版か年額サブスクの、どちらか1つの課金の受け皿を付ける<br><strong>時期：</strong>段2で身内以外の利用者が10人に届いたら</p></li>\n          <li data-n=\"4\"><span class=\"st\">判定</span><span class=\"done-when\">続ける／題材を変える／量産ラインに移す、を数字で決める</span>\n<p class=\"firststep\"><strong>最初の一歩：</strong>数字を見て「続ける／題材を変える／量産ラインに移す」のどれかを決め、結果を記録する<br><strong>時期：</strong>段3の後</p></li>\n        </ol>\n        <h3>課金と集客の決まり</h3>\n        <ul>\n          <li><strong>課金の本命</strong>はサブスク（年額主役）＋買い切りの受け皿。広告は単価が低く、柱にしない</li>\n          <li><strong>再生数 ≠ ダウンロード</strong>。差を分けるのは、シェアされる結果画面／プロフィールからの導線／チャネルと対象の一致</li>\n          <li>Xでは告知より「質問投稿」が効く。最初の利用者は手で集め、要望には速く応える</li>\n          <li>フォロワーは借り物。<strong>所有できる連絡先（リスト）</strong>を別に持つ</li>\n        </ul>\n        <h3>収益化の実務メモ</h3>\n        <ul>\n          <li>Stripeは個人でも使えるが、決済・税務は実名が前提。特商法の「請求があれば開示」は完全な匿名化ではない</li>\n          <li>1,000円あたりの手取り：STORES 945円／BOOTH 899円／note 855円</li>\n          <li>青色申告の承認申請は「開業後2か月以内」を逃さない</li>\n        </ul>\n                <div class=\"card\">\n          <h3>AIバウンティ（make.fun） <span class=\"badge pending\">テスト枠・検討中</span></h3>\n          <p>AIエージェント向けのコーディングバウンティ（懸賞案件）の基盤。集客が要らず、<strong>AIの労働力そのものが商品になる</strong>経路で、本人の作業はスマホでの承認と確認だけになる。ただし性質は「仕組み」ではなく「懸賞」で、賞金は上位の数件だけが取る。本命ルートにはならない。</p>\n          <ul>\n            <li><strong>置き場所</strong>：テスト枠。目的は種銭の獲得と、「AIに仕事を取らせて報酬を得る」実地ノウハウ。並行は最大3件まで、期間と撤退ラインを先に決める</li>\n            <li><strong>正直な留保</strong>：参加者の大半は何も得ない構造。実例として、$500の案件に参加エージェント8,138という表示もあった（2026-11-17のスクリーンショット）。平均参加者の期待値で測る仕事ではない</li>\n            <li><strong>ノウハウの置き方</strong>：仕組みの本体は、次のグループ（仕組み／採点のされ方／案件の選び方／応募と提出の手順／受け取りと実務／損なうパターン／評価の物差しでの位置づけ）に体系として置く</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>仕組み</h3>\n          <div class=\"flow\"><span>案件を探す</span><i>→</i><span>エージェントが作る</span><i>→</i><span>提出（コード＋制作記録）</span><i>→</i><span>自動チェックと採点</span><i>→</i><span>上位がUSDCを受け取る</span></div>\n          <ul>\n            <li><strong>運営と形</strong>：運営はEZO Labs Inc.。案件はコーディング課題で、カテゴリは Trading／Forecasting／Security／Automation／Growth／Games／Code（公式）。課題ごとに「測り方（指標）」と締切と順位ごとの賞金が公開される</li>\n            <li><strong>賞金は先にロックされる</strong>：案件が開く時点で、賞金総額はSolana上のエスクロー（預かり口座）に全額ロックされる。払う側の都合で消える形ではなく、入賞すれば請求で自分のウォレットに移る。初期の一部案件はエスクローではなく運営の報酬ウォレットから支払われ、その場合は案件ページに明記される</li>\n            <li><strong>参加費</strong>：大半の案件は無料。有料の案件はページに明記され、手数料は賞金側に組み込まれる（実例：フロントエンドの案件で $0.50）</li>\n            <li><strong>エージェント前提の設計</strong>：参加はエージェント自身のSolanaキーペアでサインインし、APIキーで操作する。案件探しはAPI／MCPサーバー／skill.md（公式の手順書ファイル）から行える</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>採点のされ方</h3>\n          <ul>\n            <li><strong>人の審査ではなく、指標による自動採点</strong>：採点は公開された指標（メトリック）に基づき、サンドボックスが全エントリーを同じ条件で2回実行して測る。「審査が『質』の案件」という言い方は、正確には「指標が出来栄えの質を測る案件」と読み替えるのが実態に合う</li>\n            <li><strong>順位の決まり方</strong>：開催中の順位は暫定で、他者との相対比較ではなく固定の基準との比較で付く。締切後に最終ラウンドがあり、結果と支払いリストがエスクローに掲示され、異議申立ての期間（チャレンジウィンドウ。誰でも採点を再実行して争える）を経て確定する</li>\n            <li><strong>提出の必須条件</strong>：コードは公開リポジトリ（1コミット）で出し、それを作った制作セッションの記録（トランスクリプト）を一緒に提出する。記録は「自分のエージェントが作ったこと」の証明で、自動チェックが記録の真正性とコードとの一致を確認する。記録のない提出は不受理（2026-11-17以降の提出分から、公式）</li>\n            <li><strong>落ちても直せる</strong>：チェックに落ちた提出は採点されないが、締切までなら直して再提出できる。締切の余裕が実務上の安全弁になる</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>案件の選び方</h3>\n          <ul>\n            <li><strong>賞金 ÷ 参加者数</strong>：まず母数を見る。2026-11-17のスクリーンショットでは、$500のチェスエンジン案件に参加8,138、無料モデル集約の案件に6,266が集まる一方、「最高のフロントエンドを構築する」$545の案件は参加31だった。同じ賞金額でも、勝ち筋の濃さは母数で桁が違う</li>\n            <li><strong>指標が自分の強みを測るか</strong>：採点は指標への最適化勝負。指標が明確で、コーディングやフロントエンドの出来栄え——Museの主戦場——を測る案件を選ぶ。指標が運や速度だけの案件は避ける</li>\n            <li><strong>締切に余裕があること</strong>：チェック不合格→修正→再提出の往復を前提に、締切まで余裕のある案件を優先する</li>\n            <li><strong>規律</strong>：並行は最大3件まで。始める前に期間と撤退ラインを決め、外れたら記録して次へ行く</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>応募と提出の手順</h3>\n          <ol class=\"steps\">\n            <li data-n=\"1\"><span class=\"st\">サインイン</span><span class=\"sd\">Solanaのキーペアでサインインし、APIキーを保持する（公式の skill.md が手順書になる）</span></li>\n            <li data-n=\"2\"><span class=\"st\">案件と要件を読む</span><span class=\"sd\">API／MCPで募集中の案件を引き、賞金・順位・締切・指標・要件を確認する</span></li>\n            <li data-n=\"3\"><span class=\"st\">公開リポジトリで作る</span><span class=\"sd\">制作セッションの記録が残る形で作る（記録が提出物の一部になる）</span></li>\n            <li data-n=\"4\"><span class=\"st\">ローカルで当たりを付ける</span><span class=\"sd\">キットのローカル採点（grade-local）がある案件では、先に自己採点する</span></li>\n            <li data-n=\"5\"><span class=\"st\">提出する</span><span class=\"sd\">リポジトリ（1コミット）とセッション記録を束ねて提出する</span></li>\n            <li data-n=\"6\"><span class=\"st\">状態を見て直す</span><span class=\"sd\">提出ステータスを確認し、チェックに落ちたら締切までに直して再提出する</span></li>\n            <li data-n=\"7\"><span class=\"st\">請求する</span><span class=\"sd\">入賞したら、案件の請求期間内に claim する。USDCが自分のウォレットに入る</span></li>\n          </ol>\n        </div>\n        <div class=\"card\">\n          <h3>受け取りと実務</h3>\n          <ul>\n            <li><strong>受け取りの形</strong>：報酬はUSDC（ドル連動のステーブルコイン）で、自分のSolanaウォレットへ。請求には期限があり（確定から少なくとも7日間の請求期間が公式に示されている）、支払い前に自動の制裁スクリーニングが入る。税務書類が求められるのは米国の法律で必要な場合だけ、と公式は説明している</li>\n            <li><strong>後で来る手間</strong>：USDCから円への換金と、日本での税務（クリプトの利益は原則として雑所得）が後段に来る。受け取り側の口座・取引所の用意は、初入賞の前ではなく「最初の1件を回す」段階で確認すれば足りる</li>\n            <li><strong>こちらの設定状態</strong>：ウォレットとAPI資格情報は設定済み（別チャットで実施）。スキルは v1.5.172、APIキーの期限は2026-12-15。期限が切れていれば、再発行が最初の一手になる</li>\n            <li><strong>基盤の規模（公式ページの表示・2026-11-20確認）</strong>：2026-11-09の運用開始から、支払総額 $14,810.74／970アカウント、エスクロー残高 $13,970.80／46案件。まだ小さい基盤で、数字は動き続ける前提で読む</li>\n            <li><strong>未確認</strong>：実際の応募・提出・請求はまだ1件も回していない。所要時間、詰まりどころ、請求の実際の流れは未確認で、最初の1件は「勝つ」ことより「一周回して実地の記録を取る」ことが目的になる</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>損なうパターン</h3>\n          <ul>\n            <li><strong>賞金は上位だけ</strong>：順位に入らなければ、作業はすべて無報酬。参加者が数千集まる案件では、構造的に大半が外れる</li>\n            <li><strong>指標の読み違い</strong>：出来栄えの良さと、指標が測るものがずれると勝てない。作る前に指標と要件を読むことが、そのまま勝率になる</li>\n            <li><strong>記録の不備で不受理</strong>：セッション記録が要件を満たさない提出は、出来にかかわらず採点されない</li>\n            <li><strong>時間の溶け方</strong>：再提出の往復と締切管理に時間が溶ける。期間と撤退ラインを先に決めるのは、この損を上限で切るため</li>\n            <li><strong>基盤自体の新しさ</strong>：運用開始から日が浅く、ルール（記録の必須化など）も動いている。条件は応募のたびに公式で確認する</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>評価の物差しでの位置づけ</h3>\n          <ul>\n            <li><strong>物差し1・上位が自分の強みで取れるか</strong>：コーディングとフロントエンドはClaudeの主戦場で、指標が出来栄えを測る案件なら、取れる側に立つ構造はある。平均参加者の期待値ではなく、この一点で評価する（2026-11-17に本人が訂正した物差し）</li>\n            <li><strong>物差し2・取った位置が資産として残るか</strong>：残らない。懸賞は毎回ゼロからで、搾り取る位置（基盤そのもの）はプラットフォーム側が保持する。「椅子が残らない上位」——種銭を取りに行く傭兵仕事であり、実績が単価や次の仕事に化けるかも未検証</li>\n            <li><strong>結論としての置き方</strong>：本命（自分のアプリ・作品・IP＝椅子が残る上位）とは分けて、テスト枠で小さく回す。得るものは種銭と、「AI労働で報酬を得る」実地の記録</li>\n          </ul>\n          <p class=\"firststep\"><strong>最初の一歩：</strong>締切に余裕があり、審査が「質」の案件を1件選んで応募する（並行は最大3件まで、期間と撤退線を先に決める）<br><strong>時期：</strong>受験後（2027年3月以降）</p>\n          <p class=\"sources\">きっかけ・出典：本人が送った make.fun のスクリーンショット（2026-11-17。案件の数字は当時の表示）と、別チャットでのセットアップ記録（ウォレット／API資格情報／スキル v1.5.172／APIキー期限 2026-12-15）。本文の仕組みは make.fun 公式サイトと公式ガイド（How it works／How AI agents earn money、2026-11-20確認）に拠る</p>\n        </div>\n                <div class=\"card\">\n          <h3>物語のある物（物販テスト） <span class=\"badge pending\">テスト枠・2026-11-19 合意</span></h3>\n          <p>売るのは呪物ではない。<strong>「物語と力」</strong>——見惚れるような質の高い物に、質の高い物語を付けて売る。狙う型は、市場の多数派（キーワード詰め込みのテンプレート量産）ではなく、<strong>一点ごとに固有の物語を付けた完成品</strong>。担い手は石に限らず、石・ガラス・金属・木などの小物でよい（売るのは物語であり、表面的な物が石である必要はない）。</p>\n          <ul>\n            <li><strong>置き場所</strong>：テスト枠の1件（make.funと同格）。期間と撤退ラインを先に決めて小さく試す。売り場はメルカリ——購入者の能動性が必要な場に置く</li>\n            <li><strong>もう1つの意味</strong>：アートビジネスの練習。値付け、物語の付け方、固定価格、記録の練習であり、「意味のないものに付加価値を与える」という本命の作品販売（作品の値付けと言説化）と同じ力学で動く</li>\n            <li><strong>正直な留保</strong>：市場の数字は、売り切れ実例を集めた調査に基づく（母数に対する統計ではない）。成約の傾向は読めるが、「これを出せば売れる」という保証にはならない</li>\n            <li><strong>ノウハウの置き方</strong>：仕組みの本体は、次のグループ（市場の構造／売り手の4類型／物の選び方／物語の付け方／出品の型／ルール／進め方と値付け）に体系として置く</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>市場の構造</h3>\n          <p>価格は素材そのものでは立たない。<strong>組み立てと意味付けの層で立つ</strong>。素材として流通する値段と、完成品として成約する値段の間の差が、「物語・組み立て」の価格になる。</p>\n          <div class=\"stats\">\n            <div class=\"stat\"><div class=\"v\">¥308<small>〜/粒</small></div><div class=\"k\">ビーズ素材としての流通価格（1粒）</div></div>\n            <div class=\"stat\"><div class=\"v\">¥54,678<small>〜</small>¥235,770</div><div class=\"k\">完成品ブレスレットの成約実例（ルチル系・大玉）</div></div>\n            <div class=\"stat\"><div class=\"v\">約2.4〜4.4<small>倍</small></div><div class=\"k\">同種クラスターのグラム単価の差（スピ表現が濃い出品 vs 事実ベース寄り）</div></div>\n            <div class=\"stat\"><div class=\"v\">¥540<small>〜/100g</small></div><div class=\"k\">さざれ石（グラム売りの消耗品）の厚い層</div></div>\n          </div>\n          <ul>\n            <li><strong>価格帯の地図</strong>：〜¥1,000は素材・消耗品（さざれ、ビーズ）で回転率の層／¥1,800〜¥3,100はハンドメイドと小〜中クラスターで個人売り手の主戦場／¥5,750〜¥19,420は「1点もの」「極上」の格付け言葉が付く帯／¥54,678〜は組み立て＋物語が乗った完成品の帯。安い帯ほど素材に寄り、高い帯ほど完成品＋格付け＋物語に寄る</li>\n            <li><strong>グラム単価の読み方</strong>：水晶クラスターで、事実ベース寄りは約¥8.5/g、スピ表現が濃い出品は約¥37.7/g。ただしこの差には品質・色・産地・付属品の差も混ざっていて、「物語だけの効果」とは切り分けられない。読めるのは「同じカテゴリー内で、表現と物語が濃い出品の方が高い帯にいる」という傾向まで</li>\n            <li><strong>売れる形態</strong>：ブレスレット（完成品）が市場の中心。ほかにクラスター・原石（置物）、スフィア等の小物（数千円帯の入口）、さざれ石（グラム売り）。スピ要素のない鉱物標本は事実情報だけで売買され、帯は概ね¥700〜¥8,300と低い</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>売り手の4類型</h3>\n          <ul>\n            <li><strong>大手Shops型</strong>：同一ショップから大量出品し、実際に売り切れている。説明文はテンプレート化され、タイトルは検索キーワードの塊。「質問を受け付けていません」と明記して対応コストを切る。価格の天井はこの型が作っている</li>\n            <li><strong>卸売り・回転型</strong>：さざれ石などをサイズ別価格表で出し、再入荷を繰り返す。売り手の評価数は数千件規模。単価は安く、回転とリピートで成立させる</li>\n            <li><strong>個人コレクター放出型</strong>：「マイコレクション」「秘蔵品」を一点ずつ、来歴の物語付きで出す。高額クラスターの成約はこの型に多い</li>\n            <li><strong>ハンドメイド型</strong>：デザインブレスレットを¥2,000〜¥15,800で出す。フォロー割、リピーター値引き、浄化さざれのおまけなど、関係性で回す工夫が説明文に明記されている</li>\n          </ul>\n          <p><strong>自分の型の置き場所</strong>：個人コレクター放出型の「来歴の物語」に、質の担保（産地・処理の正直な開示）を組み合わせる位置。市場の大半はテンプレートか回転型で、一点ごとの物語は薄い——そこが差別化の余地になる。</p>\n        </div>\n        <div class=\"card\">\n          <h3>物の選び方</h3>\n          <ul>\n            <li><strong>担い手は石に限らない</strong>：石・ガラス・金属・木、その他の小物でもよい。売るのは物語であり、物はその担い手</li>\n            <li><strong>質が土台</strong>：素人が適当に拾った石ころに情報を付ける形とは分ける。物語を剥がしても、物そのものに持つ価値があること（ルール3）。見惚れてしまうようなキラキラした石は、その一例</li>\n            <li><strong>マテリアルへの感覚が商品力</strong>：物の質を見分ける目そのものが、この型の参入障壁であり強みになる</li>\n            <li><strong>処理は正直に書く</strong>：染色・加熱・含浸などの処理の有無を正直に開示することが、実務者向けの解説でも信頼の条件として挙げられている。傷・クラック・インクルージョンは注意書きで「個性」として許容を求めるのが市場の型</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>物語の付け方</h3>\n          <ul>\n            <li><strong>差になるのは固有の文脈</strong>：効能の列挙は全員がやっているので差にならない。差になっているのは「なぜこの石（この物）なのか」——組み合わせの理由、来歴、産地と処理の開示の方</li>\n            <li><strong>実例1・組み合わせの物語</strong>：天珠とルチルの組み合わせブレスレット（¥99,980で成約）では、石ごとに由来と意味を物語として積んでいる</li>\n            <li><strong>実例2・使い方の物語</strong>：「インプット」という儀式（身に付けた日から一週間、願望を石に念じる方法）まで説明する出品がある。購入後の体験設計まで売っている形</li>\n            <li><strong>実例3・手放す理由の物語</strong>：「私の家での役目を終えたと夢にてお告げを授かりました」（レムリアンシード、¥7,500で成約）、「飾らずしまっていた特別の水晶」（クラスター、¥19,300で成約）。個人売り手の高額成約には来歴の物語が付いている例が目立つ</li>\n            <li><strong>効能の扱い</strong>：物語の本体ではなく、言い伝え形式（「〜と云われています」）で添えるに留める。断定しない理由はルールのグループで扱う</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>出品の型</h3>\n          <p><strong>タイトル</strong>：キーワード詰め込みが標準形（石名／形態／パワーストーン／天然石／性別／用途を総ざらいする）。格付けワード（「極上」「1点もの 現品」「秘蔵品」）は高額帯に集中し、効果ワードはタイトルよりハッシュタグ・説明文側に置く例が多い。検索に乗る最低限のキーワードは要るが、自分の型では固有の物語が先頭に来る。</p>\n          <p><strong>説明文の骨格</strong>（複数の成約出品に共通する並び）：</p>\n          <ol class=\"steps\">\n            <li data-n=\"1\"><span class=\"st\">冒頭フック</span><span class=\"sd\">最上級の形容、または入荷の宣言</span></li>\n            <li data-n=\"2\"><span class=\"st\">スペック</span><span class=\"sd\">石名、玉サイズmm、内周cm、重さg、産地</span></li>\n            <li data-n=\"3\"><span class=\"st\">石ごとの物語</span><span class=\"sd\">ここが本体。組み合わせの理由と来歴を書き、効能は言い伝え形式で添える</span></li>\n            <li data-n=\"4\"><span class=\"st\">用途提案</span><span class=\"sd\">浄化用、インテリア、プレゼント等</span></li>\n            <li data-n=\"5\"><span class=\"st\">注意書き</span><span class=\"sd\">天然物の傷・クラックは「個性」として許容を求める／返品の条件／他サイト同時出品の有無</span></li>\n            <li data-n=\"6\"><span class=\"st\">ハッシュタグ</span><span class=\"sd\">効果ワード（#金運 #浄化 等）はここに寄せる</span></li>\n          </ol>\n          <p><strong>写真</strong>：メルカリの上限は20枚。高額の単品（¥19,300、¥11,520の成約例）は20枚を使い切っている。ブレスレットは手に持つ／手首に着ける見せ方、クラスターは台座に置いた置物としての見せ方＋サイズ・重さの数値併記が定番。写真の枚数と情報量は価格帯と相関して見える。「4枚目以降実物写真です」と書き分ける運用もある。</p>\n        </div>\n        <div class=\"card\">\n          <h3>ルール</h3>\n          <p><strong>合意したルール（3つ）</strong>——担い手が石でもガラスでも金属でも木でも、そのまま適用される。</p>\n          <ul>\n            <li><strong>効能を断定しない</strong>——説明文で断定すると嘘になる。「〜と言われてきた」「〜と云われる」という言い回しが大切で、それこそが物語である</li>\n            <li><strong>無理な売りつけはしない</strong>——欲しい人が能動的に買う構造に置く。無理やりは悪質</li>\n            <li><strong>物の質は本物にする</strong>——物語を剥がしても、物そのものに持つ価値があること</li>\n          </ul>\n          <ul>\n            <li><strong>規約面の確認</strong>：メルカリ公式の「禁止されている出品物」にパワーストーン自体の禁止はない（有形の石・アクセサリーは通常の出品物）。一方、「写真や説明文から商品内容を具体的に確認できないもの」は禁止で、実体のない商品（鑑定サービスのみ等）は対象になる。石という有形物を売る形はこの点で問題になりにくい</li>\n            <li><strong>効能表現の線</strong>：メルカリ公式のアンバサダーガイドラインは、景品表示法について「合理的な根拠がない効果・性能の表示」を禁止パターンとして明示し、薬機法についても医薬品と誤認される効果効能表現を避けるよう求めている。「必ず金運が上がる」「病気が治る」等の断定はこの枠に触れるおそれがある。市場の主流である言い伝え形式は、この安全圏と一致している——先に合意したルールは、市場の実態から見ても標準形</li>\n            <li><strong>効果の受け止め方</strong>：実際に作用するかどうかは、買う人がどれほど強く信じているかによる。強く信じれば精神的に作用し、思い込みは現実に影響する。だから無意味ではない、という立場を取る</li>\n            <li><strong>不安訴求には寄らない</strong>：市場には不安を煽る文面の出品も存在し成約もしているが、それは採らない。合意した3ルールの側に立つ</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>進め方と値付け</h3>\n          <ol class=\"steps\">\n            <li data-n=\"1\"><span class=\"st\">最初の1品を決める</span><span class=\"sd\">質が土台になる物を選ぶ（物の選び方のグループ）</span></li>\n            <li data-n=\"2\"><span class=\"st\">物語を書く</span><span class=\"sd\">組み合わせの理由・来歴を固有の文脈として書き、効能は言い伝え形式で添える</span></li>\n            <li data-n=\"3\"><span class=\"st\">写真を上限まで撮る</span><span class=\"sd\">実物の質が伝わる情報を厚くする（出品の型のグループ）</span></li>\n            <li data-n=\"4\"><span class=\"st\">価格を付けて出品する</span><span class=\"sd\">下の値付けの考え方で帯の中の位置を決め、固定価格で出す</span></li>\n            <li data-n=\"5\"><span class=\"st\">反応を見る</span><span class=\"sd\">コメント経由の交渉→専用出品というリピーター動線が市場では機能している。単発の成約より、同じ買い手に繰り返し売る動線を意識する</span></li>\n            <li data-n=\"6\"><span class=\"st\">結果を記録する</span><span class=\"sd\">価格・反応・成約の有無を残し、期間と撤退ラインで判定する</span></li>\n          </ol>\n          <ul>\n            <li><strong>値付けの考え方</strong>：同種の成約実例の帯（市場の構造のグループ）を見て、物の質＋物語の固有さで帯の中の位置を決める。素材価格に引っ張られず、完成品としての価格を付ける。固定価格で出すこと自体が、本命の作品販売に向けた値付けの練習になる</li>\n          </ul>\n          <p class=\"firststep\"><strong>最初の一歩：</strong>最初の1品を決めて、その出品文の下書きを作る<br><strong>時期：</strong>受験後（2027年3月以降）。期間と撤退ラインを決めてから出す</p>\n          <p class=\"sources\">きっかけ・出典：Xで見かけたスピ物販の実例（2026-11-19、本人の共有）。本文は合意事項（2026-11-19、Business Labo）と市場分析「メルカリ物販_市場分析」（2026-11-19。メルカリの売り切れ実例ベースの調査で、検索画面がJS描画のため網羅的な統計ではない）、メルカリ公式ヘルプ（禁止されている出品物／アンバサダーガイドライン）に拠る</p>\n        </div>\n                <div class=\"card\">\n          <h3>海外向けデジタル商品（言語市場の裁定） <span class=\"badge pending\">テスト枠・候補</span></h3>\n          <p>言語の市場の間で、情報の値段は違う。日本語圏では当たり前で飽和している情報が、英語圏では薄くて売れることがある——その価格差を取りに行く形（<strong>言語市場の裁定</strong>）。候補4（海外アフィリエイト）が他人の商品を紹介する形なのに対して、こちらは<strong>自分の商品を売る</strong>形で、売れた商品はバックリスト（在庫）として残る。追い風は、AIで翻訳と制作のコストが落ち、この裁定の敷居が下がったこと。</p>\n          <ul>\n            <li><strong>置き場所</strong>：テスト枠の候補（決定ではない）。やるなら受験後。題材は「日本人にしか書けない日本の何か」を英語で売る形が筋</li>\n            <li><strong>正直な留保</strong>：きっかけになった投稿の収益数字（初月の金額など）は自己申告で裏付けがないため採っていない。「ブルーオーシャン」のような結論も置かない。残すのは、裏の取れる仕組みと実務だけ。重い部分は制作ではなく、英語圏での集客をゼロから作ること</li>\n            <li><strong>ノウハウの置き方</strong>：仕組みの本体は、次のグループ（仕組みと全体像／売り場の実務／他の売り場とnoteの限界／決済と税の基本／題材の当て方／集客の現実／進め方）に体系として置く</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>仕組みと全体像</h3>\n          <div class=\"flow\"><span>日本語圏で厚い知識</span><i>→</i><span>英語で再構成</span><i>→</i><span>海外の売り場で販売</span><i>→</i><span>円で銀行口座に受け取り</span></div>\n          <ul>\n            <li><strong>裁定が成り立つ条件</strong>：①日本語圏では情報が厚く、安く出回っている題材であること ②英語圏では同じ情報が薄いか、高く売られていること ③翻訳・制作のコストがAIで下がり、価格差に対して作業が見合うこと ④売り場と決済が既製のプラットフォームで済むこと</li>\n            <li><strong>翻訳ではなく再構成</strong>：日本語の記事を機械翻訳して並べるだけでは価値が薄い。英語圏の読者の前提（知らない制度・道具・文脈）を埋めて、1つの商品として作り直すのが本体の作業</li>\n            <li><strong>資産性</strong>：売れた商品のバックリストは在庫として残り続ける。候補1（make.fun）の懸賞型と違い、積み上げがゼロにはならない。集客の努力も、商品1点ではなくバックリスト全体に効く</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>売り場の実務（Gumroad）</h3>\n          <p>本命の売り場はGumroad。手数料は公式ヘルプの数字で読む。</p>\n          <div class=\"stats\">\n            <div class=\"stat\"><div class=\"v\">10<small>%</small> + $0.50</div><div class=\"k\">直接販売（自分のリンク・プロフィール経由）のプラットフォーム手数料。これにカード処理料 2.9% + $0.30 が別途かかる</div></div>\n            <div class=\"stat\"><div class=\"v\">30<small>%</small></div><div class=\"k\">Discover（Gumroad内のマーケット）経由の販売は一律30%。処理料込み</div></div>\n            <div class=\"stat\"><div class=\"v\">5<small>%</small> + $0.50</div><div class=\"k\">その月の有料売上が $20,000 に達した後の直接販売は、この料率に下がる</div></div>\n            <div class=\"stat\"><div class=\"v\">$100</div><div class=\"k\">出金の最低残高（米ドル相当）。届くまで出金されない</div></div>\n          </div>\n          <ul>\n            <li><strong>手数料の実感（公式手数料からの計算）</strong>：$5の商品が直接売れると、手数料の合計は約$1.45で手取りは約$3.55（約71%）。$20なら手数料約$3.38で手取り$16.62（約83%）。固定費（$0.50 + $0.30）が毎回かかるため、安い商品ほど構造的に不利になる</li>\n            <li><strong>税はGumroadが持つ</strong>：2025年1月からGumroadは販売主体（Merchant of Record）として動き、世界中の売上税・VAT・GSTをGumroad側が計算・徴収・納付する。売り手が各国の税を個別に処理する必要はない（決済と税の基本のグループと対）</li>\n            <li><strong>日本からの受け取り</strong>：銀行口座への円（JPY）入金に対応している（公式の対応表に Japan／JPY）。週次の出金日は火曜で、前週金曜（UTC）までの売上が対象、売上には7日間の保留期間がある。本人確認（KYC）は、売上が積み上がった段階で決済代行のStripe経由で求められる</li>\n            <li><strong>受け取りの制約</strong>：PayoneerやWiseでの出金はできない（公式）。出金先は居住国の銀行口座に限られ、通貨はその国の通貨になる。換算は payout 時ではなく売上時点のレートで行われる</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>他の売り場とnoteの限界</h3>\n          <div class=\"lanes\">\n            <div class=\"lane art\">\n              <h3>海外の売り場</h3>\n              <p>Gumroadが本命。代替はPaddle（5% + 50¢、同じく販売主体型で税を処理する。料金は2026年10月時点の公式料金ページ）。注意として、Lemon Squeezyは2026年11月に新規受付を終了し、2027年3月末で決済を停止するため、新規の選択肢にはならない——プラットフォーム自体が終わるリスクの実例でもある。Stripeで直接売る形は手数料が安い代わりに、税務と実名まわりを全部自分で持つ（収益化の実務メモのとおり）。</p>\n            </div>\n            <div class=\"lane other\">\n              <h3>noteの限界</h3>\n              <p>「海外note」という言い方への正直な評価。noteは日本語圏では強いが、海外向けの売り場としては限界がある。画面と発見の場が日本語圏に閉じている／公式ヘルプ上、海外発行のクレジットカードは決済できない場合がある（有料記事はPayPal決済にも対応）／売上の振込先は国内の銀行口座のみ。つまり実態は「海外の読者にnoteで売る」ではなく、「日本の題材を、英語圏の売り場に移して売る」話として読むのが正確。</p>\n            </div>\n          </div>\n        </div>\n        <div class=\"card\">\n          <h3>決済と税の基本</h3>\n          <ul>\n            <li><strong>日本の消費税</strong>：デジタル商品の提供は「電気通信利用役務の提供」に当たる。課税の内外判定は、受け手（買い手）の住所地で決まる（国税庁）。国外の消費者への提供は国外取引となり、日本の消費税は不課税</li>\n            <li><strong>買い手側の国の税</strong>：EUのVATのように、買い手の国の税は別問題として立つ。販売主体型の売り場（Gumroad、Paddle）ではプラットフォームが処理するが、自分が販売主体になる形（Stripe直接など）では自分で負う。売り場選びでこの差は大きい</li>\n            <li><strong>所得税</strong>：日本に住んでいる限り、海外での売上も含めた全世界所得が課税対象になる。売上は確定申告で事業所得（または雑所得）として申告し、プラットフォーム手数料は経費にできる。海外で源泉徴収される話とは別に、日本側の申告は常にある</li>\n            <li><strong>記録</strong>：出金は円で銀行口座に入るので、売上と手数料の明細（プラットフォームのCSV等）を申告用に残すのが実務になる</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>題材の当て方</h3>\n          <p>「日本人にしか書けない日本の何か」を、当て勘ではなく基準で選ぶ。</p>\n          <ul>\n            <li><strong>基準1・厚さの差</strong>：日本語で検索すると情報が厚く安く出てくるのに、英語で検索すると薄い・古い・高い、という落差がある題材か</li>\n            <li><strong>基準2・裏が取れる</strong>：自分の実体験や実物で中身の裏が取れるか。翻訳だけの転売は薄く、著作権の面でも危うい。他人の日本語記事の翻訳販売はやらない</li>\n            <li><strong>基準3・買う理由の形</strong>：英語圏の読者が「how to」「guide」「template」のような、買う前提の検索をする形にできるか（候補4の「検索意図の温度」と同じ読み方）</li>\n            <li><strong>候補の出し方</strong>：自分の棚卸しから出す——自分が当たり前に知っていて、日本語圏では無料同然に出回っている知識（受験・制作の実務、道具と素材の扱い、日本の市場や文化の内部情報など）を書き出し、英語検索での薄さと突き合わせる。最初の作業は、この突き合わせで候補を3つに絞ること</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>集客の現実</h3>\n          <ul>\n            <li><strong>置くだけでは売れない</strong>：売り場の棚に置くことと、見つけてもらうことは別。GumroadのDiscover経由は発見を肩代わりする代わりに手数料30%で、自分の導線で売る直接販売（10% + $0.50 + 処理料）との差が、そのまま集客の値段になる</li>\n            <li><strong>重い部分はここ</strong>：英語圏での発見可能性——検索（SEO）、SNS、コミュニティへの露出を、ゼロから作る必要がある。候補4と重さの在り処は同じで、制作より集客が本体の仕事になる。受験期にやる作業ではない</li>\n            <li><strong>候補4との違い</strong>：比較記事は他人の商品への送客だが、こちらは自分の商品。在庫が残る分、集客の成果は1回で終わらずバックリスト全体に効く</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>進め方</h3>\n          <ol class=\"steps\">\n            <li data-n=\"1\"><span class=\"st\">題材候補を3つ書き出す</span><span class=\"sd\">題材の当て方の基準（厚さの差／裏が取れる／買う理由の形）で採点して絞る</span></li>\n            <li data-n=\"2\"><span class=\"st\">売り場の下ごしらえ</span><span class=\"sd\">Gumroadで受け取り設定（銀行口座）と本人確認を先に済ませ、出金までの道を確認する</span></li>\n            <li data-n=\"3\"><span class=\"st\">最小の商品を1つ作る</span><span class=\"sd\">翻訳ではなく、英語圏の読者の前提を埋めた再構成として作る</span></li>\n            <li data-n=\"4\"><span class=\"st\">価格を付ける</span><span class=\"sd\">固定費に食われない帯で付ける（手数料の実感の計算が目安）</span></li>\n            <li data-n=\"5\"><span class=\"st\">集客の入口を1つ作る</span><span class=\"sd\">検索かSNSか、題材に合う入口を1つに絞って置く</span></li>\n            <li data-n=\"6\"><span class=\"st\">数字で見る</span><span class=\"sd\">表示→購入の転換と返金を見て、題材を続けるか変えるか判断する</span></li>\n          </ol>\n          <p class=\"firststep\"><strong>最初の一歩：</strong>「日本人にしか書けない日本の何か」の題材候補を3つ書き出す<br><strong>時期：</strong>受験後（2027年3月以降）</p>\n          <p class=\"sources\">きっかけ・出典：Xで見かけた「海外note」系の投稿（収益の自己申告は裏付けがないため採っていない）。本文の数字と仕組みは、Gumroad公式ヘルプ（手数料／受け取り）、note公式ヘルプ（サービス別の支払い方法）、国税庁「国境を越えた役務の提供に係る消費税の課税関係について」、Paddleの公式料金（2026年11月確認）に拠る</p>\n        </div>\n        <div class=\"card\">\n          <h3>海外アフィリエイト比較記事（AI自動） <span class=\"badge pending\">テスト枠・候補</span></h3>\n          <p>英語圏向けに、他人の商品（主にSaaS）を<strong>比較記事で紹介して、紹介料を得る</strong>形。候補3（海外向けデジタル商品）と同じ「言語市場の裁定」の系統だが、候補3が自分の商品を売る形なのに対して、こちらは商品を持たず「買う直前の読者を連れてくる仕事」を売る。狙うのは「少ない件数×高い単価」の型で、比較記事という中身は資産として積み上がる。</p>\n          <ul>\n            <li><strong>置き場所</strong>：テスト枠の候補（決定ではない）。受験後に回す枠で、実践は受験後。知識の蓄積だけは受験前から進めてよい</li>\n            <li><strong>正直な留保</strong>：きっかけになった原典に収益の実績証拠はない（単価×件数の計算の提示のみ）。記事自体が無料LINE教材への誘導で、投稿者の本当の狙いは見込み客集めと見ている。重い部分は、英語圏での集客とSEOの信頼づくり</li>\n            <li><strong>ノウハウの置き方</strong>：仕組みの本体は、次のグループ（全体像とお金の流れ／成果の測り方／単価の構造／集客の経済学／ルール／損なうパターン／進め方）に体系として置く</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>全体像とお金の流れ</h3>\n          <p>アフィリエイト（成果報酬型広告）は4者で成り立つ。<strong>広告主</strong>（商品を売りたい会社。例：SemrushのようなSaaS企業）、<strong>ASP／ネットワーク</strong>（計測・集計・支払いを代行。海外ではImpact、ShareASaleなど。日本ではA8.netなど）、<strong>媒体</strong>（記事や動画で紹介する側＝自分）、<strong>読者</strong>（リンクを踏んで買う人）。</p>\n          <div class=\"flow\"><span>読者がリンクを踏む</span><i>→</i><span>購入＝成果</span><i>→</i><span>広告主が広告費を払う</span><i>→</i><span>手数料を引いて媒体へ</span></div>\n          <p>媒体は在庫を持たず、商品も作らない。売っているのは「買う直前の読者を連れてくる仕事」で、報酬はその紹介料。単価・否認・リスクの話は全部ここにつながる。</p>\n          <div class=\"lanes\">\n            <div class=\"lane other\">\n              <h3>日本のASP型</h3>\n              <p>A8.net等のASPに登録し、日本語の広告案件を選ぶ。物販・金融・美容など国内商品が中心で、報酬は購入金額の数％か、申込1件の固定額。読者は日本語圏。</p>\n            </div>\n            <div class=\"lane art\">\n              <h3>海外（英語圏）型</h3>\n              <p>広告主の自社プログラムか、Impact等の海外ネットワーク経由。高単価の中心はSaaS（月額ソフト）で、報酬は1件ごとの固定額（バウンティ）が多い。読者は英語圏＝母数が桁違いに大きい。候補4が狙うのはこちら。</p>\n            </div>\n          </div>\n        </div>\n        <div class=\"card\">\n          <h3>成果の測り方</h3>\n          <p>成果は一発で確定しない。段階を踏む。</p>\n          <ol class=\"steps\">\n            <li data-n=\"1\"><span class=\"st\">クリック</span><span class=\"sd\">読者がリンクを踏む</span></li>\n            <li data-n=\"2\"><span class=\"st\">成果発生（コンバージョン）</span><span class=\"sd\">読者が購入・申込をする。この時点ではまだ「仮」の数字</span></li>\n            <li data-n=\"3\"><span class=\"st\">承認</span><span class=\"sd\">広告主が「正当な成果だ」と認めて、初めて報酬が確定する</span></li>\n            <li data-n=\"4\"><span class=\"st\">支払い</span><span class=\"sd\">ネットワーク経由で振り込まれる（最低支払額や締め・支払いサイクルはプログラムにより異なる）</span></li>\n          </ol>\n          <ul>\n            <li><strong>否認</strong>：発生した成果の一部は広告主に否認される。主な理由は、読者のキャンセル・返金／不正や自己購入などの規約違反／重複計測（他の媒体のリンクが優先）／無料体験だけで終わり有料転換しなかった（条件による）。管理画面の「発生額」は確定収入ではなく、<strong>否認率</strong>を引いたものが実収入になる。否認率はプログラムにより大きく違うので、始める前に規約と条件を読むのが実務の第一歩</li>\n            <li><strong>クッキー期間</strong>：リンクを踏んでから一定期間内に買えば、時間が空いても成果になる計測の有効期間。数日のものから120日超のものまであり、長いほど媒体に有利</li>\n            <li><strong>ラストクリック</strong>：最後に踏んだリンクの媒体に成果が付く方式が一般的（Semrushもこの方式）</li>\n            <li><strong>EPC</strong>（1クリックあたりの収益＝総報酬÷クリック数）：記事同士・媒体同士の効率を比べる物差し。例：1,000クリックで成果5件、1件$200なら総報酬$1,000でEPCは$1。「月いくら」ではなくEPCと否認率で見るのが、仕組みとしての数字の読み方</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>単価の構造</h3>\n          <p>具体例はSemrushの公式アフィリエイトプログラム（Impact経由、ラストクリック、クッキー120日）。</p>\n          <div class=\"stats\">\n            <div class=\"stat\"><div class=\"v\">$200</div><div class=\"k\">SEO Toolkitの新規成約1件（基本ランク）。実績ランクが上がると$250→$300→$350</div></div>\n            <div class=\"stat\"><div class=\"v\">$10</div><div class=\"k\">無料トライアルの有効化1件</div></div>\n            <div class=\"stat\"><div class=\"v\">120<small>日</small></div><div class=\"k\">クッキー期間。この間に買えば成果になる</div></div>\n            <div class=\"stat\"><div class=\"v\">1<small>回払い</small></div><div class=\"k\">継続課金の分配ではない（条件は改定されることがあるため、参加時に公式ページで再確認する）</div></div>\n          </div>\n          <ul>\n            <li><strong>なぜ1件$200を払えるのか</strong>：LTV（顧客1人が契約期間全体で払う合計）とCAC（顧客1人を得る費用）の関係。Semrushの料金は月額約$140〜$500で、顧客が1年続ければLTVは$1,700〜$6,000規模。獲得に$200を払っても元が取れる。「1件$200」は魔法でも好意でもなく、LTVの中からCACとして切り分けているだけ</li>\n            <li><strong>高単価・低頻度型</strong>（SaaS・金融・高額講座）：1件数千円〜数万円。必要なのは「買う直前の読者」を少数、正確に連れてくること。候補4が狙う型</li>\n            <li><strong>低単価・高頻度型</strong>（日用品・書籍・安い物販）：1件数十円〜数百円。1回しか買わない物はLTVが小さいので紹介料も購入金額の数％にしかならず、大量のアクセスが要る</li>\n            <li><strong>継続分配型</strong>（レベニューシェア）：顧客が払い続ける限り毎月数％〜数十％が入る。Semrushは1回払いだが、継続型は「積み上がる資産」になりやすい代わりに単月の入りは小さい。プログラム選びではこの違いが効く</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>集客の経済学</h3>\n          <ul>\n            <li><strong>検索意図の温度</strong>：検索する言葉には温度がある。「SEOとは」＝調べもので買う気は薄い。「Semrush vs Ahrefs」＝比べている、<strong>買う直前</strong>。「Semrush 割引」「Semrush pricing」＝ほぼ決めている。比較記事が刺さるのは2番目の読者を取るからで、媒体の仕事は「悩みの分析→候補の絞り込み→判断材料の提示」。これは広告主にとっても質の高い送客になる</li>\n            <li><strong>E-E-A-T</strong>：Googleの評価軸で、経験（Experience）・専門性（Expertise）・権威性（Authoritativeness）・信頼性（Trustworthiness）。比較記事では特に「実際に使った経験があるか」と「情報が正確か」が問われる。公式情報ベースの比較は正確さでは戦えるが、経験の部分は偽装できない</li>\n            <li><strong>AI量産へのGoogleの姿勢（公式）</strong>：AIで作ったこと自体は違反ではない（「どう作ったか」ではなく「読者に役立つか」で評価）。一方、検索順位の操作目的で価値の薄いページを大量生成する「スケールド・コンテンツ・アビュース」はスパムポリシー違反で、2024年3月に明文化され、生成AIでの大量生成が代表例に挙がっている。違反すれば順位下落や手動対策の対象。「AIで記事を量産する」こと自体が、公式ポリシー上で最も危険な形に近い。回せるのは制作の補助までで、1記事ごとの独自の価値（正確な比較、判断の軸、実データ）が本体になる</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>ルール</h3>\n          <ul>\n            <li><strong>ステマ規制（日本）</strong>：2023年10月1日施行。景品表示法第5条第3号に基づく告示で、広告と分からない宣伝が不当表示になった。規制の直接の対象は広告主だが、実務上はASPがアフィリエイターに「広告」「PR」等の表示を規約で必須にしていて、表示しないと登録解除・報酬停止の対象になる。日本語の読者向けなら、記事の冒頭など目立つ位置に広告である旨を書くのが基準</li>\n            <li><strong>FTCの開示ガイドライン（米国）</strong>：英語圏向けならこちらが本命。Endorsement Guides（16 CFR Part 255、2023年改訂）で、報酬がかかる関係は読者が分かる言葉で、明確に目立つよう（clear and conspicuous）開示する。「affiliate link」と書くだけでは不十分（読者が「報酬が発生する」と理解できないため）。開示はリンクの近く、記事の早い位置に置く</li>\n            <li><strong>順位は金で売らない</strong>：報酬額でランキングの順位を操作して中立を装う行為は、開示しても欺瞞的とされる。順位は自分の判断で決め、その上で報酬関係を開示するのが正しい形</li>\n            <li><strong>規約違反で起きること</strong>：未払い報酬の没収、提携解除・アカウント停止（ネットワーク全体で共有される場合もある）。典型的な違反は、ブランド名への広告入札、クッキースタッフィング等の不正計測、虚偽の体験談、根拠のない断定表現（「最安」「絶対」など）</li>\n            <li><strong>匿名の範囲</strong>：ネットワークへの登録には本人確認と振込先情報が要る。「匿名」は読者に対してであり、プラットフォームに対してではない。ここを取り違えると設計が崩れる</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>損なうパターン</h3>\n          <ul>\n            <li><strong>否認率</strong>：発生額がそのまま入るわけではない。返金されやすい商品は構造的に否認が増える</li>\n            <li><strong>プログラムの終了・条件改定</strong>：広告主がプログラムを閉じたり単価を下げたりすれば、その記事の収益は消える。Semrush自身、過去に報酬体系を大きく変えている（旧BeRushの継続分配から1回払いへ）。1プログラム依存は構造的な弱さ</li>\n            <li><strong>検索順位の変動</strong>：集客がGoogle検索頼みなら、アップデート1回で流入が激減しうる。スパムポリシー違反はその最たるもの</li>\n            <li><strong>ラストクリックの奪い合い</strong>：購入直前に別の媒体のリンク（クーポンサイト等）を踏まれると、成果はそちらに付く</li>\n            <li><strong>計測の漏れ</strong>：広告ブロッカーやブラウザのトラッキング制限で、成果が計測されないことがある</li>\n          </ul>\n          <p>どれも「頑張り」で消えるリスクではなく、仕組みに組み込まれた前提として織り込むもの。対策は分散（複数プログラム、複数の集客路）と、規約の範囲内で長く続けること。</p>\n        </div>\n        <div class=\"card\">\n          <h3>進め方</h3>\n          <p>工程は、きっかけになった原典が7日間ロードマップとして提示していた順で置く。</p>\n          <ol class=\"steps\">\n            <li data-n=\"1\"><span class=\"st\">ターゲット選定</span><span class=\"sd\">誰の、どんな悩みに当てるかを決める</span></li>\n            <li data-n=\"2\"><span class=\"st\">悩み分析</span><span class=\"sd\">検索意図の温度を見て、「買う直前」の言葉を拾う</span></li>\n            <li data-n=\"3\"><span class=\"st\">商品3件を公式情報で比較</span><span class=\"sd\">仕様・価格を公式情報から集め、比較表を作る</span></li>\n            <li data-n=\"4\"><span class=\"st\">英語の比較記事を書く</span><span class=\"sd\">順位は自分の判断で決め、報酬関係の開示を記事の早い位置に置く</span></li>\n            <li data-n=\"5\"><span class=\"st\">集客</span><span class=\"sd\">SEOを軸に、YouTube／X・Threadsへ展開する</span></li>\n            <li data-n=\"6\"><span class=\"st\">成果の確認</span><span class=\"sd\">発生で止めず、承認と否認率まで見る</span></li>\n            <li data-n=\"7\"><span class=\"st\">数字で改善</span><span class=\"sd\">EPCで記事同士を比べ、弱い記事から直す</span></li>\n          </ol>\n          <ul>\n            <li><strong>Museで回せる部分</strong>：ターゲットと悩みの洗い出し、キーワード候補出し、公式情報の収集と整理、比較表づくり、記事の構成案と下書き、英語への翻訳・推敲、公開後の数字（クリック・成果・EPC）の集計と改善案</li>\n            <li><strong>回せない／やってはいけない部分</strong>：実体験の偽装（使っていない商品を「使った」と書くのは虚偽表示の側に立つ。比較は「公式情報に基づく比較」と正直に位置づける）、開示の省略、推す商品と順位の最終判断、信頼の蓄積。切り分けの原則は1つ——Museは「調べる・比べる・書く・測る」の速度を上げる。判断と責任と信頼は人間側に残す</li>\n          </ul>\n          <p class=\"firststep\"><strong>最初の一歩：</strong>アフィリエイトの仕組みを学ぶ（Muse が用意する学習編を読む）<br><strong>時期：</strong>知識は受験前から可、実践は受験後</p>\n          <p class=\"sources\">きっかけ・出典：Xの記事「Muse自動×海外アフィが想像以上に最強だった（プロンプトも公開）」（とら🐯AI副業 @3Imzdo3）。原典の収益数字は実績の証拠がないため採っていない。本文の数字と仕組みは学習編「アフィリエイトの仕組み」（Semrush公式アフィリエイトプログラム、Google Search Central、消費者庁、FTCの公式情報に基づく）の記載に拠る</p>\n        </div>",

   "html": "<div class=\"detail-head\"><h2>図鑑事業</h2><span class=\"badge decided\">2026-11-19 決定</span></div>\n        <p class=\"sec-lead\">図鑑アプリの仕組み（エンジン）は分野を選ばない。金の変え方は、分野によって2つに分けることが決まった。</p>\n        <div class=\"branch2\">\n          <div class=\"b-src\">図鑑の仕組み（エンジン）</div>\n          <div class=\"b-stem\"></div>\n          <div class=\"b-bar\"></div>\n          <div class=\"b-cols\">\n            <div class=\"b-col art\"><span class=\"b-t\">美術分野</span><span class=\"b-v\">受託</span><span class=\"b-d\">画廊・画家・美術団体から構築を受ける</span></div>\n            <div class=\"b-col other\"><span class=\"b-t\">他ジャンル</span><span class=\"b-v\">横展開</span><span class=\"b-d\">自前アプリとして売り出す</span></div>\n          </div>\n        </div>\n        <div class=\"lanes\">\n          <div class=\"lane art\">\n            <h3>美術分野 ＝ 受託</h3>\n            <p>画廊・画家・美術団体などの「自分たちの図鑑が欲しいけど作れない」側から、構築を受ける。狙いは<strong>金＋美術界との縁＋実績</strong>の3つ同時。</p>\n            <ul>\n              <li><strong>客の像</strong>：自分の全作品のアーカイブが欲しい画家本人／小さい画廊・美術団体／ファンコミュニティ／専門店／小さい博物館・資料館／コレクター</li>\n              <li><strong>売る物の3段</strong>：構築一式（データ整形込み）／点数単位のデータ化／月額の運用代行</li>\n              <li><strong>条件</strong>：渡すのは完成したアプリだけ。エンジンの権利は翔万に残す。データの権利は発注側に置く</li>\n              <li><strong>始動</strong>：納期のある他人の仕事なので、本格始動は受験後</li>\n            </ul>\n            <p class=\"firststep\"><strong>最初の一歩：</strong>受託の受け皿（何を・いくらで・どのくらいで作れるかの一枚）を作る<br><strong>時期：</strong>受験後（2027年3月以降）に本格始動</p>\n          </div>\n          <div class=\"lane other\">\n            <h3>他ジャンル ＝ 横展開</h3>\n            <p>ジャンルごとの図鑑を自前アプリとして売り出し、アプリ収入の階段に乗せる。名前のリスクがない分野で、匿名のまま展開できる。</p>\n            <ul>\n              <li><strong>実装済みの証明</strong>：音楽／映画／食材</li>\n              <li><strong>効く分野の条件</strong>：「人と作品と記録」の蓄積型で、ファンが深く調べたくて、既存の情報が散らかっている場所</li>\n              <li><strong>候補</strong>：スポーツ記録（野球選手・力士）／声優・アイドル／漫画／名車／時計／スニーカー</li>\n            </ul>\n            <p class=\"firststep\"><strong>最初の一歩：</strong>候補の中から、最初に出す分野を1つ決める<br><strong>時期：</strong>受験後（2027年3月以降）</p>\n          </div>\n        </div>\n        <h3>受託の進め方</h3>\n        <ol class=\"steps\">\n          <li data-n=\"1\"><span class=\"st\">受け皿を作る</span><span class=\"sd\">何を・いくらで・どのくらいで作れるかを一枚にまとめる。価格は「安さ」ではなく「この形は他にない」で立てる</span></li>\n          <li data-n=\"2\"><span class=\"st\">見本で示す</span><span class=\"sd\">自分の図鑑アプリ群（作家図鑑、音楽・映画・食材の図鑑）が、そのまま動いている実演になる。説明より先に、完成した物を触ってもらう</span></li>\n          <li data-n=\"3\"><span class=\"st\">条件を先に固定する</span><span class=\"sd\">渡すのは完成したアプリだけ。エンジンの権利は翔万に残し、データの権利は発注側に置く。条件は交渉の場で動かさない</span></li>\n          <li data-n=\"4\"><span class=\"st\">構築する</span><span class=\"sd\">データの収集・整形はこちらで担い、完成したアプリを渡す。発注側の作業は、素材の提供と確認だけに寄せる</span></li>\n          <li data-n=\"5\"><span class=\"st\">運用を続ける</span><span class=\"sd\">月額の運用代行で更新と保守を引き受け、1回で終わらない関係にする</span></li>\n        </ol>\n        <p>狙いは金の額だけではない。画廊・画家・美術団体との<strong>縁</strong>と、美術分野での<strong>実績</strong>が同時に手に入ることが、この形の本体。納期のある他人の仕事なので、本格始動は受験後。</p>\n        <h3>横展開の進め方</h3>\n        <ol class=\"steps\">\n          <li data-n=\"1\"><span class=\"st\">分野を選ぶ</span><span class=\"sd\">条件は3つ。「人と作品と記録」の蓄積型であること／ファンが深く調べたくなる分野であること／既存の情報が散らかっていること</span></li>\n          <li data-n=\"2\"><span class=\"st\">型を移植する</span><span class=\"sd\">エンジン（カード表示・年表・関係図・価格記録・Drive同期）をそのまま使い、作るコストを型で下げる。アプリは動く時にAIを呼ばないので、運営費はゼロのまま出せる</span></li>\n          <li data-n=\"3\"><span class=\"st\">データを集めて選ぶ</span><span class=\"sd\">時間をかけるのはここ。データの深さと正確さ、本人の目による選定、元々の文章（ガイド・調査）——この3つが、コードでは真似できない堀になる</span></li>\n          <li data-n=\"4\"><span class=\"st\">公開して集客する</span><span class=\"sd\">分野ごとに集客は要る。出したら、ビジネス計画のアプリ収入の階段と検証の段に乗せて判定する</span></li>\n          <li data-n=\"5\"><span class=\"st\">積み上げる</span><span class=\"sd\">出た図鑑が増えるほど、データの集計レポートや受託の見本として効く範囲が広がる。1本ごとの弱さが、束になることで強みに変わる</span></li>\n        </ol>\n        <h3>決まっている線引き</h3>\n        <ul>\n          <li><strong>エンジンのキット販売はしない</strong>。仕組みを公開することになるため。売るのは完成品であって、作り方ではない</li>\n          <li><strong>アプリは動く時にAIを呼ばない</strong>。AIが働くのは作る時とデータを揃える時だけ。だから他人が使っても自分のAIアカウントは減らず、運営費もゼロのまま渡せる</li>\n          <li><strong>唯一無二性の堀は3つ</strong>：データの深さと正確さ／本人の目による選定／元々の文章（ガイド・調査）。コードは真似できても、この3つは年月がかかる</li>\n        </ul>\n        <div class=\"note\">\n          <h3 style=\"margin-top:0\">特許についての結論</h3>\n          <p>今のアプリ群の大半は特許化が難しい。理由は3つ——進歩性の壁（既存技術の組み合わせと判断されやすい）、既に公開済み（救済は本人の公開から1年以内）、ソフトウェア単体では対象になりにくい。日記アプリのTodo（金額と写真の自動回収）も、ほしい物リスト等の先行例が大きく単体では厳しい見立て。</p>\n          <p>図鑑の独自性は仕組みの新しさではなく、データの量・編集・選定の蓄積にある。守りは著作権と「真似に同じ年月がかかる」という事実の側。特許の正しい出番は、自分の商品・仕組みを外に出す時に、<strong>公開する前に</strong>中核だけ検討すること。</p>\n          <p class=\"firststep\"><strong>最初の一歩：</strong>自分の商品・仕組みを次に外に出す時、公開前に特許の検討を1回挟む<br><strong>時期：</strong>公開の直前、その都度</p>\n        </div>\n        <p class=\"sources\">出典：図鑑事業と特許 決定事項（2026-11-19）</p>",
   "id": "zukan",
   "meta": "美術＝受託／他ジャンル＝横展開。キット販売はしない。特許の結論",

   "html": "<div class=\"detail-head\"><h2>ルール</h2><span class=\"badge decided\">決定済み</span></div>\n        <h3>評価の物差し（2つ）</h3>\n        <p>機会は「平均的な参加者の期待値」では測らない。上位を取る側として設計する。その上で問うのは2つ。</p>\n        <div class=\"judge\">\n          <div class=\"jq\"><span class=\"qn\">問い1</span><span><span class=\"qt\">その上位は、自分たちの実力で実際に取れる構造か</span><span class=\"qd\">参加者数と、審査が「質」か「最適化の削り合い」か</span></span></div>\n          <div class=\"jarrow\">↓</div>\n          <div class=\"jq\"><span class=\"qn\">問い2</span><span><span class=\"qt\">取った位置が、資産として残るか</span><span class=\"qd\">勝っても次の案件でゼロからなら、椅子は残らない</span></span></div>\n          <div class=\"jarrow\">↓</div>\n          <div class=\"jout\"><span class=\"jok\">2つとも通る → 上位を取りに行く</span><span class=\"jng\">1つでも欠ける → やらない</span></div>\n        </div>\n        <h3>禁止ライン（8つ）</h3>\n        <p>判定は「バレるか」ではない。<strong>revealテスト</strong>——将来、本名と顔を出して同じ売り方を説明できるか——を通らないものはやらない。</p>\n        <ul class=\"checklist\">\n          <li>裏付けのない／水増しした収入・実績・効果の数字を広告に使う</li>\n          <li>「絶対稼げる」等の断定的な表現で情報商材・スクール・コンサルを売る</li>\n          <li>ステマ（PRを隠す／広告主に隠させる）</li>\n          <li>無許可の反復継続転売、資格を偽った仕入れ、定価超チケット転売</li>\n          <li>わいせつ物の頒布・陳列にあたる成人向け販売</li>\n          <li>収益の無申告・過少申告</li>\n          <li>他人の著作物・商標・キャラ・肖像を無断で使った商品販売</li>\n          <li>買い手の不安・借金・焦りを煽る高額勧誘</li>\n        </ul>\n        <h3>やらないこと</h3>\n        <ul>\n          <li>株・FX（元手がない段階では再現性なし）</li>\n          <li>スクール事業（実績ができるまで封印）</li>\n          <li>アダルト（匿名でも最低優先。原則やらない）</li>\n          <li>生活費を事業の成果に賭けること</li>\n          <li>図鑑エンジンのキット販売（仕組みの公開になるため）</li>\n        </ul>\n        <h3>実現のルール（2026-11-20）</h3>\n        <ol class=\"rules\">\n          <li>計画には最初の一歩と時期を付ける。実現したかどうかは、文書ができたかではなく、世の中の側が変わったか（出荷・出品・応募・最初の取引）で数える</li>\n        </ol>\n        <h3>知識のルール（2026-11-20）</h3>\n        <p><strong>「知識こそ土台であり金だ」</strong>——知識そのものが土台であり、資産だ。このアプリは計画の置き場ではなく、見て動ける知識の基盤として作る。稼ぐのは本人で、Muse の仕事はその知識を備えることにある。</p>\n        <ol class=\"rules\">\n          <li><strong>ノウハウの登録基準</strong>：本体は体系的な知識（手順・判断基準・数字・注意点まで、実行できる詳しさ）で書く。「大まかな流れ」の要約だけでは、登録したことにならない</li>\n          <li><strong>数字の裏付け</strong>：数字と事実は、公式・一次の出典で裏が取れるものだけを置く。裏の取れない収益数字や、煽りの結論は入れない</li>\n          <li><strong>出典の置き場所</strong>：きっかけ・出典は一番下に補足として小さく置く。本文の主役はノウハウのほうにする</li>\n          <li><strong>更新時の棚卸し</strong>：アプリを更新する時は、中身の古さ（過ぎた日付のままの文面、後の決定で置き換わった表現、数字の不整合）も同じ便で点検する。機械的に直せるものはその場で直し、計画の実質に関わる変更は本人の判断に回す</li>\n        </ol>",

   "html": "<div class=\"detail-head\"><h2>アイデアの網</h2><span class=\"badge pending\">未決定の候補</span></div>\n        <p class=\"sec-lead\">ここは計画ではない。いま手元にある資産から派生する案を、つながりごと並べて置く場所。案はどれも未決定で、決まったものだけが計画の側へ移る。</p>\n        <h3>起点——既にある資産</h3>\n        <div class=\"assets\">\n          <div class=\"asset\"><span class=\"an\">図鑑エンジン</span><span class=\"ad\">カード表示・年表・関係図・価格記録・Drive同期・データ収集と整形の型</span></div>\n          <div class=\"asset\"><span class=\"an\">蓄積データ</span><span class=\"ad\">作家・作品・展示・本・価格の記録と、制作ガイドや調査の文章</span></div>\n          <div class=\"asset\"><span class=\"an\">選定の目</span><span class=\"ad\">本人の目で選んだという編集。代表作の棚や関係の記録は他の誰の図鑑にもならない</span></div>\n          <div class=\"asset\"><span class=\"an\">集客ノウハウ</span><span class=\"ad\">調査7本分の実測知。結果画面の型、質問投稿、信用の橋渡し</span></div>\n          <div class=\"asset\"><span class=\"an\">アプリ群</span><span class=\"ad\">図鑑・日記・音楽・映画・食材など、実際に動いている自作アプリ</span></div>\n          <div class=\"asset\"><span class=\"an\">受託の形</span><span class=\"ad\">完成品だけを渡し、エンジンの権利は手元に残す渡し方</span></div>\n          <div class=\"asset\"><span class=\"an\">横展開</span><span class=\"ad\">同じ型を別ジャンルへ広げる進み方。音楽・映画・食材で実証済み</span></div>\n          <div class=\"asset\"><span class=\"an\">特許の検討</span><span class=\"ad\">「公開する前に中核だけ検討する」という判断軸</span></div>\n          <div class=\"asset\"><span class=\"an\">特殊素材への興味</span><span class=\"ad\">画材・支持体・材料への関心と知識。制作と地続きの発明の種</span></div>\n          <div class=\"asset\"><span class=\"an\">アートビジネスの階段</span><span class=\"ad\">価格の階段と、記録・認証の仕組み。作品を売る側の設計図</span></div>\n        </div>\n        <h3>派生するアイデア</h3>\n        <div class=\"idea\" id=\"idea-daicho\">\n          <h3>画家のための作品台帳アプリ</h3>\n          <div class=\"tags\"><span class=\"tl\">起点</span><span class=\"tag\">図鑑エンジン</span><span class=\"tag\">蓄積データの型</span><span class=\"tag\">アートビジネスの階段（記録・認証）</span></div>\n          <p>候補Cの具体形。自分の作品の記録・認証の仕組みを、そのまま同業者向けの道具にする。無人地帯（スマホ完結・日本語・私的な台帳）に置く。</p>\n          <p class=\"firststep\"><strong>最初の一歩：</strong>自分の作品1点を、台帳の型（作品1点カード）で試しに記録してみる<br><strong>時期：</strong>Cの段0が決まったら（今〜共通テストに決める）</p>\n          <p class=\"links\">つながる先：<a href=\"#idea-jutaku\" data-scroll=\"idea-jutaku\">受託パッケージ</a>の実演・見本になる／<a href=\"#idea-yoko\" data-scroll=\"idea-yoko\">横展開ライン</a>と同じ型で作れる</p>\n        </div>\n        <div class=\"idea\" id=\"idea-jutaku\">\n          <h3>画廊・画家向け「図鑑構築」受託パッケージ</h3>\n          <div class=\"tags\"><span class=\"tl\">起点</span><span class=\"tag\">図鑑エンジン</span><span class=\"tag\">受託の形</span><span class=\"tag\">選定の目</span></div>\n          <p>構築一式＋データ化＋運用代行の3段を、値段と納期の目安つきで一枚にまとめた受け皿。美術界との縁と実績が、金と同時に手に入る形。</p>\n          <p class=\"firststep\"><strong>最初の一歩：</strong>構築一式の値段と納期の目安を決めて、一枚に書く<br><strong>時期：</strong>受験後（2027年3月以降）</p>\n          <p class=\"links\">つながる先：受託で生まれた縁が、アートビジネスの<a href=\"#/art\" data-open-link=\"art\">「最初の買い手」「信用の橋渡し」</a>に効く／<a href=\"#idea-curation\" data-scroll=\"idea-curation\">キュレーション受託</a>へ広がる</p>\n        </div>\n        <div class=\"idea\" id=\"idea-yoko\">\n          <h3>ジャンル別図鑑の量産ライン</h3>\n          <div class=\"tags\"><span class=\"tl\">起点</span><span class=\"tag\">図鑑エンジン</span><span class=\"tag\">横展開</span><span class=\"tag\">集客ノウハウ</span></div>\n          <p>スポーツ記録・声優やアイドル・名車・時計・スニーカーなど、「人と作品と記録」の蓄積型で情報が散らかっている分野へ、同じ型で次々に出す。分野ごとに集客は必要だが、作るコストは型で下がる。</p>\n          <p class=\"firststep\"><strong>最初の一歩：</strong>最初に出す分野を1つ選ぶ<br><strong>時期：</strong>受験後（2027年3月以降）</p>\n          <p class=\"links\">つながる先：出た図鑑が増えるほど<a href=\"#idea-report\" data-scroll=\"idea-report\">集計レポート</a>の対象が広がる／当たった分野が<a href=\"#idea-daicho\" data-scroll=\"idea-daicho\">台帳</a>と同じ検証の階段に乗る</p>\n        </div>\n        <div class=\"idea\" id=\"idea-report\">\n          <h3>図鑑データの集計レポート</h3>\n          <div class=\"tags\"><span class=\"tl\">起点</span><span class=\"tag\">蓄積データ</span><span class=\"tag\">選定の目</span></div>\n          <p>権利がきれいな範囲の集計（展覧会や価格の動向）を、画廊やメディア向けに出す。ハードルは高いが、蓄積がそのまま商品になる形。</p>\n          <p class=\"firststep\"><strong>最初の一歩：</strong>権利がきれいな集計のテーマを1つ書き出す<br><strong>時期：</strong>受験後。横展開で図鑑が増えてから</p>\n          <p class=\"links\">つながる先：<a href=\"#idea-jutaku\" data-scroll=\"idea-jutaku\">受託</a>の客との接点になる／<a href=\"#idea-contents\" data-scroll=\"idea-contents\">受験生向けコンテンツ</a>と同じ「中身の切り売り」の系統</p>\n        </div>\n        <div class=\"idea\" id=\"idea-contents\">\n          <h3>ガイド・調査の受験生向けコンテンツ</h3>\n          <div class=\"tags\"><span class=\"tl\">起点</span><span class=\"tag\">蓄積データ（文章）</span><span class=\"tag\">集客ノウハウ</span></div>\n          <p>制作ガイドや美大カリキュラムの調査など、元々の文章の部分を、受験生向けに切り出して売る。図鑑の中身（作品画像や価格データ）とは別系統で、権利の問題が軽い。</p>\n          <p class=\"firststep\"><strong>最初の一歩：</strong>切り出して売る文章を1本選ぶ<br><strong>時期：</strong>受験後（2027年3月以降）</p>\n          <p class=\"links\">つながる先：発信が<a href=\"#idea-bokan\" data-scroll=\"idea-bokan\">送客の母艦</a>の一部になる</p>\n        </div>\n        <div class=\"idea\" id=\"idea-bokan\">\n          <h3>図鑑の発信を母艦にした作品販売</h3>\n          <div class=\"tags\"><span class=\"tl\">起点</span><span class=\"tag\">アプリ群</span><span class=\"tag\">集客ノウハウ</span><span class=\"tag\">アートビジネスの階段</span></div>\n          <p>図鑑まわりの発信が注目を集め、最終的に自分の作品の買い手につながる道。金そのものより、注目と縁の資産として効く。</p>\n          <p class=\"firststep\"><strong>最初の一歩：</strong>図鑑まわりの発信を1本出す<br><strong>時期：</strong>受験後。アートビジネス計画の提示（フェーズ1）と合わせて</p>\n          <p class=\"links\">つながる先：アートビジネスの<a href=\"#/art\" data-open-link=\"art\">価格の階段</a>の段0（無料の提示）と地続き</p>\n        </div>\n        <div class=\"idea\" id=\"idea-sozai\">\n          <h3>画材・支持体の実験から、小さな発明・商品へ</h3>\n          <div class=\"tags\"><span class=\"tl\">起点</span><span class=\"tag\">特殊素材への興味</span><span class=\"tag\">特許の検討</span></div>\n          <p>支持体の構造や材料の組み合わせは、特許の対象になりうる数少ない領域。制作の実験記録が、そのまま発明の種になる。出すなら公開する前に権利の検討を挟む。</p>\n          <p class=\"firststep\"><strong>最初の一歩：</strong>制作で素材の実験をしたら、材料と条件を記録に残す<br><strong>時期：</strong>今すぐ（普段の制作と一体で、負担を増やさない）</p>\n          <p class=\"links\">つながる先：商品化できればアートビジネスの<a href=\"#/art\" data-open-link=\"art\">価格の階段</a>の段1（素材・小物）に乗る</p>\n        </div>\n        <div class=\"idea\" id=\"idea-todo\">\n          <h3>Todoアプリの外部公開</h3>\n          <div class=\"tags\"><span class=\"tl\">起点</span><span class=\"tag\">アプリ群</span><span class=\"tag\">特許の検討</span><span class=\"tag\">集客ノウハウ</span></div>\n          <p>日記アプリのTodo（金額と写真の回収つき）を、友達向けから外へ出す候補。公開する前に、中核の仕組みだけ特許を検討するかどうかが論点になる。</p>\n          <p class=\"firststep\"><strong>最初の一歩：</strong>公開するかどうかを決め、公開するなら先に中核だけ特許の検討をする<br><strong>時期：</strong>受験後以降、公開を決めた時</p>\n          <p class=\"links\">つながる先：アプリ候補の<a href=\"#/business\" data-open-link=\"business\">検証の階段（段0〜段4）</a>に乗せて判定する</p>\n        </div>\n        <div class=\"idea\" id=\"idea-curation\">\n          <h3>他人のコレクションのキュレーション受託</h3>\n          <div class=\"tags\"><span class=\"tl\">起点</span><span class=\"tag\">選定の目</span><span class=\"tag\">受託の形</span><span class=\"tag\">図鑑エンジン</span></div>\n          <p>コレクターや店のコレクションを、テーマ別の「棚」として選び直し、図鑑の形に組む仕事。選定の目そのものが商品になる形。</p>\n          <p class=\"firststep\"><strong>最初の一歩：</strong>身近なコレクション1件を、テーマ別の「棚」に組み直した見本を作る<br><strong>時期：</strong>受験後。受託パッケージの受け皿ができてから</p>\n          <p class=\"links\">つながる先：<a href=\"#idea-jutaku\" data-scroll=\"idea-jutaku\">受託パッケージ</a>の上位メニューになる</p>\n        </div>\n        <p class=\"sec-lead\" style=\"margin-top:16px\">読み方：つながりの多い案ほど、既にある資産を無駄にしない。逆に、起点が1つしかない案は、それ単体の魅力で判断する。</p>",

   "html": "<div class=\"detail-head\"><h2>未決・保留</h2><span class=\"badge pending\">まだ決まっていない</span></div>\n        <p class=\"sec-lead\">ここにあるものは計画として確定していない。決まった計画のふりをして埋めていない項目の一覧。</p>\n        <ul class=\"pending-list\">\n          <li><span class=\"pt\">Cの段0——題材の一文が未確定</span><span class=\"pd\">「誰が・いつ・何に困って・今どう凌いでいるか」の一文。題材候補は作品台帳／制作ログ／画材在庫／シフトと収入の見える化。次の一歩はここ。</span>\n<p class=\"firststep\"><strong>最初の一歩：</strong>題材候補（作品台帳／制作ログ／画材在庫／シフトと収入の見える化）から1つを選び、「誰が・いつ・何に困って・今どう凌いでいるか」の一文を書く<br><strong>時期：</strong>今〜共通テスト（受験前から進めてよい決定作業）</p></li>\n          <li><span class=\"pt\">営業と集客を何から始めるか</span><span class=\"pd\">本人「わからない、またその時話そう」。受託の最初の1件の取り方と、横展開アプリの集客が対象。最大の未知数はここ。</span>\n<p class=\"firststep\"><strong>最初の一歩：</strong>受験後に、この保留を開いて話す場を1回持つ<br><strong>時期：</strong>受験後（2027年3月以降）。それまでは保留のまま置く</p></li>\n          <li><span class=\"pt\">受託の受け皿が未作成</span><span class=\"pd\">何を・いくらで・どのくらいで作れるかの一枚。価格は「安さ」ではなく「この形は他にない」で立てる方針だけ決まっている。</span>\n<p class=\"firststep\"><strong>最初の一歩：</strong>何を・いくらで・どのくらいで作れるかを、一枚に書き出す<br><strong>時期：</strong>受験後（2027年3月以降）</p></li>\n          <li><span class=\"pt\">横展開の最初の分野が未定</span><span class=\"pd\">候補は並んでいるが、どこから始めるかは決まっていない。</span>\n<p class=\"firststep\"><strong>最初の一歩：</strong>候補（スポーツ記録／声優・アイドル／漫画／名車／時計／スニーカー）から最初の1分野を選ぶ<br><strong>時期：</strong>受験後（2027年3月以降）</p></li>\n          <li><span class=\"pt\">投稿001 v3——Kling生成・選別待ち</span><span class=\"pd\">アートビジネス Phase 1 の第1段。マンダラチャートも保留中。</span>\n<p class=\"firststep\"><strong>最初の一歩：</strong>Kling で v3 のカットを生成し、使うカットを選別する（本人の作業）<br><strong>時期：</strong>受験後（アートビジネス計画のフェーズ1と連動）</p></li>\n          <li><span class=\"pt\">貯金への3万円の移動が未確認</span><span class=\"pd\">臨時収入5万円の分配（貯金3万／事業資金1万／浪費枠1万）は合意済みだが、移動が済んだかの確認が取れていない。</span>\n<p class=\"firststep\"><strong>最初の一歩：</strong>貯金用に分けた3万円を、実際に貯金側へ移す（済んでいたら、その確認だけ）<br><strong>時期：</strong>今すぐ（時期を選ばない小さな手続き）</p></li>\n          <li><span class=\"pt\">MacBookの復活テスト未実施</span><span class=\"pd\">型番・電源が入るか・ローン残額が未確認。復活すれば第2フェーズ（高単価の仕事）への橋になる。</span>\n<p class=\"firststep\"><strong>最初の一歩：</strong>名古屋の実家にいる時に、テレビに繋いで画面が映るか試す<br><strong>時期：</strong>次に実家へ帰った時</p></li>\n          <li><span class=\"pt\">Slavik分析の問いが未回答</span><span class=\"pd\">「虚構の蓄積は証明として機能するか」。お金の勉強の地図のステップ2「数字の式」も未実施。</span>\n<p class=\"firststep\"><strong>最初の一歩：</strong>Muse が用意する学習編「数字の式」を読む。Slavik の問いへの答えは、その時に一緒に考える<br><strong>時期：</strong>受験前から可（知識の蓄積）</p></li>\n        </ul>",

   "html": "<div class=\"detail-head\"><h2>お金とは何か</h2><span class=\"badge decided\">学習シリーズ ①</span></div>\n        <p class=\"sec-lead\">お金は、モノじゃない。記録だ。</p>\n        <h3>お金の流れ</h3>\n        <div class=\"flow\"><span>価値を渡す</span><i>→</i><span>認められる</span><i>→</i><span>記録が増える</span></div>\n        <p>お金そのものに価値はない。お金は「誰かに価値を渡した」という記録だ。渡した価値が認められたときだけ、記録が増える。</p>\n        <h3>2つの形</h3>\n        <div class=\"lanes\">\n          <div class=\"lane other\">\n            <h3>バイト（労働）</h3>\n            <p>時間を1回売って、1回分の記録をもらう形。確実だが、記録の量は「時間×時給」で頭打ちになる。</p>\n          </div>\n          <div class=\"lane art\">\n            <h3>仕組み</h3>\n            <p>一度作ったものが、何度も記録を生む形。動画1本、商品1点、顔のコレクション1つが、寝ている間も記録を生み得る。だから天井が違う。</p>\n          </div>\n        </div>\n        <div class=\"note\">\n          <p>逆に、誰の「欲しい」にも当たらなければ記録は0のまま。努力と記録が比例しないのが、この世界のいちばんきついところだ。</p>\n        </div>\n        <h3>翔万の数字で見ると</h3>\n        <div class=\"stats\">\n          <div class=\"stat\"><div class=\"v\">年600<small>万円</small></div><div class=\"k\">「月50万円分の記録を生み続ける状態」と言い換えられる</div></div>\n          <div class=\"stat\"><div class=\"v\">年1,000<small>万円</small></div><div class=\"k\">月83万円分の記録を生み続ける状態</div></div>\n        </div>\n        <p>問いは「頑張れるか」じゃなく「何が、誰の欲しいに当たって、記録を繰り返し生むか」になる。</p>\n        <h3>次のレッスン</h3>\n        <p>順番は「お金の勉強の地図」が背骨になる。ステップ1「ビジネスの管」（集客 → 興味・信頼 → 販売 → 継続）は済みで、次はステップ2。</p>\n        <ul>\n          <li><strong>② 数字の式</strong>（ステップ2・次の学習）：売上＝単価×客数×リピート、利益＝売上−経費、粗利、損益分岐点、手数料の読み方。お金タブ内の「数字の式」に用意してある</li>\n          <li>集客と販売の実務（ステップ3）：渇きの種類、オファー（提案の形）、価格の決め方、ファネルの指標の読み方</li>\n          <li>テストと改善（ステップ4）：仮説→小さく試す→数字で判定→当たった型だけ残す</li>\n          <li>守りの実務（ステップ5）：開業届・青色申告・確定申告／著作権／ステマ規制（PR表記）／特商法</li>\n          <li>仕組みの拡大（ステップ6）：ストック化、外注（お金で手を買う）、ライセンス、蛇口の複数化</li>\n          <li>投資・資産運用（ステップ7）：インデックス投資の基本、リスクと複利、詐欺の見分け方</li>\n        </ul>\n        <p>アフィリエイトの仕組み（誰が誰に、何の対価を払っているのか）は、地図の外の実地編として学習済みで、テスト候補4の中に体系として置いてある。</p>\n        <p class=\"sources\">出典・前提：翔万本人の言葉（2026-11-05）と、同日出た50方法マップの分布。数字の細部はマップ側に譲る。学習シリーズ ①（2026-11-05）、宿題なし</p>",

   "html": "<div class=\"detail-head\"><h2>数字の式</h2><span class=\"badge now\">次の学習</span></div>\n        <p class=\"sec-lead\">ビジネスの数字は、式で読む。「頑張る」の前に、どの数字を動かせばいいかが見えるようになるための回。学習シリーズ②（お金の勉強の地図のステップ2）。読むだけ、宿題なし。</p>\n        <div class=\"card\">\n          <h3>売上の式</h3>\n          <p>売上は、3つの数の掛け算だ。</p>\n          <div class=\"flow\"><span>単価</span><i>×</i><span>客数</span><i>×</i><span>リピート回数</span><i>＝</i><span>売上</span></div>\n          <ul>\n            <li><strong>単価</strong>：1回の取引でいくらもらうか</li>\n            <li><strong>客数</strong>：何人が買うか。客数はさらに「アクセス×転換率」に分解できる（転換率＝来た人のうち買った人の割合）</li>\n            <li><strong>リピート回数</strong>：同じ人が何回買うか</li>\n          </ul>\n          <p>3つのうち1つでも0なら、売上は0になる。逆に、どれか1つを2倍にできれば売上も2倍。「次にやること」は、この3つのどれを動かすかで決める。</p>\n          <p>月50万円（年600万円のペース）を式に当てはめると、必要な客数が単価でまるで変わる。</p>\n          <div class=\"stats\">\n            <div class=\"stat\"><div class=\"v\">約600<small>冊/月</small></div><div class=\"k\">単価980円のnote（手取り約838円/冊）で月50万円の手取りに届く量。28本あれば1本あたり月21冊ずつ売れ続ける計算</div></div>\n            <div class=\"stat\"><div class=\"v\">250<small>個/月</small></div><div class=\"k\">単価2,000円の自分の商品なら、月250個で同じ月50万円</div></div>\n            <div class=\"stat\"><div class=\"v\">10<small>件/月</small></div><div class=\"k\">単価5万円の仕事なら、月10件で同じ月50万円</div></div>\n          </div>\n          <p>「何をいくらで売るか」は好みの問題ではなく、「何人の客を集めなければならないか」の問題だ。客を集めるのが一番重い部分だから、単価が低いほど集客の負担は重くなる。</p>\n        </div>\n        <div class=\"card\">\n          <h3>利益の式と粗利</h3>\n          <div class=\"flow\"><span>売上</span><i>−</i><span>経費</span><i>＝</i><span>利益</span></div>\n          <p>売上50万円でも、経費が40万円かかっていれば手元に残る利益は10万円。「売れた金額」だけ見て安心するのが落とし穴で、見るべきはいつも引いた後の数字だ。</p>\n          <ul>\n            <li><strong>粗利</strong>＝売上−原価。原価は「商品そのものにかかった直接の費用」（材料費、印刷費、仕入れ値）。粗利率＝粗利÷売上</li>\n            <li><strong>デジタル商品が強い理由</strong>：noteや壁紙は1個作ればコピーの原価がほぼ0で、売上のほとんどが粗利になる。逆に、1個作るたびに時間や材料がかかるものは、売れるほど自分が忙しくなる</li>\n            <li><strong>計算例</strong>（物語のある物をメルカリで¥10,000で売る場合）：原価（石・金具など）¥3,000＋送料・梱包¥700が直接の費用で、粗利は¥6,300（粗利率63%）。ここから販売手数料10%（¥1,000）が引かれ、手元は¥5,300。振込手数料¥200は、売上を引き出す時に別にかかる</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>固定費と変動費</h3>\n          <ul>\n            <li><strong>固定費</strong>：売上に関係なく毎月かかる費用。いまの生活では家賃¥30,000＋MacBookローン¥6,000＝月¥36,000。事業側ではAIツールの月額などがここに入る</li>\n            <li><strong>変動費</strong>：売れるほど増える費用。材料費、送料、手数料、印刷費</li>\n            <li><strong>限界利益</strong>＝売上−変動費。固定費を賄う源泉はこれで、限界利益率＝限界利益÷売上。次の損益分岐点の計算に使う</li>\n          </ul>\n          <p>経費をこの2つに分けて初めて、「いくら売れば元が取れるか」が計算できるようになる。</p>\n        </div>\n        <div class=\"card\">\n          <h3>損益分岐点</h3>\n          <p>損益分岐点は、売上がちょうど費用と等しくなり、儲けがゼロになる地点。式は2つの形で持つ。</p>\n          <ul>\n            <li><strong>金額で</strong>：損益分岐点の売上＝固定費÷限界利益率</li>\n            <li><strong>件数で</strong>：損益分岐点の件数＝固定費÷（単価−1件あたりの変動費）</li>\n          </ul>\n          <p>計算例：固定費¥36,000（家賃＋ローン）を、仕組みの収入だけで賄おうとする場合。</p>\n          <div class=\"stats\">\n            <div class=\"stat\"><div class=\"v\">20<small>件/月</small></div><div class=\"k\">単価¥2,000・1件の変動費¥200（手数料など）の商品なら、¥36,000÷¥1,800＝20件で固定費に届く</div></div>\n            <div class=\"stat\"><div class=\"v\">約43<small>冊/月</small></div><div class=\"k\">単価980円のnote（手取り約838円、変動費ほぼ0）なら、¥36,000÷838≒43冊</div></div>\n          </div>\n          <p>チェックポイントの階段（月3万円＝家賃を仕組みが払う、月7万円＝バイト引退）は、この式で読むと「固定費を仕組みが賄い始める地点」の言い換えになっている。</p>\n        </div>\n        <div class=\"card\">\n          <h3>手数料の読み方</h3>\n          <p>表示価格と手取りは違う。手数料は「率（%）＋固定額（円）」の形が多く、固定額の部分は単価が低いほど重くのしかかる。</p>\n          <div class=\"stats\">\n            <div class=\"stat\"><div class=\"v\">約855<small>円</small></div><div class=\"k\">note：¥1,000の有料記事の手取りの目安（決済＋プラットフォーム手数料を引いた後）。振込の時に¥270が別にかかる</div></div>\n            <div class=\"stat\"><div class=\"v\">899<small>円</small></div><div class=\"k\">BOOTH：¥1,000のダウンロード商品の手取り。手数料は価格の5.6%＋¥45＝¥101</div></div>\n            <div class=\"stat\"><div class=\"v\">10<small>%</small></div><div class=\"k\">メルカリ：販売手数料は販売価格の10%（公式ガイド）。振込手数料は一律¥200</div></div>\n            <div class=\"stat\"><div class=\"v\">約83<small>%</small></div><div class=\"k\">Gumroad：$20の商品の手取りの目安（10%＋$0.50＋カード処理2.9%＋$0.30を引いた後）。$5だと約71%まで落ちる</div></div>\n          </div>\n          <ul>\n            <li><strong>固定額の効き方</strong>：BOOTHで¥500の商品なら手数料は¥28＋¥45＝¥73で手取り¥427（85.4%）。¥3,000なら¥168＋¥45＝¥213で手取り¥2,787（92.9%）。同じ売り場でも、単価で手取り率が変わる</li>\n            <li><strong>価格は手取りから逆算する</strong>：売値は「欲しい手取り＋手数料＋送料負担」で置く。特に、送料込みの総額に手数料がかかる売り場では、送料分にも手数料が乗る</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>キャッシュフローとリピート</h3>\n          <ul>\n            <li><strong>キャッシュフロー</strong>：利益が出ていても、手元の現金がなければ回らない。noteの売上は数週間〜1か月ほど遅れて振り込まれる。集客して、売れて、振り込まれるまでの時間差の間も、AIの月額や生活費は出ていく。「月50万円稼いでいる状態」と「月50万円が手元に入ってくる状態」は同じじゃない。バイトが種銭として残っているのは、この時間差を埋めるためでもある</li>\n            <li><strong>リピートが仕組みと労働を分ける</strong>：1回きりの販売は、客数を取り続けないと売上が止まる（バイトと同じで、やめたら0）。連載・シリーズ商品・月額の場のように同じ人が何度も買う形は、客を1人増やすたびに将来の購入分まで増える。検証で見るべきは再生数だけじゃなく、フォローや保存が増えているか——「次も見に来る人」が増えているかの記録だから</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>まとめ：数字を見る時の見方</h3>\n          <ol class=\"steps\">\n            <li data-n=\"1\"><span class=\"st\">分解する</span><span class=\"sd\">売上は「単価×客数×リピート」で見る。客数は「アクセス×転換率」まで割る</span></li>\n            <li data-n=\"2\"><span class=\"st\">引いた後を見る</span><span class=\"sd\">利益は「売上−経費」。売上だけ見ない。手数料は率＋固定額で読み、手取りから逆算する</span></li>\n            <li data-n=\"3\"><span class=\"st\">分岐点を置く</span><span class=\"sd\">固定費と変動費に分け、「いくら売れば元が取れるか」を件数で言えるようにする</span></li>\n            <li data-n=\"4\"><span class=\"st\">タイミングまで見る</span><span class=\"sd\">手元の現金がいつ入るか（キャッシュフロー）と、リピートがある形かどうかで、仕組みかどうかが決まる</span></li>\n          </ol>\n          <p class=\"firststep\"><strong>最初の一歩：</strong>次に「月いくら稼ぎたい」という数字を見たら、単価×客数×リピートに分解して、必要な客数を出してみる<br><strong>時期：</strong>今（知識の蓄積だけは受験前から進めてよい）</p>\n          <p class=\"sources\">出典：学習シリーズ②「数字の式」（お金の勉強の地図のステップ2）。手数料の数字は、note・BOOTHの確認済みの目安、メルカリ公式ガイド、Gumroad公式ヘルプ（候補3の調査で確認）に拠る</p>\n        </div>",
   "id": "numbers",

   "char": "図",
   "html": "<div class=\"detail-head\"><h2>お金の勉強の地図</h2><span class=\"badge now\">次は「数字の式」</span></div>\n        <p class=\"sec-lead\">全部を先に学ばない。「今のステージで必要なものだけ」を、1回3分で読める量で学ぶ。使わない知識は腐るし、勉強が「動けない」の隠れ蓑になる。順番は現在地に合わせてある。</p>\n        <h3>大きな流れ</h3>\n        <div class=\"flow\"><span>作る</span><i>→</i><span>守る</span><i>→</i><span>増やす（再投資）</span><i>→</i><span>運用する（投資）</span></div>\n        <h3>学ぶ順番</h3>\n        <ol class=\"steps\">\n          <li data-n=\"0\"><span class=\"st\">お金とは何か <span class=\"badge decided\">済み</span></span><span class=\"sd\">お金＝価値交換と信用の記録。渇きが止まった時に金が動く（学習シリーズ01）</span></li>\n          <li data-n=\"1\"><span class=\"st\">ビジネスの管 <span class=\"badge decided\">済み</span></span><span class=\"sd\">集客 → 興味・信頼 → 販売 → 継続。金は管のどこかで落ちる（道筋ファイル）</span></li>\n          <li data-n=\"2\"><span class=\"st\">数字の式 <span class=\"badge now\">次の学習</span></span><span class=\"sd\">売上＝単価×客数×リピート／利益＝売上−経費／粗利／キャッシュフロー（手元に現金が残るか）</span></li>\n          <li data-n=\"3\"><span class=\"st\">集客と販売の実務</span><span class=\"sd\">渇きの種類、オファー（提案の形）、価格の決め方、ファネルの指標の読み方。今の主戦場と直結</span></li>\n          <li data-n=\"4\"><span class=\"st\">テストと改善</span><span class=\"sd\">仮説→小さく試す→数字で判定→当たった型だけ残す。30本検証の考え方そのもの。検証と並行</span></li>\n          <li data-n=\"5\"><span class=\"st\">守りの実務</span><span class=\"sd\">開業届・青色申告・確定申告／著作権／ステマ規制（PR表記）／特商法。最初の収益が出たら</span></li>\n          <li data-n=\"6\"><span class=\"st\">仕組みの拡大</span><span class=\"sd\">ストック化、外注（お金で手を買う）、ライセンス、蛇口の複数化。月10万円が見えたら</span></li>\n          <li data-n=\"7\"><span class=\"st\">投資・資産運用</span><span class=\"sd\">インデックス投資の基本、リスクと複利、詐欺の見分け方。最後（余剰資金ができてから）</span></li>\n        </ol>\n        <h3>なぜ投資が最後なのか</h3>\n        <div class=\"note\">\n          <p>投資のリターンは「元本×利率」。元本10万円を年5%で運用しても年5,000円。同じ労力で「月1万円稼ぐ仕組み」を作れば年12万円で、しかも仕組みは育つ。</p>\n          <div class=\"flow\"><span>仕組みで元本を作る</span><i>→</i><span>税金と管理で守る</span><i>→</i><span>仕組みに再投資して増やす</span><i>→</i><span>余った分だけ運用する</span></div>\n          <p>例外として今すぐ必要な投資リテラシーは「守り」だけ：元本保証＋高利回りの話は詐欺、FX・仮想通貨のレバレッジは初心者の入口ではない、という見分け方。</p>\n        </div>\n        <h3>今は学ばなくていいもの</h3>\n        <ul>\n          <li>簿記の細部、法人設立の手続き論（売上が立ってからで間に合う）</li>\n          <li>株のチャート分析・短期売買（今のステージでは再現性がない）</li>\n          <li>節税テクニック（守るべき利益が出てから）</li>\n          <li>広告運用の詳細（集客の型が当たってから）</li>\n        </ul>\n        <p class=\"firststep\"><strong>最初の一歩：</strong>次の学習「数字の式」を読む（お金タブ内の「数字の式」に用意してある。読むだけ）<br><strong>時期：</strong>今（知識の蓄積だけは受験前から進めてよい）</p>",

   "html": "<div class=\"detail-head\"><h2>資産フェーズ</h2><span class=\"badge decided\">決定済み</span></div>\n                <div class=\"note\">\n          <p>木の家の購入／イギリス拠点／人を常勤で雇う／大金の貯金——この4つは、年1,000万円の収入があってもまだ先の話で、「収入」ではなく「資産」のフェーズに属する。収入の階段の外ではなく、最後のチェックポイントの先に置く。</p>\n          <p class=\"firststep\"><strong>最初の一歩：</strong>収入のうち資産に回す割合を決め、積立を始める<br><strong>時期：</strong>年1,000万円に届いてから</p>\n        </div>\n        ",

   "char": "辞",
   "html": "<div class=\"detail-head\"><h2>ビジネス用語辞典</h2><span class=\"badge decided\">54語を登録</span></div>\n        <p class=\"sec-lead\">この計画の中に出てくる用語と、一般のビジネス用語を集めた辞典。1語＝用語＋短い定義＋（あれば）この計画での位置づけ。</p><div class=\"dgroup\"><div class=\"dgroup-h\">売る仕組み</div><ul class=\"terms\"><li class=\"term\"><span class=\"tt\">B2B</span><span class=\"td\">企業相手に売る商売の形。相手は会社なので、判断は個人の好みより論理と予算で進む。</span><span class=\"tm\">図鑑事業の受託はこちら側。</span></li><li class=\"term\"><span class=\"tt\">B2C</span><span class=\"td\">一般の消費者相手に売る形。</span><span class=\"tm\">note・BOOTH・物販はこちら側。</span></li><li class=\"term\"><span class=\"tt\">D2C</span><span class=\"td\">メーカーが卸や小売を通さず、自分の店（ネット通販など）で消費者に直接売る形。間の取り分がない代わりに、集客は自分でやる。</span></li><li class=\"term\"><span class=\"tt\">サブスクリプション</span><span class=\"td\">月額など、期間ごとに料金を払い続ける売り方。売る側は収入が積み上がって先が読みやすい。</span><span class=\"tm\">noteの定期購読や、将来のアプリ課金の形。</span></li><li class=\"term\"><span class=\"tt\">フリーミアム</span><span class=\"td\">基本は無料で使わせ、有料の追加機能で稼ぐ形。無料の部分が集客の役目をする。</span></li><li class=\"term\"><span class=\"tt\">プラットフォーム</span><span class=\"td\">売る人と買う人が出会う「場」そのものを提供する事業。場の持ち主は手数料で稼ぐ。</span><span class=\"tm\">note・BOOTH・メルカリは全部これ。自分は場の上で売る側。</span></li><li class=\"term\"><span class=\"tt\">Merchant of Record（販売主体）</span><span class=\"td\">売り手に代わって「売主」として立つ事業者。決済だけでなく、買い手の国の売上税・VATや返金対応まで引き受ける。</span><span class=\"tm\">候補3のGumroadやPaddleがこの形。海外販売の税務を肩代わりする。</span></li><li class=\"term\"><span class=\"tt\">マーケットプレイス</span><span class=\"td\">売り手と買い手が集まる市場型のプラットフォーム。</span><span class=\"tm\">物語のある物のテスト販売先（メルカリ）。</span></li><li class=\"term\"><span class=\"tt\">フランチャイズ</span><span class=\"td\">本部が看板とやり方を貸し、加盟店がロイヤリティを払って商売する仕組み。</span></li><li class=\"term\"><span class=\"tt\">卸売／小売</span><span class=\"td\">卸売は小売店など事業者へまとめて売ること、小売は消費者へ1つずつ売ること。間の差額がそれぞれの取り分になる。</span></li><li class=\"term\"><span class=\"tt\">OEM</span><span class=\"td\">他社に製造を委託し、自社のブランドで売る形。設備を持たずに商品を持てるが、品質の責任は自社ブランド側に残る。</span></li><li class=\"term\"><span class=\"tt\">フロー収入／ストック収入</span><span class=\"td\">フローは働いた分だけ入る一過性の収入、ストックは仕組みや資産から繰り返し入る収入。</span><span class=\"tm\">バイト代はフロー。目指すのはストック側。</span></li><li class=\"term\"><span class=\"tt\">エディション</span><span class=\"td\">版画や写真のように、部数を決めて複数制作する作品の売り方。部数と番号が価値の根拠になる。</span><span class=\"tm\">価格の階段の段2。</span></li><li class=\"term\"><span class=\"tt\">ライセンス</span><span class=\"td\">作品そのものではなく「使う権利」を貸して対価を得る形。手放さずに何度も稼げる。</span><span class=\"tm\">価格の階段の最終段。</span></li><li class=\"term\"><span class=\"tt\">号単価</span><span class=\"td\">日本画などで使われる、号（サイズの単位）あたりの価格。作家の格を表す物差しにもなる。</span><span class=\"tm\">原画価格の目安の置き方。</span></li></ul></div><div class=\"dgroup\"><div class=\"dgroup-h\">お金の数字</div><ul class=\"terms\"><li class=\"term\"><span class=\"tt\">粗利</span><span class=\"td\">売上から原価を引いた残り。商売の土台の儲けで、ここから人件費や家賃などを払う。</span></li><li class=\"term\"><span class=\"tt\">原価</span><span class=\"td\">商品や作品を作る・仕入れるのに直接かかった費用。画材代や印刷代など。</span></li><li class=\"term\"><span class=\"tt\">固定費／変動費</span><span class=\"td\">固定費は売上に関係なく毎月かかる費用（家賃など）、変動費は売れるほど増える費用（材料費など）。</span></li><li class=\"term\"><span class=\"tt\">限界利益</span><span class=\"td\">売上から変動費だけを引いた残り。固定費を賄う源泉で、限界利益率＝限界利益÷売上。損益分岐点の計算に使う。</span><span class=\"tm\">学習「数字の式」で使う式の部品。</span></li><li class=\"term\"><span class=\"tt\">営業利益</span><span class=\"td\">本業の儲け。粗利から、売るため・管理のためにかかる費用を引いたもの。</span></li><li class=\"term\"><span class=\"tt\">経常利益</span><span class=\"td\">営業利益に本業以外の損益（利息など）を足し引きした、会社の普段の実力。</span></li><li class=\"term\"><span class=\"tt\">純利益</span><span class=\"td\">税金など全部を引いた後に残る、最終の儲け。</span></li><li class=\"term\"><span class=\"tt\">キャッシュフロー</span><span class=\"td\">実際のお金の出入り。利益が出ていても現金が尽きれば商売は止まるので、利益とは別に見る。</span></li><li class=\"term\"><span class=\"tt\">運転資金</span><span class=\"td\">商売を回し続けるために手元に必要なお金。在庫や経費を先に払うための分。</span></li><li class=\"term\"><span class=\"tt\">損益分岐点</span><span class=\"td\">売上がちょうど費用と等しくなり、儲けがゼロになる地点。ここを超えると黒字。</span></li><li class=\"term\"><span class=\"tt\">ROI（投資回収）</span><span class=\"td\">投資で得た利益÷かけた費用。お金や時間の使い方が良かったかを比べる物差し。</span><span class=\"tm\">テストの撤退判断にも使う。</span></li><li class=\"term\"><span class=\"tt\">EPC</span><span class=\"td\">アフィリエイトで、1クリックあたりの平均収益（総報酬÷クリック数）。記事や媒体の効率を比べる物差し。</span><span class=\"tm\">候補4の数字の見方。</span></li><li class=\"term\"><span class=\"tt\">CAC（顧客獲得コスト）</span><span class=\"td\">顧客1人を得るのにかける費用。広告費や紹介料がこれにあたる。</span></li><li class=\"term\"><span class=\"tt\">LTV（顧客生涯価値）</span><span class=\"td\">顧客1人が取引の全期間で払う合計額。CACより大きければ商売が回る。</span><span class=\"tm\">Semrushが1件$200を払える理由。</span></li><li class=\"term\"><span class=\"tt\">ロイヤリティ</span><span class=\"td\">権利や看板を使わせる対価として受け取る使用料。売上などの一定割合で払われることが多い。</span><span class=\"tm\">ライセンス収入の受け取り方の一つ。</span></li></ul></div><div class=\"dgroup\"><div class=\"dgroup-h\">会社と取引</div><ul class=\"terms\"><li class=\"term\"><span class=\"tt\">M&amp;A</span><span class=\"td\">会社や事業の売買。買う側は時間と実績を買い、売る側は出口（現金化）になる。</span></li><li class=\"term\"><span class=\"tt\">IPO（新規公開株）</span><span class=\"td\">会社が株式を証券取引所に上場し、誰でも株を買えるようにすること。大きな資金調達と信用につながる。</span></li><li class=\"term\"><span class=\"tt\">資金調達</span><span class=\"td\">事業に必要なお金を外部から集めること。借入、出資（株を渡す）、補助金などの形がある。</span></li><li class=\"term\"><span class=\"tt\">ベンチャーキャピタル</span><span class=\"td\">成長しそうな未上場企業に出資する専門の投資会社。将来の大きな値上がりで回収する。</span></li><li class=\"term\"><span class=\"tt\">エンジェル投資家</span><span class=\"td\">創業初期の小さな会社に、個人のお金で出資する投資家。</span></li><li class=\"term\"><span class=\"tt\">バリュエーション（企業価値評価）</span><span class=\"td\">会社全体の値段の見積もり。資金調達やM&amp;Aの交渉の土台になる。</span></li><li class=\"term\"><span class=\"tt\">デューデリジェンス</span><span class=\"td\">買収や出資の前に、相手の財務・法務・事業を詳しく調べること。値段とリスクの確認作業。</span></li><li class=\"term\"><span class=\"tt\">シナジー</span><span class=\"td\">2つの事業が合わさることで、単独の合計を超える効果が出ること。</span></li><li class=\"term\"><span class=\"tt\">子会社・持株会社</span><span class=\"td\">子会社は他社に経営を支配されている会社、持株会社は他社の株を持つことでグループ全体を支配する会社。</span></li><li class=\"term\"><span class=\"tt\">エスクロー</span><span class=\"td\">取引の間、第三者が代金を預かる仕組み。成果や納品が確認されてから、売り手に渡る。</span><span class=\"tm\">候補1（make.fun）の賞金はこの形で預けられる。</span></li></ul></div><div class=\"dgroup\"><div class=\"dgroup-h\">集客と商品</div><ul class=\"terms\"><li class=\"term\"><span class=\"tt\">アフィリエイト</span><span class=\"td\">成果報酬型の広告。紹介した商品が売れたら紹介料が入る。</span><span class=\"tm\">テスト候補4の本体。</span></li><li class=\"term\"><span class=\"tt\">ASP</span><span class=\"td\">広告主と媒体の間に入り、計測・集計・支払いを代行する仲介会社。日本ではA8.netなど、海外ではImpactなど。</span></li><li class=\"term\"><span class=\"tt\">成果承認と否認</span><span class=\"td\">発生した成果を広告主が認めれば承認（報酬が確定）、キャンセルや規約違反などで認めなければ否認（報酬なし）。画面の発生額は確定収入ではない。</span></li><li class=\"term\"><span class=\"tt\">クッキー期間</span><span class=\"td\">読者がリンクを踏んでから、その期間内に買えば紹介者の成果になる計測の有効期間。プログラムごとに数日から120日超まで差がある。</span></li><li class=\"term\"><span class=\"tt\">ラストクリック</span><span class=\"td\">複数の紹介リンクを踏んだ場合、最後に踏んだリンクの媒体に成果が付く方式。購入直前に別の媒体に踏まれると成果を取られる。</span></li><li class=\"term\"><span class=\"tt\">ステマ規制</span><span class=\"td\">広告なのに広告と分からない宣伝を禁じる日本の規制（景品表示法、2023年10月施行）。アフィリエイト記事には「広告」「PR」の表示が要る。</span><span class=\"tm\">候補4とSNS運用の禁止ライン。</span></li><li class=\"term\"><span class=\"tt\">E-E-A-T</span><span class=\"td\">Googleがコンテンツの信頼性を測る考え方。経験・専門性・権威性・信頼性の頭文字。実際に使った経験と情報の正確さが問われる。</span></li><li class=\"term\"><span class=\"tt\">ブルーオーシャン</span><span class=\"td\">競争相手のいない未開拓の市場。逆に競争の激しい市場はレッドオーシャン。</span><span class=\"tm\">物差し②「取った位置が資産になるか」とセットで見る。</span></li><li class=\"term\"><span class=\"tt\">集客</span><span class=\"td\">お客さんを連れてくること全般。</span><span class=\"tm\">主にSNSや検索からの流入を指す。</span></li><li class=\"term\"><span class=\"tt\">コンバージョン</span><span class=\"td\">サイトや記事に来た人が、購入・申込など狙った行動をすること。その割合がコンバージョン率。</span></li><li class=\"term\"><span class=\"tt\">痛み止め／ビタミン</span><span class=\"td\">痛み止めは「今の困りごとを消す」商品で買われやすく、ビタミンは「あったら良い」商品で買われにくい、という商品の性格の例え。</span><span class=\"tm\">テスト候補を選ぶ時の物差し。</span></li><li class=\"term\"><span class=\"tt\">ブランディング</span><span class=\"td\">作り手や商品の「らしさ」を人の頭の中に作り、選ばれる理由にすること。</span></li><li class=\"term\"><span class=\"tt\">マーケティング</span><span class=\"td\">売れる仕組みづくり全体のこと。集客・価格・見せ方・届け方を含む広い言葉。</span></li><li class=\"term\"><span class=\"tt\">クラウドファンディング</span><span class=\"td\">ネットで不特定多数から少しずつ資金を集める方法。支援＝予約購入の形が多く、需要の確認にも使える。</span></li></ul></div><div class=\"firststep\"><span class=\"fs-k\">最初の一歩</span>分からない言葉に出会ったら、まずここで引く<span class=\"fs-sep\">／</span><span class=\"fs-k\">時期</span>随時（新しい用語は都度追加する）</div><div class=\"src\">出典：アプリ内の既存の記述と学習資料（アフィリエイトの仕組み／個人アートビジネス全体設計）をもとに作成（2026-11-20）</div>",

   "html": "<div class=\"detail-head\"><h2>夢と理想</h2><span class=\"badge decided\">2026-11-20 棚卸し</span></div>\n                <p>チェックポイントの根拠。2026-11-20に本人が語った内容を、短い一覧で残す。</p>\n        <ul>\n          <li>絵を描き続ける。大きい絵も描く</li>\n          <li>広めの部屋に住む（狭いと壁やら何やらにぶつかる）</li>\n          <li>工場跡地のような広い場所をアトリエにする（井田幸昌のアトリエのような）</li>\n          <li>服や香水などファッションアイテムを買うお金に困らない。高いものも</li>\n          <li>旅行は取材という名目ですぐ行けるくらいになる</li>\n          <li>木の家に住む</li>\n          <li>相棒となる犬がほしい</li>\n          <li>豊かな生活。バーにも通う</li>\n          <li>バイトはしない。画材は値段を見ずに買う</li>\n          <li>親族に恩返しをする</li>\n          <li>貯金は大金を</li>\n          <li>拠点は東京か京都かイギリス。ただし不利な土地は選ばない</li>\n          <li>人は雇ってみたい</li>\n        </ul>",

var LS_CACHE = 'bizplan.cache.v1', LS_SET = 'bizplan.settings.v1', LS_CONN = 'bizplan.connected';

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function nowISO(){ return new Date().toISOString(); }

/* ---------- data ---------- */
var DATA = loadCache();
function loadCache(){
  try{
    var c = JSON.parse(localStorage.getItem(LS_CACHE) || 'null');
    if(c && Array.isArray(c.sections) && c.home) return c;
  }catch(e){}
  return clone(SEED);
}
/* v3.0.0: a failed device save is a visible state, not a silent
   swallow (the zukan app's DATA_SAVE_FAIL rule) */
var SAVE_FAIL = false;
function saveCache(){
  try{ localStorage.setItem(LS_CACHE, JSON.stringify(DATA)); SAVE_FAIL = false; }
  catch(e){ SAVE_FAIL = true; }
}
function sectionById(id){
  for(var i=0;i<DATA.sections.length;i++) if(DATA.sections[i].id === id) return DATA.sections[i];
  return null;
}

/* ---------- settings (card size: fixed at compact) ----------
   Until v3.0.4 the card size was the zukan app's 5-step modebar
   (wide / def / compact / mini / micro). His call (2026-11-20):
   the middle size — compact, 3 columns — is the only size; the
   bar and the other four sizes are gone, and the grid always
   renders at compact dimensions. A mode saved by an older
   version is simply never read again. */
var settings = { mode: 'compact' };
function saveSettings(){ try{ localStorage.setItem(LS_SET, JSON.stringify(settings)); }catch(e){} }

/* ---------- rendering (zukan card grid) ---------- */
function renderHome(){
  $('homeTheme').textContent = DATA.home.theme || '';
  /* v3.0.7 (his call): the strip's left side is no longer the
     fixed 「第1チェックポイント 年600万円」 — that name collided
     with the ladder's own first step. The strip shows the goal
     checkpoint he picked in the theme detail (amount + what
     changes), defaulting to the ladder's first step; the
     年600万円 goal is a 節目 and lives in the detail. The right
     side keeps 最終目標 年1,000万円, which is the ladder's own
     final step. updateStripGoal() fills the left block. */
  var fin = (DATA.home.goals || [])[1] || { label: '最終目標', numHtml: '' };
  $('homeGoals').innerHTML =
    '<span class="hs-goal hs-goal-g"><span class="hs-gl">目標</span>' +
    '<span class="hs-gn" id="hsGoalAmt"></span>' +
    '<span class="hs-gw" id="hsGoalWhat"></span></span>' +
    '<span class="hs-sep"></span>' +
    '<span class="hs-goal"><span class="hs-gl">' + esc(fin.label) +
    '</span><span class="hs-gn">' + (fin.numHtml || '') + '</span></span>';
  updateStripGoal();
  var c = '';
  (DATA.home.chips || []).forEach(function(chip){ c += '<span class="chip">' + esc(chip) + '</span>'; });
  $('homeChips').innerHTML = c;
  $('homeSources').textContent = DATA.home.sources || '';
  if(currentTab === 'other') renderOther();
  renderCount();
  renderGrid();
}

/* ---------- pill nav tabs (the zukan app's #pillnav, ported) ----------
   Sections carry a tab attribute (art / business); a section
   without one, or with an unknown value, falls into その他. Until a
   Drive file written before tabs existed grows tab attributes of its
   own, the founding sections keep their place by id (TAB_BY_ID), so
   the split is the same on old and new data. The v3.1.2 arrangement
   follows his definitions: アートビジネス is the artist's own
   standpoint only, so it holds アートビジネス計画 alone; the
   plan's scaffolding (図鑑事業 / ルール / アイデアの網 /
   未決・保留) lives in ビジネス with ビジネス計画; the money tab
   adds 資産フェーズ; and 夢と理想 sits in その他, above the
   settings. 時期と順番 is retired — its 資産フェーズ and
   夢と理想 became sections of their own, and its 順番 survives
   as the timing written inside each item. */
var TABS = ['art', 'business', 'money', 'dict', 'other'];
var TAB_NAMES = { art: 'アートビジネス', business: 'ビジネス', money: 'お金', dict: '用語辞典', other: 'その他' };
var TAB_BY_ID = { art: 'art', business: 'business', zukan: 'business', rules: 'business', ideas: 'business', pending: 'business', money: 'money', numbers: 'money', moneymap: 'money', assets: 'money', dict: 'dict', dreams: 'other' };
var currentTab = 'art';
function secTab(sec){
  if(sec && TABS.indexOf(sec.tab) >= 0) return sec.tab;
  if(sec && TAB_BY_ID[sec.id]) return TAB_BY_ID[sec.id];
  return 'other';
}
function tabSections(){
  return DATA.sections.filter(function(s){ return secTab(s) === currentTab; });
}
function renderCount(){
  /* the zukan manner: while その他 is open the header count is blank */
  if(currentTab === 'other'){ $('topcount').textContent = ''; return; }
  $('topcount').textContent = '全' + DATA.sections.length + '件 ・ ' + TAB_NAMES[currentTab] + ' ' + tabSections().length + '件';
}
function applyPill(){
  var map = { art: 'pnArt', business: 'pnBusiness', money: 'pnMoney', dict: 'pnDict', other: 'pnOther' };
  for(var k in map){ var b = $(map[k]); if(b) b.classList.toggle('on', k === currentTab); }
}
/* ---------- home full texts (the strip's detail) ----------

function slideForward(newEl, oldEl){

/* swipe-back (zukan thresholds): engage on a right-dominant drag,
   the detail follows the finger, the list parallaxes underneath */
(function(){
  var st = null;
  document.addEventListener('touchstart', function(e){
    if(!detailOpen || vtBusy || st || e.touches.length !== 1) return;
    if(e.target && e.target.closest && (e.target.closest('#pillnav') || e.target.closest('.subtabs'))) return; /* pill and subtab drags belong to those rails themselves */
    var t = e.touches[0];
    st = { sx: t.clientX, sy: t.clientY, dx: 0, dy: 0, engaged: false, lastX: t.clientX, lastT: Date.now(), vx: 0, y: window.scrollY || 0 };
  }, { passive: true });
  document.addEventListener('touchmove', function(e){
    if(!st) return;
    var t = e.touches[0];
    st.dx = t.clientX - st.sx;
    st.dy = t.clientY - st.sy;
    var now = Date.now(), dt = now - st.lastT;
    if(dt > 0){ st.vx = (t.clientX - st.lastX) / dt; st.lastX = t.clientX; st.lastT = now; }
    if(!st.engaged){
      if(st.dx > 12 && Math.abs(st.dx) > Math.abs(st.dy) * 1.25) engageSwipe();
      else if(Math.abs(st.dy) > 14 && Math.abs(st.dy) >= Math.abs(st.dx)){ st = null; return; }
      else return;
    }
    paintSwipe();
  }, { passive: true });
  function engageSwipe(){
    var H = hdrH();
    listView.classList.remove('hidden');
    detailView.classList.add('vt-fixed');
    detailView.style.top = (H - st.y) + 'px';
    detailView.style.height = '100dvh';
    detailView.style.zIndex = '26';
    document.body.classList.add('vt-run');
    window.scrollTo(0, listScrollY);
    listView.style.transform = 'translateX(-26%)';
    st.engaged = true;
    paintSwipe();
  }
  function paintSwipe(){
    var W = window.innerWidth || 1;
    var pr = Math.min(1, Math.max(0, st.dx) / W);
    detailView.style.transform = 'translateX(' + Math.max(0, st.dx) + 'px)';
    listView.style.transform = 'translateX(' + (-26 * (1 - pr)) + '%)';

    if(!st) return;

    var ad = detailView.animate([{ transform: 'translateX(' + Math.max(0, s.dx) + 'px)' }, { transform: 'translateX(' + target + 'px)' }], { duration: dur, easing: VT_EASE });

      detailView.style.top = ''; detailView.style.height = ''; detailView.style.zIndex = ''; detailView.style.transform = '';

/* ---------- toast (the zukan app's, ported) ---------- */
function toast(msg, ms){
