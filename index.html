   "html": "<div class=\"detail-head\"><h2>お金とは何か</h2><span class=\"badge decided\">学習シリーズ ①</span></div>\n        <p class=\"sec-lead\">お金は、モノじゃない。記録だ。</p>\n        <h3>お金の流れ</h3>\n        <div class=\"flow\"><span>価値を渡す</span><i>→</i><span>認められる</span><i>→</i><span>記録が増える</span></div>\n        <p>お金そのものに価値はない。お金は「誰かに価値を渡した」という記録だ。渡した価値が認められたときだけ、記録が増える。</p>\n        <h3>2つの形</h3>\n        <div class=\"lanes\">\n          <div class=\"lane other\">\n            <h3>バイト（労働）</h3>\n            <p>時間を1回売って、1回分の記録をもらう形。確実だが、記録の量は「時間×時給」で頭打ちになる。</p>\n          </div>\n          <div class=\"lane art\">\n            <h3>仕組み</h3>\n            <p>一度作ったものが、何度も記録を生む形。動画1本、商品1点が、寝ている間も記録を生み得る。だから天井が違う。</p>\n          </div>\n        </div>\n        <div class=\"note\">\n          <p>逆に、誰の「欲しい」にも当たらなければ記録は0のまま。努力と記録が比例しないのが、この世界のいちばんきついところだ。</p>\n        </div>\n        <h3>翔万の数字で見ると</h3>\n        <div class=\"stats\">\n          <div class=\"stat\"><div class=\"v\">年600<small>万円</small></div><div class=\"k\">「月50万円分の記録を生み続ける状態」と言い換えられる</div></div>\n          <div class=\"stat\"><div class=\"v\">年1,000<small>万円</small></div><div class=\"k\">月83万円分の記録を生み続ける状態</div></div>\n        </div>\n        <p>問いは「頑張れるか」じゃなく「何が、誰の欲しいに当たって、記録を繰り返し生むか」になる。</p>\n        <h3>次のレッスン</h3>\n        <p>順番は「お金の勉強の地図」が背骨になる。ステップ1「ビジネスの管」（集客 → 興味・信頼 → 販売 → 継続）は済みで、次はステップ2。</p>\n        <ul>\n          <li><strong>② 数字の式</strong>（ステップ2・次の学習）：売上＝単価×客数×リピート、利益＝売上−経費、粗利、損益分岐点、手数料の読み方。お金タブ内の「数字の式」に用意してある</li>\n          <li>集客と販売の実務（ステップ3）：渇きの種類、オファー（提案の形）、価格の決め方、ファネルの指標の読み方</li>\n          <li>テストと改善（ステップ4）：仮説→小さく試す→数字で判定→当たった型だけ残す</li>\n          <li>守りの実務（ステップ5）：開業届・青色申告・確定申告／著作権／ステマ規制（PR表記）／特商法</li>\n          <li>仕組みの拡大（ステップ6）：ストック化、外注（お金で手を買う）、ライセンス、蛇口の複数化</li>\n          <li>投資・資産運用（ステップ7）：インデックス投資の基本、リスクと複利、詐欺の見分け方</li>\n        </ul>\n        <p>アフィリエイトの仕組み（誰が誰に、何の対価を払っているのか）は、地図の外の実地編として学習済みで、テスト候補4の中に体系として置いてある。</p>\n        <p class=\"sources\">出典・前提：翔万本人の言葉（2026-11-05）と、同日出た50方法マップの分布。数字の細部はマップ側に譲る。学習シリーズ ①（2026-11-05）、宿題なし</p>",

   "html": "<div class=\"detail-head\"><h2>数字の式</h2><span class=\"badge now\">次の学習</span></div>\n        <p class=\"sec-lead\">ビジネスの数字は、式で読む。「頑張る」の前に、どの数字を動かせばいいかが見えるようになるための回。学習シリーズ②（お金の勉強の地図のステップ2）。読むだけ、宿題なし。</p>\n        <div class=\"card\">\n          <h3>売上の式</h3>\n          <p>売上は、3つの数の掛け算だ。</p>\n          <div class=\"flow\"><span>単価</span><i>×</i><span>客数</span><i>×</i><span>リピート回数</span><i>＝</i><span>売上</span></div>\n          <ul>\n            <li><strong>単価</strong>：1回の取引でいくらもらうか</li>\n            <li><strong>客数</strong>：何人が買うか。客数はさらに「アクセス×転換率」に分解できる（転換率＝来た人のうち買った人の割合）</li>\n            <li><strong>リピート回数</strong>：同じ人が何回買うか</li>\n          </ul>\n          <p>3つのうち1つでも0なら、売上は0になる。逆に、どれか1つを2倍にできれば売上も2倍。「次にやること」は、この3つのどれを動かすかで決める。</p>\n          <p>月50万円（年600万円のペース）を式に当てはめると、必要な客数が単価でまるで変わる。</p>\n          <div class=\"stats\">\n            <div class=\"stat\"><div class=\"v\">約600<small>冊/月</small></div><div class=\"k\">単価980円のnote（手取り約838円/冊）で月50万円の手取りに届く量。28本あれば1本あたり月21冊ずつ売れ続ける計算</div></div>\n            <div class=\"stat\"><div class=\"v\">250<small>個/月</small></div><div class=\"k\">単価2,000円の自分の商品なら、月250個で同じ月50万円</div></div>\n            <div class=\"stat\"><div class=\"v\">10<small>件/月</small></div><div class=\"k\">単価5万円の仕事なら、月10件で同じ月50万円</div></div>\n          </div>\n          <p>「何をいくらで売るか」は好みの問題ではなく、「何人の客を集めなければならないか」の問題だ。客を集めるのが一番重い部分だから、単価が低いほど集客の負担は重くなる。</p>\n        </div>\n        <div class=\"card\">\n          <h3>利益の式と粗利</h3>\n          <div class=\"flow\"><span>売上</span><i>−</i><span>経費</span><i>＝</i><span>利益</span></div>\n          <p>売上50万円でも、経費が40万円かかっていれば手元に残る利益は10万円。「売れた金額」だけ見て安心するのが落とし穴で、見るべきはいつも引いた後の数字だ。</p>\n          <ul>\n            <li><strong>粗利</strong>＝売上−原価。原価は「商品そのものにかかった直接の費用」（材料費、印刷費、仕入れ値）。粗利率＝粗利÷売上</li>\n            <li><strong>デジタル商品が強い理由</strong>：noteや壁紙は1個作ればコピーの原価がほぼ0で、売上のほとんどが粗利になる。逆に、1個作るたびに時間や材料がかかるものは、売れるほど自分が忙しくなる</li>\n            <li><strong>計算例</strong>（物語のある物をメルカリで¥10,000で売る場合）：原価（石・金具など）¥3,000＋送料・梱包¥700が直接の費用で、粗利は¥6,300（粗利率63%）。ここから販売手数料10%（¥1,000）が引かれ、手元は¥5,300。振込手数料¥200は、売上を引き出す時に別にかかる</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>固定費と変動費</h3>\n          <ul>\n            <li><strong>固定費</strong>：売上に関係なく毎月かかる費用。いまの生活では家賃¥30,000＋MacBookローン¥6,000＝月¥36,000。事業側ではAIツールの月額などがここに入る</li>\n            <li><strong>変動費</strong>：売れるほど増える費用。材料費、送料、手数料、印刷費</li>\n            <li><strong>限界利益</strong>＝売上−変動費。固定費を賄う源泉はこれで、限界利益率＝限界利益÷売上。次の損益分岐点の計算に使う</li>\n          </ul>\n          <p>経費をこの2つに分けて初めて、「いくら売れば元が取れるか」が計算できるようになる。</p>\n        </div>\n        <div class=\"card\">\n          <h3>損益分岐点</h3>\n          <p>損益分岐点は、売上がちょうど費用と等しくなり、儲けがゼロになる地点。式は2つの形で持つ。</p>\n          <ul>\n            <li><strong>金額で</strong>：損益分岐点の売上＝固定費÷限界利益率</li>\n            <li><strong>件数で</strong>：損益分岐点の件数＝固定費÷（単価−1件あたりの変動費）</li>\n          </ul>\n          <p>計算例：固定費¥36,000（家賃＋ローン）を、仕組みの収入だけで賄おうとする場合。</p>\n          <div class=\"stats\">\n            <div class=\"stat\"><div class=\"v\">20<small>件/月</small></div><div class=\"k\">単価¥2,000・1件の変動費¥200（手数料など）の商品なら、¥36,000÷¥1,800＝20件で固定費に届く</div></div>\n            <div class=\"stat\"><div class=\"v\">約43<small>冊/月</small></div><div class=\"k\">単価980円のnote（手取り約838円、変動費ほぼ0）なら、¥36,000÷838≒43冊</div></div>\n          </div>\n          <p>チェックポイントの階段（月3万円＝家賃を仕組みが払う、月7万円＝バイト引退）は、この式で読むと「固定費を仕組みが賄い始める地点」の言い換えになっている。</p>\n        </div>\n        <div class=\"card\">\n          <h3>手数料の読み方</h3>\n          <p>表示価格と手取りは違う。手数料は「率（%）＋固定額（円）」の形が多く、固定額の部分は単価が低いほど重くのしかかる。</p>\n          <div class=\"stats\">\n            <div class=\"stat\"><div class=\"v\">約855<small>円</small></div><div class=\"k\">note：¥1,000の有料記事の手取りの目安（決済＋プラットフォーム手数料を引いた後）。振込の時に¥270が別にかかる</div></div>\n            <div class=\"stat\"><div class=\"v\">899<small>円</small></div><div class=\"k\">BOOTH：¥1,000のダウンロード商品の手取り。手数料は価格の5.6%＋¥45＝¥101</div></div>\n            <div class=\"stat\"><div class=\"v\">10<small>%</small></div><div class=\"k\">メルカリ：販売手数料は販売価格の10%（公式ガイド）。振込手数料は一律¥200</div></div>\n            <div class=\"stat\"><div class=\"v\">約83<small>%</small></div><div class=\"k\">Gumroad：$20の商品の手取りの目安（10%＋$0.50＋カード処理2.9%＋$0.30を引いた後）。$5だと約71%まで落ちる</div></div>\n          </div>\n          <ul>\n            <li><strong>固定額の効き方</strong>：BOOTHで¥500の商品なら手数料は¥28＋¥45＝¥73で手取り¥427（85.4%）。¥3,000なら¥168＋¥45＝¥213で手取り¥2,787（92.9%）。同じ売り場でも、単価で手取り率が変わる</li>\n            <li><strong>価格は手取りから逆算する</strong>：売値は「欲しい手取り＋手数料＋送料負担」で置く。特に、送料込みの総額に手数料がかかる売り場では、送料分にも手数料が乗る</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>キャッシュフローとリピート</h3>\n          <ul>\n            <li><strong>キャッシュフロー</strong>：利益が出ていても、手元の現金がなければ回らない。noteの売上は数週間〜1か月ほど遅れて振り込まれる。集客して、売れて、振り込まれるまでの時間差の間も、AIの月額や生活費は出ていく。「月50万円稼いでいる状態」と「月50万円が手元に入ってくる状態」は同じじゃない。バイトが種銭として残っているのは、この時間差を埋めるためでもある</li>\n            <li><strong>リピートが仕組みと労働を分ける</strong>：1回きりの販売は、客数を取り続けないと売上が止まる（バイトと同じで、やめたら0）。連載・シリーズ商品・月額の場のように同じ人が何度も買う形は、客を1人増やすたびに将来の購入分まで増える。検証で見るべきは再生数だけじゃなく、フォローや保存が増えているか——「次も見に来る人」が増えているかの記録だから</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>まとめ：数字を見る時の見方</h3>\n          <ol class=\"steps\">\n            <li data-n=\"1\"><span class=\"st\">分解する</span><span class=\"sd\">売上は「単価×客数×リピート」で見る。客数は「アクセス×転換率」まで割る</span></li>\n            <li data-n=\"2\"><span class=\"st\">引いた後を見る</span><span class=\"sd\">利益は「売上−経費」。売上だけ見ない。手数料は率＋固定額で読み、手取りから逆算する</span></li>\n            <li data-n=\"3\"><span class=\"st\">分岐点を置く</span><span class=\"sd\">固定費と変動費に分け、「いくら売れば元が取れるか」を件数で言えるようにする</span></li>\n            <li data-n=\"4\"><span class=\"st\">タイミングまで見る</span><span class=\"sd\">手元の現金がいつ入るか（キャッシュフロー）と、リピートがある形かどうかで、仕組みかどうかが決まる</span></li>\n          </ol>\n          <p class=\"firststep\"><strong>最初の一歩：</strong>次に「月いくら稼ぎたい」という数字を見たら、単価×客数×リピートに分解して、必要な客数を出してみる<br><strong>時期：</strong>今（知識の蓄積だけは受験前から進めてよい）</p>\n          <p class=\"sources\">出典：学習シリーズ②「数字の式」（お金の勉強の地図のステップ2）。手数料の数字は、note・BOOTHの確認済みの目安、メルカリ公式ガイド、Gumroad公式ヘルプ（候補3の調査で確認）に拠る</p>\n        </div>",
   "id": "numbers",

   "char": "図",
   "html": "<div class=\"detail-head\"><h2>お金の勉強の地図</h2><span class=\"badge now\">次は「数字の式」</span></div>\n        <p class=\"sec-lead\">全部を先に学ばない。「今のステージで必要なものだけ」を、1回3分で読める量で学ぶ。使わない知識は腐るし、勉強が「動けない」の隠れ蓑になる。順番は現在地に合わせてある。</p>\n        <h3>大きな流れ</h3>\n        <div class=\"flow\"><span>作る</span><i>→</i><span>守る</span><i>→</i><span>増やす（再投資）</span><i>→</i><span>運用する（投資）</span></div>\n        <h3>学ぶ順番</h3>\n        <ol class=\"steps\">\n          <li data-n=\"0\"><span class=\"st\">お金とは何か <span class=\"badge decided\">済み</span></span><span class=\"sd\">お金＝価値交換と信用の記録。渇きが止まった時に金が動く（学習シリーズ01）</span></li>\n          <li data-n=\"1\"><span class=\"st\">ビジネスの管 <span class=\"badge decided\">済み</span></span><span class=\"sd\">集客 → 興味・信頼 → 販売 → 継続。金は管のどこかで落ちる（道筋ファイル）</span></li>\n          <li data-n=\"2\"><span class=\"st\">数字の式 <span class=\"badge now\">次の学習</span></span><span class=\"sd\">売上＝単価×客数×リピート／利益＝売上−経費／粗利／キャッシュフロー（手元に現金が残るか）</span></li>\n          <li data-n=\"3\"><span class=\"st\">集客と販売の実務</span><span class=\"sd\">渇きの種類、オファー（提案の形）、価格の決め方、ファネルの指標の読み方。今の主戦場と直結</span></li>\n          <li data-n=\"4\"><span class=\"st\">テストと改善</span><span class=\"sd\">仮説→小さく試す→数字で判定→当たった型だけ残す。30本検証の考え方そのもの。検証と並行</span></li>\n          <li data-n=\"5\"><span class=\"st\">守りの実務</span><span class=\"sd\">開業届・青色申告・確定申告／著作権／ステマ規制（PR表記）／特商法。最初の収益が出たら</span></li>\n          <li data-n=\"6\"><span class=\"st\">仕組みの拡大</span><span class=\"sd\">ストック化、外注（お金で手を買う）、ライセンス、蛇口の複数化。月10万円が見えたら</span></li>\n          <li data-n=\"7\"><span class=\"st\">投資・資産運用</span><span class=\"sd\">インデックス投資の基本、リスクと複利、詐欺の見分け方。最後（余剰資金ができてから）</span></li>\n        </ol>\n        <h3>なぜ投資が最後なのか</h3>\n        <div class=\"note\">\n          <p>投資のリターンは「元本×利率」。元本10万円を年5%で運用しても年5,000円。同じ労力で「月1万円稼ぐ仕組み」を作れば年12万円で、しかも仕組みは育つ。</p>\n          <div class=\"flow\"><span>仕組みで元本を作る</span><i>→</i><span>税金と管理で守る</span><i>→</i><span>仕組みに再投資して増やす</span><i>→</i><span>余った分だけ運用する</span></div>\n          <p>例外として今すぐ必要な投資リテラシーは「守り」だけ：元本保証＋高利回りの話は詐欺、FX・仮想通貨のレバレッジは初心者の入口ではない、という見分け方。</p>\n        </div>\n        <h3>今は学ばなくていいもの</h3>\n        <ul>\n          <li>簿記の細部、法人設立の手続き論（売上が立ってからで間に合う）</li>\n          <li>株のチャート分析・短期売買（今のステージでは再現性がない）</li>\n          <li>節税テクニック（守るべき利益が出てから）</li>\n          <li>広告運用の詳細（集客の型が当たってから）</li>\n        </ul>\n        <p class=\"firststep\"><strong>最初の一歩：</strong>次の学習「数字の式」を読む（お金タブ内の「数字の式」に用意してある。読むだけ）<br><strong>時期：</strong>今（知識の蓄積だけは受験前から進めてよい）</p>",

   "html": "<div class=\"detail-head\"><h2>資産フェーズ</h2><span class=\"badge decided\">決定済み</span></div>\n                <div class=\"note\">\n          <p>木の家の購入／イギリス拠点／人を常勤で雇う／大金の貯金——この4つは、年1,000万円の収入があってもまだ先の話で、「収入」ではなく「資産」のフェーズに属する。収入の階段の外ではなく、最後のチェックポイントの先に置く。</p>\n          <p class=\"firststep\"><strong>最初の一歩：</strong>収入のうち資産に回す割合を決め、積立を始める<br><strong>時期：</strong>年1,000万円に届いてから</p>\n        </div>\n        ",

   "char": "辞",
   "html": "<div class=\"detail-head\"><h2>ビジネス用語辞典</h2><span class=\"badge decided\">54語を登録</span></div>\n        <p class=\"sec-lead\">この計画の中に出てくる用語と、一般のビジネス用語を集めた辞典。1語＝用語＋短い定義＋（あれば）この計画での位置づけ。</p><div class=\"dgroup\"><div class=\"dgroup-h\">売る仕組み</div><ul class=\"terms\"><li class=\"term\"><span class=\"tt\">B2B</span><span class=\"td\">企業相手に売る商売の形。相手は会社なので、判断は個人の好みより論理と予算で進む。</span><span class=\"tm\">図鑑アプリの受託はこちら側。</span></li><li class=\"term\"><span class=\"tt\">B2C</span><span class=\"td\">一般の消費者相手に売る形。</span><span class=\"tm\">note・BOOTH・物販はこちら側。</span></li><li class=\"term\"><span class=\"tt\">D2C</span><span class=\"td\">メーカーが卸や小売を通さず、自分の店（ネット通販など）で消費者に直接売る形。間の取り分がない代わりに、集客は自分でやる。</span></li><li class=\"term\"><span class=\"tt\">サブスクリプション</span><span class=\"td\">月額など、期間ごとに料金を払い続ける売り方。売る側は収入が積み上がって先が読みやすい。</span><span class=\"tm\">noteの定期購読や、将来のアプリ課金の形。</span></li><li class=\"term\"><span class=\"tt\">フリーミアム</span><span class=\"td\">基本は無料で使わせ、有料の追加機能で稼ぐ形。無料の部分が集客の役目をする。</span></li><li class=\"term\"><span class=\"tt\">プラットフォーム</span><span class=\"td\">売る人と買う人が出会う「場」そのものを提供する事業。場の持ち主は手数料で稼ぐ。</span><span class=\"tm\">note・BOOTH・メルカリは全部これ。自分は場の上で売る側。</span></li><li class=\"term\"><span class=\"tt\">Merchant of Record（販売主体）</span><span class=\"td\">売り手に代わって「売主」として立つ事業者。決済だけでなく、買い手の国の売上税・VATや返金対応まで引き受ける。</span><span class=\"tm\">候補3のGumroadやPaddleがこの形。海外販売の税務を肩代わりする。</span></li><li class=\"term\"><span class=\"tt\">マーケットプレイス</span><span class=\"td\">売り手と買い手が集まる市場型のプラットフォーム。</span><span class=\"tm\">物語のある物のテスト販売先（メルカリ）。</span></li><li class=\"term\"><span class=\"tt\">フランチャイズ</span><span class=\"td\">本部が看板とやり方を貸し、加盟店がロイヤリティを払って商売する仕組み。</span></li><li class=\"term\"><span class=\"tt\">卸売／小売</span><span class=\"td\">卸売は小売店など事業者へまとめて売ること、小売は消費者へ1つずつ売ること。間の差額がそれぞれの取り分になる。</span></li><li class=\"term\"><span class=\"tt\">OEM</span><span class=\"td\">他社に製造を委託し、自社のブランドで売る形。設備を持たずに商品を持てるが、品質の責任は自社ブランド側に残る。</span></li><li class=\"term\"><span class=\"tt\">フロー収入／ストック収入</span><span class=\"td\">フローは働いた分だけ入る一過性の収入、ストックは仕組みや資産から繰り返し入る収入。</span><span class=\"tm\">バイト代はフロー。目指すのはストック側。</span></li><li class=\"term\"><span class=\"tt\">エディション</span><span class=\"td\">版画や写真のように、部数を決めて複数制作する作品の売り方。部数と番号が価値の根拠になる。</span><span class=\"tm\">価格の階段の段2。</span></li><li class=\"term\"><span class=\"tt\">ライセンス</span><span class=\"td\">作品そのものではなく「使う権利」を貸して対価を得る形。手放さずに何度も稼げる。</span><span class=\"tm\">価格の階段の最終段。</span></li><li class=\"term\"><span class=\"tt\">号単価</span><span class=\"td\">日本画などで使われる、号（サイズの単位）あたりの価格。作家の格を表す物差しにもなる。</span><span class=\"tm\">原画価格の目安の置き方。</span></li></ul></div><div class=\"dgroup\"><div class=\"dgroup-h\">お金の数字</div><ul class=\"terms\"><li class=\"term\"><span class=\"tt\">粗利</span><span class=\"td\">売上から原価を引いた残り。商売の土台の儲けで、ここから人件費や家賃などを払う。</span></li><li class=\"term\"><span class=\"tt\">原価</span><span class=\"td\">商品や作品を作る・仕入れるのに直接かかった費用。画材代や印刷代など。</span></li><li class=\"term\"><span class=\"tt\">固定費／変動費</span><span class=\"td\">固定費は売上に関係なく毎月かかる費用（家賃など）、変動費は売れるほど増える費用（材料費など）。</span></li><li class=\"term\"><span class=\"tt\">限界利益</span><span class=\"td\">売上から変動費だけを引いた残り。固定費を賄う源泉で、限界利益率＝限界利益÷売上。損益分岐点の計算に使う。</span><span class=\"tm\">学習「数字の式」で使う式の部品。</span></li><li class=\"term\"><span class=\"tt\">営業利益</span><span class=\"td\">本業の儲け。粗利から、売るため・管理のためにかかる費用を引いたもの。</span></li><li class=\"term\"><span class=\"tt\">経常利益</span><span class=\"td\">営業利益に本業以外の損益（利息など）を足し引きした、会社の普段の実力。</span></li><li class=\"term\"><span class=\"tt\">純利益</span><span class=\"td\">税金など全部を引いた後に残る、最終の儲け。</span></li><li class=\"term\"><span class=\"tt\">キャッシュフロー</span><span class=\"td\">実際のお金の出入り。利益が出ていても現金が尽きれば商売は止まるので、利益とは別に見る。</span></li><li class=\"term\"><span class=\"tt\">運転資金</span><span class=\"td\">商売を回し続けるために手元に必要なお金。在庫や経費を先に払うための分。</span></li><li class=\"term\"><span class=\"tt\">損益分岐点</span><span class=\"td\">売上がちょうど費用と等しくなり、儲けがゼロになる地点。ここを超えると黒字。</span></li><li class=\"term\"><span class=\"tt\">ROI（投資回収）</span><span class=\"td\">投資で得た利益÷かけた費用。お金や時間の使い方が良かったかを比べる物差し。</span><span class=\"tm\">テストの撤退判断にも使う。</span></li><li class=\"term\"><span class=\"tt\">EPC</span><span class=\"td\">アフィリエイトで、1クリックあたりの平均収益（総報酬÷クリック数）。記事や媒体の効率を比べる物差し。</span><span class=\"tm\">候補4の数字の見方。</span></li><li class=\"term\"><span class=\"tt\">CAC（顧客獲得コスト）</span><span class=\"td\">顧客1人を得るのにかける費用。広告費や紹介料がこれにあたる。</span></li><li class=\"term\"><span class=\"tt\">LTV（顧客生涯価値）</span><span class=\"td\">顧客1人が取引の全期間で払う合計額。CACより大きければ商売が回る。</span><span class=\"tm\">Semrushが1件$200を払える理由。</span></li><li class=\"term\"><span class=\"tt\">ロイヤリティ</span><span class=\"td\">権利や看板を使わせる対価として受け取る使用料。売上などの一定割合で払われることが多い。</span><span class=\"tm\">ライセンス収入の受け取り方の一つ。</span></li></ul></div><div class=\"dgroup\"><div class=\"dgroup-h\">会社と取引</div><ul class=\"terms\"><li class=\"term\"><span class=\"tt\">M&amp;A</span><span class=\"td\">会社や事業の売買。買う側は時間と実績を買い、売る側は出口（現金化）になる。</span></li><li class=\"term\"><span class=\"tt\">IPO（新規公開株）</span><span class=\"td\">会社が株式を証券取引所に上場し、誰でも株を買えるようにすること。大きな資金調達と信用につながる。</span></li><li class=\"term\"><span class=\"tt\">資金調達</span><span class=\"td\">事業に必要なお金を外部から集めること。借入、出資（株を渡す）、補助金などの形がある。</span></li><li class=\"term\"><span class=\"tt\">ベンチャーキャピタル</span><span class=\"td\">成長しそうな未上場企業に出資する専門の投資会社。将来の大きな値上がりで回収する。</span></li><li class=\"term\"><span class=\"tt\">エンジェル投資家</span><span class=\"td\">創業初期の小さな会社に、個人のお金で出資する投資家。</span></li><li class=\"term\"><span class=\"tt\">バリュエーション（企業価値評価）</span><span class=\"td\">会社全体の値段の見積もり。資金調達やM&amp;Aの交渉の土台になる。</span></li><li class=\"term\"><span class=\"tt\">デューデリジェンス</span><span class=\"td\">買収や出資の前に、相手の財務・法務・事業を詳しく調べること。値段とリスクの確認作業。</span></li><li class=\"term\"><span class=\"tt\">シナジー</span><span class=\"td\">2つの事業が合わさることで、単独の合計を超える効果が出ること。</span></li><li class=\"term\"><span class=\"tt\">子会社・持株会社</span><span class=\"td\">子会社は他社に経営を支配されている会社、持株会社は他社の株を持つことでグループ全体を支配する会社。</span></li><li class=\"term\"><span class=\"tt\">エスクロー</span><span class=\"td\">取引の間、第三者が代金を預かる仕組み。成果や納品が確認されてから、売り手に渡る。</span><span class=\"tm\">候補1（make.fun）の賞金はこの形で預けられる。</span></li></ul></div><div class=\"dgroup\"><div class=\"dgroup-h\">集客と商品</div><ul class=\"terms\"><li class=\"term\"><span class=\"tt\">アフィリエイト</span><span class=\"td\">成果報酬型の広告。紹介した商品が売れたら紹介料が入る。</span><span class=\"tm\">テスト候補4の本体。</span></li><li class=\"term\"><span class=\"tt\">ASP</span><span class=\"td\">広告主と媒体の間に入り、計測・集計・支払いを代行する仲介会社。日本ではA8.netなど、海外ではImpactなど。</span></li><li class=\"term\"><span class=\"tt\">成果承認と否認</span><span class=\"td\">発生した成果を広告主が認めれば承認（報酬が確定）、キャンセルや規約違反などで認めなければ否認（報酬なし）。画面の発生額は確定収入ではない。</span></li><li class=\"term\"><span class=\"tt\">クッキー期間</span><span class=\"td\">読者がリンクを踏んでから、その期間内に買えば紹介者の成果になる計測の有効期間。プログラムごとに数日から120日超まで差がある。</span></li><li class=\"term\"><span class=\"tt\">ラストクリック</span><span class=\"td\">複数の紹介リンクを踏んだ場合、最後に踏んだリンクの媒体に成果が付く方式。購入直前に別の媒体に踏まれると成果を取られる。</span></li><li class=\"term\"><span class=\"tt\">ステマ規制</span><span class=\"td\">広告なのに広告と分からない宣伝を禁じる日本の規制（景品表示法、2023年10月施行）。アフィリエイト記事には「広告」「PR」の表示が要る。</span><span class=\"tm\">候補4とSNS運用の禁止ライン。</span></li><li class=\"term\"><span class=\"tt\">E-E-A-T</span><span class=\"td\">Googleがコンテンツの信頼性を測る考え方。経験・専門性・権威性・信頼性の頭文字。実際に使った経験と情報の正確さが問われる。</span></li><li class=\"term\"><span class=\"tt\">ブルーオーシャン</span><span class=\"td\">競争相手のいない未開拓の市場。逆に競争の激しい市場はレッドオーシャン。</span><span class=\"tm\">物差し②「取った位置が資産になるか」とセットで見る。</span></li><li class=\"term\"><span class=\"tt\">集客</span><span class=\"td\">お客さんを連れてくること全般。</span><span class=\"tm\">主にSNSや検索からの流入を指す。</span></li><li class=\"term\"><span class=\"tt\">コンバージョン</span><span class=\"td\">サイトや記事に来た人が、購入・申込など狙った行動をすること。その割合がコンバージョン率。</span></li><li class=\"term\"><span class=\"tt\">痛み止め／ビタミン</span><span class=\"td\">痛み止めは「今の困りごとを消す」商品で買われやすく、ビタミンは「あったら良い」商品で買われにくい、という商品の性格の例え。</span><span class=\"tm\">テスト候補を選ぶ時の物差し。</span></li><li class=\"term\"><span class=\"tt\">ブランディング</span><span class=\"td\">作り手や商品の「らしさ」を人の頭の中に作り、選ばれる理由にすること。</span></li><li class=\"term\"><span class=\"tt\">マーケティング</span><span class=\"td\">売れる仕組みづくり全体のこと。集客・価格・見せ方・届け方を含む広い言葉。</span></li><li class=\"term\"><span class=\"tt\">クラウドファンディング</span><span class=\"td\">ネットで不特定多数から少しずつ資金を集める方法。支援＝予約購入の形が多く、需要の確認にも使える。</span></li></ul></div><div class=\"firststep\"><span class=\"fs-k\">最初の一歩</span>分からない言葉に出会ったら、まずここで引く<span class=\"fs-sep\">／</span><span class=\"fs-k\">時期</span>随時（新しい用語は都度追加する）</div><div class=\"src\">出典：アプリ内の既存の記述と学習資料（アフィリエイトの仕組み／個人アートビジネス全体設計）をもとに作成（2026-11-20）</div>",

   "html": "<div class=\"detail-head\"><h2>夢と理想</h2><span class=\"badge decided\">2026-11-20 棚卸し</span></div>\n                <p>チェックポイントの根拠。2026-11-20に本人が語った内容を、短い一覧で残す。</p>\n        <ul>\n          <li>絵を描き続ける。大きい絵も描く</li>\n          <li>広めの部屋に住む（狭いと壁やら何やらにぶつかる）</li>\n          <li>工場跡地のような広い場所をアトリエにする（井田幸昌のアトリエのような）</li>\n          <li>服や香水などファッションアイテムを買うお金に困らない。高いものも</li>\n          <li>旅行は取材という名目ですぐ行けるくらいになる</li>\n          <li>木の家に住む</li>\n          <li>相棒となる犬がほしい</li>\n          <li>豊かな生活。バーにも通う</li>\n          <li>バイトはしない。画材は値段を見ずに買う</li>\n          <li>親族に恩返しをする</li>\n          <li>貯金は大金を</li>\n          <li>拠点は東京か京都かイギリス。ただし不利な土地は選ばない</li>\n          <li>人は雇ってみたい</li>\n        </ul>",

var LS_CACHE = 'bizplan.cache.v1', LS_SET = 'bizplan.settings.v1', LS_CONN = 'bizplan.connected';

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function nowISO(){ return new Date().toISOString(); }

/* ---------- data ---------- */
var DATA = loadCache();
function loadCache(){
  try{
    var c = JSON.parse(localStorage.getItem(LS_CACHE) || 'null');
    if(c && Array.isArray(c.sections) && c.home) return c;
  }catch(e){}
  return clone(SEED);
}
/* v3.0.0: a failed device save is a visible state, not a silent
   swallow (the zukan app's DATA_SAVE_FAIL rule) */
var SAVE_FAIL = false;
function saveCache(){
  try{ localStorage.setItem(LS_CACHE, JSON.stringify(DATA)); SAVE_FAIL = false; }
  catch(e){ SAVE_FAIL = true; }
}
function sectionById(id){
  for(var i=0;i<DATA.sections.length;i++) if(DATA.sections[i].id === id) return DATA.sections[i];
  return null;
}

/* ---------- settings (card size: fixed at compact) ----------
   Until v3.0.4 the card size was the zukan app's 5-step modebar
   (wide / def / compact / mini / micro). His call (2026-11-20):
   the middle size — compact, 3 columns — is the only size; the
   bar and the other four sizes are gone, and the grid always
   renders at compact dimensions. A mode saved by an older
   version is simply never read again. */
var settings = { mode: 'compact' };
function saveSettings(){ try{ localStorage.setItem(LS_SET, JSON.stringify(settings)); }catch(e){} }

/* ---------- rendering (zukan card grid) ---------- */
function renderHome(){
  $('homeTheme').textContent = DATA.home.theme || '';
  /* v3.0.7 (his call): the strip's left side is no longer the
     fixed 「第1チェックポイント 年600万円」 — that name collided
     with the ladder's own first step. The strip shows the goal
     checkpoint he picked in the theme detail (amount + what
     changes), defaulting to the ladder's first step; the
     年600万円 goal is a 節目 and lives in the detail. The right
     side keeps 最終目標 年1,000万円, which is the ladder's own
     final step. updateStripGoal() fills the left block. */
  var fin = (DATA.home.goals || [])[1] || { label: '最終目標', numHtml: '' };
  $('homeGoals').innerHTML =
    '<span class="hs-goal hs-goal-g"><span class="hs-gl">目標</span>' +
    '<span class="hs-gn" id="hsGoalAmt"></span>' +
    '<span class="hs-gw" id="hsGoalWhat"></span></span>' +
    '<span class="hs-sep"></span>' +
    '<span class="hs-goal"><span class="hs-gl">' + esc(fin.label) +
    '</span><span class="hs-gn">' + (fin.numHtml || '') + '</span></span>';
  updateStripGoal();
  var c = '';
  (DATA.home.chips || []).forEach(function(chip){ c += '<span class="chip">' + esc(chip) + '</span>'; });
  $('homeChips').innerHTML = c;
  $('homeSources').textContent = DATA.home.sources || '';
  if(currentTab === 'other') renderOther();
  renderCount();
  renderGrid();
}

/* ---------- pill nav tabs (the zukan app's #pillnav, ported) ----------
   Sections carry a tab attribute (art / business); a section
   without one, or with an unknown value, falls into その他. Until a
   Drive file written before tabs existed grows tab attributes of its
   own, the founding sections keep their place by id (TAB_BY_ID), so
   the split is the same on old and new data. The v3.1.2 arrangement
   follows his definitions: アートビジネス is the artist's own
   standpoint only, so it holds アートビジネス計画 alone; the
   plan's scaffolding (図鑑事業 / ルール / アイデアの網 /
   未決・保留) lives in ビジネス with ビジネス計画; the money tab
   adds 資産フェーズ; and 夢と理想 sits in その他, above the
   settings. 時期と順番 is retired — its 資産フェーズ and
   夢と理想 became sections of their own, and its 順番 survives
   as the timing written inside each item. */
var TABS = ['art', 'business', 'money', 'dict', 'other'];
var TAB_NAMES = { art: 'アートビジネス', business: 'ビジネス', money: 'お金', dict: '用語辞典', other: 'その他' };
var TAB_BY_ID = { art: 'art', business: 'business', zukan: 'business', rules: 'business', ideas: 'business', pending: 'business', money: 'money', numbers: 'money', moneymap: 'money', assets: 'money', dict: 'dict', dreams: 'other' };
var currentTab = 'art';
function secTab(sec){
  if(sec && TABS.indexOf(sec.tab) >= 0) return sec.tab;
  if(sec && TAB_BY_ID[sec.id]) return TAB_BY_ID[sec.id];
  return 'other';
}
function tabSections(){
  return DATA.sections.filter(function(s){ return secTab(s) === currentTab; });
}
function renderCount(){
  /* the zukan manner: while その他 is open the header count is blank */
  if(currentTab === 'other'){ $('topcount').textContent = ''; return; }
  $('topcount').textContent = '全' + DATA.sections.length + '件 ・ ' + TAB_NAMES[currentTab] + ' ' + tabSections().length + '件';
}
function applyPill(){
  var map = { art: 'pnArt', business: 'pnBusiness', money: 'pnMoney', dict: 'pnDict', other: 'pnOther' };
  for(var k in map){ var b = $(map[k]); if(b) b.classList.toggle('on', k === currentTab); }
}
/* ---------- home full texts (the strip's detail) ----------

/* tab swipe (v3.1.5): on the list screens a horizontal drag
   pages to the neighbouring tab, both panes following the
   finger — the zukan thresholds again (commit past 35% of
   the width or a fast flick). The current list pins where it
   stands; the neighbour is built offscreen from the same
   renderers the real tab uses (gridHTMLFor / renderOtherInto,
   the home head cloned) and parked one screen over. Commit
   hands over to setTab, so the real screen is indistinguishable
   from a pill tap. The tab order is TABS and the ends stop —
   at the first or last tab the drag never engages and stays
   a scroll. Drags starting on the pill, the header or the
   chips rail belong to those surfaces; a vertical-dominant
   drag never engages. The home strip is part of this surface,
   so the swipe works from the home screen too. */
(function(){
  var st = null, swAnimT = false;
  function neighborFor(dir){
    var j = TABS.indexOf(currentTab) + dir;
    return (j < 0 || j >= TABS.length) ? null : TABS[j];
  }
  function paneFor(t){
    var pane = document.createElement('main');
    pane.className = 'vt-fixed';
    pane.style.zIndex = '24';
    if(t === 'other'){
      var tmp = document.createElement('div');
      renderOtherInto(tmp);
      pane.innerHTML = '<div class="setttl">その他</div><div>' + tmp.innerHTML + '</div>';
      return pane;
    }
    var hh = $('homeHead').cloneNode(true);
    hh.removeAttribute('id');
    hh.style.display = '';
    Array.prototype.forEach.call(hh.querySelectorAll('[id]'), function(n){ n.removeAttribute('id'); });
    pane.appendChild(hh);
    var grid = document.createElement('div');
    grid.className = 'grid compact';
    grid.innerHTML = gridHTMLFor(t);
    pane.appendChild(grid);
    var src = $('homeSources').cloneNode(true);
    src.removeAttribute('id');
    src.style.display = '';
    pane.appendChild(src);
    return pane;
  }
  document.addEventListener('touchstart', function(e){
    if(detailOpen || notifOpen || vtBusy || swAnimT || st || e.touches.length !== 1) return;
    if(listView.classList.contains('hidden')) return;
    if(e.target && e.target.closest && (e.target.closest('#pillnav') || e.target.closest('header.top') || e.target.closest('.chips'))) return; /* pill, header and the chips rail keep their own gestures */
    var t = e.touches[0];
    st = { sx: t.clientX, sy: t.clientY, dx: 0, dy: 0, engaged: false, dead: false, dir: 0, nb: null, pane: null, pdx: 0, lastX: t.clientX, lastT: Date.now(), vx: 0, y: window.scrollY || 0 };

    if(dt > 0){ st.vx = (t.clientX - st.lastX) / dt; st.lastX = t.clientX; st.lastT = now; }
    if(!st.engaged){
      if(Math.abs(st.dx) > 12 && Math.abs(st.dx) > Math.abs(st.dy) * 1.25){
        if(!st.dead){
          var dir = st.dx < 0 ? 1 : -1;
          var nb = neighborFor(dir);

    }

  }, { passive: true });
  function engageTab(){
    var H = hdrH();
    st.pane = paneFor(st.nb);
    st.pane.style.top = H + 'px';
    st.pane.style.height = 'calc(100dvh - ' + H + 'px)';
    document.body.appendChild(st.pane);
    listView.classList.add('vt-fixed');
    listView.style.top = (H - st.y) + 'px';
    listView.style.height = '100dvh';
    listView.style.zIndex = '25';
    document.body.classList.add('vt-run');
    st.engaged = true;
    paintTab();
  }
  function paintTab(){
    var W = window.innerWidth || 1;
    var pdx = st.dir > 0 ? Math.min(0, st.dx) : Math.max(0, st.dx);
    st.pdx = pdx;
    listView.style.transform = 'translateX(' + pdx + 'px)';
    if(st.pane) st.pane.style.transform = 'translateX(' + (pdx + st.dir * W) + 'px)';
  }
  document.addEventListener('touchend', function(){
    if(!st) return;
    var s = st; st = null;
    if(!s.engaged) return;
    suppressNextClick(); /* armed now, not at teardown: the touch's own click can land before the finish animation ends */
    var W = window.innerWidth || 1;
    var commit = s.dir > 0 ? (s.dx < -W * 0.35 || (s.dx < -56 && s.vx < -0.3))
                           : (s.dx >  W * 0.35 || (s.dx >  56 && s.vx >  0.3));
    finishTab(s, commit);
  }, { passive: true });
  document.addEventListener('touchcancel', function(){
    if(st && st.engaged){ var s = st; st = null; finishTab(s, false); }
    else st = null;
  }, { passive: true });

    var ap = s.pane ? s.pane.animate([{ transform: 'translateX(' + (pdx + s.dir * W) + 'px)' }, { transform: 'translateX(' + (commit ? 0 : s.dir * W) + 'px)' }], { duration: dur, easing: VT_EASE }) : null;
    var done = false;
    function teardown(){
      if(done) return;
      done = true;
      try{ al.cancel(); }catch(e){}
      try{ if(ap) ap.cancel(); }catch(e){}
      if(s.pane && s.pane.parentNode) s.pane.parentNode.removeChild(s.pane);
      listView.classList.remove('vt-fixed');
      listView.style.top = ''; listView.style.height = ''; listView.style.zIndex = ''; listView.style.transform = '';
      document.body.classList.remove('vt-run');

        setTab(s.nb);

    setTimeout(teardown, 420);

})();

   v3.0.0: the zukan app's mechanism layer, ported wholesale —

/* ---------- toast (the zukan app's, ported) ---------- */
function toast(msg, ms){
  var t = $('toast'); if(!t) return;
  $('toastmsg').textContent = msg;
  var act = $('toastact'); act.classList.add('hidden'); act.onclick = null;
  t.classList.add('on');
  clearTimeout(toast._tm); toast._tm = setTimeout(function(){ t.classList.remove('on'); }, ms || 2600);
}

/* ---------- fetch with timeout + content hash (the zukan app's
   fetchT / syncHashOfStr, ported verbatim) ---------- */
function fetchT(url, opts, ms){
  return new Promise(function(resolve, reject){
    var ctl = null;
    try{ ctl = new AbortController(); }catch(e){}
    var to = setTimeout(function(){ try{ if(ctl) ctl.abort(); }catch(e){} reject(new Error('通信がタイムアウトしました')); }, ms || 30000);
    var o = Object.assign({}, opts || {}); if(ctl) o.signal = ctl.signal;
    fetch(url, o).then(function(r){ clearTimeout(to); resolve(r); }, function(e){ clearTimeout(to); reject(e); });
  });
}
function syncHashOfStr(s){
  var h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for(var i = 0; i < s.length; i++){ var ch = s.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return s.length + ':' + (h2 >>> 0).toString(16) + (h1 >>> 0).toString(16);
}
function sleepMs(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

/* ---------- relay transport (the zukan app's, ported) ----------
   The relay spec is frozen (ping/stat/get/put + a filename
   pattern); bizplan.json matches the pattern, so the relay works
   for this app with NO relay-side change. getSince is NOT used:
   server-side it only splits the artists / exhibitions keys and
   returns every other root key (here: sections, home) wholesale,
   so stat + get is equivalent and simpler.
   The config lives in this app's own key. When it is absent, the
   zukan app's same-origin config is adopted read-only, so a
   device that already runs Arcanum's relay needs no new setup
   here. The secret is never embedded in this file. */
var LS_RELAY = 'bizplan.relay';
var RELAY_URL_DEFAULT = 'https://script.google.com/macros/s/AKfycbziV1Wpv7AWSUJJgaKyRzFeBR81Td4CjryGGuq4avt1xAo-e2mbeyS2vBpCuqx4_KI/exec';
function relayCfgInfo(){
  var own = null;
  try{ own = JSON.parse(localStorage.getItem(LS_RELAY) || 'null'); }catch(e){}
  if(own && own.disabled) return null;
  if(own && own.secret) return { url: own.url || RELAY_URL_DEFAULT, secret: own.secret, adopted: false };
  try{
    var z = JSON.parse(localStorage.getItem('zukan.relay') || 'null');
    if(z && z.secret) return { url: z.url || RELAY_URL_DEFAULT, secret: z.secret, adopted: true };
  }catch(e){}
  return null;
}
function relayCfg(){ var i = relayCfgInfo(); return i ? { url: i.url, secret: i.secret } : null; }
function relayReady(){ return !!relayCfg(); }
async function relayCall(op, name, content, extra){
  var c = relayCfg(); if(!c) throw new Error('中継が未設定です');
  var body = JSON.stringify(Object.assign({ secret: c.secret, op: op, name: name, content: content }, extra || {}));
  var healed = false;
  for(;;){
    var res = await fetchT(c.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body }, 60000);
    if(!res.ok) throw new Error('中継 HTTP ' + res.status);
    var text = await res.text();
    var ctype = (res.headers && res.headers.get) ? (res.headers.get('content-type') || '') : '';
    var trimmed = text.replace(/^\s+/, '');
    /* sentinel self-heal (zukan v27.11 B): a body opening with the
       relay's doGet text — or any non-JSON text/plain body — proves
       the POST was re-driven as a GET in the redirect chain.
       Re-issue the POST once, silently, right here. */
    var sentinel = trimmed.indexOf('Muse relay is alive') === 0 || (/^text\/plain/i.test(ctype) && trimmed.charAt(0) !== '{');
    if(sentinel && !healed){ healed = true; continue; }
    var j = null;
    try{ j = JSON.parse(text); }catch(e){}
    if(!j || typeof j !== 'object' || typeof j.ok === 'undefined'){
      /* envelope discipline (zukan v27.11 A): a body that is not
         the JSON envelope is a transport error — never surfaced
         raw to the user. */
      var err = new Error('中継の応答が正しく届きませんでした');
      err.code = 'RELAY_BAD_BODY';
      throw err;
    }
    if(!j.ok) throw new Error('中継エラー：' + ((j && j.error) || 'unknown'));
    return j;
  }
}
function relaySave(url, secret){
  url = String(url || '').trim() || RELAY_URL_DEFAULT; secret = String(secret || '').trim();
  if(!secret){ toast('シークレットを入力してください'); return false; }
  try{ localStorage.setItem(LS_RELAY, JSON.stringify({ url: url, secret: secret })); }catch(e){}
  renderSyncStatus();
  return true;
}
function relayForget(){
  var info = relayCfgInfo();
  try{
    if(info && !info.adopted) localStorage.removeItem(LS_RELAY);
    else localStorage.setItem(LS_RELAY, JSON.stringify({ disabled: true }));
  }catch(e){}
  renderSyncStatus();
  if(currentTab === 'other' && !detailOpen && !notifOpen) renderOther();
  toast('この端末では中継を使わない設定にしました');
}

}

/* ---------- GIS token (popup only — never a redirect on iOS) --- */
function waitGis(){
  return new Promise(function(res, rej){
    var n = 0;
    var iv = setInterval(function(){
      if(window.google && google.accounts && google.accounts.oauth2){ clearInterval(iv); res(); }
      else if(++n > 40){ clearInterval(iv); rej(new Error('gis-timeout')); }
    }, 250);
  });
}
/* the token lives in sessionStorage with its expiry (the zukan
   app's storeToken), so an in-session reload does not need a new
   GIS round-trip */
function storeToken(tok, expiresInSec){
  accessToken = tok;
  tokenExp = Date.now() + (expiresInSec ? expiresInSec * 1000 : 3000000);
  try{ sessionStorage.setItem('bizplan.token', tok); sessionStorage.setItem('bizplan.tokenExp', String(tokenExp)); }catch(e){}
}
function tokenFromSession(){
  if(accessToken && Date.now() < tokenExp - 30000) return accessToken;
  try{
    var t = sessionStorage.getItem('bizplan.token'), x = Number(sessionStorage.getItem('bizplan.tokenExp') || 0);
    if(t && Date.now() < x - 30000){ accessToken = t; tokenExp = x; return t; }
  }catch(e){}
  return null;
}
function clearToken(){
  accessToken = null; tokenExp = 0;
  try{ sessionStorage.removeItem('bizplan.token'); sessionStorage.removeItem('bizplan.tokenExp'); }catch(e){}
}
function requestToken(interactive){
  return new Promise(function(res, rej){
    waitGis().then(function(){
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: 'https://www.googleapis.com/auth/drive.file',
        callback: function(resp){
          if(resp && resp.access_token){ storeToken(resp.access_token, resp.expires_in); res(accessToken); }
          else rej(new Error('no-token'));
        },
        error_callback: function(err){ rej(new Error(err && err.type ? err.type : 'gis-error')); }
      });
      /* the zukan v5.71.2 rule: an explicit connect ALWAYS shows
         the account chooser — he holds two Google accounts, and a
         silent pick once synced the wrong account's Drive */
      tokenClient.requestAccessToken({ prompt: interactive ? 'select_account' : '' });
    }).catch(rej);
  });
}
function getValidToken(interactive){
  var t = tokenFromSession();

  return requestToken(interactive);
}
/* silent reconnect (the zukan app's): only on a device that has
   connected before, throttled to one silent attempt a minute,
   and a failure never becomes an error state */
var silentTryAt = 0;
function trySilentReconnect(){
  if(!isConnected() || relayReady()) return;
  if(tokenFromSession()) return;
  var now = Date.now();
  if(now - silentTryAt < 60000) return;
  silentTryAt = now;
  requestToken(false).then(function(){ appSync(false); }).catch(function(){});
}
function connectDrive(){
  getValidToken(true).then(function(){
    setConnected(true); syncError = null;
    renderSyncStatus();
    appSync(true);
  }).catch(function(){
    syncError = 'connect';
    renderSyncStatus();
  });
}
function disconnectDrive(){
  clearToken(); fileId = null;
  setConnected(false); syncError = null;
  renderSyncStatus();
}

/* ---------- Drive (GIS) primitives ---------- */
function driveFetch(url, opts){
  return getValidToken(false).then(function(token){
    var headers = Object.assign({}, (opts && opts.headers) || {}, { 'Authorization': 'Bearer ' + token });
    return fetchT(url, Object.assign({}, opts || {}, { headers: headers }), 60000);
  }).then(function(res){
    if(res.status === 401){ clearToken(); throw new Error('auth-401'); }
    if(!res.ok) throw new Error('drive-' + res.status);

  });

function ensureFileId(){
  if(fileId) return Promise.resolve(fileId);
  var q = encodeURIComponent("name='" + FILE_NAME + "' and trashed=false");
  return driveFetch('https://www.googleapis.com/drive/v3/files?q=' + q + '&fields=files(id,name)&spaces=drive')
    .then(function(res){ return res.json(); })
    .then(function(j){
      if(j.files && j.files.length){ fileId = j.files[0].id; return fileId; }
      return driveFetch('https://www.googleapis.com/drive/v3/files', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: FILE_NAME, mimeType: 'application/json' })
      }).then(function(cres){ return cres.json(); }).then(function(cj){
        fileId = cj.id;
        /* first connect: create the file with the current plan content */
        return uploadData(DATA).then(function(){ return fileId; });
      });
    });
}
function remoteStampGIS(){
  return ensureFileId().then(function(id){
    return driveFetch('https://www.googleapis.com/drive/v3/files/' + id + '?fields=modifiedTime');
  }).then(function(res){ return res.json(); }).then(function(j){ return j && j.modifiedTime ? String(j.modifiedTime) : null; });
}
function normalizeData(j){
  if(!j || !Array.isArray(j.sections) || !j.home) return null;
  return j;
}
function downloadData(){
  return ensureFileId()
    .then(function(id){ return driveFetch('https://www.googleapis.com/drive/v3/files/' + id + '?alt=media'); })
    .then(function(res){ return res.text(); })
    .then(function(text){
      if(!text || !text.trim()) return null;
      return normalizeData(JSON.parse(text));
    });
}
function uploadData(data){
  return ensureFileId().then(function(id){
    var payload = clone(data);
    payload.updatedAt = nowISO();
    return driveFetch('https://www.googleapis.com/upload/drive/v3/files/' + id + '?uploadType=media', {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

/* ---------- merge (the zukan app's rules, scaled to this shape)
   Per section id the newer updated_at wins wholesale; home
   likewise. Convergence: a local-only section whose id was in
   the last landed server set is treated as deleted on the
   server and dropped (deletions propagate); a local-only section
   the server set has never contained is kept and counted
   pending — it may be a brand-new local record whose upload has
   not landed yet, and dropping it would lose data. */
function mergeData(local, remote){
  if(!remote) return { data: local, changed: false, pending: local.sections.length + 1, dropped: 0 };
  var known = knownIdsLoad();
  var remoteById = {};
  remote.sections.forEach(function(s){ remoteById[s.id] = s; });
  var seen = {}, mergedSections = [], pending = 0, dropped = 0;
  local.sections.forEach(function(ls){
    seen[ls.id] = true;
    var rs = remoteById[ls.id];
    if(!rs){
      if(known && known.indexOf(ls.id) >= 0){ dropped++; return; }
      mergedSections.push(ls); pending++;
    }
    else if((ls.updated_at || '') > (rs.updated_at || '')){ mergedSections.push(ls); pending++; }
    else mergedSections.push(rs);
  });
  remote.sections.forEach(function(rs){ if(!seen[rs.id]) mergedSections.push(rs); });
  var home = local.home, homePending = 0;
  if(((remote.home && remote.home.updated_at) || '') > (local.home.updated_at || '')) home = remote.home;
  else if((local.home.updated_at || '') > ((remote.home && remote.home.updated_at) || '')) homePending = 1;
  pending += homePending;
  var merged = { version: 1, updatedAt: local.updatedAt, home: home, sections: mergedSections };
  return { data: merged, changed: JSON.stringify(merged) !== JSON.stringify(local), pending: pending, dropped: dropped };
}

/* ---------- plan-change notifications ----------
   The zukan app's registration-notification mechanism, adapted:
   whenever new data lands, section ids / updated_at are diffed
   against the last landed snapshot; new and advanced sections
   become notifications (burst cap 8 + one summary, store cap
   60 — the zukan numbers). The first snapshot seeds silently. */
var LS_PNOTIFS = 'bizplan.planNotifs', LS_STAMPS = 'bizplan.knownStamps';
function planNotifsLoad(){ try{ var a = JSON.parse(localStorage.getItem(LS_PNOTIFS) || '[]'); return Array.isArray(a) ? a : []; }catch(e){ return []; } }
function planNotifsSave(a){ try{ localStorage.setItem(LS_PNOTIFS, JSON.stringify(a.slice(0, 60))); }catch(e){} }
function stampsLoad(){ try{ return JSON.parse(localStorage.getItem(LS_STAMPS) || 'null'); }catch(e){ return null; } }
function stampsSave(data){
  var m = { home: (data.home && data.home.updated_at) || '' };
  (data.sections || []).forEach(function(s){ m[s.id] = s.updated_at || ''; });
  try{ localStorage.setItem(LS_STAMPS, JSON.stringify(m)); }catch(e){}
}
function detectPlanChanges(after){
  var prev = stampsLoad();
  stampsSave(after);
  if(!prev) return; /* first snapshot: seed silently, no flood */
  var fresh = [];
  (after.sections || []).forEach(function(s){
    if(!(s.id in prev)) fresh.push({ sectionId: s.id, title: s.title || s.id, kind: 'new' });
    else if((s.updated_at || '') > prev[s.id]) fresh.push({ sectionId: s.id, title: s.title || s.id, kind: 'updated' });
  });
  if(((after.home && after.home.updated_at) || '') > (prev.home || '')) fresh.push({ sectionId: '', title: 'ホーム（目標・前提）', kind: 'updated' });
  if(!fresh.length) return;
  var at = nowISO();
  var mk = function(f){ return { id: 'pn' + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36), sectionId: f.sectionId, title: f.title, kind: f.kind, at: at, seen: false }; };
  var entries = fresh.slice(0, 8).map(mk);
  if(fresh.length > 8) entries.push({ id: 'pnsum' + Date.now().toString(36), summary: true, count: fresh.length - 8, members: fresh.slice(8).map(function(f){ return { sectionId: f.sectionId, title: f.title, kind: f.kind }; }), at: at, seen: false });
  planNotifsSave(entries.concat(planNotifsLoad()));
  refreshBell();
}
function planUnseenCount(){ return planNotifsLoad().filter(function(n){ return !n.seen; }).length; }
function planMarkSeen(id){
  var a = planNotifsLoad(), ch = false;
  a.forEach(function(n){ if(n.id === id && !n.seen){ n.seen = true; ch = true; } });
  if(ch){ planNotifsSave(a); refreshBell(); }
}
/* v3.0.6: the panel's すべて既読 — every stored notification at
   once, through the same localStorage record the single-item

function planMarkAllSeen(){
  var a = planNotifsLoad(), ch = false;
  a.forEach(function(n){ if(!n.seen){ n.seen = true; ch = true; } });
  if(ch) planNotifsSave(a);
  refreshBell();
  if(notifOpen && bellTab === 'notif') renderNotifList();
}

/* ---------- update history (the zukan app's changelog mechanism,
   ported): changelog.json sits beside the app, fetched cache-free;
   entries carry { v, at, notes[] }; the seen set is seeded so
   only the newest entry starts as NEW; expanding an entry — or
   its 確認した button — is what marks it seen. */
var LS_CHANGELOG = 'bizplan.changelog', LS_CHANGELOG_SEEN = 'bizplan.changelogSeen';
var changelogData = null, changelogOpen = {};
function changelogCacheLoad(){ try{ return JSON.parse(localStorage.getItem(LS_CHANGELOG) || 'null'); }catch(e){ return null; } }
function fetchChangelog(){
  fetch('changelog.json?cv=' + Date.now(), { cache: 'no-store' }).then(function(r){ return r.ok ? r.json() : null; }).then(function(j){
    if(j && Array.isArray(j.entries)){
      changelogData = j;
      try{ localStorage.setItem(LS_CHANGELOG, JSON.stringify(j)); }catch(e){}
      refreshBell();
      if(notifOpen && bellTab === 'history') renderUpdateList();
    }
  }).catch(function(){});
}
function changelogEntryKey(e){ return String(e.v || '') + '|' + String(e.at || ''); }
function changelogSeenLoad(entries){
  try{ var d = JSON.parse(localStorage.getItem(LS_CHANGELOG_SEEN) || 'null'); if(Array.isArray(d)) return d; }catch(e){}
  if(!entries || !entries.length) return [];
  var sorted = entries.slice().sort(function(a, b){ return (Date.parse(b.at || '') || 0) - (Date.parse(a.at || '') || 0); });
  var seed = sorted.slice(1).map(changelogEntryKey);
  try{ localStorage.setItem(LS_CHANGELOG_SEEN, JSON.stringify(seed)); }catch(e){}

}
function changelogUnseenCount(){
  var d = changelogData || changelogCacheLoad();
  if(!d || !d.entries.length) return 0;
  var raw = null;
  try{ raw = JSON.parse(localStorage.getItem(LS_CHANGELOG_SEEN) || 'null'); }catch(e){}
  if(!Array.isArray(raw)) return 1; /* unseeded: only the newest entry will be NEW */
  var s = {};
  raw.forEach(function(k){ s[k] = true; });
  return d.entries.filter(function(e){ return !s[changelogEntryKey(e)]; }).length;
}
function changelogMarkSeen(k){
  var d = changelogData || changelogCacheLoad();
  var seen = changelogSeenLoad(d ? d.entries : null);
  if(seen.indexOf(k) >= 0) return;
  seen.push(k);
  try{ localStorage.setItem(LS_CHANGELOG_SEEN, JSON.stringify(seen)); }catch(e){}
  refreshBell();
}
/* v3.0.6: the history tab's すべて既読 — the single-item 確認した
   applied to every entry, stored in the same seen set. */
function changelogMarkAllSeen(){
  var d = changelogData || changelogCacheLoad();
  if(!d || !d.entries.length) return;
  var seen = changelogSeenLoad(d.entries), have = {}, ch = false;
  seen.forEach(function(k){ have[k] = true; });
  d.entries.forEach(function(e){
    var k = changelogEntryKey(e);
    if(!have[k]){ seen.push(k); ch = true; }
  });
  if(ch){ try{ localStorage.setItem(LS_CHANGELOG_SEEN, JSON.stringify(seen)); }catch(e){} }
  refreshBell();
  if(notifOpen && bellTab === 'history') renderUpdateList();
}
function notifWhen(iso){
  var t = Date.parse(iso || ''); if(isNaN(t)) return '';
  var d = new Date(t);
  return d.getFullYear() + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getDate()).padStart(2, '0');
}

/* ---------- sync core (the zukan app's rules) ----------
   One queue: every sync runs through queueSync, so two syncs
   never overlap (the old flag simply dropped concurrent runs).
   A timed-out attempt retries exactly once after 1.5s. A write
   is built only on the fresh download of the same run, and the
   totals guard is a VETO, not an error (zukan v14.1): if the
   merged result would shrink the server file, the upload is
   dropped, the merged state is adopted locally, and a note is
   attached — no error, no retry loop. When the server stamp and
   the local hash both match the last landed sync, the download
   is skipped entirely (the zukan B shortcut). */
var syncQueue = Promise.resolve();
function queueSync(task){
  var p = syncQueue.then(task, task);
  syncQueue = p.then(function(){}, function(){});
  return p;
}
function isTimeoutErr(e){
  var m = String((e && e.message) || e || '');
  return /タイムアウト|abort|network|failed to fetch/i.test(m) || (e && e.code === 'RELAY_BAD_BODY');
}
function appSync(manual){
  return queueSync(function(){ return syncFlow(manual); });
}
async function syncFlow(manual){
  if(!relayReady() && !isConnected()){ if(manual) connectDrive(); return; }
  syncRunning = true; syncError = null; renderSyncStatus();
  try{
    await syncOnce();
  }catch(e1){
    if(isTimeoutErr(e1)){
      await sleepMs(1500);
      try{ await syncOnce(); }
      catch(e2){ syncError = String((e2 && e2.message) || e2); appendSyncLine('同期', '失敗しました：' + syncError, true); }
    } else {
      syncError = String((e1 && e1.message) || e1);
      appendSyncLine('同期', '失敗しました：' + syncError, true);
    }
  }
  syncRunning = false;
  renderSyncStatus();
}
async function syncOnce(){
  syncNote = '';
  if(relayReady()) await syncViaRelay();
  else await syncViaGIS();
  lastSyncAt = Date.now();
}
function adoptMerged(m){
  if(m.changed){
    DATA = m.data; saveCache(); renderHome();
    if(current && detailOpen){ $('detailBody').innerHTML = (current === HOME_ID) ? homeDetailHTML() : ((sectionById(current) || {}).html || ''); decorateDetail(); }
    detectPlanChanges(DATA);
  }
  pendingCount = m.pending;
}
function guardTripped(m, remote){ return m.data.sections.length < remote.sections.length; }
async function syncViaRelay(){
  var st = await relayCall('stat', FILE_NAME);
  var meta = syncMetaLoad();
  if(st.exists && meta && String(meta.stamp) === String(st.updated) && meta.hash === syncHashOfStr(JSON.stringify(DATA))){
    pendingCount = 0; /* stamp + local hash unchanged: skip the download */
    return;
  }
  if(!st.exists){
    var seedPayload = clone(DATA); seedPayload.updatedAt = nowISO();
    await relayCall('put', FILE_NAME, JSON.stringify(seedPayload));
    DATA.updatedAt = seedPayload.updatedAt; saveCache();
    var st2 = await relayCall('stat', FILE_NAME);
    syncMetaSave({ stamp: String(st2.updated), hash: syncHashOfStr(JSON.stringify(DATA)) });
    knownIdsSave(dataIds());
    stampsSave(DATA);
    pendingCount = 0;
    appendSyncLine('同期', '中継で bizplan.json を作成しました');
    return;
  }
  var g = await relayCall('get', FILE_NAME);
  var remote = null;
  try{ remote = normalizeData(JSON.parse(g.content)); }catch(e){}
  if(!remote) throw new Error('サーバのデータを読み取れませんでした');
  var m = mergeData(DATA, remote);
  if(guardTripped(m, remote)){
    syncNote = 'サーバの最新に合わせ直しました';
    adoptMerged(m);
    pendingCount = 0;
    knownIdsSave(remote.sections.map(function(s){ return s.id; }));
    syncMetaSave({ stamp: String(g.updated), hash: syncHashOfStr(JSON.stringify(DATA)) });
    appendSyncLine('同期', '古い送信を止めて、サーバの最新に合わせました');
    return;
  }
  adoptMerged(m);
  var remoteChanged = JSON.stringify(m.data) !== JSON.stringify({ version: 1, updatedAt: remote.updatedAt, home: remote.home, sections: remote.sections });
  if(remoteChanged || m.pending > 0){
    var payload = clone(m.data); payload.updatedAt = nowISO();
    await relayCall('put', FILE_NAME, JSON.stringify(payload));
    DATA.updatedAt = payload.updatedAt; saveCache();
    pendingCount = 0;
    var st3 = await relayCall('stat', FILE_NAME);
    syncMetaSave({ stamp: String(st3.updated), hash: syncHashOfStr(JSON.stringify(DATA)) });
  } else {
    syncMetaSave({ stamp: String(g.updated), hash: syncHashOfStr(JSON.stringify(DATA)) });
  }
  knownIdsSave(dataIds());
  appendSyncLine('同期', '完了しました（中継）');
}
async function syncViaGIS(){
  var meta = syncMetaLoad();
  var stamp = null;
  try{ stamp = await remoteStampGIS(); }catch(e){ stamp = null; }
  if(stamp && meta && String(meta.stamp) === String(stamp) && meta.hash === syncHashOfStr(JSON.stringify(DATA))){
    pendingCount = 0; /* stamp + local hash unchanged: skip the download */
    return;
  }
  var remote = await downloadData();
  if(!remote){
    /* ensureFileId has just created the file with our own data */
    knownIdsSave(dataIds());
    stampsSave(DATA);
    pendingCount = 0;
    return;
  }
  var m = mergeData(DATA, remote);
  if(guardTripped(m, remote)){
    syncNote = 'サーバの最新に合わせ直しました';
    adoptMerged(m);
    pendingCount = 0;
    knownIdsSave(remote.sections.map(function(s){ return s.id; }));
    appendSyncLine('同期', '古い送信を止めて、サーバの最新に合わせました');
    return;
  }
  adoptMerged(m);
  var remoteChanged = JSON.stringify(m.data) !== JSON.stringify({ version: 1, updatedAt: remote.updatedAt, home: remote.home, sections: remote.sections });
  if(remoteChanged || m.pending > 0){
    await uploadData(m.data);
    pendingCount = 0;
    DATA.updatedAt = nowISO(); saveCache();
  }
  var stamp2 = null;
  try{ stamp2 = await remoteStampGIS(); }catch(e){}
  syncMetaSave({ stamp: stamp2 ? String(stamp2) : null, hash: syncHashOfStr(JSON.stringify(DATA)) });
  knownIdsSave(dataIds());
  appendSyncLine('同期', '完了しました');
}
/* token watchdog (the zukan app's): an expired token is silently
   re-acquired — throttled, and only on a device that connected
   before. The relay path needs no token at all. */
setInterval(function(){
  if(syncRunning) return;
  trySilentReconnect();
}, 30000);
document.addEventListener('visibilitychange', function(){
  if(document.hidden) return;
  if(relayReady()){ appSync(false); return; }
  if(isConnected()){
    if(tokenFromSession()) appSync(false);
    else trySilentReconnect();
  }
});

/* ---------- boot ---------- */
fitHdr();
window.addEventListener('resize', fitHdr);
/* v2.1.2: re-measure once the first frame and the fonts settle —
   the boot-time measure can precede the header's final height. */
requestAnimationFrame(fitHdr);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ fitHdr(); });
if(window.visualViewport) visualViewport.addEventListener('resize', fitHdr);
var vb = $('verBadge'); if(vb) vb.textContent = 'v' + APP_VERSION;
renderHome();
renderSyncStatus();
refreshBell();
fetchChangelog();
var initial = (location.hash || '').match(/^#\/(\w+)$/);
if(initial && sectionById(initial[1])){
  setTab(secTab(sectionById(initial[1])));
  $('detailBody').innerHTML = sectionById(initial[1]).html;
  decorateDetail(initial[1]);
  listView.classList.add('hidden');
  detailView.classList.remove('hidden');
  detailOpen = true; current = initial[1];
  window.scrollTo(0, 0);
}
/* opening veil (zukan pattern): the CSS fade runs on its own;
   this only removes the node, and a tap dismisses it */
(function(){
  var v = $('veil');
  if(!v) return;
  var done = false;
  function kill(){ if(done) return; done = true; try{ v.remove(); }catch(e){} }
  v.addEventListener('click', kill);
  if(reducedMotion()){ kill(); return; }
  setTimeout(kill, 900);
})();
if(relayReady()){ appSync(false); }
else if(isConnected()){
  if(tokenFromSession()) appSync(false);
  else trySilentReconnect();
}
</script>
</body>
</html>
