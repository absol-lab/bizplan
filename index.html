   "html": "<div class=\"detail-head\"><h2>数字の式</h2></div>\n        <p class=\"sec-lead\">ビジネスの数字は、式で読む。「頑張る」の前に、どの数字を動かせばいいかが見えるようになるための回。読むだけ、宿題なし。</p>\n        <div class=\"card\">\n          <h3>売上の式</h3>\n          <p>売上は、3つの数の掛け算だ。</p>\n          <div class=\"flow\"><span>単価</span><i>×</i><span>客数</span><i>×</i><span>リピート回数</span><i>＝</i><span>売上</span></div>\n          <ul>\n            <li><strong>単価</strong>：1回の取引でいくらもらうか</li>\n            <li><strong>客数</strong>：何人が買うか。客数はさらに「アクセス×転換率」に分解できる（転換率＝来た人のうち買った人の割合）</li>\n            <li><strong>リピート回数</strong>：同じ人が何回買うか</li>\n          </ul>\n          <p>3つのうち1つでも0なら、売上は0になる。逆に、どれか1つを2倍にできれば売上も2倍。「次にやること」は、この3つのどれを動かすかで決める。</p>\n          <p>月50万円（年600万円のペース）を式に当てはめると、必要な客数が単価でまるで変わる。</p>\n          <div class=\"stats\">\n            <div class=\"stat\"><div class=\"v\">約600<small>冊/月</small></div><div class=\"k\">単価980円のnote（手取り約838円/冊）で月50万円の手取りに届く量。28本あれば1本あたり月21冊ずつ売れ続ける計算</div></div>\n            <div class=\"stat\"><div class=\"v\">250<small>個/月</small></div><div class=\"k\">単価2,000円の自分の商品なら、月250個で同じ月50万円</div></div>\n            <div class=\"stat\"><div class=\"v\">10<small>件/月</small></div><div class=\"k\">単価5万円の仕事なら、月10件で同じ月50万円</div></div>\n          </div>\n          <p>「何をいくらで売るか」は好みの問題ではなく、「何人の客を集めなければならないか」の問題だ。客を集めるのが一番重い部分だから、単価が低いほど集客の負担は重くなる。</p>\n        </div>\n        <div class=\"card\">\n          <h3>利益の式と粗利</h3>\n          <div class=\"flow\"><span>売上</span><i>−</i><span>経費</span><i>＝</i><span>利益</span></div>\n          <p>売上50万円でも、経費が40万円かかっていれば手元に残る利益は10万円。「売れた金額」だけ見て安心するのが落とし穴で、見るべきはいつも引いた後の数字だ。</p>\n          <ul>\n            <li><strong>粗利</strong>＝売上−原価。原価は「商品そのものにかかった直接の費用」（材料費、印刷費、仕入れ値）。粗利率＝粗利÷売上</li>\n            <li><strong>デジタル商品が強い理由</strong>：noteや壁紙は1個作ればコピーの原価がほぼ0で、売上のほとんどが粗利になる。逆に、1個作るたびに時間や材料がかかるものは、売れるほど自分が忙しくなる</li>\n            <li><strong>計算例</strong>（物語のある物をメルカリで¥10,000で売る場合）：原価（石・金具など）¥3,000＋送料・梱包¥700が直接の費用で、粗利は¥6,300（粗利率63%）。ここから販売手数料10%（¥1,000）が引かれ、手元は¥5,300。振込手数料¥200は、売上を引き出す時に別にかかる</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>固定費と変動費</h3>\n          <ul>\n            <li><strong>固定費</strong>：売上に関係なく毎月かかる費用。いまの生活では家賃¥30,000＋MacBookローン¥6,000＝月¥36,000。事業側ではAIツールの月額などがここに入る</li>\n            <li><strong>変動費</strong>：売れるほど増える費用。材料費、送料、手数料、印刷費</li>\n            <li><strong>限界利益</strong>＝売上−変動費。固定費を賄う源泉はこれで、限界利益率＝限界利益÷売上。次の損益分岐点の計算に使う</li>\n          </ul>\n          <p>経費をこの2つに分けて初めて、「いくら売れば元が取れるか」が計算できるようになる。</p>\n        </div>\n        <div class=\"card\">\n          <h3>損益分岐点</h3>\n          <p>損益分岐点は、売上がちょうど費用と等しくなり、儲けがゼロになる地点。式は2つの形で持つ。</p>\n          <ul>\n            <li><strong>金額で</strong>：損益分岐点の売上＝固定費÷限界利益率</li>\n            <li><strong>件数で</strong>：損益分岐点の件数＝固定費÷（単価−1件あたりの変動費）</li>\n          </ul>\n          <p>計算例：固定費¥36,000（家賃＋ローン）を、仕組みの収入だけで賄おうとする場合。</p>\n          <div class=\"stats\">\n            <div class=\"stat\"><div class=\"v\">20<small>件/月</small></div><div class=\"k\">単価¥2,000・1件の変動費¥200（手数料など）の商品なら、¥36,000÷¥1,800＝20件で固定費に届く</div></div>\n            <div class=\"stat\"><div class=\"v\">約43<small>冊/月</small></div><div class=\"k\">単価980円のnote（手取り約838円、変動費ほぼ0）なら、¥36,000÷838≒43冊</div></div>\n          </div>\n          <p>チェックポイントの階段（月3万円＝家賃を仕組みが払う、月7万円＝バイト引退）は、この式で読むと「固定費を仕組みが賄い始める地点」の言い換えになっている。</p>\n        </div>\n        <div class=\"card\">\n          <h3>手数料の読み方</h3>\n          <p>表示価格と手取りは違う。手数料は「率（%）＋固定額（円）」の形が多く、固定額の部分は単価が低いほど重くのしかかる。</p>\n          <div class=\"stats\">\n            <div class=\"stat\"><div class=\"v\">約855<small>円</small></div><div class=\"k\">note：¥1,000の有料記事の手取りの目安（決済＋プラットフォーム手数料を引いた後）。振込の時に¥270が別にかかる</div></div>\n            <div class=\"stat\"><div class=\"v\">899<small>円</small></div><div class=\"k\">BOOTH：¥1,000のダウンロード商品の手取り。手数料は価格の5.6%＋¥45＝¥101</div></div>\n            <div class=\"stat\"><div class=\"v\">10<small>%</small></div><div class=\"k\">メルカリ：販売手数料は販売価格の10%（公式ガイド）。振込手数料は一律¥200</div></div>\n            <div class=\"stat\"><div class=\"v\">約83<small>%</small></div><div class=\"k\">Gumroad：$20の商品の手取りの目安（10%＋$0.50＋カード処理2.9%＋$0.30を引いた後）。$5だと約71%まで落ちる</div></div>\n          </div>\n          <ul>\n            <li><strong>固定額の効き方</strong>：BOOTHで¥500の商品なら手数料は¥28＋¥45＝¥73で手取り¥427（85.4%）。¥3,000なら¥168＋¥45＝¥213で手取り¥2,787（92.9%）。同じ売り場でも、単価で手取り率が変わる</li>\n            <li><strong>価格は手取りから逆算する</strong>：売値は「欲しい手取り＋手数料＋送料負担」で置く。特に、送料込みの総額に手数料がかかる売り場では、送料分にも手数料が乗る</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>キャッシュフローとリピート</h3>\n          <ul>\n            <li><strong>キャッシュフロー</strong>：利益が出ていても、手元の現金がなければ回らない。noteの売上は数週間〜1か月ほど遅れて振り込まれる。集客して、売れて、振り込まれるまでの時間差の間も、AIの月額や生活費は出ていく。「月50万円稼いでいる状態」と「月50万円が手元に入ってくる状態」は同じじゃない。バイトが種銭として残っているのは、この時間差を埋めるためでもある</li>\n            <li><strong>リピートが仕組みと労働を分ける</strong>：1回きりの販売は、客数を取り続けないと売上が止まる（バイトと同じで、やめたら0）。連載・シリーズ商品・月額の場のように同じ人が何度も買う形は、客を1人増やすたびに将来の購入分まで増える。検証で見るべきは再生数だけじゃなく、フォローや保存が増えているか——「次も見に来る人」が増えているかの記録だから</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>まとめ：数字を見る時の見方</h3>\n          <ol class=\"steps\">\n            <li data-n=\"1\"><span class=\"st\">分解する</span><span class=\"sd\">売上は「単価×客数×リピート」で見る。客数は「アクセス×転換率」まで割る</span></li>\n            <li data-n=\"2\"><span class=\"st\">引いた後を見る</span><span class=\"sd\">利益は「売上−経費」。売上だけ見ない。手数料は率＋固定額で読み、手取りから逆算する</span></li>\n            <li data-n=\"3\"><span class=\"st\">分岐点を置く</span><span class=\"sd\">固定費と変動費に分け、「いくら売れば元が取れるか」を件数で言えるようにする</span></li>\n            <li data-n=\"4\"><span class=\"st\">タイミングまで見る</span><span class=\"sd\">手元の現金がいつ入るか（キャッシュフロー）と、リピートがある形かどうかで、仕組みかどうかが決まる</span></li>\n          </ol>\n          <p class=\"firststep\"><strong>最初の一歩：</strong>次に「月いくら稼ぎたい」という数字を見たら、単価×客数×リピートに分解して、必要な客数を出してみる<br><strong>時期：</strong>今（知識の蓄積だけは受験前から進めてよい）</p>\n          <p class=\"sources\">出典：手数料の数字は、note・BOOTHの確認済みの目安、メルカリ公式ガイド、Gumroad公式ヘルプ（海外向けデジタル商品の調査で確認）に拠る</p>\n        </div>",

   "html": "<div class=\"detail-head\"><h2>事業形態</h2></div>\n        <p class=\"sec-lead\">事業には形がある。同じ「稼ぐ」でも、物が動くのか、データが動くのか、紹介で入るのかで、始まり方も、お金の入り方も、残るものも全部違う。</p>\n        <div class=\"card\">\n          <h3>物を売る</h3>\n          <p><strong>物販（仕入れて売る）</strong>——物を仕入れて、売り場で売る、いちばん古い形。</p>\n          <ul>\n            <li><strong>実際の動き</strong>：仕入れる→出品する→買う人が現れる→発送する→売上金が入る。売れるかどうかは、仕入れの目利きと、出品の見せ方（写真・説明文）でほぼ決まる</li>\n            <li><strong>お金の入り方</strong>：1件ごとの売買差益。メルカリなら販売手数料10％と振込手数料200円が引かれる。継続性は無く、売れるたびに次の仕入れと発送が要る。仕入れ代が先に出るので、入金の遅れがそのまま資金繰りになる</li>\n            <li><strong>一人と初期費用</strong>：一人で完結する。初期費用は仕入れ代そのもの</li>\n            <li><strong>彼の事業では</strong>：物語のある物がこの形。市場の成約実例は5万円台〜23万円台で、値段は素材ではなく構成と物語で付く（物語のある物の市場分析のとおり）</li>\n          </ul>\n          <p><strong>ハンドメイド・自作販売</strong>——自分で作った物を売る形。作り手と売り手が同じ人になる。</p>\n          <ul>\n            <li><strong>実際の動き</strong>：作る→売り場に出す→売れる→（受注生産なら、売れてから作る）。売り場は、ハンドメイド市場（minne・Creema）に置くか、自分の店（BASE・STORES）を持つか、売る場所を借りるか（画廊の委託）</li>\n            <li><strong>お金の入り方</strong>：1点ごとの売上。手数料は売り場で違い、minne 10.89％／Creema 10.67％／BASE 約6.6％＋40円／STORES 5.5％〜（アートビジネス計画「流通と取り分」の登録値）。画廊の委託販売は50:50が標準で、レンタル画廊は週10万〜100万円の場所代を先に払い、売上は100％自分の形。作る時間と引き換えの収入で、点数が増えれば線になる</li>\n            <li><strong>一人と初期費用</strong>：一人で完結する。初期費用は材料費と、売り場によっては場所代</li>\n            <li><strong>彼の事業では</strong>：原画・エディション販売（本丸）がこの形。エディションは「受注生産で在庫を持たない」工夫とセットになっている</li>\n          </ul>\n          <p><strong>転売・裁定</strong>——安く買える場所と、高く買う人がいる場所の「差」そのものを商品にする形。</p>\n          <ul>\n            <li><strong>実際の動き</strong>：仕組みは物販と同じ（買う→売る）だが、価値は物ではなく価格差にある。差が開いている場所を見つける速さが勝負で、差は時間とともに閉じていく</li>\n            <li><strong>お金の入り方</strong>：1件ごとの差益。相場の変動と在庫の抱え込みがリスクで、プラットフォームの規約（転売の扱い）も先に確認が要る</li>\n            <li><strong>一人と初期費用</strong>：一人でできる。初期費用は買い付け資金</li>\n            <li><strong>彼の事業では</strong>：直接の事業は無い。ただし海外向けデジタル商品は、「言語市場の価格差」という同じ裁定の考え方を、物ではなく情報に使っている</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>デジタルを売る</h3>\n          <p><strong>有料記事・ダウンロード販売</strong>——文章やデータを、売り場に置いて売る形。在庫が無く、複製コストがほぼゼロ。</p>\n          <ul>\n            <li><strong>実際の動き</strong>：作る→売り場（note／BOOTH／Gumroadなど）に置く→集客の入口から買いに来る→決済と受け渡しは売り場がやる。置いた物は売れ続け、過去の商品が積み上がる（バックリストが資産になる）</li>\n            <li><strong>お金の入り方</strong>：1件ごとの売上から手数料が引かれる。noteは1,000円で手取り約855円＋振込手数料270円、BOOTHは5.6％＋45円、Gumroadは$20の商品で手取り約83％（海外向けデジタル商品・有料noteの登録値）。出金には条件があり、Gumroadは週次・最低$100・7日間の保留。継続課金ではないが、バックリストが増えるほど「置いてあるだけで売れる」部分が育つ</li>\n            <li><strong>一人と初期費用</strong>：一人で完結し、初期費用はほぼゼロ。かかるのは作る時間だけ</li>\n            <li><strong>彼の事業では</strong>：有料noteと海外向けデジタル商品がこの形。作る工程はAIパイプラインに登録済み</li>\n          </ul>\n          <p><strong>アプリ／SaaS</strong>——ソフトを作って公開し、買い切りや月額課金で取る形。</p>\n          <ul>\n            <li><strong>実際の動き</strong>：作る→公開する（ストアやWeb）→使う人が増える→課金する人が一部出る。集客は、作ることと同じくらい重い仕事になる</li>\n            <li><strong>お金の入り方</strong>：買い切りか継続課金。分布の現実は厳しく、新規のサブスクリプションアプリで2年以内に月$1,000へ届くのは17.3％、中央値は月$72ほど（RevenueCatの公表データ、ビジネス計画の登録値）。当たれば時間と切り離して伸びるが、大半は届かない形でもある</li>\n            <li><strong>一人と初期費用</strong>：一人で作れる。置き場所次第で運用費はほぼゼロにもなる（彼の形はGitHub Pages＋Google Driveで運用コスト0円）</li>\n            <li><strong>彼の事業では</strong>：図鑑アプリの横展開がこの形。まず「痛み止めか、ビタミンか」の判定を通すことが、ビジネス計画の物差しになっている</li>\n          </ul>\n          <p><strong>自作ツールの販売</strong>——自分の不便を直すために作った道具を、同じ不便を持つ人に売る形。アプリより小さく、目的がはっきりしている。</p>\n          <ul>\n            <li><strong>実際の動き</strong>：自分の現場で使う→困りごとが解けた形を商品にする→同じ現場の人に届ける。使う人が「明日の困りごと」で買うので、痛み止めになりやすい</li>\n            <li><strong>お金の入り方</strong>：買い切り中心で、規模は題材の人数で決まる。大きくはないが、届く確率が高いのが特徴</li>\n            <li><strong>一人と初期費用</strong>：一人で完結し、初期費用はほぼゼロ</li>\n            <li><strong>彼の事業では</strong>：横展開の題材候補（作品台帳など、候補Cの系統）がこの形に近い</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>紹介で稼ぐ</h3>\n          <p><strong>アフィリエイト</strong>——他人の商品を紹介し、成約したら紹介料を得る形。自分の商品を持たずに始められる。</p>\n          <ul>\n            <li><strong>実際の動き</strong>：プログラムに登録する→紹介する場（記事・動画・投稿）を作る→読者がリンクから買う→成果が発生する→広告主の承認を経て確定する→支払いのサイクルで入金される</li>\n            <li><strong>お金の入り方</strong>：成約1件ごとの紹介料。単価の構造は商品の利益で決まり、高単価の例ではSemrushの新規成約1件$200・クッキー期間120日（アフィリエイトの登録値）。発生から入金までは月単位で遅れ、否認されればゼロになる。プログラムの終了や条件変更で、収入ごと消える弱さがある</li>\n            <li><strong>一人と初期費用</strong>：一人で完結し、初期費用はほぼゼロ。広告を買う型（PPC）は別で、先に広告費が出る</li>\n            <li><strong>彼の事業では</strong>：海外アフィリエイト比較記事がこの形。仕組みの学習資料と初歩段階が登録済み</li>\n          </ul>\n          <p><strong>仲介・マッチング</strong>——買い手と売り手の間に立ち、出会いの場を用意して手数料を取る形。</p>\n          <ul>\n            <li><strong>実際の動き</strong>：場を作る→売り手を集める→買い手を集める→取引が成立するたびに手数料が入る。メルカリの販売手数料10％は、この形の身近な実例（売り場そのものが仲介者）</li>\n            <li><strong>お金の入り方</strong>：取引ごとの手数料で、場が回り始めれば継続的に入る。ただし最初のうちは「売り手がいないから買い手が来ない、買い手がいないから売り手が来ない」という鶏と卵の問題が本体で、一人で始めるにはいちばん重い形</li>\n            <li><strong>一人と初期費用</strong>：仕組み作りと両側の集客が要り、初期の重さが大きい</li>\n            <li><strong>彼の事業では</strong>：自分が場の事業者になる形は無い。逆に、売り場として「乗る」側では、いつもこの形の上に乗っている（だから手数料の読み方が大事になる）</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>継続課金</h3>\n          <p><strong>サブスクリプション</strong>——月額などで入り続け、解約されるまで続く形。</p>\n          <ul>\n            <li><strong>実際の動き</strong>：入り口の商品を用意する→加入してもらう→中身を更新し続ける→解約を抑える。売る仕事より「辞めさせない」運営が本体になる</li>\n            <li><strong>お金の入り方</strong>：人数×月額で、売上が先読みできるのが強み。アプリの課金形として選ぶ場合は、上の分布（届くのは一部、中央値は小さい）が前提になる</li>\n            <li><strong>一人と初期費用</strong>：一人で始められるが、更新の手間は続く</li>\n            <li><strong>彼の事業では</strong>：横展開アプリの課金形の選択肢。図鑑アプリの受託でも「月額の運用代行」という継続課金の顔がある</li>\n          </ul>\n          <p><strong>会員制・有料コミュニティ</strong>——「場と更新」そのものを月額で売る形。</p>\n          <ul>\n            <li><strong>実際の動き</strong>：無料の発信で人を集める→有料の場に招く→投稿・交流・限定の中身を回し続ける。よねあぷ（有料コミュニティを併設）や、Slavik（自分のサイトでメンバーシップを運営）の形が実例</li>\n            <li><strong>お金の入り方</strong>：人数×月額で読みやすい。ただし中身は「人がいること」なので、運営者の手間と人気に収入が直結する</li>\n            <li><strong>一人と初期費用</strong>：一人で始められ、初期費用はほぼゼロ。続ける手間はずっとかかる</li>\n            <li><strong>彼の事業では</strong>：現行の計画には無い。知識と実績と、集まった人がいる先で開ける形</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>スキルを売る</h3>\n          <p><strong>受託・請負</strong>——相手の注文を受けて作り、対価を得る形。いちばん確実に「仕事がお金になる」形。</p>\n          <ul>\n            <li><strong>実際の動き</strong>：受け皿（見本と条件表）を用意する→声がかかる／声をかける→条件を先に固定して受ける→作って納める→入金される。集客は「売り場」ではなく「回路」（出会いが来る場所にいること）で決まる</li>\n            <li><strong>お金の入り方</strong>：仕事ごとの固定価格で、入金の確実性は高い。代わりに自分の時間と引き換えで、止めれば収入も止まる。残るのはお金そのものより、実績と縁と、次につながる信用</li>\n            <li><strong>一人と初期費用</strong>：一人で完結し、初期費用はほぼゼロ。価格と条件を先に決めておくことが、交渉の弱さを補う（ルールの「関係は柔らかく、条件は硬く」）</li>\n            <li><strong>彼の事業では</strong>：図鑑アプリの受託がこの形（構築一式／データ化／月額運用代行の3段）。受験後の本格開始が決まっている</li>\n          </ul>\n          <p><strong>講座・教育</strong>——知識を教材の形にして売る形。同じ知識でも、届け方で単価が変わる。</p>\n          <ul>\n            <li><strong>実際の動き</strong>：知識を教材にまとめる→講座プラットフォームに置くか、自分の売り場で売る→学びたい人が買う。Slavikの例では、ガイド（教材）が€499、個別のメンターが€5,000と、「読む教材」と「個別指導」で単価が10倍違う</li>\n            <li><strong>お金の入り方</strong>：教材は1件ごとの売上（デジタルの形と複合する）、個別指導は高単価だが時間と引き換え（受託の形と複合する）。知識の在庫が増えるほど、商品にできる範囲が広がる</li>\n            <li><strong>一人と初期費用</strong>：一人で完結し、初期費用はほぼゼロ</li>\n            <li><strong>彼の事業では</strong>：現行では有料noteが入口。このアプリに貯めている知識そのものが、将来の材料になる</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>権利で稼ぐ</h3>\n          <p><strong>ライセンス・印税</strong>——作った物や権利を「使わせる」対価を得る形。自分は売る作業をせず、使われた分だけ入る。</p>\n          <ul>\n            <li><strong>実際の動き</strong>：権利を持つ物を作る→使う相手と契約する→相手が売る／使う→料率や固定額で入る。本の印税、素材やキャラクターのライセンスがこの形。ずんだもんの例では、オープンな利用を広げつつ、無クレジットの商用ライセンスを1キャラ40万円＋税とし、グッズは証紙で回収する形が取られている（先駆者モデル資料集の登録）</li>\n            <li><strong>お金の入り方</strong>：相手の売上に応じた料率、または固定のライセンス料。入るまでに相手の事業が回る必要があり、遅くて読みにくいが、自分の時間は使わない。権利が自分の手に残っていることが全ての前提になる</li>\n            <li><strong>一人と初期費用</strong>：権利を持つ物を作るまでは一人でできる。契約の相手は外の事業者になる</li>\n            <li><strong>彼の事業では</strong>：アートビジネスの将来の形（作品の二次利用・版権の扱い）。図鑑事業で「型（エンジン）は売らない」と決めているのも、権利を手元に残す同じ判断</li>\n          </ul>\n          <p><strong>キャラクターIP</strong>——キャラクターを育て、グッズ・ライセンス・アニメなどに広げていく形。</p>\n          <ul>\n            <li><strong>実際の動き</strong>：SNSや連載でキャラを育てる→人気が付く→グッズ化・ライセンスの話が来る→体制のある相手と組んで広げる。ちいかわ、mofusand、カナヘイなどが通った道</li>\n            <li><strong>お金の入り方</strong>：グッズの売上とライセンス料。ただし誤読しやすい点として、ちいかわの作者は連載開始の時点で既にフォロワー約33万人の人気絵師で、「無名のゼロから」ではない。拡大の局面ではライセンス会社・出版社・メーカーの体制が必ず入り、「ずっと完全な一人」ではなくなる形でもある（先駆者モデル資料集の結論）</li>\n            <li><strong>一人と初期費用</strong>：育てるまでは一人でできる。広げる段階で外の体制が要る</li>\n            <li><strong>彼の事業では</strong>：現行の計画には入れていない。形として知っておくための登録</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>広告で稼ぐ</h3>\n          <p><strong>SNS・動画の広告収入</strong>——再生や表示に応じて、プラットフォームから分配を得る形。</p>\n          <ul>\n            <li><strong>実際の動き</strong>：投稿を続ける→収益化の条件に届く→再生されるたびに分配が入る。YouTubeの収益化は、登録者1,000人＋公開動画の総再生時間4,000時間（またはShortsの1,000万回再生／90日）が入口の条件</li>\n            <li><strong>お金の入り方</strong>：再生単価はジャンルで大きく違い、金融・ビジネス・テック系が高く、エンタメ系は低い。再生数がそのまま収入なので、届くまでの距離が長く、単価の低いジャンルでは量が要る</li>\n            <li><strong>一人と初期費用</strong>：一人で完結し、初期費用はほぼゼロ。かかるのは続ける時間</li>\n            <li><strong>彼の事業では</strong>：提示の動画は、広告収入そのものではなく集客の蛇口として使う設計（集客はTikTok、収益化は売り場側、という既存の分担）。広告は「ついでに付くもの」であって、本命の蛇口にはしない</li>\n          </ul>\n          <p><strong>メディア運営</strong>——ブログやメディアに人を集め、広告とアフィリエイトを載せる形。</p>\n          <ul>\n            <li><strong>実際の動き</strong>：記事を積む→検索やSNSから読者が来る→広告の分配と、記事内の紹介料が入る。収入は「広告＋紹介」の複合で、積んだ記事そのものが資産になる</li>\n            <li><strong>お金の入り方</strong>：読者の数に比例して小さく広く入る。育つまでが長く、検索順位やプラットフォームの方針変更で揺れる</li>\n            <li><strong>一人と初期費用</strong>：一人で完結し、初期費用はほぼゼロ</li>\n            <li><strong>彼の事業では</strong>：海外アフィリエイトの比較記事は、この形の最小単位（メディアの1ページ）でもある</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>読み方</h3>\n          <p><strong>形態は、組み合わせるもの</strong>——実際の事業は、たいてい複数の形の複合でできている。彼の計画で見ると、本丸＝自作販売（物を売る）、図鑑アプリ＝受託＋アプリ販売＋月額の運用代行、有料note＝デジタルを売る、アフィリエイト＝紹介で稼ぐ、提示動画＝広告の形を集客にだけ使う、という組み合わせ。Slavikのような個人の成功例も、広告＋講座＋会員制の複合だった。1つの形に絞る必要はなく、「どの形が、どの役割か」を分けて見る。</p>\n          <ul>\n            <li><strong>物差し1：椅子が残るか</strong>——終わった後に、権利・バックリスト・実績・集客の回路が残る形かどうか。残らない形（賞金・一回きりの仕事）は種銭作りと割り切る</li>\n            <li><strong>物差し2：最初のお客はどこにいるか</strong>——形そのものより、最初のお客への入口が見えるかが先。入口が見えない形は、段階0で止まっている</li>\n            <li><strong>物差し3：時間と切り離せるか</strong>——自分の手を止めると止まる形か、置いておけば回る形か。段取りの段階4（拡大）で効いてくる差</li>\n            <li><strong>物差し4：入金までの遅れ</strong>——売れてからお金が届くまでの長さ。遅い形ほど、最初の段階では手元のお金で回す設計が要る（段取り「お金が届くまでの遅れ」）</li>\n          </ul>\n          <p>段階との相性もある。検証の段階（段取りの段階1）では「最初のお客が見える形」から始め、回り始めたら「時間と切り離せる形」へ寄せていく。</p>\n          <p class=\"sources\">きっかけ・出典：本人の問い「いろんな事業形態を知るためのページが欲しい」（2026-11-20）。各形態の手数料・条件・分布は、各事業の実務／アートビジネス計画「流通と取り分」／ビジネス計画の市場の数字と、先駆者モデル資料集・Slavikの仕組み分析に基づく</p>\n        </div>",

   "html": "<div class=\"detail-head\"><h2>事業形態</h2></div>\n        <p class=\"sec-lead\">アートで稼ぐにも形がある。同じ「絵が売れる」でも、画廊に預けるのか、自分で場を開くのか、制度で名前を立てるのかで、出会い方も、取り分も、育ち方も全部違う。</p>\n        <div class=\"card\">\n          <h3>売る場所</h3>\n          <p><strong>画廊に預けて売る</strong>——作品を画廊に委託し、展示・集客・販売・価格維持を画廊に担ってもらう、一次市場の標準形。</p>\n          <ul>\n            <li><strong>実際の動き</strong>：新人はまず委託販売（売れた分だけ報酬、契約なしが多い）から始まるのが通例で、買い取り（卸）は画廊のリスクが高いため新人には少ない。出会いの本線は作家同士の推薦・紹介で、順序は「継続投稿で裏付け確認に耐えるアーカイブを作る→公募・グループ展で展示実績と接点を作る→推薦が発生する→画廊接続」。Instagramは発見の場というより、推薦された作家の裏付け確認のために精査される道具として使われている</li>\n            <li><strong>取り分と入金</strong>：作家：画廊＝50:50が一次市場の標準的な目安で、作家の手取りは概ね4〜6割が中心帯。委託販売専門の画廊では手数料30％（作家70％）の例や、非営利・協同スペースでは作家側60％の例もある。画廊の取り分は「集客・信用・価格維持」の対価</li>\n            <li><strong>次にどう育つか</strong>：個展の実績と完売の継続が、号単価の段階的な値上げに連動していく。実績の裏付けのない急な跳ね上げはしない</li>\n            <li><strong>彼の計画では</strong>：本丸の主軸ルート。画廊と組んだ後は、価格と顧客管理の管を画廊に移す段階設計になっていて、直販は入口の検証に限定する（アートビジネス計画「画家の集客の実態」）</li>\n          </ul>\n          <p><strong>レンタルギャラリーで自分で開く</strong>——場所代を先に払って画廊を借り、個展を自分で開く形。</p>\n          <ul>\n            <li><strong>実際の動き</strong>：1週間単位で場所を借り、告知・集客・在廊・販売まで全部自分でやる。画廊の集客力は借りられないので、来場者は自分の回路から連れてくることになる</li>\n            <li><strong>取り分と入金</strong>：賃貸料を払うため売上は100％作家のもの。ただし賃貸料は立地・広さ・時期で週10万円程度〜100万円近くまでで、売れなければ場所代がそのまま損失になる</li>\n            <li><strong>次にどう育つか</strong>：履歴に書ける個展の実績と、来場者（将来のコレクター候補）との直接の接点が残る。お金より「実績と接点」を買う形</li>\n            <li><strong>彼の計画では</strong>：現行計画の主軸には置いていない。個展実績が要る段階で、自分の集客の回路が持てるようになってから使う形</li>\n          </ul>\n          <p><strong>オンラインで直接売る</strong>——BOOTH・BASEなどの売り場に自分で置いて売る形。手数料は安いが、集客は全部自分になる。</p>\n          <ul>\n            <li><strong>実際の動き</strong>：売り場に商品ページを置く→SNSの提示から買いに来る→注文が入る→発送する。受注生産なら在庫を持たずに出せる。売り場の発見力には頼れないので、提示（動画・投稿）そのものが集客になる</li>\n            <li><strong>取り分と入金</strong>：手数料は1桁台〜1割強で、手取り比率は画廊より圧倒的に高い。BASE 約6.6％＋40円／STORES 5.5％〜／minne 10.89％／Creema 10.67％／BOOTH 5.6％＋45円（アートビジネス計画「流通と取り分」と初歩段階の登録値）。手数料は送料込みの総額にかかる場合があり、価格は「売値＝手取り＋手数料＋送料負担」で逆算して置く</li>\n            <li><strong>次にどう育つか</strong>：役割は「最初の買い手と需要の確認」。ここで実績を作り、画廊接続の後は価格の管を画廊側へ移す。画廊接続を目指すなら、原画の価格は非公開・問い合わせ制が原則で、直販の管とは分ける</li>\n            <li><strong>彼の計画では</strong>：フェーズ1で、既存のドローイングからエディション1点をBOOTHに受注生産で出すことが決まっている（初歩段階に手順）。価格の階段の段1・段2の受け皿</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>名前を立てる</h3>\n          <p><strong>公募・コンクールから名前を立てる</strong>——賞と入選の経歴を積み、評価の側から名前を立てる形。収入源ではなく、経歴（価格の裏付け）への投資として置く。</p>\n          <ul>\n            <li><strong>実際の動き</strong>：出品料を払って応募する→入選・入賞が展示実績になる→その場に集まる学芸員・評論家・他の作家との接点ができ、経歴が次の推薦と画廊接続の材料になる。Idemitsu Art Award（40歳以下・平面、グランプリ300万円、出品料1点7,000円・25歳以下は無料、締切は7月末頃）が若手の登竜門の代表格。VOCA展は公募ではなく推薦制（VOCA賞300万円）で、「応募する賞」ではなく「推薦される側」になることが目標になるタイプ</li>\n            <li><strong>取り分と入金</strong>：賞金は副次的で、本体は出費が先行する構造。出品料は1点1万〜1.5万円に図録掲載料・搬送費が乗り、1展あたり実費2万〜5万円規模（団体展の例：日展1点14,000円）。若手割引（25歳・30歳・35歳以下）のある賞を優先するとコストが下がる</li>\n            <li><strong>次にどう育つか</strong>：団体展には入選→会友→会員という昇格の仕組みがあり、受賞歴・展示歴は号単価を動かす要素（知名度・展示歴・受賞歴）そのものになる</li>\n            <li><strong>彼の計画では</strong>：アートビジネス計画「公募・助成のカレンダー」に季節の窓が登録済み（夏＝Idemitsu、秋＝ポーラ、など）。提示と並行して経歴を作る回路として置く</li>\n          </ul>\n          <p><strong>海外の市場に出る</strong>——助成で渡航して滞在制作し、現地の回路と展示歴を作る形。いきなり売りに行く形ではない。</p>\n          <ul>\n            <li><strong>実際の動き</strong>：制度に応募する→渡航・滞在制作→現地のギャラリー・作家・学芸員と接点ができる→海外での展示と評価につながる。制度の実態は「研修」で、市場への入口は研修で作る回路の側にある</li>\n            <li><strong>取り分と入金</strong>：ポーラ美術振興財団「若手芸術家の在外研修助成」は1名あたり上限360万円（20〜39歳、募集は秋）。文化庁「新進芸術家海外研修制度」は渡航費実費＋滞在費（締切は7月末頃）。野村財団は上限100万円で春・秋の窓。金額の大きい順に押さえるのが計画の置き方</li>\n            <li><strong>次にどう育つか</strong>：海外の研修歴・展示歴はそのまま経歴の重みになり、号単価を動かす要素にもなる</li>\n            <li><strong>彼の計画では</strong>：公募・助成のカレンダーに登録済み。大学院に進むなら神山財団（年30万円×2年）も射程に入る（アートビジネス実務の調査の結論）</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>形を広げる</h3>\n          <p><strong>版画・エディションを軸にする</strong>——原画の下の段に、番号と記録のついたエディション作品を常設し、買える層を厚くする形。</p>\n          <ul>\n            <li><strong>実際の動き</strong>：エディション数と価格を先に固定して出す→受注生産なら在庫を持たず、注文が入ってから作って届ける→買った人の記録（番号・制作年・販売記録）が来歴として積み上がる。前提にあるのは階段の設計で、一点ものの高額作品だけでは、欲しい人の99％が買えずに去ってしまう</li>\n            <li><strong>取り分と入金</strong>：売り場は直販と複合する（手数料はオンライン直販の数字）。段2（1万〜5万円）が本命の入口で、点数を増やせば「1点ごとの取引」が「線」になる。原画（段3・10万円〜）の買い手を育てる階段でもある</li>\n            <li><strong>次にどう育つか</strong>：供給と認証を自分の手に握ることが価格の土台になる（認証と来歴の仕組みを握ったBanksyのやり方の個人版、という位置づけ）。逆に供給過多は価格と評価を同時に壊す（Hirstの失敗側の教訓）</li>\n            <li><strong>彼の計画では</strong>：価格の階段の段2そのもの。フェーズ2で「エディションの点数を増やし段2を常設にする」が設計済みで、記録・認証は管の部品5として、受験期から型を決めている</li>\n          </ul>\n          <p><strong>ライセンスとコラボに広げる</strong>——名前と視覚言語が立った後、権利を「貸す」側に回る形。自分の手を離れて回る層。</p>\n          <ul>\n            <li><strong>実際の動き</strong>：美術の実績が先に立つ→企業やブランドから打診が来る→権利は渡さず、条件をこちらが決めて貸す。村上隆は会社（カイカイキキ）を作って市場の側まで設計し、ルイ・ヴィトンとのコラボではライセンスする側に立ち、GEISAIで若手の市場自体も作った。商業を隠さず「スーパーフラット」と理論化して言説に入れたことも、この形の一部</li>\n            <li><strong>取り分と入金</strong>：ライセンス料とコラボの対価は契約ごとに決まる。作る時間と引き換えではない収入になるが、前提は「貸せる名前と視覚言語」が既に立っていること</li>\n            <li><strong>次にどう育つか</strong>：影の面もある。村上は2020年にカイカイキキの経営危機を自ら公表した。会社と市場の設計は固定費と体制の重さと引き換えで、広げた分だけ運営が本体を食い得る</li>\n            <li><strong>彼の計画では</strong>：フェーズ3「権利の層」そのもの。打診を受ける側に立ち、自分からは売り込まない。村上型の順序は「美術が先、商業が後」で、彼の順序（稼いでから画家として立つ）とは逆になるため、接続の条件（視覚言語の同一性、供給のコントロールなど）は将来逆算マップに登録済み</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>人でつながる</h3>\n          <p><strong>仕事の橋渡し型</strong>——絵に近い仕事（イラスト・デザイン）で食いながら回路を作り、作品が売れたら画家に渡り切る形。</p>\n          <ul>\n            <li><strong>実際の動き</strong>：五木田智哉の実例——デザイン会社に勤めたことはなく、人づてにイラスト・デザインの仕事を受け、「できますよ」と言って現場で覚えた。橋の収入で食いながら、出会いが来る回路の中に身を置き、名前と画風が先に立った。2003〜05年のニューヨークのグループ展で作品が完売し、デザインを辞めて画家専業に移った（引き際）</li>\n            <li><strong>取り分と入金</strong>：橋の仕事は仕事ごとの対価で確実性は高いが、時間と引き換え。画家の収入ではなく「制作を続けるための土台」の側のお金</li>\n            <li><strong>次にどう育つか</strong>：育つのは画風と回路と実績で、橋そのものは渡り切ったら離れる前提の形。渡り切る条件は、作品の側に売れる実績が立つこと</li>\n            <li><strong>彼の計画では</strong>：正直な留保として、今は入口の仕事（イラスト・デザインの下の層）がAIに食われていて、五木田の時代と同じ橋は架けにくい。彼の橋の収入は既に居酒屋のバイトが担っているので、この形から借りるのは「橋の収入＋回路＋引き際」という構造の側だけ</li>\n          </ul>\n          <p><strong>コレクターと直接つながる</strong>——画廊を介さず、買ってくれる個人と直接の関係を育てる、パトロン型の形。</p>\n          <ul>\n            <li><strong>実際の動き</strong>：展示の場とSNSで、作品と物語を買う個人と出会う→購入が来歴になる→買い手が次の買い手と推薦を連れてくる。決定的なのはフォロワー数ではなく、著名な作家・コレクターによる購入と推薦という「信用の橋渡し」で、ボアフォは著名作家の購入と推薦から画廊接続が起きた。コレクター側の調査では、100点超を所有するコレクター35名の半数超が「Instagramで発見した作家から購入した」と答えたという報告もある（サンプルは小さく参考値）</li>\n            <li><strong>取り分と入金</strong>：直接取引なので、引かれるのは売り場の手数料だけになる。ただし価格の一貫性は自分で守る——画廊より安く直販するアンダーカットは、パートナーシップと市場そのものを壊す</li>\n            <li><strong>次にどう育つか</strong>：コレクションされることが来歴になり、買い手の信用が次の評価への橋になる。関係が育つほど、価格の階段の上の段が成立しやすくなる</li>\n            <li><strong>彼の計画では</strong>：管の部品4「最初の買い手」——「市場」ではなく具体的な少数、がこの形。入口はSNSの蓄積と身近な評価者で、フェーズ1で作ることが決まっている</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>読み方</h3>\n          <p><strong>本丸は、形の組み合わせ</strong>——彼の本丸（原画・エディション販売）は、1つの形態ではなく組み合わせでできている。エディション（形を広げる）を入口に置き、オンライン直販で最初の取引を検証し、画廊委託で価格と信用を立て、公募で経歴を裏付けし、コレクターと直接の関係を育てる。ライセンスと海外は、実績が立った後の段に置く。レンタルギャラリーと橋渡し型は主軸ではなく、必要になった段階で使う部品。</p>\n          <ul>\n            <li><strong>回路の違いで見る</strong>：形態ごとに「出会いの回路」が違う。画廊は推薦の回路、公募は制度の回路、直販は自分の発信の回路、レンタルは自分で場を作る回路、海外は制度で渡る回路、橋渡しは仕事の回路、コレクターは関係の回路。形を選ぶことは、回路を選ぶことでもある</li>\n            <li><strong>彼の不足は出口の回路</strong>：彼の設計で不足が指摘されてきたのは、作品と提示があっても、評価と取引が発生する「出口の回路」がまだ設置されていないこと（五木田の分解で出た結論。管の部品では3・4・5＝価格の階段・最初の買い手・記録と認証がそれに当たる）。この見本帳は、回路の種類の地図として読む</li>\n            <li><strong>順序の置き方</strong>：受験期に進むのは記録の型（どの形態でも土台になる）だけ。フェーズ1で直販・提示・公募の回路を開き、画廊とコレクターの回路は実績と接点ができてから。ライセンスと海外は最後の段に置く</li>\n          </ul>\n          <p class=\"sources\">きっかけ・出典：本人の指示「アートビジネスの方でも同じように作っておいて」（2026-11-20）。数字と実例は、アートビジネス計画「流通と取り分」「公募・助成のカレンダー」「画家の集客の実態」と、アートビジネス実務の調査・画家の集客の事例・将来逆算マップに基づく</p>\n        </div>",

   "html": "<div class=\"detail-head\"><h2>アートビジネス計画</h2></div>\n        <p class=\"sec-lead\">天才の偶然売れではなく、計画的にいく。ただし計画は表に見せない——表に出るのは作品と物語だけ。</p>\n        <h3>設計原則（4つ）</h3>\n        <ol class=\"rules\">\n          <li><strong>計画は裏、表は作品と物語だけ</strong>——計算・検証・価格の設計は裏側に置く。名前を守る構造でもある</li>\n          <li><strong>関係は柔らかく、条件は硬く</strong>——値段・エディション数・権利の条件は先に固定し、その場の交渉に性格を持ち込まない</li>\n          <li><strong>視覚言語の同一性</strong>——集客の動画も、売る物も、本命の絵画も、同じモチーフ・同じ世界で通す</li>\n          <li><strong>reveal-ready</strong>——原画・日付・制作記録を残し、将来本名に接続できる来歴を最初から作る</li>\n        </ol>\n        <h3>ビジネスの管（6つの部品）</h3>\n        <div class=\"flow\"><span>制作</span><i>→</i><span>提示</span><i>→</i><span>取引</span><i>→</i><span>記録・認証</span><i>→</i><span>評価</span><i>→</i><span>次の制作</span></div>\n        <p>「作品を作って売る」だけでは金にならない。管のどれが欠けても止まる。いまの不足は <strong>3・4・5</strong> で、ここがビジネスの実体部分。</p>\n        <ul class=\"parts\">\n          <li><span class=\"pn\">1</span><div class=\"pb\"><span class=\"pt\">作品（質）</span><span class=\"pd\">個人でしか生み出せない質の高いもの。全ての前提</span></div><span class=\"status\">制作中</span></li>\n          <li><span class=\"pn\">2</span><div class=\"pb\"><span class=\"pt\">物語</span><span class=\"pd\">作家と世界の物語。買い手は絵と一緒に物語を買う</span></div><span class=\"status\">設計中</span></li>\n          <li><span class=\"pn\">3</span><div class=\"pb\"><span class=\"pt\">価格の階段</span><span class=\"pd\">「買える層」の設計。高額一点だけでは取引が発生しない</span></div><span class=\"status gap\">未設計</span></li>\n          <li><span class=\"pn\">4</span><div class=\"pb\"><span class=\"pt\">最初の買い手</span><span class=\"pd\">「市場」ではなく具体的な少数。SNSの蓄積＋身近な評価者</span></div><span class=\"status gap\">未着手</span></li>\n          <li><span class=\"pn\">5</span><div class=\"pb\"><span class=\"pt\">記録・認証</span><span class=\"pd\">エディション番号、制作年、原画データ、販売記録。来歴が将来の価格の土台になる</span></div><span class=\"status gap\">仕組み化が課題</span></li>\n          <li><span class=\"pn\">6</span><div class=\"pb\"><span class=\"pt\">見せる場と頻度</span><span class=\"pd\">作品が人の目に触れる回数と場所。質×露出でしか評価は生まれない</span></div><span class=\"status\">TikTok設計中</span></li>\n        </ul>\n        <p class=\"firststep\"><strong>最初の一歩：</strong>不足している3つ（価格の階段・最初の買い手・記録と認証）のうち、まず記録の型をフェーズ0で決める。残り2つはフェーズ1で作る<br><strong>時期：</strong>記録の型は今（フェーズ0）。価格の階段と最初の買い手は受験後（フェーズ1）</p>\n        <h3>価格の階段</h3>\n        <p>一点ものの高額作品だけを置くと、欲しい人の99%が買えずに去る。階段を作ると、各段が次の段の買い手を育てる。<strong>原則：値段は下げない。</strong>下の段を増やして買える人を増やすのであって、同じ物の値段を割って売らない。</p>\n        <div class=\"pstairs\">\n          <div class=\"ps-row\" style=\"--i:0\"><span class=\"ps-n\">段0</span><span class=\"ps-price\">無料</span><span class=\"ps-b\"><span class=\"ps-f\">動画・投稿（世界観の提示）</span><span class=\"ps-r\">集客と物語の蓄積</span></span></div>\n          <div class=\"ps-row\" style=\"--i:1\"><span class=\"ps-n\">段1</span><span class=\"ps-price\">数百〜数千円</span><span class=\"ps-b\"><span class=\"ps-f\">デジタル素材、描き文字、小プリント</span><span class=\"ps-r\">最初の取引。買う体験を作る</span></span></div>\n          <div class=\"ps-row\" style=\"--i:2\"><span class=\"ps-n\">段2</span><span class=\"ps-price\">1万〜5万円</span><span class=\"ps-b\"><span class=\"ps-f\">エディション作品（番号・記録つき）</span><span class=\"ps-r\">本命の入口。来歴が始まる</span></span></div>\n          <div class=\"ps-row\" style=\"--i:3\"><span class=\"ps-n\">段3</span><span class=\"ps-price\">10万円〜</span><span class=\"ps-b\"><span class=\"ps-f\">原画、大判エディション</span><span class=\"ps-r\">評価と価格の頂点。供給は絞る</span></span></div>\n          <div class=\"ps-row\" style=\"--i:4\"><span class=\"ps-n\">段4</span><span class=\"ps-price\">契約</span><span class=\"ps-b\"><span class=\"ps-f\">ライセンス（グッズ・コラボ）</span><span class=\"ps-r\">自分の手を離れて回る層。権利は渡さず貸す</span></span></div>\n        </div>\n        <p class=\"firststep\"><strong>最初の一歩：</strong>段1の品目を1つ決め、既存のドローイングからエディションにする1点を選ぶ<br><strong>時期：</strong>受験後（フェーズ1と並行）</p>\n        <h3>取引の実務（号単価と価格の決め方）</h3>\n        <p>原画の価格は、日本の画廊市場では<strong>号単価（1号あたりの価格）×号数</strong>で置く慣行が一般的だ。価格はオークション式ではなく、作家と画廊が話し合って決める。</p>\n        <ul>\n          <li><strong>号単価を動かす要素</strong>：知名度、美術館での展示歴、受賞歴、個展実績、市場での取引実績、評論家の評価。『美術市場』『美術年鑑』には作家ごとの標準価格（号単価）が掲載される</li>\n          <li><strong>慣行上の調整</strong>：4号以下の小品は手間を考えて号計算より高めに、12〜15号を超える大作は号計算より抑えめに置かれることが多い</li>\n          <li><strong>販売実績がない段階の置き方</strong>：号単価の相場だけで決めず、「材料費＋制作時間＋売る場所の相場」の3点で下限と上限を挟んで決めるのが現実的</li>\n          <li><strong>値上げの仕方</strong>：完売の継続、重要な展覧会、美術館収蔵、需要超過といった実績の裏付けに連動させて、少しずつ段階を刻む。実績の伴わない急な跳ね上げはしない</li>\n          <li><strong>値下げが禁忌の理由</strong>：一度付けた値段を下げると、前に定価で買ってくれた人の絵の値打ちまで下がってしまう。売れない時の処方箋は値下げではなく、見せる場所・相手を変えること</li>\n          <li><strong>売る場所ごとの一貫性</strong>：画廊では高く直販では安く売る「アンダーカット」は、パートナーシップと市場そのものを壊す。直販でも同じ価格基準を守る</li>\n        </ul>\n        <h3>流通と取り分</h3>\n        <p>同じ1点でも、売る場所で手元に残る割合がまったく違う。画廊の取り分は「集客・信用・価格維持」の対価で、手数料の安さだけで売り場を選ばない。</p>\n        <ul>\n          <li><strong>画廊委託</strong>：作家：画廊＝50：50 が一次市場の標準的な目安。固定ルールではなく交渉と条件で動き、画廊の取り分が60%になるケースや、非営利・協同スペースでは作家側60%の例もある。日本の実務では、作家の手取りは概ね4〜6割が中心帯</li>\n          <li><strong>形態による違い</strong>：委託販売専門の画廊では手数料30%（作家70%）の例、公募展・団体展の会場で売れた場合は下代（画料）が上代の2〜4割程度という例もある</li>\n          <li><strong>貸画廊</strong>：賃貸料は立地・広さ・時期で週10万円程度〜100万円近くまで。賃貸料を払うため売上は100%作家のものになるが、集客と販売は自己責任</li>\n          <li><strong>新人の始まり方</strong>：まず委託販売（売れた分だけ報酬、契約なしが多い）から始まるのが通例。買い取り（卸）は画廊のリスクが高いため、新人には少ない</li>\n        </ul>\n        <p>オンライン直販は手数料が1桁台〜1割強で、手取り比率は圧倒的に高い。代わりに集客は全て自分でやる。</p>\n        <div class=\"stats\">\n          <div class=\"stat\"><div class=\"v\">約6.6<small>%＋40円</small></div><div class=\"k\">BASE（スタンダードプラン）：決済3.6%＋40円＋サービス利用料3%</div></div>\n          <div class=\"stat\"><div class=\"v\">5.5<small>%〜</small></div><div class=\"k\">STORES（フリープラン）の決済手数料</div></div>\n          <div class=\"stat\"><div class=\"v\">10.89<small>%</small></div><div class=\"k\">minne の販売手数料（税込）。ほかに振込手数料220円</div></div>\n          <div class=\"stat\"><div class=\"v\">10.67<small>%</small></div><div class=\"k\">Creema の手数料（税込、決済総額に対して）</div></div>\n        </div>\n        <div class=\"note\">\n          <p>注意：手数料は「送料込みの総額」にかかる場合があり、額装・送料の実費は別途自分持ちになる。価格は「売値＝手取り＋手数料＋送料負担」で逆算して置く。</p>\n        </div>\n        <h3>フェーズ</h3>\n        <ol class=\"steps\">\n          <li data-n=\"0\"><span class=\"st\">土台（今ここ）</span><span class=\"sd\">制作ラインを維持する（受験制作がそのまま作品蓄積になる）。世界観と視覚言語を1つに絞る。記録の型を決める：作品ごとに原画ファイル／制作日／タイトル／技法を残す。</span>\n<p class=\"firststep\"><strong>最初の一歩：</strong>記録の型を1枚に決めて、次に仕上がる作品からその型で残し始める<br><strong>時期：</strong>今すぐ（受験制作と一体で進める）</p></li>\n          <li data-n=\"1\"><span class=\"st\">提示と最初の取引</span><span class=\"sd\">動画の投稿を始め、30本検証で「提示の型」を1つ当てる。並行して既存ドローイングからエディション1点をBOOTHに受注生産で出す。</span><span class=\"done-when\">最初の1件の取引（金額は問わない）と、提示の型の当たり1つ</span>\n<p class=\"firststep\"><strong>最初の一歩：</strong>提示に使う最初の動画を1本作る<br><strong>時期：</strong>受験後（2027年3月以降）</p></li>\n          <li data-n=\"2\"><span class=\"st\">階段を組む</span><span class=\"sd\">当たった型を連載化し、フォロワーの蓄積を始める。エディションの点数を増やし段2を常設にする。売上の実績に応じてバイトを段階的に減らす。</span><span class=\"done-when\">月10万円の売上ラインが見えること</span>\n<p class=\"firststep\"><strong>最初の一歩：</strong>フェーズ1で当たった型の2本目を出す<br><strong>時期：</strong>フェーズ1が終わってから</p></li>\n          <li data-n=\"3\"><span class=\"st\">権利の層</span><span class=\"sd\">ライセンス・コラボの打診を受ける側に立つ（自分から売り込まない。条件はこちらが決める）。原画の価格帯を上げる。供給は絞ったまま。</span><span class=\"done-when\">年600万円ペース（節目）</span>\n<p class=\"firststep\"><strong>最初の一歩：</strong>ライセンスの条件（権利は渡さず貸す、条件はこちらが決める）を1枚に書き出す<br><strong>時期：</strong>フェーズ2で売上の実績が立ってから</p></li>\n        </ol>\n        <h3>初歩段階</h3>\n        <p>フェーズ0と1を、順番どおりに実行できる手順に開いたもの。計画の本体はフェーズの側にあり、ここは「手を動かす順番」だけを置く。</p>\n        <p><strong>初歩段階のゴール：</strong>エディション作品1点がBOOTHで受注生産として販売中になっていて、作品を提示する動画の投稿が始まっている状態。その手前の段（受験期）では、記録の型が決まり、仕上がった作品がその型で残り始めていること。</p>\n        <p><strong>必要なもの</strong></p>\n        <ul>\n          <li><strong>記録の置き場所</strong>：作品ごとに原画ファイル／制作日／タイトル／技法を残す場所（台帳でもフォルダでもよい。型が1つに決まっていれば足りる）</li>\n          <li><strong>BOOTHのアカウント</strong>：受注生産なら在庫を持たずに出せる。手数料は売上の5.6%＋45円（1,000円の販売で手取り899円）。口座等の登録の細部は開始時に確認する</li>\n          <li><strong>動画の投稿先</strong>：提示の動画を出すアカウント（フェーズ1の30本検証の場）。既存の設計どおりTikTokが軸</li>\n          <li><strong>費用</strong>：開始は0円で始められる。印刷・発送の実費は注文が入ってから発生する（受注生産のため）</li>\n        </ul>\n        <p><strong>手順</strong></p>\n        <ol class=\"steps\">\n          <li data-n=\"1\"><span class=\"st\">記録の型を1枚に決める</span><span class=\"sd\">作品ごとに残す項目（原画ファイル／制作日／タイトル／技法／エディション番号の振り方）を決め、型として固定する。来歴は後から作れないので、型決めが全ての先に来る</span><span class=\"done-when\">終わりの目安：型が1枚にまとまり、次の作品から迷わず使える</span></li>\n          <li data-n=\"2\"><span class=\"st\">型で残し始める</span><span class=\"sd\">仕上がった作品から、その型で記録していく。受験制作がそのまま作品の蓄積になる（フェーズ0）</span><span class=\"done-when\">終わりの目安：新作が仕上がるたびに、記録が型どおりに増えている</span></li>\n          <li data-n=\"3\"><span class=\"st\">エディションにする1点を選ぶ</span><span class=\"sd\">受験後。既存のドローイングから、価格の階段の段2（1万〜5万円）に出す1点を選ぶ。エディション数と価格を先に固定する（値段は下げない、が原則）</span><span class=\"done-when\">終わりの目安：1点・部数・価格の3つが決まっている</span></li>\n          <li data-n=\"4\"><span class=\"st\">BOOTHに受注生産で出す</span><span class=\"sd\">商品ページを作り、受注生産（注文が入ってから印刷・発送）の形で販売を開始する。価格は「売値＝手取り＋手数料＋送料負担」で逆算して置く</span><span class=\"done-when\">終わりの目安：商品ページが公開され、買える状態になっている</span></li>\n          <li data-n=\"5\"><span class=\"st\">提示の動画を投稿し始める</span><span class=\"sd\">制作過程そのものを素材にして、世界観を提示する動画を出す。30本検証で「提示の型」を1つ当てるのがフェーズ1の本体</span><span class=\"done-when\">終わりの目安：投稿が始まり、型の当たりを探す記録が付いている</span></li>\n        </ol>\n        <p><strong>つまずきどころ</strong></p>\n        <ul>\n          <li><strong>記録を後回しにする</strong>：制作年や原画データは後から復元できない。型決めだけは受験期のうちに終わらせる</li>\n          <li><strong>直販と原画の価格管理を混ぜる</strong>：BOOTHの直販は「入口の検証」に限定する位置づけ（画家の集客の実態）。画廊接続を目指すなら原画の価格は非公開・問い合わせ制が原則で、段2のエディションと原画の価格の管は分ける</li>\n          <li><strong>売れない時に値段を下げる</strong>：値下げは前に買った人の絵の値打ちまで下げる。処方箋は値下げではなく、見せる場所と相手を変えること（取引の実務）</li>\n          <li><strong>運営が制作を食う</strong>：販売は受注生産＋プラットフォームに寄せて、在庫・発送・交渉の時間を消す。順番は制作→運営（時間の設計）</li>\n        </ul>\n        <p><strong>時期：</strong>手順1〜2（記録の型と運用開始）は今すぐ（受験制作と一体）。手順3以降は受験後（2027年3月以降、フェーズ1）</p>\n        <h3>現実の数字</h3>\n        <div class=\"stats\">\n          <div class=\"stat\"><div class=\"v\">4,000〜5,000<small>円/号</small></div><div class=\"k\">号単価（学生・無名）。実績が積めれば8,000〜15,000円/号</div></div>\n          <div class=\"stat\"><div class=\"v\">50 : 50</div><div class=\"k\">画廊委託の標準的な取り分</div></div>\n          <div class=\"stat\"><div class=\"v\">約239<small>万円</small></div><div class=\"k\">美術家の平均年収。半数が200万円未満</div></div>\n          <div class=\"stat\"><div class=\"v\">上限360<small>万円</small></div><div class=\"k\">ポーラの在外研修助成。募集は毎年10〜11月</div></div>\n        </div>\n        <p>数字が示す標準形は「安定した枠 ＋ 作品販売 ＋ 公募・助成」の複合。作品販売一本では立たない。</p>\n        <h3>画家の集客の実態</h3>\n        <ul>\n          <li>決定的なのはフォロワー数ではなく、<strong>一貫した作風の継続投稿</strong>と、著名な作家・コレクターの購入と推薦による<strong>信用の橋渡し</strong></li>\n          <li>SNSの役割は2つに限られる。<strong>発見される場</strong>であることと、関心が発生した後に<strong>裏付け確認に耐える記録</strong>であること。評価の確定は、人の推薦と展示歴というオフラインの回路で起きる</li>\n          <li><strong>価格の出し方</strong>：画廊接続を目指すなら、価格は非公開・問い合わせ制が原則。価格をフィードに明示すると画廊の価格管理と衝突し、将来の所属の障害になりうる</li>\n          <li><strong>直販の置き場所</strong>：入口の検証に限定する。無所属期はDM・オンライン直販で最初の買い手と需要を確認し、画廊と組んだ後は価格と顧客管理の管を画廊に移す（画廊所属後に直販をやめたレイ・クラインの段階設計）</li>\n          <li><strong>日本の現実</strong>：画廊のスカウトは作家同士の推薦・紹介が今も本線で、Instagramは推薦された作家の裏付け確認のために精査される道具。公募も接続の入口として有効。順序は「継続投稿でアーカイブを作る→公募・グループ展で展示実績と接点を作る→推薦が発生する→画廊接続」</li>\n          <li><strong>失敗側の教訓</strong>：投機バブルは崩壊した（若手市場は2021年比で約3分の1に縮小）。投機マネーが作る価格は作家の評価ではない。急な値上げと安易な値下げの両方が、価格という信頼の信号を毀損する</li>\n        </ul>\n        <h3>公募・助成のカレンダー</h3>\n        <p>若手画家に関係の深い制度は、季節で回っている。金額の大きいものから押さえる。</p>\n        <ul>\n          <li><strong>春（4〜6月）</strong>：野村財団「芸術文化助成」（美術部門・個人、上限100万円）の下期分の窓。神山財団「芸術支援プログラム」（年30万円×2年）は大学院生が対象で、学部生のうちは射程外</li>\n          <li><strong>夏（7月）</strong>：文化庁「新進芸術家海外研修制度」（締切は7月末頃）。Idemitsu Art Award（40歳以下・平面、グランプリ300万円、締切は7月末頃、25歳以下は出品料無料）</li>\n          <li><strong>秋（10〜11月）</strong>：ポーラ美術振興財団「若手芸術家の在外研修助成」（1名あたり上限360万円、この規模では最大級）。野村財団の上期分の窓。日展など団体展の搬入・締切も秋</li>\n          <li><strong>冬〜春</strong>：レジデンス（滞在制作）の公募。神山アーティスト・イン・レジデンスは1〜2月の募集が例年のリズム</li>\n          <li><strong>VOCA展は公募ではない</strong>：学芸員・評論家等の推薦制（VOCA賞300万円）。「応募する賞」ではなく「推薦される側」になることが目標になるタイプ</li>\n        </ul>\n        <div class=\"note\">\n          <p>公募展は出品料1点1万〜1.5万円に図録掲載料・搬送費が乗り、1展あたり実費2万〜5万円規模。収入源ではなく、経歴（価格の裏付け）への投資として置く。若手割引（25歳・30歳・35歳以下）のある賞を優先するとコストが下がる。金額・締切は年度で変わるため、応募時は必ず当年度の公式要項で確認する。</p>\n        </div>\n        <h3>時間の設計</h3>\n        <ul>\n          <li><strong>制作と集客を分けない</strong>。制作過程そのものが集客素材になる</li>\n          <li>販売は受注生産＋プラットフォームに寄せ、在庫・発送・交渉の時間を消す</li>\n          <li>運営時間に上限を置く。順番は制作 → 運営。制作時間が残り物にならないようにする</li>\n          <li>Phase 2で売上が立つまで、事業に生活費を背負わせない（焦りが作風と価格を壊すため）</li>\n        </ul>\n        <p class=\"sources\">出典：個人アートビジネス全体設計（2026-11-08）／アートビジネス実務 調査（2026-11-11。号単価・取り分・制度の数字は調査内で出典を確認したもの）／画家の集客 事例（2026-11-11）</p>",

   "html": "<div class=\"detail-head\"><h2>事業リスト</h2></div>\n        <div class=\"bizcards\">\n          <a class=\"bizcard\" href=\"#/appbiz\" data-open-link=\"appbiz\"><span class=\"bc-main\"><span class=\"bc-t\">アプリ事業</span><span class=\"bc-d\">図鑑アプリの受託と、他ジャンルの横展開</span></span><span class=\"status\">常設</span></a>\n          <a class=\"bizcard\" href=\"#/affiliate\" data-open-link=\"affiliate\"><span class=\"bc-main\"><span class=\"bc-t\">アフィリエイト</span><span class=\"bc-d\">英語圏の比較記事で、他人の商品の紹介料を得る</span></span><span class=\"status\">テスト枠</span></a>\n          <a class=\"bizcard\" href=\"#/digital\" data-open-link=\"digital\"><span class=\"bc-main\"><span class=\"bc-t\">海外向けデジタル商品</span><span class=\"bc-d\">日本人にしか作れない題材を、英語圏の売り場で売る</span></span><span class=\"status\">テスト枠</span></a>\n          <a class=\"bizcard\" href=\"#/story\" data-open-link=\"story\"><span class=\"bc-main\"><span class=\"bc-t\">物語のある物</span><span class=\"bc-d\">物ではなく物語を売る、メルカリ物販</span></span><span class=\"status\">テスト枠</span></a>\n          <a class=\"bizcard\" href=\"#/makefun\" data-open-link=\"makefun\"><span class=\"bc-main\"><span class=\"bc-t\">make.fun</span><span class=\"bc-d\">AIエージェントの懸賞案件で賞金を取る</span></span><span class=\"status\">テスト枠</span></a>\n          <a class=\"bizcard\" href=\"#/note\" data-open-link=\"note\"><span class=\"bc-main\"><span class=\"bc-t\">有料note</span><span class=\"bc-d\">AIパイプラインで有料記事を作って売る</span></span><span class=\"status\">テスト枠</span></a>\n        </div>",

   "html": "<div class=\"detail-head\"><h2>アプリ事業</h2></div>\n        <p class=\"sec-lead\">図鑑アプリを金に変える事業。美術分野の受託と、他ジャンルの横展開——2つの顔の進め方と決まりを置く。</p>\n        <h3>アプリ事業―図鑑アプリ</h3>\n        <p class=\"sec-lead\">図鑑アプリの仕組み（エンジン）は分野を選ばない。金の変え方は、分野によって2つに分けることが決まった。</p>\n        <div class=\"branch2\">\n          <div class=\"b-src\">図鑑の仕組み（エンジン）</div>\n          <div class=\"b-stem\"></div>\n          <div class=\"b-bar\"></div>\n          <div class=\"b-cols\">\n            <div class=\"b-col art\"><span class=\"b-t\">美術分野</span><span class=\"b-v\">受託</span><span class=\"b-d\">画廊・画家・美術団体から構築を受ける</span></div>\n            <div class=\"b-col other\"><span class=\"b-t\">他ジャンル</span><span class=\"b-v\">横展開</span><span class=\"b-d\">自前のネイティブアプリとしてストアに出す</span></div>\n          </div>\n        </div>\n        <div class=\"lanes\">\n          <div class=\"lane art\">\n            <h3>美術分野 ＝ 受託</h3>\n            <p>画廊・画家・美術団体などの「自分たちの図鑑が欲しいけど作れない」側から、構築を受ける。狙いは<strong>金＋美術界との縁＋実績</strong>の3つ同時。</p>\n            <ul>\n              <li><strong>客の像</strong>：自分の全作品のアーカイブが欲しい画家本人／小さい画廊・美術団体／ファンコミュニティ／専門店／小さい博物館・資料館／コレクター</li>\n              <li><strong>売る物の3段</strong>：構築一式（データ整形込み）／点数単位のデータ化／月額の運用代行</li>\n              <li><strong>条件</strong>：渡すのは完成したアプリだけ。エンジンの権利は翔万に残す。データの権利は発注側に置く</li>\n              <li><strong>始動</strong>：納期のある他人の仕事なので、本格始動は受験後</li>\n            </ul>\n          </div>\n          <div class=\"lane other\">\n            <h3>他ジャンル ＝ 横展開</h3>\n            <p>ジャンルごとの図鑑を、自前のネイティブアプリとして App Store / Google Play に出し、アプリ収入の階段に乗せる。無料で出し、サブスクや追加機能の課金で取る（本人の決定、2026-11-21）。名義については、ストアは個人登録だと本名が出る——App Store では販売元に本名（ローマ字）が表示され、Google Play では本名と国が公開され、収益化すると住所まで出る（2026-11-21、本人の実機で確認）。ただし2026-11-21の条件の組み直し（ルールの「名前と顔の条件」）で、名義はとりあえず決着した——個人登録のまま出し、本名表示は許容する。法人化は必須ではない。最終確認は最初の1本を出す時（未決・保留に登録）。</p>\n            <ul>\n              <li><strong>実装済みの証明</strong>：音楽／映画／食材</li>\n              <li><strong>効く分野の条件</strong>：「人と作品と記録」の蓄積型で、ファンが深く調べたくて、既存の情報が散らかっている場所</li>\n              <li><strong>候補</strong>：スポーツ記録（野球選手・力士）／声優・アイドル／漫画／名車／時計／スニーカー</li>\n            </ul>\n          </div>\n        </div>\n        <h3>図鑑：受託の進め方</h3>\n        <p><strong>初歩段階のゴール：</strong>声かけの受け皿（見本アプリ＋「何を・いくらで・どのくらいで作れるか」の条件表）が公開されていて、最初の声かけ先が名指しで決まっている状態。ここまで来れば、あとは声をかけるだけで仕事が動き始める。</p>\n        <p><strong>必要なもの</strong></p>\n        <ul>\n          <li><strong>見本になるアプリ群</strong>：作家図鑑（Arcanum）と音楽・映画・食材の図鑑。既に動いている実物がそのまま見本になる（追加で作るものはない）</li>\n          <li><strong>受け皿の置き場所</strong>：条件表と見本への導線を置くページ（公開URL）。形式は開始時に決める</li>\n          <li><strong>費用</strong>：0円で始められる（既存の仕組みの上で作るため、新しい契約や道具は要らない）</li>\n        </ul>\n        <ol class=\"steps\">\n          <li data-n=\"1\"><span class=\"st\">条件表を作る</span><span class=\"sd\">売る物の3段（構築一式／点数単位のデータ化／月額の運用代行）ごとに、内容・価格・期間の目安を一枚にまとめる。価格は「安さ」ではなく「この形は他にない」で立てる。あわせて条件の線引き（渡すのは完成したアプリだけ／エンジンの権利は翔万に残す／データの権利は発注側に置く）も同じ一枚に書く</span><span class=\"done-when\">終わりの目安：3段それぞれに価格と期間が入り、そのまま相手に見せられる</span></li>\n          <li data-n=\"2\"><span class=\"st\">見本の見せ方を決める</span><span class=\"sd\">説明より先に、完成した物を触ってもらうのがこの形の売り方。見本アプリ群のうち、相手の分野に一番近い1つを最初に見せる順番を決める</span><span class=\"done-when\">終わりの目安：「まずこれを触ってください」と言える見本が1つに決まっている</span></li>\n          <li data-n=\"3\"><span class=\"st\">受け皿を公開する</span><span class=\"sd\">条件表と見本への導線を1つのページにまとめ、公開URLにする。問い合わせの受け口（連絡先）も同じページに置く</span><span class=\"done-when\">終わりの目安：受け皿ページが公開され、他人が開けるURLがある</span></li>\n          <li data-n=\"4\"><span class=\"st\">最初の声かけ先を決める</span><span class=\"sd\">客の像（自分の全作品のアーカイブが欲しい画家本人／小さい画廊・美術団体／ファンコミュニティ／専門店／小さい博物館・資料館／コレクター）の中から、縁のある順に最初の数件を名指しで決める。営業と集客の進め方そのものは本人の保留事項で、初歩段階は「誰に声をかけるか」の決定までとする</span><span class=\"done-when\">終わりの目安：声かけ先が名指しで決まっている</span></li>\n        </ol>\n        <p><strong>つまずきどころ</strong></p>\n        <ul>\n          <li><strong>価格を決めずに話し始める</strong>：条件が曖昧なまま進むと、交渉の場で条件が動く。条件表を先に作ることが、この形の要になる</li>\n          <li><strong>仕組みそのものを売りそうになる</strong>：売るのは完成したアプリだけ。エンジンのキット販売はしない（線引きの決まり）</li>\n          <li><strong>発注側の作業を増やす</strong>：構築の段では、発注側の作業は素材の提供と確認だけに寄せる。相手に手間をかけさせる形は続かない</li>\n        </ul>\n        <p>狙いは金の額だけではない。画廊・画家・美術団体との<strong>縁</strong>と、美術分野での<strong>実績</strong>が同時に手に入ることが、この形の本体。</p>\n        <p><strong>時期：</strong>受験後（2027年3月以降）に本格始動。納期のある他人の仕事なので、受験期には始めない</p>\n        <h3>図鑑：横展開の進め方</h3>\n        <p><strong>初歩段階のゴール：</strong>最初の1本がストア（App Store / Google Play）で公開され、誰でも無料でダウンロードできる状態。ビジネス計画の検証の段（段1）にそのまま乗せられる形で出す。</p>\n        <p><strong>必要なもの</strong></p>\n        <ul>\n          <li><strong>型とデータの作り方</strong>：図鑑の型（カード表示・年表・関係図・価格記録）の設計と、データの集め方・選び方は既にある。ただし出品する物はネイティブアプリなので、ビルドの手段は今のウェブ基盤とは別になる（具体的な手段は未検証）</li>\n          <li><strong>題材のデータ</strong>：最初の分野のデータを集めて選ぶ作業が、本体の手間になる</li>\n          <li><strong>開発者登録</strong>：ストアに出す前提費用として、Apple Developer が年額 $99、Google Play が登録 $25（1回）。アプリの運営費は、動く時にAIを呼ばない形ならゼロのままにできる</li>\n        </ul>\n        <ol class=\"steps\">\n          <li data-n=\"1\"><span class=\"st\">分野を1つ決める</span><span class=\"sd\">条件は3つ——「人と作品と記録」の蓄積型であること／ファンが深く調べたくなる分野であること／既存の情報が散らかっていること。候補（スポーツ記録／声優・アイドル／漫画／名車／時計／スニーカー）から、この3条件で採点して1つに絞る</span><span class=\"done-when\">終わりの目安：分野が1つに決まり、3条件で「なぜか」を言える</span></li>\n          <li data-n=\"2\"><span class=\"st\">最小のデータセットを揃える</span><span class=\"sd\">公開に足りる最小の範囲を先に決め、その範囲のデータを集めて選ぶ。データの深さと正確さ、本人の目による選定、元々の文章——この3つが堀になる。全部を揃えてから出そうとすると公開が来ないので、範囲を切るのが先</span><span class=\"done-when\">終わりの目安：決めた範囲のデータが、公開できる形で揃っている</span></li>\n          <li data-n=\"3\"><span class=\"st\">型を移植して組み立てる</span><span class=\"sd\">図鑑の型（カード表示・年表・関係図・価格記録）の設計を使い、ネイティブアプリとして組み立てる。分野に合わせてデータと見せ方を差し替える。作るコストは型で下げる</span><span class=\"done-when\">終わりの目安：アプリが手元で一通り動く</span></li>\n          <li data-n=\"4\"><span class=\"st\">ストアに出す</span><span class=\"sd\">開発者登録を済ませ、ストアの審査を通して公開する。無料で出し、課金はサブスク／追加機能の形で付ける</span><span class=\"done-when\">終わりの目安：ストアで公開され、身内以外がダウンロードできる</span></li>\n          <li data-n=\"5\"><span class=\"st\">集客の入口を1つ置く</span><span class=\"sd\">分野ごとに集客は要る。結果画面のシェアか短尺動画か、分野に合う入口を1つに絞って出す（ビジネス計画の段2＝集客テスト30日に接続する）</span><span class=\"done-when\">終わりの目安：入口が1つ公開され、利用の記録が付き始める</span></li>\n        </ol>\n        <p><strong>つまずきどころ</strong></p>\n        <ul>\n          <li><strong>データ集めで時間を溶かす</strong>：時間をかけるのはここ、と分かっていても際限がない。最小の範囲を先に決めることが回避法になる</li>\n          <li><strong>作る前に配布の形がない</strong>：出しただけでは誰にも届かない。集客の入口までを初歩段階に含めるのはそのため</li>\n          <li><strong>分野の選び間違い</strong>：3条件を満たさない分野は、ファンの深さも情報の空白もなく、型を移植しても刺さらない。段2の数字（身内以外の利用者10人）が判定になる</li>\n        </ul>\n                <p><strong>AIの置き場所——制作時と使用時</strong></p>\n        <ul>\n          <li><strong>今の形はそのまま出品できる</strong>：彼のアプリ群は、AIが働くのは制作とデータのキュレーションの時だけで、出品するアプリ自体にはAIが入っていない（データ＋閲覧の形）。更新は、彼とClaudeが新しいデータを用意して配る形になる。この形なら、ストアに出す時にAIまわりの追加の仕組みは要らない</li>\n          <li><strong>使用時にAIが要る機能は別問題</strong>：その場で生成・収集する機能を入れると、APIの鍵と利用料を誰が持つかが問題になる。選択肢は3つ——(a) サブスク収入で賄い、彼のサーバー経由でAPIを使う形（サーバー費用がかかり、ヘビーユーザーが来ると利用料が膨らむ）／(b) ユーザー自身のキーを持たせる形（使える人が限られ、摩擦が大きい）／(c) 使用時AIを入れない設計にする</li>\n          <li><strong>結論は未決定</strong>：未決・保留にも登録した。最初の1本を決める時に、その題材が制作時のAIだけで成立するかどうかを判定する</li>\n        </ul>\n        <p>出た図鑑が増えるほど、データの集計レポートや受託の見本として効く範囲が広がる。1本ごとの弱さが、束になることで強みに変わる。</p>\n        <p><strong>時期：</strong>受験後（2027年3月以降）</p>\n        <h3>図鑑：線引きの決まり</h3>\n        <ul>\n          <li><strong>エンジンのキット販売はしない</strong>。仕組みを公開することになるため。売るのは完成品であって、作り方ではない</li>\n          <li><strong>アプリは動く時にAIを呼ばない</strong>。AIが働くのは作る時とデータを揃える時だけ。だから他人が使っても自分のAIアカウントは減らず、運営費もゼロのまま渡せる</li>\n          <li><strong>唯一無二性の堀は3つ</strong>：データの深さと正確さ／本人の目による選定／元々の文章（ガイド・調査）。コードは真似できても、この3つは年月がかかる</li>\n        </ul>\n        <div class=\"note\">\n          <h3 style=\"margin-top:0\">図鑑：特許の結論</h3>\n          <p>今のアプリ群の大半は特許化が難しい。理由は3つ——進歩性の壁（既存技術の組み合わせと判断されやすい）、既に公開済み（救済は本人の公開から1年以内）、ソフトウェア単体では対象になりにくい。日記アプリのTodo（金額と写真の自動回収）も、ほしい物リスト等の先行例が大きく単体では厳しい見立て。</p>\n          <p>図鑑の独自性は仕組みの新しさではなく、データの量・編集・選定の蓄積にある。守りは著作権と「真似に同じ年月がかかる」という事実の側。特許の正しい出番は、自分の商品・仕組みを外に出す時に、<strong>公開する前に</strong>中核だけ検討すること。</p>\n          <p class=\"firststep\"><strong>最初の一歩：</strong>自分の商品・仕組みを次に外に出す時、公開前に特許の検討を1回挟む<br><strong>時期：</strong>公開の直前、その都度</p>\n        </div>\n        <p class=\"sources\">出典：図鑑事業と特許 決定事項（2026-11-19）</p>",

   "html": "<div class=\"detail-head\"><h2>アフィリエイト</h2></div>\n        <div class=\"card\">\n          <h3>海外アフィリエイト比較記事（AI自動） <span class=\"badge pending\">テスト枠</span></h3>\n          <p>英語圏向けに、他人の商品（主にSaaS）を<strong>比較記事で紹介して、紹介料を得る</strong>形。海外向けデジタル商品と同じ「言語市場の裁定」の系統だが、海外向けデジタル商品が自分の商品を売る形なのに対して、こちらは商品を持たず「買う直前の読者を連れてくる仕事」を売る。狙うのは「少ない件数×高い単価」の型で、比較記事という中身は資産として積み上がる。</p>\n          <ul>\n            <li><strong>置き場所</strong>：テスト枠の候補（決定ではない）。受験後に回す枠で、実践は受験後。知識の蓄積だけは受験前から進めてよい</li>\n            <li><strong>正直な留保</strong>：きっかけになった原典に収益の実績証拠はない（単価×件数の計算の提示のみ）。記事自体が無料LINE教材への誘導で、投稿者の本当の狙いは見込み客集めと見ている。重い部分は、英語圏での集客とSEOの信頼づくり</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>全体像とお金の流れ</h3>\n          <p>アフィリエイト（成果報酬型広告）は4者で成り立つ。<strong>広告主</strong>（商品を売りたい会社。例：SemrushのようなSaaS企業）、<strong>ASP／ネットワーク</strong>（計測・集計・支払いを代行。海外ではImpact、ShareASaleなど。日本ではA8.netなど）、<strong>媒体</strong>（記事や動画で紹介する側＝自分）、<strong>読者</strong>（リンクを踏んで買う人）。</p>\n          <div class=\"flow\"><span>読者がリンクを踏む</span><i>→</i><span>購入＝成果</span><i>→</i><span>広告主が広告費を払う</span><i>→</i><span>手数料を引いて媒体へ</span></div>\n          <p>媒体は在庫を持たず、商品も作らない。売っているのは「買う直前の読者を連れてくる仕事」で、報酬はその紹介料。単価・否認・リスクの話は全部ここにつながる。</p>\n          <div class=\"lanes\">\n            <div class=\"lane other\">\n              <h3>日本のASP型</h3>\n              <p>A8.net等のASPに登録し、日本語の広告案件を選ぶ。物販・金融・美容など国内商品が中心で、報酬は購入金額の数％か、申込1件の固定額。読者は日本語圏。</p>\n            </div>\n            <div class=\"lane art\">\n              <h3>海外（英語圏）型</h3>\n              <p>広告主の自社プログラムか、Impact等の海外ネットワーク経由。高単価の中心はSaaS（月額ソフト）で、報酬は1件ごとの固定額（バウンティ）が多い。読者は英語圏＝母数が桁違いに大きい。アフィリエイトが狙うのはこちら。</p>\n            </div>\n          </div>\n        </div>\n        <div class=\"card\">\n          <h3>成果の測り方</h3>\n          <p>成果は一発で確定しない。段階を踏む。</p>\n          <ol class=\"steps\">\n            <li data-n=\"1\"><span class=\"st\">クリック</span><span class=\"sd\">読者がリンクを踏む</span></li>\n            <li data-n=\"2\"><span class=\"st\">成果発生（コンバージョン）</span><span class=\"sd\">読者が購入・申込をする。この時点ではまだ「仮」の数字</span></li>\n            <li data-n=\"3\"><span class=\"st\">承認</span><span class=\"sd\">広告主が「正当な成果だ」と認めて、初めて報酬が確定する</span></li>\n            <li data-n=\"4\"><span class=\"st\">支払い</span><span class=\"sd\">ネットワーク経由で振り込まれる（最低支払額や締め・支払いサイクルはプログラムにより異なる）</span></li>\n          </ol>\n          <ul>\n            <li><strong>否認</strong>：発生した成果の一部は広告主に否認される。主な理由は、読者のキャンセル・返金／不正や自己購入などの規約違反／重複計測（他の媒体のリンクが優先）／無料体験だけで終わり有料転換しなかった（条件による）。管理画面の「発生額」は確定収入ではなく、<strong>否認率</strong>を引いたものが実収入になる。否認率はプログラムにより大きく違うので、始める前に規約と条件を読むのが実務の第一歩</li>\n            <li><strong>クッキー期間</strong>：リンクを踏んでから一定期間内に買えば、時間が空いても成果になる計測の有効期間。数日のものから120日超のものまであり、長いほど媒体に有利</li>\n            <li><strong>ラストクリック</strong>：最後に踏んだリンクの媒体に成果が付く方式が一般的（Semrushもこの方式）</li>\n            <li><strong>EPC</strong>（1クリックあたりの収益＝総報酬÷クリック数）：記事同士・媒体同士の効率を比べる物差し。例：1,000クリックで成果5件、1件$200なら総報酬$1,000でEPCは$1。「月いくら」ではなくEPCと否認率で見るのが、仕組みとしての数字の読み方</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>単価の構造</h3>\n          <p>具体例はSemrushの公式アフィリエイトプログラム（Impact経由、ラストクリック、クッキー120日）。</p>\n          <div class=\"stats\">\n            <div class=\"stat\"><div class=\"v\">$200</div><div class=\"k\">SEO Toolkitの新規成約1件（基本ランク）。実績ランクが上がると$250→$300→$350</div></div>\n            <div class=\"stat\"><div class=\"v\">$10</div><div class=\"k\">無料トライアルの有効化1件</div></div>\n            <div class=\"stat\"><div class=\"v\">120<small>日</small></div><div class=\"k\">クッキー期間。この間に買えば成果になる</div></div>\n            <div class=\"stat\"><div class=\"v\">1<small>回払い</small></div><div class=\"k\">継続課金の分配ではない（条件は改定されることがあるため、参加時に公式ページで再確認する）</div></div>\n          </div>\n          <ul>\n            <li><strong>なぜ1件$200を払えるのか</strong>：LTV（顧客1人が契約期間全体で払う合計）とCAC（顧客1人を得る費用）の関係。Semrushの料金は月額約$140〜$500で、顧客が1年続ければLTVは$1,700〜$6,000規模。獲得に$200を払っても元が取れる。「1件$200」は魔法でも好意でもなく、LTVの中からCACとして切り分けているだけ</li>\n            <li><strong>高単価・低頻度型</strong>（SaaS・金融・高額講座）：1件数千円〜数万円。必要なのは「買う直前の読者」を少数、正確に連れてくること。アフィリエイトが狙う型</li>\n            <li><strong>低単価・高頻度型</strong>（日用品・書籍・安い物販）：1件数十円〜数百円。1回しか買わない物はLTVが小さいので紹介料も購入金額の数％にしかならず、大量のアクセスが要る</li>\n            <li><strong>継続分配型</strong>（レベニューシェア）：顧客が払い続ける限り毎月数％〜数十％が入る。Semrushは1回払いだが、継続型は「積み上がる資産」になりやすい代わりに単月の入りは小さい。プログラム選びではこの違いが効く</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>集客の経済学</h3>\n          <ul>\n            <li><strong>検索意図の温度</strong>：検索する言葉には温度がある。「SEOとは」＝調べもので買う気は薄い。「Semrush vs Ahrefs」＝比べている、<strong>買う直前</strong>。「Semrush 割引」「Semrush pricing」＝ほぼ決めている。比較記事が刺さるのは2番目の読者を取るからで、媒体の仕事は「悩みの分析→候補の絞り込み→判断材料の提示」。これは広告主にとっても質の高い送客になる</li>\n            <li><strong>E-E-A-T</strong>：Googleの評価軸で、経験（Experience）・専門性（Expertise）・権威性（Authoritativeness）・信頼性（Trustworthiness）。比較記事では特に「実際に使った経験があるか」と「情報が正確か」が問われる。公式情報ベースの比較は正確さでは戦えるが、経験の部分は偽装できない</li>\n            <li><strong>AI量産へのGoogleの姿勢（公式）</strong>：AIで作ったこと自体は違反ではない（「どう作ったか」ではなく「読者に役立つか」で評価）。一方、検索順位の操作目的で価値の薄いページを大量生成する「スケールド・コンテンツ・アビュース」はスパムポリシー違反で、2024年3月に明文化され、生成AIでの大量生成が代表例に挙がっている。違反すれば順位下落や手動対策の対象。「AIで記事を量産する」こと自体が、公式ポリシー上で最も危険な形に近い。回せるのは制作の補助までで、1記事ごとの独自の価値（正確な比較、判断の軸、実データ）が本体になる</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>ルール</h3>\n          <ul>\n            <li><strong>ステマ規制（日本）</strong>：2023年10月1日施行。景品表示法第5条第3号に基づく告示で、広告と分からない宣伝が不当表示になった。規制の直接の対象は広告主だが、実務上はASPがアフィリエイターに「広告」「PR」等の表示を規約で必須にしていて、表示しないと登録解除・報酬停止の対象になる。日本語の読者向けなら、記事の冒頭など目立つ位置に広告である旨を書くのが基準</li>\n            <li><strong>FTCの開示ガイドライン（米国）</strong>：英語圏向けならこちらが本命。Endorsement Guides（16 CFR Part 255、2023年改訂）で、報酬がかかる関係は読者が分かる言葉で、明確に目立つよう（clear and conspicuous）開示する。「affiliate link」と書くだけでは不十分（読者が「報酬が発生する」と理解できないため）。開示はリンクの近く、記事の早い位置に置く</li>\n            <li><strong>順位は金で売らない</strong>：報酬額でランキングの順位を操作して中立を装う行為は、開示しても欺瞞的とされる。順位は自分の判断で決め、その上で報酬関係を開示するのが正しい形</li>\n            <li><strong>規約違反で起きること</strong>：未払い報酬の没収、提携解除・アカウント停止（ネットワーク全体で共有される場合もある）。典型的な違反は、ブランド名への広告入札、クッキースタッフィング等の不正計測、虚偽の体験談、根拠のない断定表現（「最安」「絶対」など）</li>\n            <li><strong>匿名の範囲</strong>：ネットワークへの登録には本人確認と振込先情報が要る。「匿名」は読者に対してであり、プラットフォームに対してではない。ここを取り違えると設計が崩れる</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>損なうパターン</h3>\n          <ul>\n            <li><strong>否認率</strong>：発生額がそのまま入るわけではない。返金されやすい商品は構造的に否認が増える</li>\n            <li><strong>プログラムの終了・条件改定</strong>：広告主がプログラムを閉じたり単価を下げたりすれば、その記事の収益は消える。Semrush自身、過去に報酬体系を大きく変えている（旧BeRushの継続分配から1回払いへ）。1プログラム依存は構造的な弱さ</li>\n            <li><strong>検索順位の変動</strong>：集客がGoogle検索頼みなら、アップデート1回で流入が激減しうる。スパムポリシー違反はその最たるもの</li>\n            <li><strong>ラストクリックの奪い合い</strong>：購入直前に別の媒体のリンク（クーポンサイト等）を踏まれると、成果はそちらに付く</li>\n            <li><strong>計測の漏れ</strong>：広告ブロッカーやブラウザのトラッキング制限で、成果が計測されないことがある</li>\n          </ul>\n          <p>どれも「頑張り」で消えるリスクではなく、仕組みに組み込まれた前提として織り込むもの。対策は分散（複数プログラム、複数の集客路）と、規約の範囲内で長く続けること。</p>\n        </div>\n        <div class=\"card\">\n          <h3>初歩段階</h3>\n          <p><strong>初歩段階のゴール：</strong>最初の比較記事1本が公開され、アフィリエイトリンクの計測が正しく動いている状態（クリックが記録されるところまで）。成果が出るかどうかは、その先の話。</p>\n          <p><strong>必要なもの</strong></p>\n          <ul>\n            <li><strong>学習編</strong>：先に学習編「アフィリエイトの仕組み」を読む。この候補の各グループ（全体像／成果の測り方／単価の構造／集客の経済学／ルール／損なうパターン）が、その体系に当たる</li>\n            <li><strong>ASP／プログラムへの登録</strong>：海外型は広告主の自社プログラムか、Impact等のネットワーク経由。本人確認と振込先情報が要る（匿名は読者に対してであり、プラットフォームに対してではない）</li>\n            <li><strong>記事を置く場所</strong>：英語の比較記事を公開する場所。具体的な置き場所は開始時に決める</li>\n            <li><strong>費用</strong>：登録と記事の公開は0円で始められる（広告出稿はしない）</li>\n          </ul>\n          <p><strong>手順</strong></p>\n          <ol class=\"steps\">\n            <li data-n=\"1\"><span class=\"st\">仕組みを学ぶ</span><span class=\"sd\">学習編「アフィリエイトの仕組み」を読み、成果の測り方（クリック→成果発生→承認→支払い、否認率、クッキー期間、ラストクリック、EPC）を掴む。知らないまま始めると、発生額を収入と読み違える</span><span class=\"done-when\">終わりの目安：「発生額≠確定収入」ということと、EPCの計算が言える</span></li>\n            <li data-n=\"2\"><span class=\"st\">プログラムに登録する</span><span class=\"sd\">狙う型（高単価・低頻度のSaaS）から最初のプログラムを1つ選び、登録と本人確認を済ませる。規約（否認の条件、クッキー期間、禁止事項）は登録の時点で読む。例：SemrushはImpact経由で、SEO Toolkitの新規成約1件$200・クッキー120日・ラストクリック</span><span class=\"done-when\">終わりの目安：提携が承認され、自分のリンクが発行できる</span></li>\n            <li data-n=\"3\"><span class=\"st\">ターゲットと悩みを決める</span><span class=\"sd\">誰の、どんな悩みに当てるかを決め、検索意図の温度を見て「買う直前」の言葉（比べている・価格を調べている検索）を拾う</span><span class=\"done-when\">終わりの目安：記事が狙う検索の言葉が決まっている</span></li>\n            <li data-n=\"4\"><span class=\"st\">商品3件を公式情報で比べる</span><span class=\"sd\">仕様・価格を公式情報から集めて比較表を作る。順位は報酬額ではなく自分の判断で決める（順位は金で売らない）</span><span class=\"done-when\">終わりの目安：比較表があり、順位の理由が言える</span></li>\n            <li data-n=\"5\"><span class=\"st\">記事を書いて公開する</span><span class=\"sd\">英語の比較記事として書き、報酬関係の開示を記事の早い位置に、読者が「報酬が発生する」と分かる言葉で目立つよう置く（FTCの基準）。使っていない商品を「使った」とは書かない——比較は「公式情報に基づく比較」と正直に位置づける。公開したら、自分のリンクを踏んでクリックが計測されるか確認する</span><span class=\"done-when\">終わりの目安：記事が公開され、クリックの計測が確認できている</span></li>\n            <li data-n=\"6\"><span class=\"st\">成果の出方を見る</span><span class=\"sd\">発生で止めず、承認と否認率まで見る。記事同士の効率はEPCで比べる</span><span class=\"done-when\">終わりの目安：一定期間のクリック・発生・承認が記録されている</span></li>\n          </ol>\n          <ul>\n            <li><strong>Museで回せる部分</strong>：ターゲットと悩みの洗い出し、キーワード候補出し、公式情報の収集と整理、比較表づくり、記事の構成案と下書き、英語への翻訳・推敲、公開後の数字（クリック・成果・EPC）の集計と改善案</li>\n            <li><strong>回せない／やってはいけない部分</strong>：実体験の偽装（使っていない商品を「使った」と書くのは虚偽表示の側に立つ）、開示の省略、推す商品と順位の最終判断、信頼の蓄積。切り分けの原則は1つ——Museは「調べる・比べる・書く・測る」の速度を上げる。判断と責任と信頼は人間側に残す</li>\n          </ul>\n          <p><strong>つまずきどころ</strong></p>\n          <ul>\n            <li><strong>開示を忘れる・薄くする</strong>：開示はリンクの近く、記事の早い位置に。「affiliate link」と書くだけでは、読者が「報酬が発生する」と理解できないため不十分とされる</li>\n            <li><strong>量産に寄る</strong>：検索順位の操作目的で価値の薄いページを大量生成する形は、Googleのスパムポリシー（スケールド・コンテンツ・アビュース）に触れる。回せるのは制作の補助までで、1記事ごとの独自の価値が本体になる</li>\n            <li><strong>発生額を収入と読む</strong>：否認率を引いたものが実収入。返金されやすい商品は構造的に否認が増える</li>\n            <li><strong>1プログラム依存</strong>：広告主がプログラムを閉じたり単価を下げたりすれば、その記事の収益は消える。分散が前提</li>\n          </ul>\n          <p>手順3〜4の前に、自分の立場（武器）を決めておくと、比べる切り口がぶれない。武器の決め方は、第4章の部「<a href=\"#/pioneers\" data-open-link=\"pioneers\">先駆者の型</a>」の「ヒカルの型」に、手順としてまとめてある。</p>\n          <p><strong>時期：</strong>手順1（学習）は受験前から可。実践（手順2以降）は受験後</p>\n          <p class=\"sources\">きっかけ・出典：Xの記事「Muse自動×海外アフィが想像以上に最強だった（プロンプトも公開）」（とら🐯AI副業 @3Imzdo3）。原典の収益数字は実績の証拠がないため採っていない。本文の数字と仕組みは学習編「アフィリエイトの仕組み」（Semrush公式アフィリエイトプログラム、Google Search Central、消費者庁、FTCの公式情報に基づく）の記載に拠る</p>\n        </div>",

   "html": "<div class=\"detail-head\"><h2>海外向けデジタル商品</h2></div>\n        <div class=\"card\">\n          <h3>海外向けデジタル商品（言語市場の裁定） <span class=\"badge pending\">テスト枠</span></h3>\n          <p>言語の市場の間で、情報の値段は違う。日本語圏では当たり前で飽和している情報が、英語圏では薄くて売れることがある——その価格差を取りに行く形（<strong>言語市場の裁定</strong>）。アフィリエイトが他人の商品を紹介する形なのに対して、こちらは<strong>自分の商品を売る</strong>形で、売れた商品はバックリスト（在庫）として残る。追い風は、AIで翻訳と制作のコストが落ち、この裁定の敷居が下がったこと。</p>\n          <ul>\n            <li><strong>置き場所</strong>：テスト枠の候補（決定ではない）。やるなら受験後。題材は「日本人にしか書けない日本の何か」を英語で売る形が筋</li>\n            <li><strong>正直な留保</strong>：きっかけになった投稿の収益数字（初月の金額など）は自己申告で裏付けがないため採っていない。「ブルーオーシャン」のような結論も置かない。残すのは、裏の取れる仕組みと実務だけ。重い部分は制作ではなく、英語圏での集客をゼロから作ること</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>仕組みと全体像</h3>\n          <div class=\"flow\"><span>日本語圏で厚い知識</span><i>→</i><span>英語で再構成</span><i>→</i><span>海外の売り場で販売</span><i>→</i><span>円で銀行口座に受け取り</span></div>\n          <ul>\n            <li><strong>裁定が成り立つ条件</strong>：①日本語圏では情報が厚く、安く出回っている題材であること ②英語圏では同じ情報が薄いか、高く売られていること ③翻訳・制作のコストがAIで下がり、価格差に対して作業が見合うこと ④売り場と決済が既製のプラットフォームで済むこと</li>\n            <li><strong>翻訳ではなく再構成</strong>：日本語の記事を機械翻訳して並べるだけでは価値が薄い。英語圏の読者の前提（知らない制度・道具・文脈）を埋めて、1つの商品として作り直すのが本体の作業</li>\n            <li><strong>資産性</strong>：売れた商品のバックリストは在庫として残り続ける。make.funの懸賞型と違い、積み上げがゼロにはならない。集客の努力も、商品1点ではなくバックリスト全体に効く</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>売り場の実務（Gumroad）</h3>\n          <p>本命の売り場はGumroad。手数料は公式ヘルプの数字で読む。</p>\n          <div class=\"stats\">\n            <div class=\"stat\"><div class=\"v\">10<small>%</small> + $0.50</div><div class=\"k\">直接販売（自分のリンク・プロフィール経由）のプラットフォーム手数料。これにカード処理料 2.9% + $0.30 が別途かかる</div></div>\n            <div class=\"stat\"><div class=\"v\">30<small>%</small></div><div class=\"k\">Discover（Gumroad内のマーケット）経由の販売は一律30%。処理料込み</div></div>\n            <div class=\"stat\"><div class=\"v\">5<small>%</small> + $0.50</div><div class=\"k\">その月の有料売上が $20,000 に達した後の直接販売は、この料率に下がる</div></div>\n            <div class=\"stat\"><div class=\"v\">$100</div><div class=\"k\">出金の最低残高（米ドル相当）。届くまで出金されない</div></div>\n          </div>\n          <ul>\n            <li><strong>手数料の実感（公式手数料からの計算）</strong>：$5の商品が直接売れると、手数料の合計は約$1.45で手取りは約$3.55（約71%）。$20なら手数料約$3.38で手取り$16.62（約83%）。固定費（$0.50 + $0.30）が毎回かかるため、安い商品ほど構造的に不利になる</li>\n            <li><strong>税はGumroadが持つ</strong>：2025年1月からGumroadは販売主体（Merchant of Record）として動き、世界中の売上税・VAT・GSTをGumroad側が計算・徴収・納付する。売り手が各国の税を個別に処理する必要はない（決済と税の基本のグループと対）</li>\n            <li><strong>日本からの受け取り</strong>：銀行口座への円（JPY）入金に対応している（公式の対応表に Japan／JPY）。週次の出金日は火曜で、前週金曜（UTC）までの売上が対象、売上には7日間の保留期間がある。本人確認（KYC）は、売上が積み上がった段階で決済代行のStripe経由で求められる</li>\n            <li><strong>受け取りの制約</strong>：PayoneerやWiseでの出金はできない（公式）。出金先は居住国の銀行口座に限られ、通貨はその国の通貨になる。換算は payout 時ではなく売上時点のレートで行われる</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>他の売り場とnoteの限界</h3>\n          <div class=\"lanes\">\n            <div class=\"lane art\">\n              <h3>海外の売り場</h3>\n              <p>Gumroadが本命。代替はPaddle（5% + 50¢、同じく販売主体型で税を処理する。料金は2026年10月時点の公式料金ページ）。注意として、Lemon Squeezyは2026年11月に新規受付を終了し、2027年3月末で決済を停止するため、新規の選択肢にはならない——プラットフォーム自体が終わるリスクの実例でもある。Stripeで直接売る形は手数料が安い代わりに、税務と実名まわりを全部自分で持つ（収益化の実務メモのとおり）。</p>\n            </div>\n            <div class=\"lane other\">\n              <h3>noteの限界</h3>\n              <p>「海外note」という言い方への正直な評価。noteは日本語圏では強いが、海外向けの売り場としては限界がある。画面と発見の場が日本語圏に閉じている／公式ヘルプ上、海外発行のクレジットカードは決済できない場合がある（有料記事はPayPal決済にも対応）／売上の振込先は国内の銀行口座のみ。つまり実態は「海外の読者にnoteで売る」ではなく、「日本の題材を、英語圏の売り場に移して売る」話として読むのが正確。</p>\n            </div>\n          </div>\n        </div>\n        <div class=\"card\">\n          <h3>決済と税の基本</h3>\n          <ul>\n            <li><strong>日本の消費税</strong>：デジタル商品の提供は「電気通信利用役務の提供」に当たる。課税の内外判定は、受け手（買い手）の住所地で決まる（国税庁）。国外の消費者への提供は国外取引となり、日本の消費税は不課税</li>\n            <li><strong>買い手側の国の税</strong>：EUのVATのように、買い手の国の税は別問題として立つ。販売主体型の売り場（Gumroad、Paddle）ではプラットフォームが処理するが、自分が販売主体になる形（Stripe直接など）では自分で負う。売り場選びでこの差は大きい</li>\n            <li><strong>所得税</strong>：日本に住んでいる限り、海外での売上も含めた全世界所得が課税対象になる。売上は確定申告で事業所得（または雑所得）として申告し、プラットフォーム手数料は経費にできる。海外で源泉徴収される話とは別に、日本側の申告は常にある</li>\n            <li><strong>記録</strong>：出金は円で銀行口座に入るので、売上と手数料の明細（プラットフォームのCSV等）を申告用に残すのが実務になる</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>題材の当て方</h3>\n          <p>「日本人にしか書けない日本の何か」を、当て勘ではなく基準で選ぶ。</p>\n          <ul>\n            <li><strong>基準1・厚さの差</strong>：日本語で検索すると情報が厚く安く出てくるのに、英語で検索すると薄い・古い・高い、という落差がある題材か</li>\n            <li><strong>基準2・裏が取れる</strong>：自分の実体験や実物で中身の裏が取れるか。翻訳だけの転売は薄く、著作権の面でも危うい。他人の日本語記事の翻訳販売はやらない</li>\n            <li><strong>基準3・買う理由の形</strong>：英語圏の読者が「how to」「guide」「template」のような、買う前提の検索をする形にできるか（アフィリエイトの「検索意図の温度」と同じ読み方）</li>\n            <li><strong>候補の出し方</strong>：自分の棚卸しから出す——自分が当たり前に知っていて、日本語圏では無料同然に出回っている知識（受験・制作の実務、道具と素材の扱い、日本の市場や文化の内部情報など）を書き出し、英語検索での薄さと突き合わせる。最初の作業は、この突き合わせで候補を3つに絞ること</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>集客の現実</h3>\n          <ul>\n            <li><strong>置くだけでは売れない</strong>：売り場の棚に置くことと、見つけてもらうことは別。GumroadのDiscover経由は発見を肩代わりする代わりに手数料30%で、自分の導線で売る直接販売（10% + $0.50 + 処理料）との差が、そのまま集客の値段になる</li>\n            <li><strong>重い部分はここ</strong>：英語圏での発見可能性——検索（SEO）、SNS、コミュニティへの露出を、ゼロから作る必要がある。アフィリエイトと重さの在り処は同じで、制作より集客が本体の仕事になる。受験期にやる作業ではない</li>\n            <li><strong>アフィリエイトとの違い</strong>：比較記事は他人の商品への送客だが、こちらは自分の商品。在庫が残る分、集客の成果は1回で終わらずバックリスト全体に効く</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>初歩段階</h3>\n          <p><strong>初歩段階のゴール：</strong>Gumroadで最初の商品1点が販売中になっている状態（商品ページが公開され、買える形になっている）。売れるかどうかは、その先の数字で判定する。</p>\n          <p><strong>必要なもの</strong></p>\n          <ul>\n            <li><strong>Gumroadのアカウント</strong>：本命の売り場。受け取りは居住国の銀行口座（円）へ</li>\n            <li><strong>題材の材料</strong>：自分の実体験や実物で裏が取れる題材（翻訳だけの転売はしない）</li>\n            <li><strong>費用</strong>：アカウントと出品は0円で始められる。かかるのは売れた時の手数料だけ（直接販売で10%＋$0.50、別途カード処理料2.9%＋$0.30）</li>\n          </ul>\n          <p><strong>手順</strong></p>\n          <ol class=\"steps\">\n            <li data-n=\"1\"><span class=\"st\">題材候補を3つ書き出す</span><span class=\"sd\">「題材の当て方」の基準（厚さの差／裏が取れる／買う理由の形）で自分の棚卸しから出し、英語検索での薄さと突き合わせる</span><span class=\"done-when\">終わりの目安：候補が3つに絞れている</span></li>\n            <li data-n=\"2\"><span class=\"st\">題材を1つに決める</span><span class=\"sd\">3つの基準で採点し、最初に作る1つを決める。残り2つはバックリストの候補として残す</span><span class=\"done-when\">終わりの目安：作る題材が1つに決まっている</span></li>\n            <li data-n=\"3\"><span class=\"st\">売り場の下ごしらえをする</span><span class=\"sd\">Gumroadで受け取り設定（銀行口座）を済ませ、出金までの道を確認する。本人確認（KYC）は売上が積み上がった段階で求められるが、受け取りの形は先に通しておく。出金は週次（火曜）、最低残高$100、売上に7日間の保留がある点も先に把握する</span><span class=\"done-when\">終わりの目安：受け取り設定が終わり、出金の条件を把握している</span></li>\n            <li data-n=\"4\"><span class=\"st\">商品を1つ作る</span><span class=\"sd\">翻訳ではなく再構成で作る——英語圏の読者が知らない前提（制度・道具・文脈）を埋めて、1つの商品として作り直す</span><span class=\"done-when\">終わりの目安：商品ファイルが完成している</span></li>\n            <li data-n=\"5\"><span class=\"st\">価格を付けて公開する</span><span class=\"sd\">固定費（$0.50＋$0.30）に食われない帯で付ける。目安は「手数料の実感」の計算（$5では手取り約71%、$20では約83%）。Discover経由は一律30%なので、基本は直接販売の形で出す</span><span class=\"done-when\">終わりの目安：商品ページが公開され、買える状態になっている</span></li>\n            <li data-n=\"6\"><span class=\"st\">集客の入口を1つ作る</span><span class=\"sd\">検索かSNSか、題材に合う入口を1つに絞って置く。置くだけでは売れないのがこの候補の重い部分で、入口まで作って初歩段階の終わりとする</span><span class=\"done-when\">終わりの目安：商品への導線が1つ公開されている</span></li>\n          </ol>\n          <p><strong>つまずきどころ</strong></p>\n          <ul>\n            <li><strong>安く付けすぎる</strong>：固定費が毎回かかるため、安い商品ほど構造的に不利になる</li>\n            <li><strong>機械翻訳の転売になる</strong>：日本語の記事を訳して並べるだけでは価値が薄く、著作権の面でも危うい。他人の日本語記事の翻訳販売はやらない</li>\n            <li><strong>置いて終わる</strong>：英語圏での発見可能性（SEO、SNS、コミュニティへの露出）はゼロから作る必要がある。制作より集客が本体の仕事になる</li>\n            <li><strong>出金の最低残高</strong>：$100に届くまで出金されない。最初の売上＝すぐ現金、ではない</li>\n          </ul>\n          <p><strong>時期：</strong>受験後（2027年3月以降）</p>\n          <p class=\"sources\">きっかけ・出典：Xで見かけた「海外note」系の投稿（収益の自己申告は裏付けがないため採っていない）。本文の数字と仕組みは、Gumroad公式ヘルプ（手数料／受け取り）、note公式ヘルプ（サービス別の支払い方法）、国税庁「国境を越えた役務の提供に係る消費税の課税関係について」、Paddleの公式料金（2026年11月確認）に拠る</p>\n        </div>",

   "html": "<div class=\"detail-head\"><h2>物語のある物</h2></div>\n        <div class=\"card\">\n          <h3>物語のある物（物販テスト） <span class=\"badge pending\">テスト枠</span></h3>\n          <p>売るのは呪物ではない。<strong>「物語と力」</strong>——見惚れるような質の高い物に、質の高い物語を付けて売る。狙う型は、市場の多数派（キーワード詰め込みのテンプレート量産）ではなく、<strong>一点ごとに固有の物語を付けた完成品</strong>。担い手は石に限らず、石・ガラス・金属・木などの小物でよい（売るのは物語であり、表面的な物が石である必要はない）。</p>\n          <ul>\n            <li><strong>置き場所</strong>：テスト枠の1件（make.funと同格）。期間と撤退ラインを先に決めて小さく試す。売り場はメルカリ——購入者の能動性が必要な場に置く</li>\n            <li><strong>もう1つの意味</strong>：アートビジネスの練習。値付け、物語の付け方、固定価格、記録の練習であり、「意味のないものに付加価値を与える」という本命の作品販売（作品の値付けと言説化）と同じ力学で動く</li>\n            <li><strong>正直な留保</strong>：市場の数字は、売り切れ実例を集めた調査に基づく（母数に対する統計ではない）。成約の傾向は読めるが、「これを出せば売れる」という保証にはならない</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>市場の構造</h3>\n          <p>価格は素材そのものでは立たない。<strong>組み立てと意味付けの層で立つ</strong>。素材として流通する値段と、完成品として成約する値段の間の差が、「物語・組み立て」の価格になる。</p>\n          <div class=\"stats\">\n            <div class=\"stat\"><div class=\"v\">¥308<small>〜/粒</small></div><div class=\"k\">ビーズ素材としての流通価格（1粒）</div></div>\n            <div class=\"stat\"><div class=\"v\">¥54,678<small>〜</small>¥235,770</div><div class=\"k\">完成品ブレスレットの成約実例（ルチル系・大玉）</div></div>\n            <div class=\"stat\"><div class=\"v\">約2.4〜4.4<small>倍</small></div><div class=\"k\">同種クラスターのグラム単価の差（スピ表現が濃い出品 vs 事実ベース寄り）</div></div>\n            <div class=\"stat\"><div class=\"v\">¥540<small>〜/100g</small></div><div class=\"k\">さざれ石（グラム売りの消耗品）の厚い層</div></div>\n          </div>\n          <ul>\n            <li><strong>価格帯の地図</strong>：〜¥1,000は素材・消耗品（さざれ、ビーズ）で回転率の層／¥1,800〜¥3,100はハンドメイドと小〜中クラスターで個人売り手の主戦場／¥5,750〜¥19,420は「1点もの」「極上」の格付け言葉が付く帯／¥54,678〜は組み立て＋物語が乗った完成品の帯。安い帯ほど素材に寄り、高い帯ほど完成品＋格付け＋物語に寄る</li>\n            <li><strong>グラム単価の読み方</strong>：水晶クラスターで、事実ベース寄りは約¥8.5/g、スピ表現が濃い出品は約¥37.7/g。ただしこの差には品質・色・産地・付属品の差も混ざっていて、「物語だけの効果」とは切り分けられない。読めるのは「同じカテゴリー内で、表現と物語が濃い出品の方が高い帯にいる」という傾向まで</li>\n            <li><strong>売れる形態</strong>：ブレスレット（完成品）が市場の中心。ほかにクラスター・原石（置物）、スフィア等の小物（数千円帯の入口）、さざれ石（グラム売り）。スピ要素のない鉱物標本は事実情報だけで売買され、帯は概ね¥700〜¥8,300と低い</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>売り手の4類型</h3>\n          <ul>\n            <li><strong>大手Shops型</strong>：同一ショップから大量出品し、実際に売り切れている。説明文はテンプレート化され、タイトルは検索キーワードの塊。「質問を受け付けていません」と明記して対応コストを切る。価格の天井はこの型が作っている</li>\n            <li><strong>卸売り・回転型</strong>：さざれ石などをサイズ別価格表で出し、再入荷を繰り返す。売り手の評価数は数千件規模。単価は安く、回転とリピートで成立させる</li>\n            <li><strong>個人コレクター放出型</strong>：「マイコレクション」「秘蔵品」を一点ずつ、来歴の物語付きで出す。高額クラスターの成約はこの型に多い</li>\n            <li><strong>ハンドメイド型</strong>：デザインブレスレットを¥2,000〜¥15,800で出す。フォロー割、リピーター値引き、浄化さざれのおまけなど、関係性で回す工夫が説明文に明記されている</li>\n          </ul>\n          <p><strong>自分の型の置き場所</strong>：個人コレクター放出型の「来歴の物語」に、質の担保（産地・処理の正直な開示）を組み合わせる位置。市場の大半はテンプレートか回転型で、一点ごとの物語は薄い——そこが差別化の余地になる。</p>\n        </div>\n        <div class=\"card\">\n          <h3>物の選び方</h3>\n          <ul>\n            <li><strong>担い手は石に限らない</strong>：石・ガラス・金属・木、その他の小物でもよい。売るのは物語であり、物はその担い手</li>\n            <li><strong>質が土台</strong>：素人が適当に拾った石ころに情報を付ける形とは分ける。物語を剥がしても、物そのものに持つ価値があること（ルール3）。見惚れてしまうようなキラキラした石は、その一例</li>\n            <li><strong>マテリアルへの感覚が商品力</strong>：物の質を見分ける目そのものが、この型の参入障壁であり強みになる</li>\n            <li><strong>処理は正直に書く</strong>：染色・加熱・含浸などの処理の有無を正直に開示することが、実務者向けの解説でも信頼の条件として挙げられている。傷・クラック・インクルージョンは注意書きで「個性」として許容を求めるのが市場の型</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>物語の付け方</h3>\n          <ul>\n            <li><strong>差になるのは固有の文脈</strong>：効能の列挙は全員がやっているので差にならない。差になっているのは「なぜこの石（この物）なのか」——組み合わせの理由、来歴、産地と処理の開示の方</li>\n            <li><strong>実例1・組み合わせの物語</strong>：天珠とルチルの組み合わせブレスレット（¥99,980で成約）では、石ごとに由来と意味を物語として積んでいる</li>\n            <li><strong>実例2・使い方の物語</strong>：「インプット」という儀式（身に付けた日から一週間、願望を石に念じる方法）まで説明する出品がある。購入後の体験設計まで売っている形</li>\n            <li><strong>実例3・手放す理由の物語</strong>：「私の家での役目を終えたと夢にてお告げを授かりました」（レムリアンシード、¥7,500で成約）、「飾らずしまっていた特別の水晶」（クラスター、¥19,300で成約）。個人売り手の高額成約には来歴の物語が付いている例が目立つ</li>\n            <li><strong>効能の扱い</strong>：物語の本体ではなく、言い伝え形式（「〜と云われています」）で添えるに留める。断定しない理由はルールのグループで扱う</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>出品の型</h3>\n          <p><strong>タイトル</strong>：キーワード詰め込みが標準形（石名／形態／パワーストーン／天然石／性別／用途を総ざらいする）。格付けワード（「極上」「1点もの 現品」「秘蔵品」）は高額帯に集中し、効果ワードはタイトルよりハッシュタグ・説明文側に置く例が多い。検索に乗る最低限のキーワードは要るが、自分の型では固有の物語が先頭に来る。</p>\n          <p><strong>説明文の骨格</strong>（複数の成約出品に共通する並び）：</p>\n          <ol class=\"steps\">\n            <li data-n=\"1\"><span class=\"st\">冒頭フック</span><span class=\"sd\">最上級の形容、または入荷の宣言</span></li>\n            <li data-n=\"2\"><span class=\"st\">スペック</span><span class=\"sd\">石名、玉サイズmm、内周cm、重さg、産地</span></li>\n            <li data-n=\"3\"><span class=\"st\">石ごとの物語</span><span class=\"sd\">ここが本体。組み合わせの理由と来歴を書き、効能は言い伝え形式で添える</span></li>\n            <li data-n=\"4\"><span class=\"st\">用途提案</span><span class=\"sd\">浄化用、インテリア、プレゼント等</span></li>\n            <li data-n=\"5\"><span class=\"st\">注意書き</span><span class=\"sd\">天然物の傷・クラックは「個性」として許容を求める／返品の条件／他サイト同時出品の有無</span></li>\n            <li data-n=\"6\"><span class=\"st\">ハッシュタグ</span><span class=\"sd\">効果ワード（#金運 #浄化 等）はここに寄せる</span></li>\n          </ol>\n          <p><strong>写真</strong>：メルカリの上限は20枚。高額の単品（¥19,300、¥11,520の成約例）は20枚を使い切っている。ブレスレットは手に持つ／手首に着ける見せ方、クラスターは台座に置いた置物としての見せ方＋サイズ・重さの数値併記が定番。写真の枚数と情報量は価格帯と相関して見える。「4枚目以降実物写真です」と書き分ける運用もある。</p>\n        </div>\n        <div class=\"card\">\n          <h3>ルール</h3>\n          <p><strong>合意したルール（3つ）</strong>——担い手が石でもガラスでも金属でも木でも、そのまま適用される。</p>\n          <ul>\n            <li><strong>効能を断定しない</strong>——説明文で断定すると嘘になる。「〜と言われてきた」「〜と云われる」という言い回しが大切で、それこそが物語である</li>\n            <li><strong>無理な売りつけはしない</strong>——欲しい人が能動的に買う構造に置く。無理やりは悪質</li>\n            <li><strong>物の質は本物にする</strong>——物語を剥がしても、物そのものに持つ価値があること</li>\n          </ul>\n          <ul>\n            <li><strong>規約面の確認</strong>：メルカリ公式の「禁止されている出品物」にパワーストーン自体の禁止はない（有形の石・アクセサリーは通常の出品物）。一方、「写真や説明文から商品内容を具体的に確認できないもの」は禁止で、実体のない商品（鑑定サービスのみ等）は対象になる。石という有形物を売る形はこの点で問題になりにくい</li>\n            <li><strong>効能表現の線</strong>：メルカリ公式のアンバサダーガイドラインは、景品表示法について「合理的な根拠がない効果・性能の表示」を禁止パターンとして明示し、薬機法についても医薬品と誤認される効果効能表現を避けるよう求めている。「必ず金運が上がる」「病気が治る」等の断定はこの枠に触れるおそれがある。市場の主流である言い伝え形式は、この安全圏と一致している——先に合意したルールは、市場の実態から見ても標準形</li>\n            <li><strong>効果の受け止め方</strong>：実際に作用するかどうかは、買う人がどれほど強く信じているかによる。強く信じれば精神的に作用し、思い込みは現実に影響する。だから無意味ではない、という立場を取る</li>\n            <li><strong>不安訴求には寄らない</strong>：市場には不安を煽る文面の出品も存在し成約もしているが、それは採らない。合意した3ルールの側に立つ</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>初歩段階</h3>\n          <p><strong>初歩段階のゴール：</strong>最初の1品が、メルカリで出品され公開されている状態。価格・反応・成約の有無を記録できる形で出すことまでが初歩段階で、判定はその先。</p>\n          <p><strong>必要なもの</strong></p>\n          <ul>\n            <li><strong>メルカリのアカウント</strong>：出品の場。本人確認などの要件は開始時に確認する</li>\n            <li><strong>最初の1品</strong>：物語を剥がしても物そのものに価値がある物（ルール3）。担い手は石に限らない</li>\n            <li><strong>撮影の道具</strong>：スマホのみ。写真は上限20枚まで使える</li>\n            <li><strong>費用</strong>：仕入れに使う額は、テストの期間と撤退ラインと一緒に先に決める（金額そのものの決め方は未確定——開始時に決める）</li>\n          </ul>\n          <p><strong>手順</strong></p>\n          <ol class=\"steps\">\n            <li data-n=\"1\"><span class=\"st\">仕入れ先の決め方を決める</span><span class=\"sd\">具体的な仕入れ先の比較は未調査なので、ここでは「どこから買うか」の物差しだけを先に固定する。①産地・処理（染色・加熱・含浸など）の情報が正直に取れる相手であること——処理の開示は信頼の条件で、情報が取れない物は質の担保ができない ②仕入れの経緯そのものが来歴の物語になる形であること——個人コレクター放出型の位置に立つ以上、「どこで・どう出会ったか」が固有の文脈になる ③最初の1品は、自分が持っていたいと思える物から始める</span><span class=\"done-when\">終わりの目安：この物差しで、買う場所の候補が絞れている</span></li>\n            <li data-n=\"2\"><span class=\"st\">最初の1品を選ぶ</span><span class=\"sd\">「物の選び方」の基準で選ぶ——質が土台（見惚れるような質があるか）、処理は正直に書けるか、傷・クラックは「個性」として書ける範囲か</span><span class=\"done-when\">終わりの目安：1品が手元にあり、産地・処理・状態を説明文に書ける</span></li>\n            <li data-n=\"3\"><span class=\"st\">物語を書く</span><span class=\"sd\">「なぜこの物なのか」——組み合わせの理由、来歴、仕入れの経緯を固有の文脈として書く。効能は言い伝え形式（「〜と云われています」）で添えるに留め、断定しない（ルール1）</span><span class=\"done-when\">終わりの目安：物語の原稿ができている</span></li>\n            <li data-n=\"4\"><span class=\"st\">出品文を組み立てる</span><span class=\"sd\">「出品の型」の骨格（冒頭フック→スペック→物ごとの物語→用途提案→注意書き→ハッシュタグ）で説明文を作る。タイトルは検索に乗る最低限のキーワードを入れ、固有の物語が先頭に来る形にする。キーワード詰め込みのテンプレートにはしない</span><span class=\"done-when\">終わりの目安：タイトルと説明文が完成している</span></li>\n            <li data-n=\"5\"><span class=\"st\">写真を撮る</span><span class=\"sd\">上限20枚を目安に、実物の質が伝わる情報を厚くする。ブレスレットは手に持つ／手首に着ける見せ方、置物は台座に置いた見せ方＋サイズ・重さの数値併記が市場の定番</span><span class=\"done-when\">終わりの目安：写真が揃い、質と大きさが伝わる</span></li>\n            <li data-n=\"6\"><span class=\"st\">価格を付けて出品する</span><span class=\"sd\">同種の成約実例の帯（市場の構造）を見て、物の質＋物語の固有さで帯の中の位置を決める。素材価格に引っ張られず、完成品としての価格を固定価格で出す。固定価格で出すこと自体が、本命の作品販売に向けた値付けの練習になる</span><span class=\"done-when\">終わりの目安：出品が公開されている</span></li>\n            <li data-n=\"7\"><span class=\"st\">反応を記録する</span><span class=\"sd\">価格・反応（いいね、コメント、交渉）・成約の有無を残す。コメント経由の交渉→専用出品というリピーター動線が市場では機能しているので、単発の成約より、同じ買い手に繰り返し売る動線を意識する</span><span class=\"done-when\">終わりの目安：記録が付き、期間と撤退ラインでの判定材料が揃う</span></li>\n          </ol>\n          <p><strong>つまずきどころ</strong></p>\n          <ul>\n            <li><strong>効能を断定してしまう</strong>：景品表示法・薬機法の線に触れる書き方（「必ず金運が上がる」「病気が治る」等）はしない。市場の主流である言い伝え形式が安全圏で、合意したルールとも一致する</li>\n            <li><strong>素材の安さに価格が引っ張られる</strong>：価格は素材そのものではなく、組み立てと意味付けの層で立つ。素材価格で付けると、この型の意味がなくなる</li>\n            <li><strong>写真と情報が薄い</strong>：写真の枚数と情報量は価格帯と相関して見える。高額帯の成約例は20枚を使い切っている</li>\n            <li><strong>不安訴求に寄る</strong>：市場には不安を煽って成約している出品もあるが、採らない。合意した3ルールの側に立つ</li>\n          </ul>\n          <p><strong>時期：</strong>受験後（2027年3月以降）。出す前に、期間と撤退ラインを決める</p>\n          <p class=\"sources\">きっかけ・出典：Xで見かけたスピ物販の実例（2026-11-19、本人の共有）。本文は合意事項（2026-11-19、Business Labo）と市場分析「メルカリ物販_市場分析」（2026-11-19。メルカリの売り切れ実例ベースの調査で、検索画面がJS描画のため網羅的な統計ではない）、メルカリ公式ヘルプ（禁止されている出品物／アンバサダーガイドライン）に拠る</p>\n        </div>",
