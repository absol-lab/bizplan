/* ============================================================
   Busilabo v2.0.0 — outer shell taken from the zukan app
   (absol-lab/zukan index.html, v5.70.0) verbatim blocks.
   Theme fixed to wood-wenge (the zukan default look).
   ============================================================ */
:root{
  /* appearance system (v2.22, ported from the diary app): four themes keyed
     off <html data-theme>, the content font rides on --bodyfont (UI stays
     --sans, per the diary rule), and --fs / --lh carry the text-size and
     line-height settings. The markup default is sumi; the pre-paint script
     restores the saved choice before first paint. */
  --fs:16px; --lh:1.7;
  --bodyfont:"Hiragino Mincho ProN","Hiragino Mincho Pro","Yu Mincho","YuMincho","Noto Serif JP",serif;
  --serif:var(--bodyfont);
  /* v31.0 pinned display type (names + headings) to a fixed Mincho
     stack regardless of the content-font setting. RETIRED in
     v5.54.0 (his decision, 2026-11-17): display type now rides the
     same --bodyfont as reading text, so the font setting governs
     names, headings and dictionary terms too. With the default
     Mincho setting the resolved face is the same stack as before. */
  --headfont:var(--bodyfont);
  --sans:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  /* legacy aliases (older class names / inline styles) */
  --paper:var(--bg); --paper2:var(--bg2); --ink:var(--text);
  --ink60:var(--muted);
  --lineSoft:var(--line); --shu:var(--danger);
}

:root[data-theme="wood-wenge"]{
  --bg:#100d0a; --bg2:#1b1611; --card:#211b15; --card2:#2f261e;
  --text:#f3eee7; --muted:#d8c29e; --accent:#ddb55f; --line:#3d3227; --lineStrong:#ad8d66;
  --danger:#ff6a55; --nav:rgba(27,22,17,.94); --sheet:rgba(0,0,0,.55);
  --fab:#ddb55f; --fabink:#100d0a; --ink35:rgba(243,238,231,.65);
  --desktex:var(--tex-wood-wenge);
}
:root[data-fontsize="small"]{--fs:14px;}
:root[data-fontsize="standard"]{--fs:16px;}
:root[data-fontsize="large"]{--fs:18px;}
:root[data-fontsize="xlarge"]{--fs:20px;}
:root[data-lineheight="narrow"]{--lh:1.5;}
:root[data-lineheight="standard"]{--lh:1.7;}
:root[data-lineheight="wide"]{--lh:1.9;}
:root[data-lineheight="xwide"]{--lh:2.1;}
:root[data-fontfamily="mincho"]{--bodyfont:"Hiragino Mincho ProN","Hiragino Mincho Pro","Yu Mincho","YuMincho","Noto Serif JP",serif;}
:root[data-fontfamily="gothic"]{--bodyfont:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0; touch-action:manipulation; /* v2.41: no double-tap zoom (user: annoying when it fires by accident); pinch zoom stays — manipulation = pan + pinch-zoom without double-tap. Local rules (e.g. .seg pan-y) still win on their own elements via intersection. */}
body{background:var(--bg); color:var(--text); font-family:var(--sans); font-size:15px; line-height:1.65;
  padding-top:var(--hdrh, 0px); padding-bottom:108px; -webkit-text-size-adjust:100%;}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer; padding:0; -webkit-appearance:none; appearance:none;}
input,select,textarea{font:inherit; color:inherit;}
button:active:not(:disabled){filter:brightness(1.07);}
header.top{position:fixed; top:0; left:0; right:0; z-index:30; background:var(--bg); border-bottom:1px solid var(--line);}
.toprow{display:flex; align-items:center; gap:5px; padding:calc(env(safe-area-inset-top, 0px) + 10px) 10px 4px; max-width:720px; margin:0 auto;}
h1.appname{font-family:var(--sans); font-size:16px; font-weight:700; letter-spacing:.02em; margin:0; white-space:nowrap; flex:none;}
#syncdot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-left:3px; background:#e5484d; vertical-align:2px; flex:none;}
.topcount{font-size:12px; color:var(--muted); white-space:nowrap; flex:none;}
.topsp{flex:1;}
#syncbar{display:block; width:100%; background:none; border:none; text-align:center; font-size:13px; color:var(--muted); padding:0 16px 6px; min-height:1.2em; letter-spacing:.03em; font-family:inherit; cursor:pointer;}
#syncbar .err{color:var(--danger);}
#syncbar .sbhint{color:var(--accent);}
main{display:block; max-width:720px; margin:0 auto; padding:0 14px; min-height:calc(100dvh + 1px);}
/* v3.0.5: the card-size modebar is gone — the grid is fixed at
   compact (3 columns), see the settings block. Its CSS went with it. */
.seg{display:inline-flex; gap:8px; flex-wrap:wrap;}
.seg button{background:var(--bg2); border:1px solid var(--line); color:var(--text); padding:8px 16px; font-size:13px; letter-spacing:.06em; border-radius:999px; font-family:var(--sans); min-height:48px; display:inline-flex; align-items:center; justify-content:center;}
.seg button.on{background:var(--accent); color:var(--bg); border-color:var(--accent); font-weight:600;}
.seg.mini button{padding:7px 12px; font-size:12.5px;}
.grid{display:grid; gap:12px; margin-top:10px;}
.grid.wide{grid-template-columns:1fr;}
.grid.def{grid-template-columns:1fr 1fr;}
.grid.compact{grid-template-columns:repeat(3,1fr); gap:10px;}
.grid.mini{grid-template-columns:repeat(4,1fr); gap:8px;}
.grid.micro{grid-template-columns:repeat(5,1fr); gap:6px;}
figure.work{margin:0; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:6px; cursor:pointer; overflow:hidden;}
figure.work:active{background:var(--card2);}
/* v21.11 (his ask): a person tile says what the person IS — painter,
   sculptor, animator — as small dark chips on the photo's corner,
   derived from the field's discipline part. Name + photo alone did
   not tell him. */
.fsyms{font-size:12px; line-height:1.35; color:var(--sub); letter-spacing:.28em; margin-top:1px;}
.symlegend{padding:10px 14px; font-size:12.5px; color:var(--sub); line-height:2;}
.symlegend b{display:inline-block; min-width:26px; color:var(--ink); font-weight:600; font-size:13px;}
figure.work .ph{position:relative; aspect-ratio:4/3; background:var(--bg2); display:flex; align-items:center; justify-content:center; overflow:hidden; border-radius:9px; box-shadow:inset 0 0 0 1px rgba(0,0,0,.22);}
/* v10.3: hi-res badge — the mark for works whose registered
   master is 4000px+ (definition owned by the data side). Sits
   at the photo's top-right on the photo-primary surfaces:
   detail works tiles, museum tiles, and the viewer. */
.hiresbadge{position:absolute; top:6px; right:6px; z-index:2; font-size:10px; font-weight:700; letter-spacing:.06em; color:#EBCB6B; background:rgba(16,14,10,.78); border:1px solid rgba(235,203,107,.55); border-radius:999px; padding:2px 8px; line-height:1.5; pointer-events:none;}
/* v27.8: a work with an official video embed carries a play badge on
   its card (bottom-left, clear of the hi-res badge at top-right). */
.videopill{display:inline-block; font-size:10px; font-weight:700; letter-spacing:.06em; color:#fff; background:rgba(166,38,28,.92); border-radius:999px; padding:1px 8px; line-height:1.6; margin:0 0 2px;}
.lvid{font-size:10.5px; font-weight:700; letter-spacing:.05em; color:#cf3a2a; margin-top:1px;}
#vhires{position:absolute; top:calc(env(safe-area-inset-top, 0px) + 58px); right:12px; z-index:6; font-size:11px; font-weight:700; letter-spacing:.06em; color:#EBCB6B; background:rgba(16,14,10,.78); border:1px solid rgba(235,203,107,.55); border-radius:999px; padding:3px 10px; line-height:1.5; pointer-events:none;}
/* v10.4: the badge reaches every work-tile surface. Small
   variant for timeline strips; a gold dot for the 52px
   biography/chronicle thumbs, where a text pill would cover
   the whole thumb. Person-representative tiles stay clean
   (his call). */
.hiresbadge.sm{font-size:8.5px; padding:1px 5px; top:4px; right:4px;}
.hiresdot{position:absolute; top:3px; right:3px; width:9px; height:9px; border-radius:50%; background:#EBCB6B; border:1px solid rgba(16,14,10,.65); z-index:2; pointer-events:none;}
.biothumb,.tlthumb{position:relative;}
figure.work .ph img{width:100%; height:100%; object-fit:cover; display:block;}
/* v32.16.0 (fix 3): the holder fills the frame, and once the
   image lands phFit() sets the frame's aspect-ratio to the
   image's own (clamped), so a wide work no longer sits in a
   square frame with a void under it (his Warhol report). At the
   exact ratio, cover == the whole image — nothing is cropped.
   Beyond the clamps (panoramas, long scrolls) the frame stops
   at the cap and the image letterboxes (contain) instead of
   being cropped. The person-list grid keeps its uniform frames
   (phFit skips #listbody — the pinned list design). */
figure.work .ph>.imgholder{width:100%; height:100%; display:flex; align-items:center; justify-content:center;}
figure.work .ph.arx img{object-fit:contain;}
/* v5.41.4: in the tile galleries (packed columns and the flat
   gallery) the frame is FIXED at its CSS aspect and the image
   letterboxes inside it (contain) — the whole work is shown,
   uncropped, on the frame's mat, and a landed image changes
   nothing about the tile's geometry, so a scrolling grid can
   neither reflow nor smear (see phFit). The person-list grid
   (.grid) keeps its cover rule and uniform frames, untouched. */
.pcols figure.work .ph img, .gallery figure.work .ph img{object-fit:contain;}
.grid figure.work:has(>.ph.arnat), .gallery figure.work:has(>.ph.arnat){align-self:start;}
figure.work .ph .noimg{font-family:var(--serif); font-size:11px; color:var(--ink35); letter-spacing:.2em; padding:6px; text-align:center;}
/* v5.49.0: the shared no-photo mark — every image-less card
   (artists / designers / makers / professors / universities /
   venues / genealogies / price cards …) shows this one small
   pictogram centred on the plain plate instead of the retired
   big initial letter. One component (noPhotoHTML) so all
   surfaces match. */
.nophoto{display:flex; align-items:center; justify-content:center; width:100%; height:100%; color:var(--ink35);}
.nophoto svg{display:block; width:30px; height:30px; opacity:.8;}
/* v27.9 (§6.4-3 of the return-jump diagnosis): a plate whose image
   has not arrived yet must read as "loading", never as a black void
   — on the 2026-11-14 device video a cold detail page sat on
   near-black boxes for a full second, because the pending holder
   wears the darkest tone (--bg2 is #101012-class in the dark
   themes) and its wordmark sits at 65% ink. While the holder still
   carries only the wordmark (no <img> yet, not a failure plate),
   the box steps UP to the card tone and the wordmark runs at full
   ink with a slow breathing opacity, so the eye reads a live
   placeholder. Geometry is untouched (the box is aspect-ratio
   fixed either way) and the moment an image lands the rules stop
   matching. The failure plate (.platefail) keeps its own look. */
figure.work .ph:not(.platefail):has(> .imgholder > .noimg){background:var(--card);}
figure.work .ph:not(.platefail):has(> .imgholder > .noimg) .noimg{color:var(--text);}
/* the breathing motion is scoped to the DETAIL view (the surface
   the diagnosis measured): a 500-card list can hold hundreds of
   pending plates at once, and an infinite animation on each of
   them is a real paint cost on the phone. The tone/ink step-up
   above is static and applies everywhere. */
#viewDetail figure.work .ph:not(.platefail):has(> .imgholder > .noimg) .noimg{animation:phbreathe 1.7s ease-in-out infinite;}
@keyframes phbreathe{0%,100%{opacity:.5}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){ #viewDetail figure.work .ph .noimg{animation:none;} }
/* v29.1 (his ask, 2026-11-14 21:16): while a work image is still
   loading, its box says 読み込んでいます… — muted, small, centred,
   no flashing. .imgload is the in-flow placeholder (it takes the
   seat the 図版 wordmark used to hold before hydration, and the
   seat between retries); .imgload.ov is the overlay shown while
   the fetch itself is in flight, the <img> sitting under it. The
   label is removed the moment the image lands; a terminal failure
   replaces the holder's content wholesale (label included), so
   the failure plate is untouched. A cached image never shows it. */
.imgholder{position:relative;}
/* v5.41.2: an <img> that has not loaded successfully paints
   NOTHING. Safari draws a broken-image glyph for an errored
   img (and a frame while it is in flight); on his device that
   glyph sat inside every card next to the loading label (the
   v5.41.1 recording). The holder's label / plate underneath
   carries the state instead. hydrateImg adds .imgok only on a
   verified load (naturalWidth > 0), so a photo appears exactly
   when it is really there. The two raw-img surfaces with the
   same label-sibling pattern (.tlphoto / .intvthumb) follow
   the same rule via their inline onload. */
.imgholder img{opacity:0;}
.imgholder img.imgok{opacity:1;}
.tlphoto img,.intvthumb img{opacity:0;}
.tlphoto img.imgok,.intvthumb img.imgok{opacity:1;}
.imgload{font-family:var(--sans); font-size:11px; color:var(--muted); letter-spacing:.05em; line-height:1.5; padding:4px; text-align:center; white-space:nowrap;}
.imgload.ov{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:1; pointer-events:none;}
/* v29.8 (his device report, 2026-11-14 23:44): on narrow tiles the
   label wrapped one character per line and read as vertical text.
   The label NEVER wraps now (white-space:nowrap on the base rule
   above and on the viewer's .vload below), and each narrow surface
   shrinks the type to fit its narrowest tile instead: the fixed
   micro thumbs (.biothumb 52px, .bookcover 72px) get fixed small
   sizes, the timeline strip thumbs scale with the viewport, and
   the 3-/4-column grid modes (whose tile width is a fixed
   fraction of the viewport) scale the same way; wide surfaces
   keep their readable sizes. Tile geometry is untouched — the
   box was and stays aspect-ratio fixed, so a loading tile is
   exactly the size of the landed tile. Measured per surface in
   validate_v29_8.js (one text line, no spill outside the holder,
   at 320/360/393px viewports). */
.biothumb .imgload{font-size:5px; letter-spacing:0; padding:1px;}
.tlthumb .imgload{font-size:min(9px, 2.35vw);}
.ysthumb .imgload{font-size:min(8.5px, 2.35vw);}
.grid.compact figure.work .ph .imgload, .gallery.wm-compact figure.work .ph .imgload, .mgrid.compact .mtile .imgload{font-size:min(11px, 2.3vw); letter-spacing:.03em; padding:2px 3px;}
.grid.mini figure.work .ph .imgload, .gallery.wm-mini figure.work .ph .imgload, .mgrid.mini .mtile .imgload{font-size:min(11px, 1.6vw); letter-spacing:.02em; padding:2px;}
.gallery.wm-micro figure.work .ph .imgload, .mgrid.micro .mtile .imgload{font-size:min(10px, 1.3vw); letter-spacing:.01em; padding:1px;}
.grid.micro figure.work .ph .imgload{font-size:min(10px, 1.25vw); letter-spacing:.02em; padding:2px;}
.bookcover .imgload{font-size:6.5px; letter-spacing:.02em; padding:2px;}
.exposter .imgload{font-size:12px;}
.intvthumb .imgload{font-size:8.5px; padding:2px;}
figure.work .ph .imgload{color:var(--ink35);}
/* the v27.9 step-up (a pending plate reads as "loading", never a
   black void) extends to the new label, in-flow and overlay alike */
figure.work .ph:not(.platefail):has(> .imgholder > .imgload){background:var(--card);}
figure.work .ph:not(.platefail):has(> .imgholder > .imgload) .imgload{color:var(--text);}
#viewDetail figure.work .ph:not(.platefail):has(> .imgholder > .imgload) .imgload{animation:phbreathe 1.7s ease-in-out infinite;}
@media (prefers-reduced-motion: reduce){ #viewDetail figure.work .ph .imgload{animation:none;} }
/* the viewer's loading label lives on the stage, over the plate

#viewer .vload{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); font-family:var(--sans); font-size:13px; letter-spacing:.08em; pointer-events:none; z-index:5; white-space:nowrap;}

.grid.wide figure.work .nm{font-size:18px;}
.grid.compact figure.work .nm{font-size:12px;}

   Busilabo app layer — home head + section content classes,
   re-skinned in the zukan palette (wood-wenge tokens above).

/* v2.1.0: the zukan pill nav is ported in (the block right below,
   taken verbatim from the zukan app), so the body keeps the zukan
   app's 108px bottom reserve for it again. */
/* bottom pill navigation (ported from diary #pillnav: fixed height, glass, sliding indicator) */
#pillnav{position:fixed; pointer-events:auto; left:0; right:0; margin-left:auto; margin-right:auto; z-index:40; bottom:calc(env(safe-area-inset-bottom, 0px) + 10px); width:calc(100vw - 92px); max-width:430px; height:56px; display:flex; gap:0; padding:3px; box-sizing:border-box; font-family:var(--sans); background:var(--nav); border:1px solid var(--line); border:1px solid color-mix(in srgb, var(--text) 13%, transparent); border-radius:999px; box-shadow:0 10px 30px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.10), inset 0 -8px 16px rgba(255,255,255,.03);}
/* v2.28: the pill is centred WITHOUT a transform (left/right 0 + auto
   margins). It used to be left:50% + translateX(-50%) — a permanent
   transform on a position:fixed element keeps it on the composited
   transform path, which is exactly the layer iOS Safari misplaces
   during the app's full-screen fixed/transformed view transitions
   (the recurring "pill floats to mid-screen" bug, 3rd recurrence).
   The diary's identical pill never shows the bug, but the diary has
   no vt-fixed transition churn; in this app the fixed element itself
   now carries no transform at all. */

#pillnav button{position:relative; z-index:1; flex:1; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; padding:0; border-radius:999px; font-size:12px; font-weight:500; color:var(--muted); white-space:nowrap; font-family:inherit; transition:color .3s;}
#pillnav svg{width:21px; height:21px;}
/* v16.0 DESIGN CHANGE (pill bug, 4th recurrence): the sliding
   indicator is abolished. It was the one element inside the
   pill that was measured, absolutely positioned and animated
   with transforms — the whole misplacement class lived there
   (Musilabo abolished it the same way in its v2.3 and the bug
   never returned). The active button now carries the highlight
   itself; nothing inside or above the pill ever transforms. */
#pillnav button.on{color:var(--text); font-weight:600; background:var(--card2); background:linear-gradient(180deg, color-mix(in srgb, var(--text) 21%, transparent), color-mix(in srgb, var(--text) 8%, transparent) 58%, color-mix(in srgb, var(--text) 13%, transparent)); border:1px solid color-mix(in srgb, var(--text) 16%, transparent); box-shadow:inset 0 1px 0 rgba(255,255,255,.25), inset 0 -6px 10px rgba(255,255,255,.05), 0 2px 10px rgba(0,0,0,.25);}
#pillnav button{border:1px solid transparent;}

/* home head — v2.1.1 brush-up: the zukan home opens straight onto
   the grid, so the theme / goals / premises no longer stack as big
   blocks above the cards. The home keeps only a slim summary strip
   (theme line + the two goals inline) and a single-line chips rail.
   v3.0.6 (his call: the full-text card at the head of the
   アートビジネス tab was in the way): the strip itself is the
   door — tapping it opens the full texts (theme paragraph, goal
   notes, all premises) as a detail page, with the same slide as
   a section detail; the chips rail stays a plain summary. */
.home-head{padding:10px 0 0;}
.homestrip{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:11px 36px 10px 14px; margin-bottom:9px; position:relative; cursor:pointer;}
.homestrip:active{background:var(--card2);}
.hs-chev{position:absolute; right:13px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:21px; line-height:1; font-family:var(--sans); pointer-events:none;}
.hs-theme{font-family:var(--headfont); font-size:16.5px; font-weight:700; letter-spacing:.05em; line-height:1.4;}
/* v2.1.2: the goals row is plain block flow, not a flex row. The
   strip's height is then exactly the sum of its line boxes under
   any font metrics — a flex cross-axis (align-items / baseline)
   calculation can displace the row against the strip's own top
   edge when the device renders the serif larger than the layout
   assumed (his device recording: goals sliced at the strip top,
   theme row pushed out of sight). Block flow cannot displace:
   if a row wraps or grows, the strip grows with it. */
.hs-goals{display:block; margin-top:6px; line-height:1.6;}
.hs-goal{display:inline-flex; align-items:baseline; gap:6px; vertical-align:baseline;}
.hs-gl{font-size:11px; color:var(--muted); letter-spacing:.04em; white-space:nowrap;}
.hs-gn{font-family:var(--headfont); font-weight:700; font-size:16px; line-height:1.2;}
.hs-gn small{font-size:11px; font-weight:600;}
.hs-sep{display:inline-block; width:1px; height:14px; background:var(--line); margin:0 10px; vertical-align:-2px;}
.chips{display:flex; flex-wrap:nowrap; gap:7px; overflow-x:auto; padding-bottom:2px; margin-bottom:2px; scrollbar-width:none; -webkit-overflow-scrolling:touch;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex:none; font-size:11.5px; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:4px 10px; color:var(--text); white-space:nowrap;}

/* ---------- その他 view: the zukan app's settings system, ported
   verbatim (.setttl / .pillrow / .groupcard / .srow from the zukan
   app's own stylesheet). Since v3.0.5 this screen is settings
   only — sync, relay, app information (version, data file) in

.setttl{text-align:center; font-size:18px; font-weight:700; letter-spacing:.08em; margin:6px 0 20px; font-family:var(--sans);}
.pillrow{display:flex; align-items:center; gap:15px; width:100%; text-align:left; background:var(--card); border-radius:999px; padding:18px 22px; margin-bottom:26px; font-family:var(--sans); color:var(--text); min-height:48px;}
.pillrow:active{background:var(--card2);}
.groupcard{background:var(--card); border-radius:26px; padding:4px 20px; margin-bottom:26px;}
.srow{display:flex; align-items:center; gap:15px; width:100%; text-align:left; padding:16px 0; border-bottom:1px solid var(--line); font-family:var(--sans); color:var(--text); min-height:48px;}

.pillrow .ic{flex:none; width:26px; height:26px; color:var(--muted); display:inline-flex; align-items:center; justify-content:center;}
.pillrow .ic svg{width:25px; height:25px;}
.srow .lb, .pillrow .lb{flex:1; font-size:calc(var(--fs) * 1.02); min-width:0;}
.srow .val{color:var(--muted); font-size:calc(var(--fs) * .95);}
.pillrow .val{color:var(--muted); font-size:calc(var(--fs) * .95);}
.srow .chev, .pillrow .chev{color:var(--muted); font-size:22px; line-height:1;}
.srow.danger .lb{color:var(--danger);}
/* full-text block: theme paragraph, goal notes, premise chips —
   everything the compact home strip abbreviates. It sat at the
   bottom of その他 until v3.0.3, led the アートビジネス tab as
   a card in v3.0.4–v3.0.5, and since v3.0.6 opens as the strip's

.orow-text{padding:11px 0 9px; border-bottom:1px solid var(--line);}
.oth-theme{font-family:var(--headfont); font-size:16px; font-weight:700; letter-spacing:.04em; margin-bottom:5px;}

/* v3.0.0: section cards carry NO image face (his call, 2026-11-19:
   「カードに写真いらない」). The zukan app's own no-photo manner is
   the collapsed .ph.noplate strip (58px / wide 72px / compact 40px)
   — when there is no photo the face shrinks away and the figcaption
   text hierarchy IS the card. Busilabo has no photos at all, so the
   face goes entirely: the figcaption (title / num・tag / meta /
   badge) sits directly on the zukan card surface, and each of the
   5 size stops still earns its place — the column count, the card
   padding and the title size all move per stop (the zukan caption
   rules above carry the type sizes). */

figure.work figcaption{padding:0;}
.grid.wide figure.work{padding:17px 19px 15px;}
.grid.compact figure.work{padding:9px 11px 8px;}

/* detail content */
/* v3.0.6 brush-up (his call: 全体的に野暮ったくて見にくい):
   the detail article IS the dark-brown panel — no prose sits
   directly on the wood grain. Blocks that carried the card
   tone step up to --card2 inside the panel, and the home
   full-text card insets to --bg2, so nested surfaces still
   read as separate layers. Auxiliary text brightens one step
   app-wide via --muted in the theme block. */
/* v3.0.7 compact pass (his call: もっとコンパクトに見やすく):
   the detail type steps down half a size, line-height and the
   vertical rhythm tighten one notch across every block below;
   headings keep their size gap so the hierarchy still reads. */
.detail{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:15px 14px 9px; margin-bottom:14px; font-size:14.5px; line-height:1.68;}
.detail .card, .detail .lane, .detail .note, .detail .stat, .detail .asset, .detail .idea, .detail .pending-list li{background:var(--card2);}
.detail .groupcard{background:var(--bg2); border:1px solid var(--line); margin-bottom:0;}
.detail-head{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:2px 0 6px;}
.detail-head h2{font-family:var(--headfont); font-size:24px; font-weight:700; line-height:1.3; margin:0; letter-spacing:.05em;}
.badge{display:inline-block; font-family:var(--sans); font-size:12px; font-weight:700; border-radius:999px; padding:3px 11px; white-space:nowrap;}
.badge.decided{background:var(--accent); color:var(--bg);}
.badge.pending{background:transparent; color:var(--muted); border:1.5px dashed var(--lineStrong);}
.badge.now{background:var(--card2); color:var(--text); border:1px solid var(--line);}
.sec-lead{color:var(--text); margin-bottom:10px;}
.detail p{margin-bottom:.7em;}
.detail h3{font-family:var(--headfont); font-size:17px; font-weight:700; letter-spacing:.04em; margin:19px 0 6px; line-height:1.45;}
.detail h3::before{content:''; display:inline-block; width:8px; height:8px; border-radius:2px; background:var(--accent); margin-right:9px; vertical-align:2px;}
.detail h3:first-of-type{margin-top:12px;}
/* plain lists read as divided rows on the panel （夢と理想 etc.) */
/* plain lists only — every component list (rules / steps /
   parts / ladder / pending-list) is excluded on BOTH the ul and
   the ol side. v3.0.7: the ol side used to exclude only .steps,
   so this rule out-specified .rules li, stripped its left
   padding and left the gold number sitting on the first
   character of the body text (his screenshot, 2026-11-20). */
.detail ul:not(.ladder):not(.steps):not(.parts):not(.rules):not(.pending-list):not(.checklist):not(.goalpick):not(.terms),
.detail ol:not(.steps):not(.rules):not(.ladder):not(.parts):not(.pending-list){list-style:none; padding-left:0; margin:2px 0 12px;}
.detail ul:not(.ladder):not(.steps):not(.parts):not(.rules):not(.pending-list):not(.checklist):not(.goalpick):not(.terms) li,
.detail ol:not(.steps):not(.rules):not(.ladder):not(.parts):not(.pending-list) li{padding:6px 0; border-bottom:1px solid var(--line); margin:0; line-height:1.6;}
.detail ul:not(.ladder):not(.steps):not(.parts):not(.rules):not(.pending-list):not(.checklist):not(.goalpick):not(.terms) li:last-child,
.detail ol:not(.steps):not(.rules):not(.ladder):not(.parts):not(.pending-list) li:last-child{border-bottom:none;}
.card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:13px 14px 6px; margin-bottom:12px;}
.card h3{margin-top:0;}

.steps{list-style:none; margin:4px 0 12px; padding:0;}
.steps li{position:relative; padding:0 0 15px 42px; margin:0;}
.steps li::before{content:attr(data-n); position:absolute; left:0; top:1px; width:27px; height:27px; border-radius:50%; background:var(--accent); color:var(--bg); font-weight:700; font-size:13px; display:flex; align-items:center; justify-content:center;}
.steps li::after{content:""; position:absolute; left:12.5px; top:32px; bottom:2px; width:2px; background:var(--line);}
.steps li:last-child{padding-bottom:2px;}
.steps li:last-child::after{display:none;}
.steps .st{font-weight:700; display:block;}
.steps .sd{color:var(--muted); font-size:14px; display:block;}
.steps .done-when{font-size:13px; color:var(--muted); display:block; margin-top:2px;}
.steps .done-when::before{content:"完了条件："; font-weight:700;}
.firststep{display:block; font-size:13.5px; line-height:1.55; background:var(--card2); border-left:3px solid var(--accent); border-radius:8px; padding:7px 11px; margin:8px 0 10px;}
.ladder .firststep{flex:1 1 100%; margin:8px 0 0; background:var(--bg2);}
.steps .firststep{margin-bottom:0;}

/* v3.0.6: each checkpoint is one self-contained row card —
   amount, what changes, and the first-step panel read as a
   single unit; the floating gold bars (lengths with no legend)
   are gone. Rows are tappable: the tapped step is 現在地
   (cp-now), earlier steps read as reached (cp-done) — the
   state lives on the device only (see decorateLadder). */
.ladder{list-style:none; margin:6px 0 13px; padding:0; display:flex; flex-direction:column; gap:7px;}
.ladder::before{content:'タップで現在地を設定（もう一度タップで解除）'; font-family:var(--sans); font-size:11.5px; color:var(--muted); letter-spacing:.03em;}
.ladder li{display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin:0; cursor:pointer;}
.ladder li:active{background:var(--bg2);}
/* v3.0.7: the checkpoint rows become a staircase — each row
   opens with a gold tread whose length the data already
   carries (the .bar widths, hidden in v3.0.6), and the rows
   cascade right as they climb (--i set by decorateLadder).
   The 現在地／到達済み states ride on the same rows. */
.ladder .bar{display:block; order:-1; flex:1 1 100%; height:5px; border-radius:3px; background:var(--accent); opacity:.5; margin-bottom:2px;}
.ladder li{margin-left:calc(var(--i, 0) * 4px);}
.ladder li.cp-done .bar{opacity:.95;}
.ladder li.cp-now .bar{opacity:1;}
.ladder .amt{display:inline-flex; align-items:center; font-family:var(--headfont); font-weight:700; font-size:18px;}
.ladder .what{color:var(--muted); font-size:13.5px; line-height:1.55; flex:1 1 140px;}
.ladder li.cp-done .amt{color:var(--accent);}
.ladder li.cp-done .amt::before{content:'✓'; flex:none; width:19px; height:19px; border-radius:50%; background:var(--accent); color:var(--bg); font-family:var(--sans); font-size:11px; font-weight:800; display:inline-flex; align-items:center; justify-content:center; margin-right:8px;}
.ladder li.cp-now{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent);}
.ladder li.cp-now .amt::after{content:'現在地'; flex:none; font-family:var(--sans); font-size:10.5px; font-weight:700; letter-spacing:.06em; color:var(--bg); background:var(--accent); border-radius:999px; padding:2px 8px; margin-left:9px;}

.stats{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px;}
@media (min-width:640px){.stats{grid-template-columns:repeat(4,1fr);}}
.stat{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:11px 12px 8px;}
.stat .v{font-family:var(--headfont); font-weight:700; font-size:22px; line-height:1.25;}
.stat .v small{font-size:14px; font-weight:600;}
.stat .k{font-size:13px; color:var(--muted); margin-top:2px;}

.parts{list-style:none; margin:4px 0 12px; padding:0;}
.parts li{display:flex; gap:11px; align-items:flex-start; padding:9px 0; border-bottom:1px solid var(--line); margin:0;}
.parts li:last-child{border-bottom:none;}
.parts .pn{flex:none; width:28px; height:28px; border-radius:50%; border:1.5px solid var(--accent); color:var(--accent); font-weight:700; font-size:13.5px; display:flex; align-items:center; justify-content:center; margin-top:0;}
.parts .pb{flex:1;}
.parts .pt{font-weight:700;}
.parts .pd{color:var(--muted); font-size:14px; display:block;}
.status{flex:none; font-family:var(--sans); font-size:12px; font-weight:700; border-radius:999px; padding:3px 9px; margin-top:4px; background:var(--card2); color:var(--muted); white-space:nowrap;}
.status.gap{color:var(--accent);}

table.plan{width:100%; border-collapse:collapse; margin:4px 0 13px; font-size:14px;}
table.plan th,table.plan td{text-align:left; vertical-align:top; padding:8px 10px; border-bottom:1px solid var(--line);}
table.plan th{font-size:13px; color:var(--muted); font-weight:700; white-space:nowrap;}
table.plan td.price{font-weight:700; white-space:nowrap;}
@media (max-width:560px){
  table.plan thead{display:none;}
  table.plan tr{display:block; padding:10px 0; border-bottom:1px solid var(--line);}
  table.plan td{display:block; border-bottom:none; padding:2px 0;}
  table.plan td.price{font-size:16px;}
  table.plan td::before{content:attr(data-l); font-size:12px; color:var(--muted); font-weight:700; display:block;}
  table.plan td.price::before{display:none;}
}

.lanes{display:grid; grid-template-columns:1fr; gap:12px; margin-bottom:14px;}
@media (min-width:640px){.lanes{grid-template-columns:1fr 1fr;}}
.lane{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 16px 8px;}
.lane h3{margin-top:0;}
.lane.art{border-top:3px solid var(--accent);}
.lane.other{border-top:3px solid var(--lineStrong);}

.pending-list{list-style:none; margin:4px 0 12px; padding:0;}
.pending-list li{background:var(--card); border:1.5px dashed var(--lineStrong); border-radius:14px; padding:11px 14px 6px; margin-bottom:8px;}
.pending-list .pt{font-weight:700; display:block;}
.pending-list .pd{color:var(--muted); font-size:14px; display:block;}

/* v3.0.7: the numbered list carries its number in a fixed
   gutter column — the ::before owns the left 26px of the row
   and the body text starts at 38px, so marker and text can
   never overlap. Scoped under .detail ol.rules so the padding
   that reserves the gutter stands on its own specificity. */
.detail .rules{list-style:none; margin:4px 0 12px; padding:0; counter-reset:rule;}
.detail ol.rules li{counter-increment:rule; position:relative; padding:6px 0 6px 38px; border-bottom:1px solid var(--line); margin:0; line-height:1.6;}
.detail ol.rules li:last-child{border-bottom:none;}
.detail ol.rules li::before{content:counter(rule); position:absolute; left:0; top:6px; width:26px; text-align:center; font-family:var(--headfont); font-weight:700; font-size:16px; line-height:1.45; color:var(--accent);}

/* ---------- v3.0.7 diagrams ----------
   His standing rule （鉄則）: content sits in frames, and
   anything that states an order, a staircase, a branch, a
   comparison or a judgment is drawn as a diagram — prose is
   demoted to labels and short captions. Everything below is
   built from the app's own surfaces; no external images. */
/* judgment flow （ルール： 評価の物差し — 問い1 → 問い2 → 判定） */
.judge{margin:4px 0 14px;}
.jq{background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:10px 12px; display:flex; gap:10px; align-items:flex-start;}
.jq>span{min-width:0;}
.jq .qn{flex:none; font-family:var(--sans); font-size:11px; font-weight:800; letter-spacing:.05em; color:var(--bg); background:var(--accent); border-radius:999px; padding:2px 8px; margin-top:2px;}
.jq .qt{font-weight:700; display:block; line-height:1.5;}
.jq .qd{color:var(--muted); font-size:13px; display:block; line-height:1.55;}
.jarrow{text-align:center; color:var(--accent); font-size:14px; line-height:1.25; padding:2px 0;}
.jout{display:flex; gap:8px; flex-wrap:wrap;}
.jout span{flex:1 1 140px; border-radius:12px; padding:9px 12px; font-weight:700; font-size:13.5px; line-height:1.5; text-align:center;}
.jok{background:var(--accent); color:var(--bg);}
.jng{background:var(--bg2); color:var(--muted); border:1.5px dashed var(--lineStrong);}
/* checklist （ルール： 禁止ライン — a ✕ in a square owns the
   left column, the body starts after it, same gutter contract
   as the numbered list) */
.checklist{list-style:none; margin:4px 0 12px; padding:0;}
.checklist li{position:relative; padding:6px 0 6px 38px; border-bottom:1px solid var(--line); margin:0; line-height:1.6;}
.checklist li:last-child{border-bottom:none;}
.checklist li::before{content:'✕'; position:absolute; left:1px; top:7px; width:22px; height:22px; border:1.5px solid var(--danger); border-radius:6px; color:var(--danger); font-family:var(--sans); font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center;}
/* branch diagram （図鑑事業： 仕組み → 受託 / 横展開） */
.branch2{margin:4px 0 14px;}
.b-src{background:var(--card2); border:1px solid var(--accent); border-radius:12px; padding:9px 12px; text-align:center; font-weight:700;}
.b-stem{width:2px; height:11px; background:var(--lineStrong); margin:0 auto;}
.b-bar{height:2px; background:var(--lineStrong); margin:0 25%;}
.b-cols{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.b-col{position:relative; background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:9px 10px 7px; margin-top:11px; text-align:center;}
.b-col::before{content:''; position:absolute; top:-11px; left:50%; width:2px; height:11px; background:var(--lineStrong);}
.b-col .b-t{display:block; font-size:12px; color:var(--muted); letter-spacing:.05em;}
.b-col .b-v{display:block; font-family:var(--headfont); font-weight:700; font-size:19px; margin:1px 0 2px;}
.b-col .b-d{display:block; font-size:12.5px; color:var(--muted); line-height:1.55;}
.b-col.art{border-top:3px solid var(--accent);}
/* trio （ビジネス計画： A/B/C を並列に、その下に進める順番） */
.trio{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin:4px 0 8px;}
.tcol{background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:9px 8px 7px; text-align:center;}
.tcol .tl-t{display:block; font-family:var(--headfont); font-weight:700; font-size:17px; color:var(--accent);}
.tcol .tl-n{display:block; font-weight:700; font-size:12.5px; line-height:1.45; margin-top:1px;}
.tcol .tl-d{display:block; color:var(--muted); font-size:11.5px; line-height:1.5; margin-top:2px;}
.trio-seq{background:var(--bg2); border:1px solid var(--line); border-radius:10px; padding:8px 12px; font-size:13px; line-height:1.6; margin:0 0 14px;}
/* price staircase （アートビジネス計画： 価格の階段 — rows
   cascade right as the tier climbs, --i is in the markup) */
.pstairs{margin:4px 0 12px; display:flex; flex-direction:column; gap:7px;}
.ps-row{display:flex; align-items:center; gap:11px; background:var(--card2); border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:12px; padding:9px 12px; margin-left:calc(var(--i, 0) * 11px);}
.ps-n{flex:none; font-family:var(--sans); font-size:11px; font-weight:800; letter-spacing:.05em; color:var(--bg); background:var(--accent); border-radius:999px; padding:2px 8px;}
.ps-price{flex:none; font-family:var(--headfont); font-weight:700; font-size:16.5px; white-space:nowrap;}
.ps-b{flex:1; min-width:0;}
.ps-f{display:block; font-weight:600; line-height:1.5;}
.ps-r{display:block; color:var(--muted); font-size:12.5px; line-height:1.5;}
/* goal picker （テーマと目標の詳細： 目標のチェックポイントを
   選ぶ） + the 目標 tag on the ladder itself */
.goalpick{list-style:none; margin:4px 0 6px; padding:0; display:flex; flex-direction:column; gap:7px;}
.goalpick li{display:flex; align-items:center; gap:10px; background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:9px 12px; margin:0; cursor:pointer;}
.goalpick li:active{background:var(--bg2);}
.goalpick .amt{font-family:var(--headfont); font-weight:700; font-size:16.5px; flex:none;}
.goalpick .what{color:var(--muted); font-size:12.5px; line-height:1.5; flex:1; min-width:0;}
.goalpick li.gp-on{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent);}
.goalpick li.gp-on .amt{color:var(--accent);}
.goalpick li.gp-on::after{content:'目標'; flex:none; font-family:var(--sans); font-size:10.5px; font-weight:800; letter-spacing:.06em; color:var(--bg); background:var(--accent); border-radius:999px; padding:2px 8px;}
.gp-head{font-family:var(--sans); font-size:12px; font-weight:700; color:var(--muted); letter-spacing:.05em; margin:14px 0 2px;}
.cpgoal-tag{flex:none; font-family:var(--sans); font-size:10.5px; font-weight:800; letter-spacing:.06em; color:var(--accent); border:1.5px solid var(--accent); border-radius:999px; padding:1px 8px;}
.hs-goal-g{display:inline-block; vertical-align:top; max-width:57%;}
.hs-gw{display:block; font-size:11px; color:var(--muted); line-height:1.5; margin-top:1px;}
/* v3.0.7 (his call): the sources footer no longer sits under
   the list screens — the data keeps it, the lists do not
   show it, and no new home is made for it */
#homeSources{display:none;}
/* dictionary （用語辞典）: framed groups, one framed row per
   term — name, plain definition, and where it sits in this
   plan when that applies */
.dgroup{border:1px solid var(--line); border-radius:14px; background:rgba(255,244,214,.05); padding:12px 11px 5px; margin:0 0 12px;}
.dgroup-h{font-family:var(--headfont); font-weight:700; font-size:16.5px; margin:0 2px 9px; padding-bottom:7px; border-bottom:1px solid var(--line);}
.terms{list-style:none; margin:0 0 6px; padding:0; display:flex; flex-direction:column; gap:7px;}
.term{background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:9px 12px 10px; margin:0;}
.term .tt{font-family:var(--headfont); font-weight:700; font-size:15.5px;}
.term .td{display:block; margin-top:2px; line-height:1.6;}
.term .tm{display:block; margin-top:3px; font-size:12.5px; color:var(--muted); line-height:1.55;}
.term .tm::before{content:'この計画では：'; font-weight:700; color:var(--accent);}
.note{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:11px 14px 4px; margin-bottom:12px; font-size:14px;}

.assets{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:4px 0 14px;}
@media (min-width:640px){.assets{grid-template-columns:repeat(3,1fr);}}
.asset{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 12px 6px;}
.asset .an{font-weight:700; font-size:15px; display:block;}
.asset .ad{font-size:13px; color:var(--muted); display:block;}
.idea{background:var(--card); border:1.5px dashed var(--lineStrong); border-radius:14px; padding:13px 15px 8px; margin-bottom:10px; scroll-margin-top:calc(var(--hdrh, 56px) + 70px);}
.idea h3{margin:0 0 6px; font-size:17px;}
.idea p{font-size:14px; color:var(--muted);}
.tags{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0;}
.tags .tl{font-size:12px; font-weight:700; color:var(--muted); width:100%;}
.tag{font-size:12.5px; background:var(--card2); color:var(--text); border:1px solid var(--line); border-radius:999px; padding:3px 10px; font-weight:700;}
.idea .links{font-size:13.5px; color:var(--muted); margin-bottom:8px;}
.idea .links a{color:var(--accent); text-decoration:underline; text-underline-offset:3px; padding:4px 2px; display:inline-block;}
.sources{font-size:12.5px; color:var(--muted); margin-top:22px; line-height:1.65;}
.flow{display:flex; flex-wrap:wrap; align-items:center; gap:6px; font-weight:700; font-size:15px; margin-bottom:9px;}
.flow span{background:var(--card); border:1px solid var(--line); border-radius:8px; padding:5px 11px;}
.flow i{color:var(--accent); font-style:normal;}
.verline{font-size:12px; color:var(--muted); margin-top:14px;}
.verline button{background:none; border:0; color:var(--muted); font:inherit; font-size:12px; text-decoration:underline; text-underline-offset:3px; cursor:pointer; padding:4px 2px; min-height:0;}

/* ============================================================
   v3.0.0: the zukan app's mechanism layer, ported — version
   badge, notification bell + panel, sync result lines, relay
   form, toast. (Styles are the zukan app's own values; --tag
   becomes the fixed gold pairing the zukan app uses for NEW.)
   ============================================================ */
#verBadge{position:fixed; top:calc(env(safe-area-inset-top, 0px) + 2px); left:0; right:0; text-align:center; z-index:39; font-size:11px; letter-spacing:.03em; color:var(--muted); opacity:.85; pointer-events:none; white-space:nowrap; font-family:var(--sans);}
/* the bell: a presence dot only (zukan v5.53.0 manner) — the
   counts live on the panel's tabs, never on the bell itself */
#bellbtn{position:relative; flex:none; width:40px; height:40px; display:inline-flex; align-items:center; justify-content:center; background:none; border:0; color:var(--muted); cursor:pointer; padding:0;}
#bellbtn svg{width:21px; height:21px;}
#bellbtn .bdot{position:absolute; top:7px; right:7px; width:9px; height:9px; border-radius:50%; background:#e5484d; border:1.5px solid var(--bg);}
body.notifopen #pillnav{opacity:0; pointer-events:none;}
/* notification rows (the zukan app's .uprow family) */
.uprow{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:13px 14px 12px; margin:0 0 10px;}
.uprow.tap{cursor:pointer; position:relative; padding-right:24px; touch-action:manipulation; -webkit-tap-highlight-color:transparent;}
.uprow .nexp{position:absolute; right:2px; top:15px; color:var(--muted); font-size:17px; line-height:1; transition:transform .18s;}
.uprow .nexp.open{transform:rotate(90deg);}
#updatelist .nexp{transition:none;}
.uprow.hasnew{position:relative; padding-right:64px;}
.uprow.tap.hasnew{padding-right:86px;}
.newtag{position:absolute; top:13px; right:2px; font-size:11px; font-weight:800; letter-spacing:.1em; color:#191204; background:#e6b93d; border-radius:999px; padding:2px 8px; line-height:1.5;}
.uprow.tap .newtag{right:24px;}
.newtag.inl{position:static; flex:none; align-self:center;}
.belldot{display:inline-block; min-width:17px; height:17px; padding:0 4px; margin-left:6px; border-radius:999px; background:#e6b93d; color:#191204; font-size:10.5px; font-weight:800; line-height:17px; text-align:center; box-sizing:border-box; vertical-align:2px;}
.uphead{display:flex; align-items:baseline; gap:9px;}

.nmember:first-child{border-top:0;}
.seenwrap{margin-left:auto; display:flex; align-self:center;}
.seenbtn{touch-action:manipulation; border:1px solid var(--accent); color:var(--accent); background:none; border-radius:999px; font-size:12px; font-weight:700; padding:8px 14px; min-height:40px; letter-spacing:.04em; font-family:var(--sans);}
.seenbtn.done{border-color:var(--line); color:var(--muted); background:var(--bg2); font-weight:400;}
/* v3.0.6: mark-all-seen row at the head of both bell-panel lists */
.allseenrow{display:flex; justify-content:flex-end; margin:0 0 10px;}
.allseenbtn{touch-action:manipulation; border:1px solid var(--accent); color:var(--accent); background:none; border-radius:999px; font-size:12.5px; font-weight:700; padding:8px 16px; min-height:40px; letter-spacing:.04em; font-family:var(--sans); cursor:pointer; -webkit-tap-highlight-color:transparent;}

/* sync result lines + the relay form, inside その他 */

/* v3.0.6 brush-up: sync result lines sit on a panel too, not

 "sections": [

   "num": "01",
   "char": "時",
   "tag": "3期間",
   "themeClass": "t-schedule",
   "title": "時期と順番",
   "meta": "受験を軸に固定された順番と、収入の階段（月1,000円〜年1,000万円）",
   "badgeClass": "decided",
   "badgeText": "決定済み",
   "html": "<div class=\"detail-head\"><h2>時期と順番<\/h2><span class=\"badge decided\">決定済み<\/span><\/div>\n        <p class=\"sec-lead\">受験を軸に、やる順番は固定されている。並行開発はしない。<\/p>\n        <ol class=\"steps\">\n          <li data-n=\"1\"><span class=\"st\">今 〜 共通テスト（2027年1月16・17日）<\/span><span class=\"sd\">候補A（単語原木）を自分用に育てる。並行するのは候補Cの題材決定（段0）まで。<\/span><\/li>\n          <li data-n=\"2\"><span class=\"st\">共通テスト後 〜 2月<\/span><span class=\"sd\">候補C×B（現場の不便解消 × シェアされる出力）の最小版を公開し、集客テスト30日。<\/span><\/li>\n          <li data-n=\"3\"><span class=\"st\">受験後<\/span><span class=\"sd\">候補Aの一般公開版を調整・公開。図鑑事業の受託を本格始動させる。<\/span><\/li>\n        <\/ol>\n        <div class=\"note\">\n          <p>補足として、知識の蓄積だけは受験前から進めてよい（アフィリエイトの仕組みを学ぶ学習編など）。応募・出品・公開といった実践は、すべて受験後の段に置く。<\/p>\n        <\/div>\n        <h3>収入の階段（チェックポイント）<\/h3>\n        <p>2026-11-20、夢と理想の棚卸しを受けて、階段を細かく割った。金額はすべて「仕組みからの月収」で、各地点に生活の何が変わるかを付けてある。<\/p>\n        <ul class=\"ladder\">\n          <li><span class=\"amt\">月1,000円<\/span><span class=\"bar\" style=\"width:5%\"><\/span><span class=\"what\">最初の取引。額ではなく「仕組みが金を生んだ」ことの証明<\/span>\n<p class=\"firststep\"><strong>最初の一歩：<\/strong>有料の物を1つ出して、最初の取引を作る<br><strong>時期：<\/strong>受験後、最初に届いた仕組みから<\/p><\/li>\n          <li><span class=\"amt\">月1万円<\/span><span class=\"bar\" style=\"width:12%\"><\/span><span class=\"what\">ツール代・教材費が仕組みから出る。自腹が終わる<\/span>\n<p class=\"firststep\"><strong>最初の一歩：<\/strong>最初の取引が立った仕組みで、2件目・2つ目の商品を作り、再現するか確かめる<br><strong>時期：<\/strong>最初の取引が立ってから<\/p><\/li>\n          <li><span class=\"amt\">月3万円<\/span><span class=\"bar\" style=\"width:20%\"><\/span><span class=\"what\">家賃3万円を仕組みが払う。バイトを減らし始める目安<\/span>\n<p class=\"firststep\"><strong>最初の一歩：<\/strong>家賃分が仕組みから出る月を作り、バイトのシフトを減らす相談を始める<br><strong>時期：<\/strong>月1万円に届いてから<\/p><\/li>\n          <li><span class=\"amt\">月7万円<\/span><span class=\"bar\" style=\"width:30%\"><\/span><span class=\"what\">バイト引退。今のバイト給料と同額で、今の暮らし＋先取り貯金まで仕組みで再現できる<\/span>\n<p class=\"firststep\"><strong>最初の一歩：<\/strong>バイトを辞める条件（仕組みの収入が今の暮らし＋先取り貯金を賄う月が続くこと）を先に決め、月次で記録する<br><strong>時期：<\/strong>月3万円に届いてから<\/p><\/li>\n          <li><span class=\"amt\">月10万円<\/span><span class=\"bar\" style=\"width:38%\"><\/span><span class=\"what\">画材を少し奮発できる。貯金のペースが上がる<\/span>\n<p class=\"firststep\"><strong>最初の一歩：<\/strong>届いた1つの仕組みを、繰り返し売れる形（連載化・定番化）に整える<br><strong>時期：<\/strong>月7万円に届いてから<\/p><\/li>\n          <li><span class=\"amt\">月15万円<\/span><span class=\"bar\" style=\"width:46%\"><\/span><span class=\"what\">広めの部屋への引っ越しが視野（家賃アップを吸収できる）。犬の初期費用と月の飼育費もここ<\/span>\n<p class=\"firststep\"><strong>最初の一歩：<\/strong>広めの部屋の条件（広さ・家賃の上限）を決めて物件を探し始める。犬は迎える条件（犬種・初期費用）を書き出す<br><strong>時期：<\/strong>月10万円に届いてから<\/p><\/li>\n          <li><span class=\"amt\">月20万円<\/span><span class=\"bar\" style=\"width:54%\"><\/span><span class=\"what\">取材旅行に年数回行ける。ファッションに月数万回せる<\/span>\n<p class=\"firststep\"><strong>最初の一歩：<\/strong>取材旅行を1回、行き先と予算を先に決めて実際に計画する<br><strong>時期：<\/strong>月15万円に届いてから<\/p><\/li>\n          <li><span class=\"amt\">月30万円<\/span><span class=\"bar\" style=\"width:64%\"><\/span><span class=\"what\">年換算360万円。同年代の平均を超える。バー通いも無理のない範囲に入る<\/span>\n<p class=\"firststep\"><strong>最初の一歩：<\/strong>柱を2本目に増やす（届いた仕組みともう1系統を並走させる）<br><strong>時期：<\/strong>月20万円の帯で安定してから<\/p><\/li>\n          <li><span class=\"amt\">月50万円<\/span><span class=\"bar\" style=\"width:78%\"><\/span><span class=\"what\">年600万円＝父親超えのチェックポイント。工場跡アトリエの賃貸、人をパートで雇う、親族への恩返しが年単位で可能になる<\/span>\n<p class=\"firststep\"><strong>最初の一歩：<\/strong>月50万円ペースが続いたら、年600万円の到達として記録し、次の目標に切り替える<br><strong>時期：<\/strong>月30万円の帯に入ってから<\/p><\/li>\n          <li><span class=\"amt\">月83万円<\/span><span class=\"bar\" style=\"width:92%\"><\/span><span class=\"what\">年換算で約1,000万円＝最終目標。拠点を東京か京都に置く選択が現実になる<\/span>\n<p class=\"firststep\"><strong>最初の一歩：<\/strong>拠点（東京か京都）の条件を決め、移住の試算を1枚作る<br><strong>時期：<\/strong>月50万円の帯で安定してから<\/p><\/li>\n        <\/ul>\n        <h3>資産フェーズ（年1,000万円の先）<\/h3>\n        <div class=\"note\">\n          <p>木の家の購入／イギリス拠点／人を常勤で雇う／大金の貯金——この4つは、年1,000万円の収入があってもまだ先の話で、「収入」ではなく「資産」のフェーズに属する。階段の外ではなく、10番のチェックポイントの先に置く。<\/p>\n          <p class=\"firststep\"><strong>最初の一歩：<\/strong>収入のうち資産に回す割合を決め、積立を始める<br><strong>時期：<\/strong>年1,000万円に届いてから<\/p>\n        <\/div>\n        <h3>夢と理想（2026-11-20 の棚卸し）<\/h3>\n        <p>上のチェックポイントの根拠。2026-11-20に本人が語った内容を、短い一覧で残す。<\/p>\n        <ul>\n          <li>絵を描き続ける。大きい絵も描く<\/li>\n          <li>広めの部屋に住む（狭いと壁やら何やらにぶつかる）<\/li>\n          <li>工場跡地のような広い場所をアトリエにする（井田幸昌のアトリエのような）<\/li>\n          <li>服や香水などファッションアイテムを買うお金に困らない。高いものも<\/li>\n          <li>旅行は取材という名目ですぐ行けるくらいになる<\/li>\n          <li>木の家に住む<\/li>\n          <li>相棒となる犬がほしい<\/li>\n          <li>豊かな生活。バーにも通う<\/li>\n          <li>バイトはしない。画材は値段を見ずに買う<\/li>\n          <li>親族に恩返しをする<\/li>\n          <li>貯金は大金を<\/li>\n          <li>拠点は東京か京都かイギリス。ただし不利な土地は選ばない<\/li>\n          <li>人は雇ってみたい<\/li>\n        <\/ul>",
   "updated_at": "2026-11-20T14:42:01+09:00"
  },

   "html": "<div class=\"detail-head\"><h2>ビジネス計画<\/h2><span class=\"badge decided\">骨格は決定済み<\/span><\/div>\n        <p class=\"sec-lead\">柱はアプリ。市場の現実を踏まえ、「小さく複数出し、届いたものだけ伸ばす」が勝ち方として決まっている。<\/p>\n        <div class=\"stats\">\n          <div class=\"stat\"><div class=\"v\">約83<small>%<\/small><\/div><div class=\"k\">新作アプリが2年経っても月$1,000に届かない割合<\/div><\/div>\n          <div class=\"stat\"><div class=\"v\">月$72<\/div><div class=\"k\">公開1年後の月収の中央値<\/div><\/div>\n          <div class=\"stat\"><div class=\"v\">58<small>日<\/small><\/div><div class=\"k\">月$1,000到達までの中央値。届くものは早く届く<\/div><\/div>\n          <div class=\"stat\"><div class=\"v\">5〜9<small>倍<\/small><\/div><div class=\"k\">「痛み止め」が「ビタミン」より転換する倍率<\/div><\/div>\n        <\/div>\n        <h3>候補は3つともやる。順番だけ固定<\/h3>\n        <div class=\"trio\">\n          <div class=\"tcol\"><span class=\"tl-t\">A<\/span><span class=\"tl-n\">単語原木<\/span><span class=\"tl-d\">自分用に育てる<\/span><\/div>\n          <div class=\"tcol\"><span class=\"tl-t\">B<\/span><span class=\"tl-n\">結果画面型の小ツール<\/span><span class=\"tl-d\">Cと一体で作る<\/span><\/div>\n          <div class=\"tcol\"><span class=\"tl-t\">C<\/span><span class=\"tl-n\">現場の不便解消型<\/span><span class=\"tl-d\">題材は段0で決める<\/span><\/div>\n        <\/div>\n        <p class=\"trio-seq\">進める順番：<strong>Aを育てる（今〜共通テスト）→ C×Bの最小版（共通テスト後〜2月）→ Aの一般公開版（受験後）<\/strong><\/p>\n        <div class=\"card\">\n          <h3>A. 単語原木（一般公開版） <span class=\"badge now\">自分用に走行中<\/span><\/h3>\n          <p>英語の単語暗記が続かない痛みへの道具。育成×図鑑の形で、「変身の実感」と「卒業した単語の図鑑」というシェアできる成果物を持つ。既にv1が走っているのが強み。弱みは学習アプリ市場の激戦。<\/p>\n          <p class=\"firststep\"><strong>最初の一歩：<\/strong>自分で使いながら、公開版に残すもの・削るものをメモに書きためる<br><strong>時期：<\/strong>今〜共通テスト（自分用に育てる期間）。公開版の調整と公開は受験後<\/p>\n        <\/div>\n        <div class=\"card\">\n          <h3>B. シェアされる結果画面型の小ツール<\/h3>\n          <p>手持ちの記録や写真から「分析／図鑑／年表」のような結果画像を出す道具。結果がそのまま投稿物になる形が集客装置になる（IsTalkの型）。強みは日本事例で最も再現性が高いこと。弱みは題材の当たり外れが全てで、「誰の何の結果が見たいか」の選定が勝負になる。<\/p>\n          <p class=\"firststep\"><strong>最初の一歩：<\/strong>Cの題材が決まったら、その結果画面の試し画像を1枚作る<br><strong>時期：<\/strong>共通テスト後〜2月（Cの最小版と一体で作る）<\/p>\n        <\/div>\n        <div class=\"card\">\n          <h3>C. 現場の不便解消型（作品台帳が有力）<\/h3>\n          <p>自分の制作・受験生活の現場の道具。調査で「スマホ完結・日本語・私的な作品台帳」は日本語圏に不在の<strong>無人地帯<\/strong>と確認済み。海外製品は高額・英語・PC寄りで、国内は公開ポートフォリオと物理保管に二極化している。<\/p>\n          <ul>\n            <li><strong>価格の隙間<\/strong>：買い切り〜月300〜980円、点数課金・広告なし<\/li>\n            <li><strong>集客になる出力<\/strong>：展示・完成ごとの「作品1点カード（縦型）」、第二弾に年間「制作Wrapped」<\/li>\n            <li><strong>弱み<\/strong>：層が狭く天井は低い。最初の月1万円ライン向き<\/li>\n          <\/ul>\n          <p class=\"firststep\"><strong>最初の一歩：<\/strong>段0の一文を決める（下の検証の階段の段0と、未決・保留の筆頭がここ）<br><strong>時期：<\/strong>今〜共通テスト（題材の決定だけは受験前から進める）<\/p>\n        <\/div>\n        <h3>検証の階段（段0〜段4）<\/h3>\n        <ol class=\"steps\">\n          <li data-n=\"0\"><span class=\"st\">題材を1つ決める<\/span><span class=\"done-when\">「誰が・いつ・何に困って・今どう凌いでいるか」を一文で言えること<\/span>\n<p class=\"firststep\"><strong>最初の一歩：<\/strong>題材候補（作品台帳／制作ログ／画材の在庫と消費／シフトと収入の見える化）から1つに絞って、その一文を書く<br><strong>時期：<\/strong>今〜共通テスト<\/p><\/li>\n          <li data-n=\"1\"><span class=\"st\">最小版を公開する<\/span><span class=\"done-when\">実際に他人が触れるURLがあること（決済はまだ付けない）<\/span>\n<p class=\"firststep\"><strong>最初の一歩：<\/strong>最小版の最初の1画面を作る<br><strong>時期：<\/strong>共通テスト後〜2月<\/p><\/li>\n          <li data-n=\"2\"><span class=\"st\">集客テスト30日<\/span><span class=\"done-when\">結果画面のシェアか短尺動画経由で、身内以外の利用者が10人。ゼロなら題材を変える<\/span>\n<p class=\"firststep\"><strong>最初の一歩：<\/strong>公開した日に、結果画面のシェア投稿か短尺動画を1本出す<br><strong>時期：<\/strong>段1の公開直後から30日間<\/p><\/li>\n          <li data-n=\"3\"><span class=\"st\">課金の仮設置<\/span><span class=\"done-when\">最初の1件の支払い（広告削除か年額サブスクの小さい壁で試す）<\/span>\n<p class=\"firststep\"><strong>最初の一歩：<\/strong>広告を消す有料版か年額サブスクの、どちらか1つの課金の受け皿を付ける<br><strong>時期：<\/strong>段2で身内以外の利用者が10人に届いたら<\/p><\/li>\n          <li data-n=\"4\"><span class=\"st\">判定<\/span><span class=\"done-when\">続ける／題材を変える／量産ラインに移す、を数字で決める<\/span>\n<p class=\"firststep\"><strong>最初の一歩：<\/strong>数字を見て「続ける／題材を変える／量産ラインに移す」のどれかを決め、結果を記録する<br><strong>時期：<\/strong>段3の後<\/p><\/li>\n        <\/ol>\n        <h3>課金と集客の決まり<\/h3>\n        <ul>\n          <li><strong>課金の本命<\/strong>はサブスク（年額主役）＋買い切りの受け皿。広告は単価が低く、柱にしない<\/li>\n          <li><strong>再生数 ≠ ダウンロード<\/strong>。差を分けるのは、シェアされる結果画面／プロフィールからの導線／チャネルと対象の一致<\/li>\n          <li>Xでは告知より「質問投稿」が効く。最初の利用者は手で集め、要望には速く応える<\/li>\n          <li>フォロワーは借り物。<strong>所有できる連絡先（リスト）<\/strong>を別に持つ<\/li>\n        <\/ul>\n        <h3>収益化の実務メモ<\/h3>\n        <ul>\n          <li>Stripeは個人でも使えるが、決済・税務は実名が前提。特商法の「請求があれば開示」は完全な匿名化ではない<\/li>\n          <li>1,000円あたりの手取り：STORES 945円／BOOTH 899円／note 855円<\/li>\n          <li>青色申告の承認申請は「開業後2か月以内」を逃さない<\/li>\n        <\/ul>\n        <div class=\"card\">\n          <h3>AIバウンティ（make.fun） <span class=\"badge pending\">テスト枠・検討中<\/span><\/h3>\n          <p>集客が要らず、AIの労働力そのものが商品になる経路。ただし性質は「仕組み」ではなく「懸賞」で、本命ルートにはならない。位置づけはテスト枠：目的は種銭の獲得と、AIに仕事を取らせて報酬を得る実地ノウハウ。<\/p>\n          <ul>\n            <li><strong>規律<\/strong>：並行は最大3件まで。期間と撤退線を先に決める。外れたら記録して次へ<\/li>\n            <li><strong>選ぶ基準<\/strong>：賞金÷参加者数がましで、締切に余裕があるもの。審査が「質」の案件を優先する<\/li>\n            <li><strong>注意<\/strong>：受け取りはUSDC／Solanaウォレット側で、換金と税務の手間が後で来る<\/li>\n          <\/ul>\n          <p class=\"firststep\"><strong>最初の一歩：<\/strong>締切に余裕があり、審査が「質」の案件を1件選んで応募する（並行は最大3件まで、期間と撤退線を先に決める）<br><strong>時期：<\/strong>受験後（2027年3月以降）<\/p>\n        <\/div>\n        <div class=\"card\">\n          <h3>物語のある物（物販テスト） <span class=\"badge pending\">テスト枠・2026-11-19 合意<\/span><\/h3>\n          <p>売るのは呪物ではない。<strong>「物語と力」<\/strong>——見惚れるような質の高い物に、質の高い物語を付けて売る。make.funと同格のテスト枠として、期間と撤退ラインを先に決めて小さく試す。<\/p>\n          <p><strong>担い手は石に限らない。<\/strong>売るのは物語そのものであり、表面的な物が石である必要はない。担い手は石・ガラス・金属・木などの小物でもよい。見惚れてしまうようなキラキラした石はその一例にすぎない。<\/p>\n          <ul>\n            <li><strong>狙う層<\/strong>：スピ層<\/li>\n            <li><strong>売り場<\/strong>：メルカリ。購入者の能動性が必要な場に置く<\/li>\n            <li><strong>物の土台<\/strong>：素人が適当に拾った石ころや小物に情報を付ける形とは分ける。物自体の質が土台で、マテリアルへの感覚そのものが商品力になる<\/li>\n          <\/ul>\n          <p><strong>合意したルール（3つ）<\/strong>——担い手が石でもガラスでも金属でも木でも、何であれそのまま適用される。<\/p>\n          <ul>\n            <li><strong>効能を断定しない<\/strong>——説明文で断定すると嘘になる。「〜と言われてきた」「〜と云われる」という言い回しが大切で、それこそが物語である<\/li>\n            <li><strong>無理な売りつけはしない<\/strong>——欲しい人が能動的に買う構造に置く。無理やりは悪質<\/li>\n            <li><strong>物の質は本物にする<\/strong>——物語を剥がしても、物そのものに持つ価値があること<\/li>\n          <\/ul>\n          <p><strong>位置づけ——アートビジネスの練習。<\/strong>値付け、物語の付け方、固定価格、記録の練習であり、「意味のないものに付加価値を与える」という、本命の作品販売（作品の値付けと言説化）と同じ力学で動く。<\/p>\n          <p>効果の受け止め方についての考え：実際に作用するかどうかは、買う人がどれほど強く信じているかによる。強く信じれば精神的に作用し、思い込みは現実に影響する。だから無意味ではない、という立場を取る。<\/p>\n          <p class=\"firststep\"><strong>最初の一歩：<\/strong>最初の1品を決めて、その出品文の下書きを作る<br><strong>時期：<\/strong>受験後（2027年3月以降）。期間と撤退ラインを決めてから出す<\/p>\n        <\/div>\n        <div class=\"card\">\n          <h3>海外向けデジタル商品（言語市場の裁定） <span class=\"badge pending\">テスト枠・候補<\/span><\/h3>\n          <p>きっかけはXで見かけた「海外note」系の投稿。収益の自己申告（初月の金額など）は裏付けがないので採らない。残すのは仕組みの部分だけ。<\/p>\n          <ul>\n            <li><strong>仕組み<\/strong>：言語の市場の間で情報の値段が違う。日本語圏では当たり前で飽和している情報が、英語圏では薄くて売れることがある（言語市場の裁定取引）<\/li>\n            <li><strong>追い風<\/strong>：AIで翻訳と制作のコストが落ち、この裁定の敷居が下がった<\/li>\n            <li><strong>売り場<\/strong>：Gumroadなど海外のデジタル商品の販売プラットフォーム（実在する経路）<\/li>\n            <li><strong>資産性<\/strong>：売れた商品のバックリストは在庫として残る。懸賞型と違い、ゼロにはならない<\/li>\n            <li><strong>重い部分<\/strong>：勝ち筋は英語圏での集客をゼロから作る力で、そこが最も重い。受験期にやる作業ではない<\/li>\n            <li><strong>置き場所<\/strong>：テスト枠の候補（決定ではない）。やるなら受験後。題材は「日本人にしか書けない日本の何か」を英語で売る形が筋<\/li>\n          <\/ul>\n          <p class=\"firststep\"><strong>最初の一歩：<\/strong>「日本人にしか書けない日本の何か」の題材候補を3つ書き出す<br><strong>時期：<\/strong>受験後（2027年3月以降）<\/p>\n        <\/div>\n        <div class=\"card\">\n          <h3>海外アフィリエイト比較記事（AI自動） <span class=\"badge pending\">テスト枠・候補<\/span><\/h3>\n          <p>きっかけはXの記事「Muse自動×海外アフィが想像以上に最強だった」（とら🐯AI副業 @3Imzdo3）。候補3（海外向けデジタル商品）と同じ「言語市場の裁定」の系統だが、仕組みが違う。候補3は自分の商品を売る形、こちらは<strong>他人の商品を紹介して、紹介料を得る<\/strong>形。原典の収益数字は実績の証拠がないので採らない。残すのは仕組みと、実在が確認できる部分だけ。<\/p>\n          <ul>\n            <li><strong>仕組み<\/strong>：AIを使い、英語圏向けに一式を回す。ターゲット選定→悩み分析→商品3件を公式情報ベースで比較→英語の比較記事→SEO／YouTube／X・Threadsで集客→アフィリエイト成果→数字で改善。原典には7日間ロードマップがある<\/li>\n            <li><strong>実在する土台<\/strong>：単価の高いSaaSのアフィリエイトは実在する。Semrushの公式プログラムは、SEO Toolkitの新規成約1件で$200（上位ランクでは$250〜350）。薄く広くではなく「少ない件数×高い単価」の型<\/li>\n            <li><strong>運用の注意<\/strong>：広告であることの開示を明記する。試していない商品を「試した」と書かない（原典にもある注意で、こちらの禁止ラインとも一致する）<\/li>\n            <li><strong>正直な留保<\/strong>：原典に収益の実績証拠はない（単価×件数の計算の提示のみ）。記事自体が無料LINE教材への誘導で、投稿者の本当の狙いは見込み客集め。重い部分は候補3と同じで、英語圏での集客とSEOの信頼づくり。ただし比較記事という中身は資産として積み上がる<\/li>\n            <li><strong>置き場所<\/strong>：テスト枠の候補（決定ではない）。受験後に回す枠<\/li>\n          <\/ul>\n          <p class=\"firststep\"><strong>最初の一歩：<\/strong>アフィリエイトの仕組みを学ぶ（Muse が用意する学習編を読む）<br><strong>時期：<\/strong>知識は受験前から可、実践は受験後<\/p>\n        <\/div>",
   "updated_at": "2026-11-20T14:42:01+09:00"

   "title": "お金とは何か",
   "meta": "お金は「誰かに価値を渡した」という記録。労働と仕組みで天井が違う理由",
   "badgeClass": "decided",
   "badgeText": "学習済み",
   "html": "<div class=\"detail-head\"><h2>お金とは何か<\/h2><span class=\"badge decided\">学習シリーズ ①<\/span><\/div>\n        <p class=\"sec-lead\">お金は、モノじゃない。記録だ。<\/p>\n        <h3>お金の流れ<\/h3>\n        <div class=\"flow\"><span>価値を渡す<\/span><i>→<\/i><span>認められる<\/span><i>→<\/i><span>記録が増える<\/span><\/div>\n        <p>お金そのものに価値はない。お金は「誰かに価値を渡した」という記録だ。渡した価値が認められたときだけ、記録が増える。<\/p>\n        <h3>2つの形<\/h3>\n        <div class=\"lanes\">\n          <div class=\"lane other\">\n            <h3>バイト（労働）<\/h3>\n            <p>時間を1回売って、1回分の記録をもらう形。確実だが、記録の量は「時間×時給」で頭打ちになる。<\/p>\n          <\/div>\n          <div class=\"lane art\">\n            <h3>仕組み<\/h3>\n            <p>一度作ったものが、何度も記録を生む形。動画1本、商品1点、顔のコレクション1つが、寝ている間も記録を生み得る。だから天井が違う。<\/p>\n          <\/div>\n        <\/div>\n        <div class=\"note\">\n          <p>逆に、誰の「欲しい」にも当たらなければ記録は0のまま。努力と記録が比例しないのが、この世界のいちばんきついところだ。<\/p>\n        <\/div>\n        <h3>翔万の数字で見ると<\/h3>\n        <div class=\"stats\">\n          <div class=\"stat\"><div class=\"v\">年600<small>万円<\/small><\/div><div class=\"k\">「月50万円分の記録を生み続ける状態」と言い換えられる<\/div><\/div>\n          <div class=\"stat\"><div class=\"v\">年1,000<small>万円<\/small><\/div><div class=\"k\">月83万円分の記録を生み続ける状態<\/div><\/div>\n        <\/div>\n        <p>問いは「頑張れるか」じゃなく「何が、誰の欲しいに当たって、記録を繰り返し生むか」になる。<\/p>\n        <h3>次のレッスン<\/h3>\n        <ul>\n          <li>② ビジネスとは何か（仕組みの定義。労働と仕組みの違い）<\/li>\n          <li>③ アフィリエイトの中身（誰が誰に、何の対価を払っているのか）<\/li>\n          <li>④ 過去の人間がどう仕組みを作ったか／低い地位からの成り上がりの型<\/li>\n        <\/ul>\n        <p class=\"sources\">出典・前提：翔万本人の言葉（2026-11-05）と、同日出た50方法マップの分布。数字の細部はマップ側に譲る。学習シリーズ ①（2026-11-05）、宿題なし<\/p>",

   "html": "<div class=\"detail-head\"><h2>お金の勉強の地図<\/h2><span class=\"badge now\">次は「数字の式」<\/span><\/div>\n        <p class=\"sec-lead\">全部を先に学ばない。「今のステージで必要なものだけ」を、1回3分で読める量で学ぶ。使わない知識は腐るし、勉強が「動けない」の隠れ蓑になる。順番は現在地に合わせてある。<\/p>\n        <h3>大きな流れ<\/h3>\n        <div class=\"flow\"><span>作る<\/span><i>→<\/i><span>守る<\/span><i>→<\/i><span>増やす（再投資）<\/span><i>→<\/i><span>運用する（投資）<\/span><\/div>\n        <h3>学ぶ順番<\/h3>\n        <ol class=\"steps\">\n          <li data-n=\"0\"><span class=\"st\">お金とは何か <span class=\"badge decided\">済み<\/span><\/span><span class=\"sd\">お金＝価値交換と信用の記録。渇きが止まった時に金が動く（学習シリーズ01）<\/span><\/li>\n          <li data-n=\"1\"><span class=\"st\">ビジネスの管 <span class=\"badge decided\">済み<\/span><\/span><span class=\"sd\">集客 → 興味・信頼 → 販売 → 継続。金は管のどこかで落ちる（道筋ファイル）<\/span><\/li>\n          <li data-n=\"2\"><span class=\"st\">数字の式 <span class=\"badge now\">次の学習<\/span><\/span><span class=\"sd\">売上＝単価×客数×リピート／利益＝売上−経費／粗利／キャッシュフロー（手元に現金が残るか）<\/span><\/li>\n          <li data-n=\"3\"><span class=\"st\">集客と販売の実務<\/span><span class=\"sd\">渇きの種類、オファー（提案の形）、価格の決め方、ファネルの指標の読み方。今の主戦場と直結<\/span><\/li>\n          <li data-n=\"4\"><span class=\"st\">テストと改善<\/span><span class=\"sd\">仮説→小さく試す→数字で判定→当たった型だけ残す。30本検証の考え方そのもの。検証と並行<\/span><\/li>\n          <li data-n=\"5\"><span class=\"st\">守りの実務<\/span><span class=\"sd\">開業届・青色申告・確定申告／著作権／ステマ規制（PR表記）／特商法。最初の収益が出たら<\/span><\/li>\n          <li data-n=\"6\"><span class=\"st\">仕組みの拡大<\/span><span class=\"sd\">ストック化、外注（お金で手を買う）、ライセンス、蛇口の複数化。月10万円が見えたら<\/span><\/li>\n          <li data-n=\"7\"><span class=\"st\">投資・資産運用<\/span><span class=\"sd\">インデックス投資の基本、リスクと複利、詐欺の見分け方。最後（余剰資金ができてから）<\/span><\/li>\n        <\/ol>\n        <h3>なぜ投資が最後なのか<\/h3>\n        <div class=\"note\">\n          <p>投資のリターンは「元本×利率」。元本10万円を年5%で運用しても年5,000円。同じ労力で「月1万円稼ぐ仕組み」を作れば年12万円で、しかも仕組みは育つ。<\/p>\n          <div class=\"flow\"><span>仕組みで元本を作る<\/span><i>→<\/i><span>税金と管理で守る<\/span><i>→<\/i><span>仕組みに再投資して増やす<\/span><i>→<\/i><span>余った分だけ運用する<\/span><\/div>\n          <p>例外として今すぐ必要な投資リテラシーは「守り」だけ：元本保証＋高利回りの話は詐欺、FX・仮想通貨のレバレッジは初心者の入口ではない、という見分け方。<\/p>\n        <\/div>\n        <h3>今は学ばなくていいもの<\/h3>\n        <ul>\n          <li>簿記の細部、法人設立の手続き論（売上が立ってからで間に合う）<\/li>\n          <li>株のチャート分析・短期売買（今のステージでは再現性がない）<\/li>\n          <li>節税テクニック（守るべき利益が出てから）<\/li>\n          <li>広告運用の詳細（集客の型が当たってから）<\/li>\n        <\/ul>\n        <p class=\"firststep\"><strong>最初の一歩：<\/strong>次の学習「数字の式」を読む（学習ファイルは Muse が用意する。読むだけ）<br><strong>時期：<\/strong>今（知識の蓄積だけは受験前から進めてよい）<\/p>",
   "updated_at": "2026-11-20T14:42:01+09:00"
  },

   "title": "ビジネス用語辞典",
   "meta": "計画に出てくる用語と、一般のビジネス用語の定義集（4グループ・50語）",
   "badgeClass": "decided",
   "badgeText": "50語を登録",
   "html": "<div class=\"detail-head\"><h2>ビジネス用語辞典<\/h2><span class=\"badge decided\">50語を登録<\/span><\/div>\n        <p class=\"sec-lead\">この計画の中に出てくる用語と、一般のビジネス用語を集めた辞典。1語＝用語＋短い定義＋（あれば）この計画での位置づけ。<\/p><div class=\"dgroup\"><div class=\"dgroup-h\">売る仕組み<\/div><ul class=\"terms\"><li class=\"term\"><span class=\"tt\">B2B<\/span><span class=\"td\">企業相手に売る商売の形。相手は会社なので、判断は個人の好みより論理と予算で進む。<\/span><span class=\"tm\">図鑑事業の受託はこちら側。<\/span><\/li><li class=\"term\"><span class=\"tt\">B2C<\/span><span class=\"td\">一般の消費者相手に売る形。<\/span><span class=\"tm\">note・BOOTH・物販はこちら側。<\/span><\/li><li class=\"term\"><span class=\"tt\">D2C<\/span><span class=\"td\">メーカーが卸や小売を通さず、自分の店（ネット通販など）で消費者に直接売る形。間の取り分がない代わりに、集客は自分でやる。<\/span><\/li><li class=\"term\"><span class=\"tt\">サブスクリプション<\/span><span class=\"td\">月額など、期間ごとに料金を払い続ける売り方。売る側は収入が積み上がって先が読みやすい。<\/span><span class=\"tm\">noteの定期購読や、将来のアプリ課金の形。<\/span><\/li><li class=\"term\"><span class=\"tt\">フリーミアム<\/span><span class=\"td\">基本は無料で使わせ、有料の追加機能で稼ぐ形。無料の部分が集客の役目をする。<\/span><\/li><li class=\"term\"><span class=\"tt\">プラットフォーム<\/span><span class=\"td\">売る人と買う人が出会う「場」そのものを提供する事業。場の持ち主は手数料で稼ぐ。<\/span><span class=\"tm\">note・BOOTH・メルカリは全部これ。自分は場の上で売る側。<\/span><\/li><li class=\"term\"><span class=\"tt\">マーケットプレイス<\/span><span class=\"td\">売り手と買い手が集まる市場型のプラットフォーム。<\/span><span class=\"tm\">物語のある物のテスト販売先（メルカリ）。<\/span><\/li><li class=\"term\"><span class=\"tt\">フランチャイズ<\/span><span class=\"td\">本部が看板とやり方を貸し、加盟店がロイヤリティを払って商売する仕組み。<\/span><\/li><li class=\"term\"><span class=\"tt\">卸売／小売<\/span><span class=\"td\">卸売は小売店など事業者へまとめて売ること、小売は消費者へ1つずつ売ること。間の差額がそれぞれの取り分になる。<\/span><\/li><li class=\"term\"><span class=\"tt\">フロー収入／ストック収入<\/span><span class=\"td\">フローは働いた分だけ入る一過性の収入、ストックは仕組みや資産から繰り返し入る収入。<\/span><span class=\"tm\">バイト代はフロー。目指すのはストック側。<\/span><\/li><li class=\"term\"><span class=\"tt\">エディション<\/span><span class=\"td\">版画や写真のように、部数を決めて複数制作する作品の売り方。部数と番号が価値の根拠になる。<\/span><span class=\"tm\">価格の階段の段3。<\/span><\/li><li class=\"term\"><span class=\"tt\">ライセンス<\/span><span class=\"td\">作品そのものではなく「使う権利」を貸して対価を得る形。手放さずに何度も稼げる。<\/span><span class=\"tm\">価格の階段の最終段。<\/span><\/li><li class=\"term\"><span class=\"tt\">号単価<\/span><span class=\"td\">日本画などで使われる、号（サイズの単位）あたりの価格。作家の格を表す物差しにもなる。<\/span><span class=\"tm\">原画価格の目安の置き方。<\/span><\/li><\/ul><\/div><div class=\"dgroup\"><div class=\"dgroup-h\">お金の数字<\/div><ul class=\"terms\"><li class=\"term\"><span class=\"tt\">粗利<\/span><span class=\"td\">売上から原価を引いた残り。商売の土台の儲けで、ここから人件費や家賃などを払う。<\/span><\/li><li class=\"term\"><span class=\"tt\">原価<\/span><span class=\"td\">商品や作品を作る・仕入れるのに直接かかった費用。画材代や印刷代など。<\/span><\/li><li class=\"term\"><span class=\"tt\">固定費／変動費<\/span><span class=\"td\">固定費は売上に関係なく毎月かかる費用（家賃など）、変動費は売れるほど増える費用（材料費など）。<\/span><\/li><li class=\"term\"><span class=\"tt\">営業利益<\/span><span class=\"td\">本業の儲け。粗利から、売るため・管理のためにかかる費用を引いたもの。<\/span><\/li><li class=\"term\"><span class=\"tt\">経常利益<\/span><span class=\"td\">営業利益に本業以外の損益（利息など）を足し引きした、会社の普段の実力。<\/span><\/li><li class=\"term\"><span class=\"tt\">純利益<\/span><span class=\"td\">税金など全部を引いた後に残る、最終の儲け。<\/span><\/li><li class=\"term\"><span class=\"tt\">キャッシュフロー<\/span><span class=\"td\">実際のお金の出入り。利益が出ていても現金が尽きれば商売は止まるので、利益とは別に見る。<\/span><\/li><li class=\"term\"><span class=\"tt\">運転資金<\/span><span class=\"td\">商売を回し続けるために手元に必要なお金。在庫や経費を先に払うための分。<\/span><\/li><li class=\"term\"><span class=\"tt\">損益分岐点<\/span><span class=\"td\">売上がちょうど費用と等しくなり、儲けがゼロになる地点。ここを超えると黒字。<\/span><\/li><li class=\"term\"><span class=\"tt\">ROI（投資回収）<\/span><span class=\"td\">投資で得た利益÷かけた費用。お金や時間の使い方が良かったかを比べる物差し。<\/span><span class=\"tm\">テストの撤退判断にも使う。<\/span><\/li><li class=\"term\"><span class=\"tt\">EPC<\/span><span class=\"td\">アフィリエイトで、1クリックあたりの平均収益（総報酬÷クリック数）。記事や媒体の効率を比べる物差し。<\/span><span class=\"tm\">候補4の数字の見方。<\/span><\/li><li class=\"term\"><span class=\"tt\">CAC（顧客獲得コスト）<\/span><span class=\"td\">顧客1人を得るのにかける費用。広告費や紹介料がこれにあたる。<\/span><\/li><li class=\"term\"><span class=\"tt\">LTV（顧客生涯価値）<\/span><span class=\"td\">顧客1人が取引の全期間で払う合計額。CACより大きければ商売が回る。<\/span><span class=\"tm\">Semrushが1件$200を払える理由。<\/span><\/li><li class=\"term\"><span class=\"tt\">ロイヤリティ<\/span><span class=\"td\">権利や看板を使わせる対価として受け取る使用料。売上などの一定割合で払われることが多い。<\/span><span class=\"tm\">ライセンス収入の受け取り方の一つ。<\/span><\/li><\/ul><\/div><div class=\"dgroup\"><div class=\"dgroup-h\">会社と取引<\/div><ul class=\"terms\"><li class=\"term\"><span class=\"tt\">M&amp;A<\/span><span class=\"td\">会社や事業の売買。買う側は時間と実績を買い、売る側は出口（現金化）になる。<\/span><\/li><li class=\"term\"><span class=\"tt\">IPO（新規公開株）<\/span><span class=\"td\">会社が株式を証券取引所に上場し、誰でも株を買えるようにすること。大きな資金調達と信用につながる。<\/span><\/li><li class=\"term\"><span class=\"tt\">資金調達<\/span><span class=\"td\">事業に必要なお金を外部から集めること。借入、出資（株を渡す）、補助金などの形がある。<\/span><\/li><li class=\"term\"><span class=\"tt\">ベンチャーキャピタル<\/span><span class=\"td\">成長しそうな未上場企業に出資する専門の投資会社。将来の大きな値上がりで回収する。<\/span><\/li><li class=\"term\"><span class=\"tt\">エンジェル投資家<\/span><span class=\"td\">創業初期の小さな会社に、個人のお金で出資する投資家。<\/span><\/li><li class=\"term\"><span class=\"tt\">バリュエーション（企業価値評価）<\/span><span class=\"td\">会社全体の値段の見積もり。資金調達やM&amp;Aの交渉の土台になる。<\/span><\/li><li class=\"term\"><span class=\"tt\">デューデリジェンス<\/span><span class=\"td\">買収や出資の前に、相手の財務・法務・事業を詳しく調べること。値段とリスクの確認作業。<\/span><\/li><li class=\"term\"><span class=\"tt\">シナジー<\/span><span class=\"td\">2つの事業が合わさることで、単独の合計を超える効果が出ること。<\/span><\/li><li class=\"term\"><span class=\"tt\">子会社・持株会社<\/span><span class=\"td\">子会社は他社に経営を支配されている会社、持株会社は他社の株を持つことでグループ全体を支配する会社。<\/span><\/li><\/ul><\/div><div class=\"dgroup\"><div class=\"dgroup-h\">集客と商品<\/div><ul class=\"terms\"><li class=\"term\"><span class=\"tt\">アフィリエイト<\/span><span class=\"td\">成果報酬型の広告。紹介した商品が売れたら紹介料が入る。<\/span><span class=\"tm\">テスト候補4の本体。<\/span><\/li><li class=\"term\"><span class=\"tt\">ASP<\/span><span class=\"td\">広告主と媒体の間に入り、計測・集計・支払いを代行する仲介会社。日本ではA8.netなど、海外ではImpactなど。<\/span><\/li><li class=\"term\"><span class=\"tt\">成果承認と否認<\/span><span class=\"td\">発生した成果を広告主が認めれば承認（報酬が確定）、キャンセルや規約違反などで認めなければ否認（報酬なし）。画面の発生額は確定収入ではない。<\/span><\/li><li class=\"term\"><span class=\"tt\">クッキー期間<\/span><span class=\"td\">読者がリンクを踏んでから、その期間内に買えば紹介者の成果になる計測の有効期間。プログラムごとに数日から120日超まで差がある。<\/span><\/li><li class=\"term\"><span class=\"tt\">ラストクリック<\/span><span class=\"td\">複数の紹介リンクを踏んだ場合、最後に踏んだリンクの媒体に成果が付く方式。購入直前に別の媒体に踏まれると成果を取られる。<\/span><\/li><li class=\"term\"><span class=\"tt\">ステマ規制<\/span><span class=\"td\">広告なのに広告と分からない宣伝を禁じる日本の規制（景品表示法、2023年10月施行）。アフィリエイト記事には「広告」「PR」の表示が要る。<\/span><span class=\"tm\">候補4とSNS運用の禁止ライン。<\/span><\/li><li class=\"term\"><span class=\"tt\">E-E-A-T<\/span><span class=\"td\">Googleがコンテンツの信頼性を測る考え方。経験・専門性・権威性・信頼性の頭文字。実際に使った経験と情報の正確さが問われる。<\/span><\/li><li class=\"term\"><span class=\"tt\">ブルーオーシャン<\/span><span class=\"td\">競争相手のいない未開拓の市場。逆に競争の激しい市場はレッドオーシャン。<\/span><span class=\"tm\">物差し②「取った位置が資産になるか」とセットで見る。<\/span><\/li><li class=\"term\"><span class=\"tt\">集客<\/span><span class=\"td\">お客さんを連れてくること全般。<\/span><span class=\"tm\">主にSNSや検索からの流入を指す。<\/span><\/li><li class=\"term\"><span class=\"tt\">コンバージョン<\/span><span class=\"td\">サイトや記事に来た人が、購入・申込など狙った行動をすること。その割合がコンバージョン率。<\/span><\/li><li class=\"term\"><span class=\"tt\">痛み止め／ビタミン<\/span><span class=\"td\">痛み止めは「今の困りごとを消す」商品で買われやすく、ビタミンは「あったら良い」商品で買われにくい、という商品の性格の例え。<\/span><span class=\"tm\">テスト候補を選ぶ時の物差し。<\/span><\/li><li class=\"term\"><span class=\"tt\">ブランディング<\/span><span class=\"td\">作り手や商品の「らしさ」を人の頭の中に作り、選ばれる理由にすること。<\/span><\/li><li class=\"term\"><span class=\"tt\">マーケティング<\/span><span class=\"td\">売れる仕組みづくり全体のこと。集客・価格・見せ方・届け方を含む広い言葉。<\/span><\/li><li class=\"term\"><span class=\"tt\">クラウドファンディング<\/span><span class=\"td\">ネットで不特定多数から少しずつ資金を集める方法。支援＝予約購入の形が多く、需要の確認にも使える。<\/span><\/li><\/ul><\/div><div class=\"firststep\"><span class=\"fs-k\">最初の一歩<\/span>分からない言葉に出会ったら、まずここで引く<span class=\"fs-sep\">／<\/span><span class=\"fs-k\">時期<\/span>随時（新しい用語は都度追加する）<\/div><div class=\"src\">出典：アプリ内の既存の記述と学習資料（アフィリエイトの仕組み／個人アートビジネス全体設計）をもとに作成（2026-11-20）<\/div>",

   "html": "<div class=\"detail-head\"><h2>アートビジネス計画<\/h2><span class=\"badge decided\">設計済み<\/span><\/div>\n        <p class=\"sec-lead\">天才の偶然売れではなく、計画的にいく。ただし計画は表に見せない——表に出るのは作品と物語だけ。<\/p>\n        <h3>設計原則（4つ）<\/h3>\n        <ol class=\"rules\">\n          <li><strong>計画は裏、表は作品と物語だけ<\/strong>——計算・検証・価格の設計は裏側に置く。名前を守る構造でもある<\/li>\n          <li><strong>関係は柔らかく、条件は硬く<\/strong>——値段・エディション数・権利の条件は先に固定し、その場の交渉に性格を持ち込まない<\/li>\n          <li><strong>視覚言語の同一性<\/strong>——集客の動画も、売る物も、本命の絵画も、同じモチーフ・同じ世界で通す<\/li>\n          <li><strong>reveal-ready<\/strong>——原画・日付・制作記録を残し、将来本名に接続できる来歴を最初から作る<\/li>\n        <\/ol>\n        <h3>ビジネスの管（6つの部品）<\/h3>\n        <div class=\"flow\"><span>制作<\/span><i>→<\/i><span>提示<\/span><i>→<\/i><span>取引<\/span><i>→<\/i><span>記録・認証<\/span><i>→<\/i><span>評価<\/span><i>→<\/i><span>次の制作<\/span><\/div>\n        <p>「作品を作って売る」だけでは金にならない。管のどれが欠けても止まる。いまの不足は <strong>3・4・5<\/strong> で、ここがビジネスの実体部分。<\/p>\n        <ul class=\"parts\">\n          <li><span class=\"pn\">1<\/span><div class=\"pb\"><span class=\"pt\">作品（質）<\/span><span class=\"pd\">個人でしか生み出せない質の高いもの。全ての前提<\/span><\/div><span class=\"status\">制作中<\/span><\/li>\n          <li><span class=\"pn\">2<\/span><div class=\"pb\"><span class=\"pt\">物語<\/span><span class=\"pd\">作家と世界の物語。買い手は絵と一緒に物語を買う<\/span><\/div><span class=\"status\">設計中（顔のない男）<\/span><\/li>\n          <li><span class=\"pn\">3<\/span><div class=\"pb\"><span class=\"pt\">価格の階段<\/span><span class=\"pd\">「買える層」の設計。高額一点だけでは取引が発生しない<\/span><\/div><span class=\"status gap\">未設計<\/span><\/li>\n          <li><span class=\"pn\">4<\/span><div class=\"pb\"><span class=\"pt\">最初の買い手<\/span><span class=\"pd\">「市場」ではなく具体的な少数。SNSの蓄積＋身近な評価者<\/span><\/div><span class=\"status gap\">未着手<\/span><\/li>\n          <li><span class=\"pn\">5<\/span><div class=\"pb\"><span class=\"pt\">記録・認証<\/span><span class=\"pd\">エディション番号、制作年、原画データ、販売記録。来歴が将来の価格の土台になる<\/span><\/div><span class=\"status gap\">仕組み化が課題<\/span><\/li>\n          <li><span class=\"pn\">6<\/span><div class=\"pb\"><span class=\"pt\">見せる場と頻度<\/span><span class=\"pd\">作品が人の目に触れる回数と場所。質×露出でしか評価は生まれない<\/span><\/div><span class=\"status\">TikTok設計中<\/span><\/li>\n        <\/ul>\n        <p class=\"firststep\"><strong>最初の一歩：<\/strong>不足している3つ（価格の階段・最初の買い手・記録と認証）のうち、まず記録の型をフェーズ0で決める。残り2つはフェーズ1で作る<br><strong>時期：<\/strong>記録の型は今（フェーズ0）。価格の階段と最初の買い手は受験後（フェーズ1）<\/p>\n        <h3>価格の階段<\/h3>\n        <p>一点ものの高額作品だけを置くと、欲しい人の99%が買えずに去る。階段を作ると、各段が次の段の買い手を育てる。<strong>原則：値段は下げない。<\/strong>下の段を増やして買える人を増やすのであって、同じ物の値段を割って売らない。<\/p>\n        <div class=\"pstairs\">\n          <div class=\"ps-row\" style=\"--i:0\"><span class=\"ps-n\">段0<\/span><span class=\"ps-price\">無料<\/span><span class=\"ps-b\"><span class=\"ps-f\">動画・投稿（世界観の提示）<\/span><span class=\"ps-r\">集客と物語の蓄積<\/span><\/span><\/div>\n          <div class=\"ps-row\" style=\"--i:1\"><span class=\"ps-n\">段1<\/span><span class=\"ps-price\">数百〜数千円<\/span><span class=\"ps-b\"><span class=\"ps-f\">デジタル素材、描き文字、小プリント<\/span><span class=\"ps-r\">最初の取引。買う体験を作る<\/span><\/span><\/div>\n          <div class=\"ps-row\" style=\"--i:2\"><span class=\"ps-n\">段2<\/span><span class=\"ps-price\">1万〜5万円<\/span><span class=\"ps-b\"><span class=\"ps-f\">エディション作品（番号・記録つき）<\/span><span class=\"ps-r\">本命の入口。来歴が始まる<\/span><\/span><\/div>\n          <div class=\"ps-row\" style=\"--i:3\"><span class=\"ps-n\">段3<\/span><span class=\"ps-price\">10万円〜<\/span><span class=\"ps-b\"><span class=\"ps-f\">原画、大判エディション<\/span><span class=\"ps-r\">評価と価格の頂点。供給は絞る<\/span><\/span><\/div>\n          <div class=\"ps-row\" style=\"--i:4\"><span class=\"ps-n\">段4<\/span><span class=\"ps-price\">契約<\/span><span class=\"ps-b\"><span class=\"ps-f\">ライセンス（グッズ・コラボ）<\/span><span class=\"ps-r\">自分の手を離れて回る層。権利は渡さず貸す<\/span><\/span><\/div>\n        <\/div>\n        <p class=\"firststep\"><strong>最初の一歩：<\/strong>段1の品目を1つ決め、既存のドローイングからエディションにする1点を選ぶ<br><strong>時期：<\/strong>受験後（フェーズ1と並行）<\/p>\n        <h3>フェーズ<\/h3>\n        <ol class=\"steps\">\n          <li data-n=\"0\"><span class=\"st\">土台（今ここ）<\/span><span class=\"sd\">制作ラインを維持する（受験制作がそのまま作品蓄積になる）。世界観と視覚言語を1つに絞る。記録の型を決める：作品ごとに原画ファイル／制作日／タイトル／技法を残す。<\/span>\n<p class=\"firststep\"><strong>最初の一歩：<\/strong>記録の型を1枚に決めて、次に仕上がる作品からその型で残し始める<br><strong>時期：<\/strong>今すぐ（受験制作と一体で進める）<\/p><\/li>\n          <li data-n=\"1\"><span class=\"st\">提示と最初の取引<\/span><span class=\"sd\">投稿001（v3）を出し、30本検証で「提示の型」を1つ当てる。並行して既存ドローイングからエディション1点をBOOTHに受注生産で出す。<\/span><span class=\"done-when\">最初の1件の取引（金額は問わない）と、提示の型の当たり1つ<\/span>\n<p class=\"firststep\"><strong>最初の一歩：<\/strong>投稿001（v3）のカットを Kling で生成・選別する（未決・保留にもある、本人の作業待ちの続き）<br><strong>時期：<\/strong>受験後（2027年3月以降）<\/p><\/li>\n          <li data-n=\"2\"><span class=\"st\">階段を組む<\/span><span class=\"sd\">当たった型を連載化し、フォロワーの蓄積を始める。エディションの点数を増やし段2を常設にする。売上の実績に応じてバイトを段階的に減らす。<\/span><span class=\"done-when\">月10万円の売上ラインが見えること<\/span>\n<p class=\"firststep\"><strong>最初の一歩：<\/strong>フェーズ1で当たった型の2本目を出す<br><strong>時期：<\/strong>フェーズ1が終わってから<\/p><\/li>\n          <li data-n=\"3\"><span class=\"st\">権利の層<\/span><span class=\"sd\">ライセンス・コラボの打診を受ける側に立つ（自分から売り込まない。条件はこちらが決める）。原画の価格帯を上げる。供給は絞ったまま。<\/span><span class=\"done-when\">年600万円ペース（第1チェックポイント）<\/span>\n<p class=\"firststep\"><strong>最初の一歩：<\/strong>ライセンスの条件（権利は渡さず貸す、条件はこちらが決める）を1枚に書き出す<br><strong>時期：<\/strong>フェーズ2で売上の実績が立ってから<\/p><\/li>\n        <\/ol>\n        <h3>現実の数字<\/h3>\n        <div class=\"stats\">\n          <div class=\"stat\"><div class=\"v\">4,000〜5,000<small>円\/号<\/small><\/div><div class=\"k\">号単価（学生・無名）。実績が積めれば8,000〜15,000円\/号<\/div><\/div>\n          <div class=\"stat\"><div class=\"v\">50 : 50<\/div><div class=\"k\">画廊委託の標準的な取り分<\/div><\/div>\n          <div class=\"stat\"><div class=\"v\">約239<small>万円<\/small><\/div><div class=\"k\">美術家の平均年収。半数が200万円未満<\/div><\/div>\n          <div class=\"stat\"><div class=\"v\">上限360<small>万円<\/small><\/div><div class=\"k\">ポーラの在外研修助成。募集は毎年10〜11月<\/div><\/div>\n        <\/div>\n        <p>数字が示す標準形は「安定した枠 ＋ 作品販売 ＋ 公募・助成」の複合。作品販売一本では立たない。<\/p>\n        <h3>画家の集客の実態<\/h3>\n        <ul>\n          <li>決定的なのはフォロワー数ではなく、<strong>一貫した作風の継続投稿<\/strong>と、著名な作家・コレクターの購入と推薦による<strong>信用の橋渡し<\/strong><\/li>\n          <li>SNSは発見と身辺調査の道具。価格は非公開・問い合わせ制が原則で、直販は入口に限定する<\/li>\n          <li>失敗側の教訓：投機バブルは崩壊した（若手市場は2021年比で約3分の1に縮小）<\/li>\n        <\/ul>\n        <h3>時間の設計<\/h3>\n        <ul>\n          <li><strong>制作と集客を分けない<\/strong>。制作過程そのものが集客素材になる<\/li>\n          <li>販売は受注生産＋プラットフォームに寄せ、在庫・発送・交渉の時間を消す<\/li>\n          <li>運営時間に上限を置く。順番は制作 → 運営。制作時間が残り物にならないようにする<\/li>\n          <li>Phase 2で売上が立つまで、事業に生活費を背負わせない（焦りが作風と価格を壊すため）<\/li>\n        <\/ul>",
   "updated_at": "2026-11-20T14:42:01+09:00"
  },
