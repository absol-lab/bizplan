   "html": "<div class=\"detail-head\"><h2>make.fun</h2></div>\n        <div class=\"card\">\n          <h3>AIバウンティ（make.fun） <span class=\"badge pending\">テスト枠</span></h3>\n          <p>AIエージェント向けのコーディングバウンティ（懸賞案件）の基盤。集客が要らず、<strong>AIの労働力そのものが商品になる</strong>経路で、本人の作業はスマホでの承認と確認だけになる。ただし性質は「仕組み」ではなく「懸賞」で、賞金は上位の数件だけが取る。本命ルートにはならない。</p>\n          <ul>\n            <li><strong>置き場所</strong>：テスト枠。目的は種銭の獲得と、「AIに仕事を取らせて報酬を得る」実地ノウハウ。並行は最大3件まで、期間と撤退ラインを先に決める</li>\n            <li><strong>正直な留保</strong>：参加者の大半は何も得ない構造。実例として、$500の案件に参加エージェント8,138という表示もあった（2026-11-17のスクリーンショット）。平均参加者の期待値で測る仕事ではない</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>仕組み</h3>\n          <div class=\"flow\"><span>案件を探す</span><i>→</i><span>エージェントが作る</span><i>→</i><span>提出（コード＋制作記録）</span><i>→</i><span>自動チェックと採点</span><i>→</i><span>上位がUSDCを受け取る</span></div>\n          <ul>\n            <li><strong>運営と形</strong>：運営はEZO Labs Inc.。案件はコーディング課題で、カテゴリは Trading／Forecasting／Security／Automation／Growth／Games／Code（公式）。課題ごとに「測り方（指標）」と締切と順位ごとの賞金が公開される</li>\n            <li><strong>賞金は先にロックされる</strong>：案件が開く時点で、賞金総額はSolana上のエスクロー（預かり口座）に全額ロックされる。払う側の都合で消える形ではなく、入賞すれば請求で自分のウォレットに移る。初期の一部案件はエスクローではなく運営の報酬ウォレットから支払われ、その場合は案件ページに明記される</li>\n            <li><strong>参加費</strong>：大半の案件は無料。有料の案件はページに明記され、手数料は賞金側に組み込まれる（実例：フロントエンドの案件で $0.50）</li>\n            <li><strong>エージェント前提の設計</strong>：参加はエージェント自身のSolanaキーペアでサインインし、APIキーで操作する。案件探しはAPI／MCPサーバー／skill.md（公式の手順書ファイル）から行える</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>採点のされ方</h3>\n          <ul>\n            <li><strong>人の審査ではなく、指標による自動採点</strong>：採点は公開された指標（メトリック）に基づき、サンドボックスが全エントリーを同じ条件で2回実行して測る。「審査が『質』の案件」という言い方は、正確には「指標が出来栄えの質を測る案件」と読み替えるのが実態に合う</li>\n            <li><strong>順位の決まり方</strong>：開催中の順位は暫定で、他者との相対比較ではなく固定の基準との比較で付く。締切後に最終ラウンドがあり、結果と支払いリストがエスクローに掲示され、異議申立ての期間（チャレンジウィンドウ。誰でも採点を再実行して争える）を経て確定する</li>\n            <li><strong>提出の必須条件</strong>：コードは公開リポジトリ（1コミット）で出し、それを作った制作セッションの記録（トランスクリプト）を一緒に提出する。記録は「自分のエージェントが作ったこと」の証明で、自動チェックが記録の真正性とコードとの一致を確認する。記録のない提出は不受理（2026-11-17以降の提出分から、公式）</li>\n            <li><strong>落ちても直せる</strong>：チェックに落ちた提出は採点されないが、締切までなら直して再提出できる。締切の余裕が実務上の安全弁になる</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>案件の選び方</h3>\n          <ul>\n            <li><strong>賞金 ÷ 参加者数</strong>：まず母数を見る。2026-11-17のスクリーンショットでは、$500のチェスエンジン案件に参加8,138、無料モデル集約の案件に6,266が集まる一方、「最高のフロントエンドを構築する」$545の案件は参加31だった。同じ賞金額でも、勝ち筋の濃さは母数で桁が違う</li>\n            <li><strong>指標が自分の強みを測るか</strong>：採点は指標への最適化勝負。指標が明確で、コーディングやフロントエンドの出来栄え——Museの主戦場——を測る案件を選ぶ。指標が運や速度だけの案件は避ける</li>\n            <li><strong>締切に余裕があること</strong>：チェック不合格→修正→再提出の往復を前提に、締切まで余裕のある案件を優先する</li>\n            <li><strong>規律</strong>：並行は最大3件まで。始める前に期間と撤退ラインを決め、外れたら記録して次へ行く</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>受け取りと実務</h3>\n          <ul>\n            <li><strong>受け取りの形</strong>：報酬はUSDC（ドル連動のステーブルコイン）で、自分のSolanaウォレットへ。請求には期限があり（確定から少なくとも7日間の請求期間が公式に示されている）、支払い前に自動の制裁スクリーニングが入る。税務書類が求められるのは米国の法律で必要な場合だけ、と公式は説明している</li>\n            <li><strong>後で来る手間</strong>：USDCから円への換金と、日本での税務（クリプトの利益は原則として雑所得）が後段に来る。受け取り側の口座・取引所の用意は、初入賞の前ではなく「最初の1件を回す」段階で確認すれば足りる</li>\n            <li><strong>こちらの設定状態</strong>：ウォレットとAPI資格情報は設定済み（別チャットで実施）。スキルは v1.5.172、APIキーの期限は2026-12-15。期限が切れていれば、再発行が最初の一手になる</li>\n            <li><strong>基盤の規模（公式ページの表示・2026-11-20確認）</strong>：2026-11-09の運用開始から、支払総額 $14,810.74／970アカウント、エスクロー残高 $13,970.80／46案件。まだ小さい基盤で、数字は動き続ける前提で読む</li>\n            <li><strong>未確認</strong>：実際の応募・提出・請求はまだ1件も回していない。所要時間、詰まりどころ、請求の実際の流れは未確認で、最初の1件は「勝つ」ことより「一周回して実地の記録を取る」ことが目的になる</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>損なうパターン</h3>\n          <ul>\n            <li><strong>賞金は上位だけ</strong>：順位に入らなければ、作業はすべて無報酬。参加者が数千集まる案件では、構造的に大半が外れる</li>\n            <li><strong>指標の読み違い</strong>：出来栄えの良さと、指標が測るものがずれると勝てない。作る前に指標と要件を読むことが、そのまま勝率になる</li>\n            <li><strong>記録の不備で不受理</strong>：セッション記録が要件を満たさない提出は、出来にかかわらず採点されない</li>\n            <li><strong>時間の溶け方</strong>：再提出の往復と締切管理に時間が溶ける。期間と撤退ラインを先に決めるのは、この損を上限で切るため</li>\n            <li><strong>基盤自体の新しさ</strong>：運用開始から日が浅く、ルール（記録の必須化など）も動いている。条件は応募のたびに公式で確認する</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>評価の物差しでの位置づけ</h3>\n          <ul>\n            <li><strong>物差し1・上位が自分の強みで取れるか</strong>：コーディングとフロントエンドはClaudeの主戦場で、指標が出来栄えを測る案件なら、取れる側に立つ構造はある。平均参加者の期待値ではなく、この一点で評価する（2026-11-17に本人が訂正した物差し）</li>\n            <li><strong>物差し2・取った位置が資産として残るか</strong>：残らない。懸賞は毎回ゼロからで、搾り取る位置（基盤そのもの）はプラットフォーム側が保持する。「椅子が残らない上位」——種銭を取りに行く傭兵仕事であり、実績が単価や次の仕事に化けるかも未検証</li>\n            <li><strong>結論としての置き方</strong>：本命（自分のアプリ・作品・IP＝椅子が残る上位）とは分けて、テスト枠で小さく回す。得るものは種銭と、「AI労働で報酬を得る」実地の記録</li>\n          </ul>\n          <p class=\"sources\">きっかけ・出典：本人が送った make.fun のスクリーンショット（2026-11-17。案件の数字は当時の表示）。本文の仕組みは make.fun 公式サイトと公式ガイド（How it works／How AI agents earn money、2026-11-20確認）に拠る</p>\n        </div>\n        <div class=\"card\">\n          <h3>初歩段階</h3>\n          <p><strong>初歩段階のゴール：</strong>最初の応募1件が、提出済みの状態になっていること。この1件の目的は勝つことではなく、応募→提出→（落ちれば）再提出→確定までを一周回して、実地の記録を取ること。</p>\n          <p><strong>必要なもの</strong></p>\n          <ul>\n            <li><strong>セットアップ済みの基盤</strong>：ウォレットとAPI資格情報は設定済み。スキルは v1.5.172。APIキーの期限は2026-12-15で、開始時点で切れていれば再発行が最初の一手になる</li>\n            <li><strong>公開リポジトリの置き場所</strong>：提出は公開リポジトリ（1コミット）が必須条件になる</li>\n            <li><strong>費用</strong>：大半の案件は参加無料。有料の案件はページに明記されるので、初歩段階では無料の案件を選ぶ</li>\n          </ul>\n          <p><strong>手順</strong></p>\n          <ol class=\"steps\">\n            <li data-n=\"1\"><span class=\"st\">公式ガイドで現在の手順を確認する</span><span class=\"sd\">実際の応募・提出・請求はまだ1件も回しておらず、手順の細部は未確認。ルール（記録の必須化など）も動いているため、始める前に公式ガイド（How it works／How AI agents earn money）と skill.md で、提出条件と請求の流れを最新で確認する</span><span class=\"done-when\">終わりの目安：提出に必要なもの（リポジトリとセッション記録）と、請求までの流れが言える</span></li>\n            <li data-n=\"2\"><span class=\"st\">APIキーの状態を確認する</span><span class=\"sd\">期限（2026-12-15）を過ぎていれば再発行する。サインインはSolanaのキーペアで行う</span><span class=\"done-when\">終わりの目安：APIで案件一覧が引ける</span></li>\n            <li data-n=\"3\"><span class=\"st\">案件を1件選ぶ</span><span class=\"sd\">「案件の選び方」の物差しで選ぶ——賞金÷参加者数の母数、指標がコーディングやフロントエンドの出来栄え（Museの主戦場）を測るか、締切に余裕があるか。並行は最大3件まで、期間と撤退ラインを先に決める</span><span class=\"done-when\">終わりの目安：応募する案件が1件決まり、指標と締切を把握している</span></li>\n            <li data-n=\"4\"><span class=\"st\">記録が残る形で作る</span><span class=\"sd\">公開リポジトリで制作し、制作セッションの記録（トランスクリプト）が提出物の一部になる形を保つ。キットのローカル採点（grade-local）がある案件では、先に自己採点する</span><span class=\"done-when\">終わりの目安：成果物とセッション記録が揃い、自己採点で致命的な落ち目がない</span></li>\n            <li data-n=\"5\"><span class=\"st\">提出する</span><span class=\"sd\">リポジトリ（1コミット）とセッション記録を束ねて提出する</span><span class=\"done-when\">終わりの目安：提出ステータスが「提出済み」になっている</span></li>\n            <li data-n=\"6\"><span class=\"st\">状態を見て、落ちたら直す</span><span class=\"sd\">チェックに落ちた提出は採点されないが、締切までなら直して再提出できる。確定（チャレンジウィンドウの経過後）までを見届け、入賞したら請求期間内に claim する</span><span class=\"done-when\">終わりの目安：結果が確定し、一周の記録（かかった時間・詰まった場所）が残っている</span></li>\n          </ol>\n          <p><strong>つまずきどころ</strong></p>\n          <ul>\n            <li><strong>記録の不備で不受理</strong>：セッション記録が要件を満たさない提出は、出来にかかわらず採点されない（2026-11-17以降の提出分から必須）</li>\n            <li><strong>指標の読み違い</strong>：出来栄えの良さと、指標が測るものがずれると勝てない。作る前に指標と要件を読むことが、そのまま勝率になる</li>\n            <li><strong>締切間際の提出</strong>：再提出の往復が前提の仕組みなので、余裕のない日程はそのまま損になる</li>\n            <li><strong>APIキーの期限切れ</strong>：開始時点で切れている可能性が高い（期限2026-12-15）。手順2で先に潰す</li>\n          </ul>\n          <p><strong>時期：</strong>受験後（2027年3月以降）</p>\n        </div>",

   "html": "<div class=\"detail-head\"><h2>有料note</h2></div>\n        <div class=\"card\">\n          <h3>有料note（AIパイプライン） <span class=\"badge pending\">テスト枠</span></h3>\n          <p>「AIパイプライン」の工程（リサーチ→売れる構成→有料本編→集客ポスト）を1周回して、有料noteを1本作って売るテスト。狙いは金額ではなく、<strong>工程そのものが回るか</strong>と<strong>題材が売れるか</strong>を分けて判定すること。工程の本体は「AIパイプライン」セクションに体系として置いてある。</p>\n          <ul>\n            <li><strong>置き場所</strong>：テスト枠の候補（決定ではない）。実践は受験後</li>\n            <li><strong>海外向けデジタル商品との関係</strong>：海外向けデジタル商品と同じ「デジタル商品」系。ただしこちらは国内のnoteで、売り場と言語の重さを外して、まず工程を検証する順序。工程が回ると確認できたら、同じ鎖を海外向けデジタル商品（英語圏・Gumroad）にも使い回せる</li>\n            <li><strong>正直な留保</strong>：きっかけになった投稿の収益主張は裏付けがないため採っていない。残すのは工程と、判定の仕組みだけ</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>仕組みと進め方</h3>\n          <div class=\"flow\"><span>題材を決める</span><i>→</i><span>工程を1周回す</span><i>→</i><span>公開・販売</span><i>→</i><span>数字で判定</span></div>\n          <p>進め方の要約は上の流れ図。実行の詳しい手順は、次の「初歩段階」に置いた。</p>\n        </div>\n        <div class=\"card\">\n          <h3>初歩段階</h3>\n          <p><strong>初歩段階のゴール：</strong>有料noteが1本、販売中の状態で公開されていて、集客ポストがXに出ていること。工程を1周回し切った記録が残ることも、売上の有無と同じくらいこのテストの成果になる。</p>\n          <p><strong>必要なもの</strong></p>\n          <ul>\n            <li><strong>noteのアカウント</strong>：販売の場。有料記事の手取りは価格の約85%（1,000円で約855円。振込の時に270円が別にかかる）</li>\n            <li><strong>題材の材料</strong>：自分の実録・数字・一次情報。材料の質がそのまま本文の質になる（AIパイプラインの工程3）</li>\n            <li><strong>集客の場</strong>：Xのアカウント（集客ポストを出す場所）</li>\n            <li><strong>費用</strong>：0円で始められる</li>\n          </ul>\n          <p><strong>手順</strong></p>\n          <ol class=\"steps\">\n            <li data-n=\"1\"><span class=\"st\">題材を1つ決める</span><span class=\"sd\">本人が本物の材料を持つ題材から選ぶ（例：アプリ制作の実録、受験勉強の仕組み化）。ここは工程の外の判断で、決定は本人</span><span class=\"done-when\">終わりの目安：題材が1つに決まり、「誰の・どんな渇きに・何を渡すか」が言える</span></li>\n            <li data-n=\"2\"><span class=\"st\">工程1 リサーチ</span><span class=\"sd\">noteで実際に売れている同種の商品と価格帯、買う人の言葉を実物で確かめる。需要の証拠は「実際に売れている物」であって、言及数や盛り上がりではない</span><span class=\"done-when\">終わりの目安：同種の販売実例と価格帯が挙げられる</span></li>\n            <li data-n=\"3\"><span class=\"st\">工程2 構成</span><span class=\"sd\">目次と、無料部分と有料部分の境目を決める。物差しは痛み止めになっているか（今困っている人に刺さるか。漠然と良いもの＝ビタミンでは買われない）。無料部分で価値が伝わり、有料部分に「続きを買う理由」がある形にする。価格の案もここで置く</span><span class=\"done-when\">終わりの目安：目次・境目・価格が決まっている</span></li>\n            <li data-n=\"4\"><span class=\"st\">工程3 本編</span><span class=\"sd\">構成に沿って本文を作る。AIの下書きに、自分の経験と数字を入れて置き換えていく。一般論の水増しになっている部分は、自分の材料で潰す。数字には出典を付ける</span><span class=\"done-when\">終わりの目安：本文が完成し、自分の材料が入っている</span></li>\n            <li data-n=\"5\"><span class=\"st\">価格を付けて公開する</span><span class=\"sd\">noteで有料記事として販売を開始する。手取りの計算（価格の約85%）を踏まえて価格を置く</span><span class=\"done-when\">終わりの目安：販売中の状態で公開されている</span></li>\n            <li data-n=\"6\"><span class=\"st\">工程4 集客ポスト</span><span class=\"sd\">本編の要点と、リサーチで拾った読者の言葉から告知文を作り、Xに出す。自分の声と実体験の一文を入れ、誇張を落とす。宣伝の文面ではなく「読み手の渇きへの一言」になっているかを見る。最初の読者は手で連れてくる</span><span class=\"done-when\">終わりの目安：集客ポストが公開されている</span></li>\n            <li data-n=\"7\"><span class=\"st\">記録して判定する</span><span class=\"sd\">詰まった工程と、AIの出力が薄かった場所を記録する。一定期間（目安は30日）の販売数と、工程にかかった時間を見て、「判定の物差し」で工程と題材を切り分ける</span><span class=\"done-when\">終わりの目安：一周の記録が残り、続ける／題材を変えるの判断材料が揃う</span></li>\n          </ol>\n          <p><strong>つまずきどころ</strong></p>\n          <ul>\n            <li><strong>題材が薄い</strong>：材料の本物さが差になる。一般論だけの題材は、工程を回しても薄い物しか出てこない</li>\n            <li><strong>無料と有料の境目を間違える</strong>：無料部分で価値を出し切ると買う理由が消え、隠しすぎると価値が伝わらない。境目は工程2で先に決める</li>\n            <li><strong>全自動のまま出す</strong>：確認点（構成と本編の2か所）を飛ばすと、薄さと誇張がそのまま表に出る。自動化するのは手であって、目ではない</li>\n            <li><strong>公開して終わる</strong>：最初の読者は工程では来ない。集客ポストまでが1周になる</li>\n          </ul>\n          <p><strong>時期：</strong>受験後</p>\n        </div>\n        <div class=\"card\">\n          <h3>判定の物差し</h3>\n          <ul>\n            <li><strong>売れた場合</strong>：題材の当たり。同じ題材で2本目を出すか、工程を海外向けデジタル商品に使い回す</li>\n            <li><strong>売れなかった場合</strong>：工程と題材を分けて見る。集客ポストまで届いていないなら集客の問題、読まれて買われていないなら題材か構成の問題。工程自体は資産として残るので、題材を変えてもう1周できる</li>\n            <li><strong>得るもの</strong>：売上の有無にかかわらず、「AIで商品を1本作って売る」全工程の実地の記録。これは他のデジタル商品すべてに使い回せる</li>\n          </ul>\n          <p class=\"sources\">きっかけ・出典：X投稿「Gemini 4 × note自動化プロンプト10選」（まな｜AIの申し子 @note_ai_mousigo、2026-11-20）</p>\n        </div>",

   "html": "<div class=\"detail-head\"><h2>ビジネス計画</h2></div>\n        <p class=\"sec-lead\">柱はアプリ。市場の現実を踏まえ、「小さく複数出し、届いたものだけ伸ばす」が勝ち方として決まっている。</p>\n        <div class=\"stats\">\n          <div class=\"stat\"><div class=\"v\">約83<small>%</small></div><div class=\"k\">新作アプリが2年経っても月$1,000に届かない割合</div></div>\n          <div class=\"stat\"><div class=\"v\">月$72</div><div class=\"k\">公開1年後の月収の中央値</div></div>\n          <div class=\"stat\"><div class=\"v\">58<small>日</small></div><div class=\"k\">月$1,000到達までの中央値。届くものは早く届く</div></div>\n          <div class=\"stat\"><div class=\"v\">5〜9<small>倍</small></div><div class=\"k\">「痛み止め」が「ビタミン」より転換する倍率</div></div>\n        </div>\n        <h3>候補はBとCの2つ。順番だけ固定</h3>\n        <div class=\"trio\" style=\"grid-template-columns:1fr 1fr\">\n          <div class=\"tcol\"><span class=\"tl-t\">B</span><span class=\"tl-n\">結果画面型の小ツール</span><span class=\"tl-d\">Cと一体で作る</span></div>\n          <div class=\"tcol\"><span class=\"tl-t\">C</span><span class=\"tl-n\">現場の不便解消型</span><span class=\"tl-d\">題材は段0で決める</span></div>\n        </div>\n        <p class=\"trio-seq\">進める順番：<strong>Cの題材決定（段0、今〜共通テスト）→ C×Bの最小版（共通テスト後〜2月）</strong></p>\n        <div class=\"card\">\n          <h3>B. シェアされる結果画面型の小ツール</h3>\n          <p>手持ちの記録や写真から「分析／図鑑／年表」のような結果画像を出す道具。結果がそのまま投稿物になる形が集客装置になる（IsTalkの型）。強みは日本事例で最も再現性が高いこと。弱みは題材の当たり外れが全てで、「誰の何の結果が見たいか」の選定が勝負になる。</p>\n          <p class=\"firststep\"><strong>最初の一歩：</strong>Cの題材が決まったら、その結果画面の試し画像を1枚作る<br><strong>時期：</strong>共通テスト後〜2月（Cの最小版と一体で作る）</p>\n        </div>\n        <div class=\"card\">\n          <h3>C. 現場の不便解消型（作品台帳が有力）</h3>\n          <p>自分の制作・受験生活の現場の道具。調査で「スマホ完結・日本語・私的な作品台帳」は日本語圏に不在の<strong>無人地帯</strong>と確認済み。海外製品は高額・英語・PC寄りで、国内は公開ポートフォリオと物理保管に二極化している。</p>\n          <ul>\n            <li><strong>価格の隙間</strong>：買い切り〜月300〜980円、点数課金・広告なし</li>\n            <li><strong>集客になる出力</strong>：展示・完成ごとの「作品1点カード（縦型）」、第二弾に年間「制作Wrapped」</li>\n            <li><strong>弱み</strong>：層が狭く天井は低い。最初の月1万円ライン向き</li>\n          </ul>\n          <p class=\"firststep\"><strong>最初の一歩：</strong>段0の一文を決める（下の検証の階段の段0と、未決・保留の筆頭がここ）<br><strong>時期：</strong>今〜共通テスト（題材の決定だけは受験前から進める）</p>\n        </div>\n        <h3>検証の階段（段0〜段4）</h3>\n        <ol class=\"steps\">\n          <li data-n=\"0\"><span class=\"st\">題材を1つ決める</span><span class=\"done-when\">「誰が・いつ・何に困って・今どう凌いでいるか」を一文で言えること</span>\n<p class=\"firststep\"><strong>最初の一歩：</strong>題材候補（作品台帳／制作ログ／画材の在庫と消費／シフトと収入の見える化）から1つに絞って、その一文を書く<br><strong>時期：</strong>今〜共通テスト</p></li>\n          <li data-n=\"1\"><span class=\"st\">最小版を公開する</span><span class=\"done-when\">実際に他人が触れるURLがあること（決済はまだ付けない）</span>\n<p class=\"firststep\"><strong>最初の一歩：</strong>最小版の最初の1画面を作る<br><strong>時期：</strong>共通テスト後〜2月</p></li>\n          <li data-n=\"2\"><span class=\"st\">集客テスト30日</span><span class=\"done-when\">結果画面のシェアか短尺動画経由で、身内以外の利用者が10人。ゼロなら題材を変える</span>\n<p class=\"firststep\"><strong>最初の一歩：</strong>公開した日に、結果画面のシェア投稿か短尺動画を1本出す<br><strong>時期：</strong>段1の公開直後から30日間</p></li>\n          <li data-n=\"3\"><span class=\"st\">課金の仮設置</span><span class=\"done-when\">最初の1件の支払い（広告削除か年額サブスクの小さい壁で試す）</span>\n<p class=\"firststep\"><strong>最初の一歩：</strong>広告を消す有料版か年額サブスクの、どちらか1つの課金の受け皿を付ける<br><strong>時期：</strong>段2で身内以外の利用者が10人に届いたら</p></li>\n          <li data-n=\"4\"><span class=\"st\">判定</span><span class=\"done-when\">続ける／題材を変える／量産ラインに移す、を数字で決める</span>\n<p class=\"firststep\"><strong>最初の一歩：</strong>数字を見て「続ける／題材を変える／量産ラインに移す」のどれかを決め、結果を記録する<br><strong>時期：</strong>段3の後</p></li>\n        </ol>\n        <h3>課金と集客の決まり</h3>\n        <ul>\n          <li><strong>課金の本命</strong>はサブスク（年額主役）＋買い切りの受け皿。広告は単価が低く、柱にしない</li>\n          <li><strong>再生数 ≠ ダウンロード</strong>。差を分けるのは、シェアされる結果画面／プロフィールからの導線／チャネルと対象の一致</li>\n          <li>Xでは告知より「質問投稿」が効く。最初の利用者は手で集め、要望には速く応える</li>\n          <li>フォロワーは借り物。<strong>所有できる連絡先（リスト）</strong>を別に持つ</li>\n        </ul>\n        <h3>収益化の実務メモ</h3>\n        <ul>\n          <li>Stripeは個人でも使えるが、決済・税務は実名が前提。特商法の「請求があれば開示」は完全な匿名化ではない</li>\n          <li>1,000円あたりの手取り：STORES 945円／BOOTH 899円／note 855円</li>\n          <li>青色申告の承認申請は「開業後2か月以内」を逃さない</li>\n        </ul>",

   "html": "<div class=\"detail-head\"><h2>AIパイプライン</h2></div>\n        <p class=\"sec-lead\">デジタル商品を「リサーチ→売れる構成→有料本編→集客ポスト」の4工程の鎖で作る方法。1つの長い指示で全部を一気に作らせるのではなく、工程ごとに分け、前の工程の出力を次の工程の入力にする。売る物が変わっても（有料noteでも、Gumroadの商品でも、アプリの中身でも）鎖の形は同じで、使い回せる。</p>\n        <div class=\"card\">\n          <h3>全体像</h3>\n          <div class=\"flow\"><span>リサーチ</span><i>→</i><span>売れる構成</span><i>→</i><span>有料本編</span><i>→</i><span>集客ポスト</span></div>\n          <p>各工程は「渡すもの」「返ってくるもの」「人間が見るポイント」が決まった、独立した仕事として扱う。鎖に分ける意味は3つある。</p>\n          <ul>\n            <li><strong>確認点を置ける</strong>：工程の境目ごとに人間が目を通せる。全部を一気に作らせると、間違いや薄さがどこで入ったか分からない</li>\n            <li><strong>差し替えが効く</strong>：工程ごとに使うモデルも、やり方も、題材も差し替えられる。1工程だけ作り直せば鎖全体は壊れない</li>\n            <li><strong>記録が残る</strong>：どの工程で詰まったか、どこが薄かったかが残り、次の1本が速くなる。これが「AIで作って売る」実地のノウハウの本体になる</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>各工程の中身</h3>\n          <p><strong>工程1 リサーチ</strong>——市場の需要と競合の確認。作る前に「誰が・何に困って・いくらで買っているか」を実物で確かめる工程。</p>\n          <ul>\n            <li><strong>AIに渡すもの</strong>：題材の候補、売り場（note等）、読者の仮説（誰の、どんな場面の困りごとか）</li>\n            <li><strong>返ってくるもの</strong>：実際に売れている同種の商品の一覧と価格帯、買う人の言葉（レビュー・検索される言葉）、競合の弱い場所</li>\n            <li><strong>人間が見るポイント</strong>：需要の証拠が「実際に売れている物」かどうか。言及数や盛り上がりは需要ではない。検索意図の温度（買う前提で探している言葉かどうか）の読み方は、アフィリエイトの「集客の経済学」と同じ</li>\n          </ul>\n          <p><strong>工程2 構成</strong>——売れる構成を決める工程。要素は「誰の・どんな渇きに・何を渡すか」の3点セット。</p>\n          <ul>\n            <li><strong>AIに渡すもの</strong>：リサーチの結果と、渡すものの定義（読み手が手に入れる成果物は何か）</li>\n            <li><strong>返ってくるもの</strong>：目次案、無料部分と有料部分の境目、価格の案</li>\n            <li><strong>人間が見るポイント</strong>：痛み止めになっているか（今困っている人に刺さるか。漠然と良いもの＝ビタミンでは買われない）。無料部分で価値が伝わり、有料部分に「続きを買う理由」があるか</li>\n          </ul>\n          <p><strong>工程3 本編</strong>——本文の生成と整形。量ではなく、質の基準で見る工程。</p>\n          <ul>\n            <li><strong>AIに渡すもの</strong>：構成と、材料（自分の実録・数字・一次情報）。材料の質がそのまま本文の質になる</li>\n            <li><strong>返ってくるもの</strong>：本文の下書き</li>\n            <li><strong>人間が見るポイント</strong>：自分の経験と数字が入っているか、読み手が実行できる詳しさか。一般論の水増しになっている部分は、自分の材料で置き換える。数字には出典を付ける</li>\n          </ul>\n          <p><strong>工程4 集客ポスト</strong>——告知文の自動生成と仕上げ。</p>\n          <ul>\n            <li><strong>AIに渡すもの</strong>：本編の要点と、リサーチで拾った読者の言葉</li>\n            <li><strong>返ってくるもの</strong>：X等の告知文の案（複数）</li>\n            <li><strong>人間が直す部分</strong>：自分の声と実体験の一文を入れ、誇張を落とす。宣伝の文面ではなく「読み手の渇きへの一言」になっているかを見る。報酬が絡む紹介はステマ規制の開示を外さない</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>モデルの使い分け</h3>\n          <p>工程ごとに、得意なモデルを割り当てる。1つのモデルに全工程をやらせるより、役割で分けた方が質が上がり、詰まった時の原因も追える。</p>\n          <ul>\n            <li><strong>調査・生成系</strong>：大量の読み書きが要る工程（リサーチ、構成案、本編の下書き）に向く。速く、広く出せる代わりに、出力の裏取りと取捨は人間がやる前提で使う</li>\n            <li><strong>実装・整形系</strong>：コードを書く、ファイルを直接編集する、検証まで回す工程（公開用ファイルの作成、データの整形、LPや売り場の組み立て）に向く</li>\n            <li><strong>連携の考え方</strong>：片方の出力を人間がコピペで運ぶと、手間と転記ミスが残る。ファイルやAPIで直接受け渡す形にすると、この手間が消える——「Geminiで回す→Claude Codeと連携させる」という発想の実体はこれで、特定の製品の組み合わせではなく「受け渡しを自動化する」という方法として採る</li>\n            <li><strong>管理の注意</strong>：モデルを分けると「誰が何を作ったか」が散らばる。指示と成果物は同じ場所に残し、どの工程の出力か分かる形にする</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>資源の確保——眠っている権利を使い倒す</h3>\n          <p>有料プランの特典には「自動で付くもの」と「申請しないと入らないもの」がある。払っているのに使っていない特典は、それだけ捨てているのと同じ。工程の燃料（APIの利用枠、計算資源、動画生成の枠）は、まず手持ちの権利から確保する。</p>\n          <ul>\n            <li><strong>棚卸しの手順</strong>：①契約中のプランの特典一覧を公式ページで確認する ②申請・有効化が要るものをその場で取る ③月ごとに消える枠（クレジット・計算単位）は、使い道の工程を先に決めて組み込む</li>\n            <li><strong>具体例：Google AI Pro（月2,900円）の束</strong>（2026-11時点の内訳）：申請制の月10ドル Google Cloud クレジット（Google Developer Programの特典ページで申請。Gemini API等に使える）／Colabの計算枠（月200単位、A100級のGPU、ノートブックは最長12時間ほど）／Flowの動画クレジット月1,000（720p・10秒動画で月30本ほど）／5TBの保存容量／YouTube Premium Lite。チャットしか使っていないと、この大半が眠ったままになる</li>\n            <li><strong>もう一つの例：Kaggleの無料GPU枠</strong>：無料アカウントでも週の枠内でGPUが使える（本人のアカウントで利用実績あり）。画像生成モデルや学習の実験は、課金前にこちらで回せる</li>\n            <li><strong>運用ルール</strong>：新しいプランに入ったら、入った日に特典を棚卸しする／月末に消える枠は先に使う／特典の内容と条件は変わるので、使う前に公式で確認する</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>人間が残る仕事</h3>\n          <p>工程を自動化しても、残る仕事がある。そこが勝負の場所になる。</p>\n          <ul>\n            <li><strong>題材の選定</strong>：何を売るかは工程の外の判断。リサーチは材料を出すが、「これをやる」と決めるのは人間</li>\n            <li><strong>最終判断</strong>：出す・出さない、価格、やめる・続ける。数字を見て決めるのは人間</li>\n            <li><strong>信頼の構築</strong>：実体験と実績の蓄積は自動化できない。誰が作ったかの一貫性が、2本目以降の売れ方を決める</li>\n            <li><strong>最初の読者を連れてくること</strong>：工程は2本目以降を速くするが、最初の読者は手で連れてくるしかない。ここはアフィリエイトの集客の現実と同じで、制作より重い</li>\n          </ul>\n          <p>工程そのものは誰でも組める時代になる。だから差は、工程の外側——題材と材料の本物さ——に移っていく。</p>\n        </div>\n        <div class=\"card\">\n          <h3>注意と失敗パターン</h3>\n          <ul>\n            <li><strong>量産＝売上ではない</strong>：作る速度が上がっても、買う理由は増えない。工程の速さは「テストの回数」を増やすためのもので、量そのものが成果ではない</li>\n            <li><strong>薄い量産は評価を落とす</strong>：質の薄いコンテンツの量産は、プラットフォーム側の評価を下げて露出を落とす。アフィリエイトの「損なうパターン」（量産の質の問題）と同じ構造で、売り場がnoteでも検索でも同じことが起きる</li>\n            <li><strong>収益主張を根拠にしない</strong>：「初月で○万円」のような数字は、裏付けがなければ工程の根拠にしない。採るのは仕組みと手順だけ</li>\n            <li><strong>全自動のまま出さない</strong>：確認点（構成と本編の2か所）を飛ばすと、薄さと誇張がそのまま表に出る。自動化するのは手であって、目ではない</li>\n          </ul>\n          <p class=\"firststep\"><strong>最初の一歩：</strong>契約中の有料プランの特典を棚卸しする（申請しないと入らないものが無いか、公式ページで確認する）<br><strong>時期：</strong>今すぐ（知識と資源の蓄積は受験前から可）</p>\n          <p class=\"sources\">きっかけ・出典：X投稿「Gemini 4 × note自動化プロンプト10選」（まな｜AIの申し子 @note_ai_mousigo、2026-11-20）。特典の内訳はnoteの検証記事2件（ふるふる／おぼろ。公式ヘルプでの確認日2026-11-16）に基づく。原典の収益主張は裏付けがないため採っていない</p>\n        </div>",

   "html": "<div class=\"detail-head\"><h2>先駆者の型</h2></div>\n<p class=\"sec-lead\">先駆者から借りるのは、実績の数字ではなく、順番と仕組みと判断基準。数字と経歴は本人の申告として切り分けて読み、自分の事業に移せる部分だけを採る。ここには2人の型を置く。噂のタカハシ（思考法・会話術・集客の装置）と、ヒカル（武器を先に決める順番）。</p>\n<h3>噂のタカハシ</h3>\n<p>元No.1ホスト（本人の申告）から、YouTube「大変身チャンネル」を登録者数十万人規模に伸ばし、現在は有料コミュニティ「REGAL」（49,800円・買い切り）を主宰する人物。発信の柱は、思考法、会話術・対人心理、SNSで稼ぐ仕組みの3つ。</p>\n<div class=\"card\">\n<h4>思考法の体系</h4>\n<p><strong>根本の方程式：成果 ＝ 努力 × ポテンシャル × 方向性</strong>。3つのうち、多くの人に欠けているのは努力でも才能でもなく方向性で、方向性が0なら、どれだけ努力しても結果は0になる。筋トレの例で彼はこう言う。週5で通ってもフォーム・食事・睡眠が滅茶苦茶な人（努力100・方向性0）は変わらず、週2でも正しいフォームと栄養の人（努力50・方向性100）が勝つ。彼の商品REGAL自体が「方向性の供給装置」として設計されていて、比喩は「人生の技マシン」——自力習得に時間がかかる技を、時間を買って先に覚える装置、という定義。</p>\n<ul>\n<li><strong>地獄と努力量の基準</strong>：20代で一つのことに短期集中し、遊びと友人を断つ「地獄」の時期を経験した人間は、努力量の基準そのものが定着し、別の分野に移っても常人離れした量を維持できる、という彼の観察。ただし努力は方向性が前提で、方向性のない量は「全部無駄」と切り捨てる。彼の転換は2回とも、量の方向違いの修正だった（会話術は後述。YouTubeは「毎日5本・サムネ自作」から「1本に絞る・サムネ外注・企画に集中」へ）</li>\n<li><strong>お金観は引き算</strong>：人生は足し算（フォロワーを増やす、地位を上げる、高級時計を買う）では満たされず、充足は引き算にある——無駄な人間関係、意味のないプライド、不要な物を捨てて、自分の核を見つけること。稼いだ直後の見栄消費（全身ハイブランド等）は「センスがない」ものとして否定する</li>\n<li><strong>器と、稼ぎ続ける2つの本質</strong>：稼げる額は「器」（受け止められる規模と姿勢）で決まる。金を稼ぎ続ける本質は2つだけ——①他人にできないことができる（希少性） ②他人が耐えられないことに耐える（耐久性）</li>\n<li><strong>コンプレックスは消すな</strong>：コンプレックスは克服しようとしなくていい。収入・経験・知識といった「自分のレベル」が上がれば、比較の位置関係そのものが変わって勝手に消える。劣等感は「自分への期待の証拠」で、努力の燃料になる</li>\n<li><strong>人を変えるのは3つだけ</strong>：時間配分を変える／住む場所を変える／付き合う人を変える。「決意を新たにする」ことは最も無意味。恨みや怒りは無理に手放さず燃料として使い、「許すのは成功してからでいい」という順序で置く</li>\n</ul>\n<p><strong>種銭の見方——「悪魔と契約」のクリップから。</strong>資産1億円以上を持つ富裕層のうち、親が金持ちでもなく、突出した才能もない出身者については、体感で8〜9割が、人生の若いタイミングで種銭を一気に作る局面を持っていた、というのが彼の見方（根拠は本人の体感のみで、統計や事例の提示はない）。彼の言い方では、その局面は非人道的・違法・背信に触れる要素を抱えた商売を期間限定で回すもので、その後はクリーンな仕事に移り、過去の部分は一切表に出さない。だから表から見える「立派な姿」は、種銭の後に整えられたものだ、という構図になる。</p>\n<p>ここから採るのは手段ではなく、見る順番の物差しだけ。成功者を見る時は「今の姿」ではなく「最初の種銭をどう作ったか」を先に問う。表の姿だけを真似ると、土台の工程を飛ばすことになる。なお、グレーな手段そのものは「名前を汚さない」という自分の条件と両立しないため採らない。採るのは、種銭の作り方への注目と、「種銭が先、整えた姿は後」という順番の読みだけ。</p>\n</div>\n<div class=\"card\">\n<h4>会話術・対人心理</h4>\n<p><strong>核は「話すな、聞け」</strong>。ホスト駆け出しの頃、彼は短髪＋面白いエピソードトークで武装して全く売れなかった。先輩の指摘——「男は話すな、女の話を聞け。傾聴力こそモテの本質」——で全部を反転させ、自分の話を捨てて傾聴に全振りしたことがNo.1の起点だった、と繰り返し語る。努力の方向違いの、最も分かりやすい実例でもある。</p>\n<ul>\n<li><strong>相手が求めているのは「楽しい空気」</strong>：面白い話そのものではない。自分が楽しまなければ相手は楽しめない。趣味の話なら「それ俺も好き！」と素直に乗る。空気は、自分が作る側に回る</li>\n<li><strong>笑顔の基準値を下げろ</strong>：効くのは会話の中身の面白さではなく、表情の柔らかさ。つまらなくても真顔にならないことが、空気の質に直結する</li>\n<li><strong>質問攻めをしない</strong>：尋問形式（「？」の連射）は会話を殺す。質問で掘るのではなく、相手が話したくなる場を作る側に回る</li>\n<li><strong>仮面を剥がす</strong>：誰もが社会的な仮面（役割としての自分）を着けている。相手を役割として扱わずフラットに接し、警戒を下げる入口（「話しやすそう」と伝える等）を作り、幼少期の話や好きだった遊びのような「見栄のない素の自分」が出る話題を引き出す。「素でいられる場」を作れた相手は、他の誰とも違う存在になる、という理屈</li>\n<li><strong>好意は「量の比較」で起きる</strong>：人が動くのは、今の対象への好意を、新しい対象への好意が超えた時。感情を、好意の階層の逆転として捉える見方</li>\n<li><strong>見た目は需要に合わせる</strong>：駆け出しの頃、店のオーナーに「マッチョを目指すな。需要側が好む、細身の清潔感にしろ」と言われた。自分の好みではなく、需要側の好みに外見を合わせるという実務原則</li>\n</ul>\n<p>無料特典として配られている「4つの会話ステップ」の中身自体は、LINE登録の内側にあり未回収。ここに置いたのは、外側の発信から復元できた原則だけ。</p>\n</div>\n<div class=\"card\">\n<h4>SNSで稼ぐ2つの道</h4>\n<p>彼の公式見解（X投稿の原文）：「SNSで稼ぐ道は2つしかない。①人間力で人を惹きつける ②情報価値で信頼を勝ち取る」。人間力とは、圧倒的な経験から「感情」に寄り添って共感を集める力。情報価値とは、「誰が言ったか」を消してでも「使える情報」だけを届ける力。彼は前者で勝負している側だと明言している。</p>\n<p>もう1本の圧縮形（X投稿の原文）：「ビジネスの本質は超シンプル。①他人を豊かにする ②それができるよう己が勉強する ③情報発信しながら顧客を集める」。集客の型（人間力／情報価値）と、商品の側の条件（他人を豊かにする）を分けて考える物差しになる。読み方として、自分の発信がどちらの型なのかを先に決めると、何を見せて何を伏せるかの設計が決まる。</p>\n<ul>\n<li><strong>作り込んだコンテンツは資産になる</strong>：使い捨てのショート動画ではなく、作り込んだものは残り続ける。大変身チャンネルの動画は、今も収益と集客を生み続けている（本人の申告）。「生涯かけて作り上げるプロセス自体を楽しめ」という主張とセットになっている</li>\n<li><strong>実力の見抜き方＝証拠の出し方</strong>：判定する側の基準。「1億円稼いだ」というテキストより、5,000万円の現金を持っている写真の方が説得力がある——画像は言葉より重い。実力を見抜くなら、テキスト投稿ではなく動画やブログを見て、知識の深さ・思考過程・話すテンポ・一貫性を評価しろ、というのが彼の言い分。逆に、自分の実績を伝える側の技術でもある。実績の見せ方で、聞き手の信頼と聞く姿勢が変わる</li>\n<li><strong>スマホは消費者、PCは生産者</strong>：スマホは買い物と視聴のために設計されていて、消費者側に留まりやすい。管理画面など生産者側の機能は、PCでしか開けないものが多い。本気で生産者側に回るなら、道具を生産者側に揃えろ、という主張</li>\n</ul>\n</div>\n<div class=\"card\">\n<h4>装置の分解</h4>\n<p>彼の集客は、個人の発信力ではなく装置として組まれている。層は4つ。</p>\n<ul>\n<li><strong>拡散層</strong>：週1回の生配信（本家YouTube）が母艦。公認切り抜きのアカウント群が、同じ素材を媒体ごとの形（YouTubeは長尺＋目次、Xは1〜3分、Instagram／Threadsは名言カード＋短尺）に変えて、同時多発的に流す</li>\n<li><strong>回収層</strong>：全媒体の説明文・バナーが、1本の導線に統一されている。公式LINE登録→登録直後だけ開く「72時間限定」で、有料コミュニティの中身の一部を無料公開する</li>\n<li><strong>販売層</strong>：商品はREGAL（49,800円・買い切り）。配信はTeachable、販売にはBrainも併用され、アフィリエイト報酬50%が設定されている</li>\n<li><strong>送客層</strong>：年4回のオフ会と面談で信頼を積み、外部の高額コンサル（よろず屋等）へ送客する接続が、受講生の記録から確認できる（送客の対価関係は未確認）</li>\n</ul>\n<ul>\n<li><strong>切り抜き軍団の相互利益</strong>：本人は切り抜き側に「公認」と収益機会（広告収益・フォロワー）を与え、切り抜き側は全投稿にLINE導線を埋め込んで、本人の集客装置として働く。拡散を「頼む」のではなく、相手の利益になる形で構造化している</li>\n<li><strong>削除による希少性</strong>：本家YouTubeは常に30本だけ動画を残し、新しい動画を上げるたびに古いものを削除する（広告収益も入れていないと公言）。生配信のアーカイブは2週間で非公開になる。「消えた全量はREGALでだけ見られる」が、常時発生する入会理由になる。希少性を値引きや煽りで作るのではなく、「消す」ことで作る設計</li>\n<li><strong>無料→有料の設計</strong>：無料特典は「商品の抜粋を72時間だけ開ける」形。中身の質を購入前に検証できることと、期限が決断を促すことの、両方を担う。買い切り価格のため解約の概念がなく、「一生メンバー」を売り文句にできる</li>\n<li><strong>価格論法</strong>：LPの比較表で「恋愛コンサル3ヶ月50万円＋ビジネススクール100万円＋哲学本100冊30万円＝200万円以上の価値」を束ね、その束を49,800円と提示して、相対的な安さを作る。差別化の主張は「部分最適の寄せ集めではなく、統合されていること」</li>\n<li><strong>信者の熱量の販売チャネル化</strong>：Brainのアフィリエイト報酬50%により、受講生自身が販売者になる。受講生が書く熱量の高い紹介文（アフィリエイトである旨を明示したnote等）が、そのまま販売チャネルとして働く</li>\n<li><strong>オフ会の設計</strong>：主宰者が全参加者と1対1で話し、課題と夢を聞いて、相性の良いメンバー同士をその場で直接繋ぐ。「主催者が壇上で語る会」ではなく「参加者同士の出会いが商品」という設計を、明示している</li>\n<li><strong>物語の反復</strong>：経歴の物語（高校中退・引きこもり→ホストNo.1→YouTube→FIRE→感謝と貢献）が、LP・プロフィール・動画の自己紹介で、完全に同一の形で反復される。商品の定義も物語と一体化している（REGAL＝「18歳の頃の自分に向けた人生の教科書」。ターゲットは「過去の自分と同じ状態の人間」と明言されている）</li>\n</ul>\n</div>\n<p class=\"sources\">きっかけ・出典：本人が共有した切り抜き動画「富裕層は人生のどこかで悪魔と契約する」（噂のタカハシ@YhG1937800、文字起こし済み）と、吸収資料（2026-11-21。YouTube動画21本の目次、公認切り抜き投稿、公式note、受講生note等から作成）。経歴・収益の数字（ホスト月収500万円、YouTube最高月収8,500万円、26歳でFIRE等）はすべて本人の申告で、媒体によって数字が揺れるものもある（最高月収には「約8,000万円」「1億円超」の表記もあり、REGALのメンバー数も1,100名超〜3,000名超と時期・媒体で変動）。規模感の照合が取れたのは大変身チャンネルの登録者数だけで、第三者統計（vidIQ）では登録者45.8万人・総再生約1.44億回と、「最大50万人」という主張と桁は概ね整合する</p>\n<h3>ヒカルの型</h3>\n<p>YouTuberのヒカルが、駆け出しのアフィリエイトで結果を出した時の「順番」を分解したもの。借りるのは手法ではなく順番——作業より先に、自分の武器を決める。</p>\n<div class=\"card\">\n<h4>順番そのもの</h4>\n<p>彼がアフィリエイトを始めて最初にやったのは、作業ではなかった。まず自分の状況を、正直に書き出した。</p>\n<ul>\n<li><strong>無いものを書き出す</strong>：ネットの知識はない／パソコン音痴／人脈なし。無いものを、先に並べる</li>\n<li><strong>武器を1つ決める</strong>：その上で「他の人に無くて、自分にあるもの」を探し、1つに決める。彼の答えは「知識がないなら、生まれ持った容姿を使って目立つしかない」だった</li>\n<li><strong>方程式に落とす</strong>：武器の使い道を、1本の方程式にしてブログに残した</li>\n</ul>\n<div class=\"flow\"><span>目立つ</span><i>→</i><span>集客ができる</span><i>→</i><span>見込み客をつくるチャンス</span><i>→</i><span>お金に繋がる</span></div>\n<p>普通は、アフィリエイトを始めたら、記事の書き方や案件の選び方から調べて「知識の勝負」に正面から入っていく。彼は知識の勝負を、最初から避けた。知識で勝てないなら知識以外で目立てばいい——自分が勝てる場所を先に選んだことが本質で、後の著書『心配すんな。全部上手くいく。』でも「正面から勝負をしない」と書いている。武器が決まってから、集客の作業（当時はTwitterとブログ）に入った。</p>\n<p>結果の数字（本人が当時のブログに書いた自己申告）：1ヶ月目8万円→2ヶ月目14万円→4ヶ月目110万円→5ヶ月目200万円→7ヶ月目500万円→8ヶ月目1,200万円。ただし4ヶ月目以降は「総合月収」で、トレンドブログの広告収入の他に、メルマガで教材を紹介した報酬も含む。その後のYouTubeでもアパレルでも、「先に人を集めて、後でお金に変える」という順番は変わっていないように見える、というのが記事の著者の読み。</p>\n</div>\n<div class=\"card\">\n<h4>現代版の翻案——武器は仕事と経験から選ぶ</h4>\n<p>「容姿で目立つ」は、誰でも持てる武器ではない。今、同じ順番で始めるなら、武器は自分の仕事や経験から選ぶ——というのが記事の著者の提案。</p>\n<ul>\n<li><strong>立場そのものが切り口になる</strong>：例——経理の会社員が会計ソフトを紹介する。同じソフトの紹介記事はネットに山ほどあるが、毎月の締め作業を実際にやっている人が、経理の目線で比べた記事はほとんどない。容姿は選べないが、仕事と経験は誰にでもあり、他のアフィリエイターには真似できない</li>\n<li><strong>武器の珍しさはAIで確かめられる</strong>：紹介したい案件の名前で検索し、上位の記事を書いている人がどんな立場の人かを、AIにまとめさせる。表の中に無い立場が、そのまま自分の切り口になる。「容姿で目立つ」と決めた2012年の判断を、今は「自分の立場で目立つ」に置き換える</li>\n<li><strong>アフィリエイトへの接続</strong>：比較記事の型でも、案件と商品を決める前に、まず自分の立場を決める。この順番が入ると、比較の切り口（何を比べ、何を重視するか）が立場から自然に決まる</li>\n</ul>\n</div>\n<div class=\"card\">\n<h4>今夜やる3つ（30分）</h4>\n<ol class=\"steps\">\n<li data-n=\"1\"><span class=\"st\">武器の候補を3つ書き出す</span><span class=\"sd\">自分にあって、周りのアフィリエイターに無いものを3つ書き出す（仕事・住んでいる場所・失敗した経験など）</span><span class=\"done-when\">終わりの目安：候補が3つ書き出せている</span></li>\n<li data-n=\"2\"><span class=\"st\">競合の立場を表にする</span><span class=\"sd\">A8.netで、1つ目の手順に近いジャンルの案件を1つ選び、その案件名で検索する。上位10記事のURLをAIに貼って、書き手の立場（仕事・年代・経験）を表にまとめさせる</span><span class=\"done-when\">終わりの目安：上位10記事の書き手の立場が、表になっている</span></li>\n<li data-n=\"3\"><span class=\"st\">空いた切り口で見出しを作る</span><span class=\"sd\">1つ目の手順のうち、表に1つも無かったものを切り口にして、記事の見出しを5つAIに出させる。全部どこかにあったら、候補を1つ足してやり直す</span><span class=\"done-when\">終わりの目安：切り口が1つ決まり、見出しが5つある</span></li>\n</ol>\n<p class=\"firststep\"><strong>最初の一歩：</strong>この「今夜やる3つ」を、アフィリエイトで狙う案件に対して1回やってみる<br><strong>時期：</strong>知識として受験前から可。実践はアフィリエイトの開始時</p>\n</div>\n<div class=\"card\">\n<h4>留保——数字と環境の変化</h4>\n<ul>\n<li><strong>数字は自己申告</strong>：月収の推移は全部、本人が当時のブログに書いたもので、決算資料のように外部から確かめられた数字ではない。記事自身がその旨を明記している。採るのは金額ではなく順番</li>\n<li><strong>同じ数字にはならない</strong>：2012年と同じ武器・同じ場所（トレンドブログ等）で今同じことをやっても、同じ数字は出ない。環境が変わったからで、手法の順番自体が古くなったわけではない</li>\n<li><strong>紹介のルールが変わった</strong>：2023年10月からステマ規制の対象になり、商品を紹介する時は、広告だと分かる表示が要る（アフィリエイトの「ルール」と同じ線引き）</li>\n</ul>\n</div>\n<p class=\"sources\">きっかけ・出典：Xの長文記事「YouTuberヒカルが21歳で月収1,200万円稼いだ\"ヤバい\"アフィリエイト手法」（裏めがねくん @uraglasskun、2026-11-19）。数字はヒカル本人が当時のブログに書いた自己申告に基づく（記事自身もその旨を明記）。著者自身もAI×アフィリエイトの実績（単月101万円、本人の申告）を掲げてLINEのオープンチャットへ誘導する装置を持ち、記事はその集客を兼ねている。採るのは順番と手順だけ</p>",

   "html": "<div class=\"detail-head\"><h2>ビジネスの段取り</h2></div>\n        <p class=\"sec-lead\">事業というものが、始まってから稼ぐまでに、どういう段階を経るかという一生の段取り。どの事業もこの順番を通る。順番を知っていると、「いま自分がどこにいて、次に何が来るか」が見える。</p>\n        <div class=\"card\">\n          <h3>全体像——事業の5段階</h3>\n          <div class=\"flow\"><span>段階0 準備</span><i>→</i><span>段階1 検証</span><i>→</i><span>段階2 継続販売</span><i>→</i><span>段階3 運営と改善</span><i>→</i><span>段階4 拡大</span></div>\n          <p>この5段階は、成功逆算マップのStage 0〜5と、検証のはしご（段0〜段4）、計画のフェーズ設計を、事業一般の言葉に直したもの。事業ごとに中身は違っても、段階の順番と「終わりの判定」は共通している。段階は飛ばせない——前の段階の判定を通っていないのに次へ進むと、どこで間違えたか分からなくなる。</p>\n          <ol class=\"steps\">\n            <li data-n=\"0\"><span class=\"st\">段階0 準備</span><span class=\"sd\">目的は、売る物の仮説を「誰が・何に困って・いくらで買っているか」まで具体化すること。終わりの判定は、題材が一文で言えて、判定ラインと撤退ラインが先に決まっていること。お金は、収入はまだ無く、出すのは原則として時間だけ</span></li>\n            <li data-n=\"1\"><span class=\"st\">段階1 検証</span><span class=\"sd\">目的は、仮説が本物かを「売れた／反応があった」という事実で確かめること。各事業の「初歩段階」は、この段階の手引きになっている。終わりの判定は、判定ラインに触れること（最初の売上、または基準を超える反応）。お金は、ここで最初の収入が生まれる。金額は判定の材料であって、生活費ではない</span></li>\n            <li data-n=\"2\"><span class=\"st\">段階2 継続販売</span><span class=\"sd\">目的は、1回売れた形を「いつでも買える形」に固定すること。終わりの判定は、同じ形で2回目以降の売上が立つこと。お金は「点」から「線」になり始める。入金の遅れが効いてくるのはここから</span></li>\n            <li data-n=\"3\"><span class=\"st\">段階3 運営と改善</span><span class=\"sd\">目的は、数字を見て直すリズムを作ること。この段階に終わりはなく、事業が続く限り回し続ける。判定は「先月と比べて何が変わったか、数字で言えるか」。お金は、月ごとの売上が読めるようになる</span></li>\n            <li data-n=\"4\"><span class=\"st\">段階4 拡大</span><span class=\"sd\">目的は、自分の時間を増やさずに売上を増やすこと。当たった型の複数化と仕組み化、お金で手を買うことが仕事になる。終わりの判定は、自分が手を止めても売上が落ちない部分が生まれること。お金は、資産フェーズ（第7章）の入口に届く規模になる</span></li>\n          </ol>\n        </div>\n        <div class=\"card\">\n          <h3>段階ごとの中身</h3>\n          <p><strong>段階0 準備</strong>——決めるための段階。</p>\n          <ul>\n            <li><strong>やること</strong>：市場の実物を見る（実際に売れている同種の物と、その価格・売れ方）／型を1つ決める（形式・売り場・価格の仮置き）／判定ラインと撤退ラインを、始める前に書いておく</li>\n            <li><strong>つまずき</strong>：調べ続けて始めないこと。準備は決めるためのもので、知識が全部揃うのを待つ段階ではない</li>\n          </ul>\n          <p><strong>段階1 検証</strong>——小さく売ってみる段階。</p>\n          <ul>\n            <li><strong>やること</strong>：最小の形で公開する／決めた本数・期間だけ回す（事業ごとの「初歩段階」の手順がこれにあたる）／結果を数字で記録する</li>\n            <li><strong>つまずき</strong>：判定ラインを後から動かすこと。決めた本数を出し切る前に諦めること。反応ゼロは失敗ではなく「型が違う」という判定材料</li>\n          </ul>\n          <p><strong>段階1→2の境目</strong>——「1回売れた」と「回り始めた」は別物で、ここを取り違えると段取り全体が崩れる。</p>\n          <ul>\n            <li><strong>1回には偶然が混ざる</strong>：知り合いの購入、たまたまの露出、一時的な話題。1回の売上は「当たった」証拠にはならない</li>\n            <li><strong>回り始めたと言える証拠</strong>：同じ形で繰り返し売れる／宣伝していない時にも売れる／転換率などの数字が再現する</li>\n            <li><strong>仕事が切り替わる</strong>：段階1の仕事は「型が当たったか」の判定、段階2の仕事は「当たった型を固定すること」。当たった直後に形や価格を変えると、せっかくの証拠が消える</li>\n          </ul>\n          <p><strong>段階2 継続販売</strong>——形を固定する段階。</p>\n          <ul>\n            <li><strong>やること</strong>：売り場・価格・導線を固定する／売れた物が残り続ける形にする（在庫・バックリスト・公開され続けるURL）／価格は下げない（下げると、既に買った人の持つ価値まで壊れる）</li>\n            <li><strong>つまずき</strong>：売れた勢いで題材や売り場を増やしすぎること。まず1つの形を「線」にすること</li>\n          </ul>\n          <p><strong>段階3 運営と改善</strong>——数字で回す段階。</p>\n          <ul>\n            <li><strong>見る数字</strong>：売上＝アクセス×転換率×単価（数字の式の分解）。事業ごとの物差しも固定する（アフィリエイトなら発生→承認→確定の3つの数字。アプリなら利用者と課金の数字）</li>\n            <li><strong>リズムの作り方</strong>：出すたびに記録する／週に1回、数字を置いて眺める／月に1回、「続ける・直す・やめる」を判定する。直すのは1回に1か所だけ——同時に変えると、何が効いたか分からなくなる</li>\n            <li><strong>つまずき</strong>：数字を見ずに新作ばかり増やすこと。運営は地味だが、売上の差はここで付く</li>\n          </ul>\n          <p><strong>段階4 拡大</strong>——仕組みに任せる段階。</p>\n          <ul>\n            <li><strong>やること</strong>：当たった型の複数化（商品点数・売り場・蛇口を増やす）／作業の仕組み化（工程として固定し、AIや外注に渡せる形にする）／人を入れる（お金で手を買う）</li>\n            <li><strong>つまずき</strong>：段階2〜3が固まる前に広げること。薄い量産はプラットフォームの評価を落とす（AIパイプラインの注意と同じ構造）</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>事務の段取り</h3>\n          <p>事業のお金と並んで、事務の段取りも進む。順番の要点は2つだけ——事務の大半は「最初の売上が立ってから」で間に合うこと。そして青色申告だけは、期限が先に来ること。</p>\n          <ul>\n            <li><strong>最初の売上まで</strong>：要るのは、売り場のアカウントと振込先の登録くらい。届け出はまだ要らない。「守りの実務」（届け出や税務の手続き）は、最初の収益が出た時が開始の合図になる</li>\n            <li><strong>開業届</strong>：個人事業を始めたことを税務署に届ける書類で、無料で出せる。「事業として続ける」と決めた時点が出しどきの目安。様式や出し方の細部は、出す時に最新を確認する</li>\n            <li><strong>青色申告承認申請</strong>：開業から2か月以内に出すのが節目で、最大65万円の控除がかかる。期限を逃すと、その年は青色申告が使えない。実務の勘所は「最初の売上が立ったら、まずこの期限を確認する」こと</li>\n            <li><strong>お金と記録の置き場所</strong>：事業のお金は、生活のお金と分けて記録する。口座を分けるのが一番確実で、最低限、売上・手数料・経費の記録を1か所にそろえる。この記録が、そのまま確定申告の材料になる</li>\n            <li><strong>販売時の表示義務（特定商取引法）</strong>：自分の売り場で直接売る場合、販売者の表示が要る。特商法の「請求があれば開示」は完全な匿名化ではない（ルールの線引きどおり）。売り場の仕組みに乗る販売（メルカリ・BOOTH・noteなど）では表示の形が違うので、売り場ごとに開始時に確認する</li>\n            <li><strong>確定申告</strong>：年に1回、その年の所得を申告する。海外での売上も含めた全世界所得が対象で、事業所得（または雑所得）として申告し、プラットフォームの手数料は経費にできる。最初の申告は、最初の収益が出た年の分から</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>お金が届くまでの遅れ</h3>\n          <p>「売れた」と「お金が手元にある」は、同じではない。間には、承認・保留・締め・最低出金額が挟まる。この遅れは、最初の段階で一番つまずきやすい場所になる。</p>\n          <ul>\n            <li><strong>アフィリエイト</strong>：成果が発生しても、広告主の承認を経て初めて確定し、そこから支払いのサイクルに乗る。発生から入金までは月単位の遅れが出るのが普通で、否認されればその分はゼロになる（アフィリエイトの「成果の測り方」のとおり）</li>\n            <li><strong>Gumroad</strong>：売上には7日間の保留期間があり、出金は週次（火曜、前週金曜UTCまでの分）。最低残高$100に届くまで、出金されない</li>\n            <li><strong>note／メルカリ</strong>：売上金は、振込の形で受け取る（noteは振込手数料270円、メルカリは振込手数料200円が別にかかる）。振込のタイミングの細部は、開始時に確認する</li>\n            <li><strong>意味すること</strong>：段階1〜2では、「売上の数字」と「手元のお金」がずれる。売上の見込みを先に使わないこと（次の仕入れや費用は、手元の範囲で回す）。先に費用が出る型（物販の仕入れなど）では、この遅れがそのまま資金繰りになる——数字の式の「キャッシュフローとリピート」が言っていたことの、実地での姿</li>\n          </ul>\n        </div>\n        <div class=\"card\">\n          <h3>7つの事業の現在地</h3>\n          <p>7つの事業を、この5段階の物差しに置くと、こうなる。</p>\n          <ul>\n            <li><strong>原画・エディション販売（本丸）</strong>：段階0の終わり。価格の階段と売り場は設計済みで、材料になる制作は受験制作と兼ねて進んでいる。販売の開始（段階1）は受験後</li>\n            <li><strong>図鑑アプリ</strong>：受託は段階0の準備が済んだところ（受け皿作りからが初歩段階）。横展開は段階0で、最初の分野が未定</li>\n            <li><strong>make.fun</strong>：段階0の準備済み。セットアップは終わっていて、応募＝段階1は受験後</li>\n            <li><strong>物語のある物</strong>：段階0。市場分析は済んでいて、最初の1品が未定</li>\n            <li><strong>海外向けデジタル商品</strong>：段階0。売り場の実務まで調査済みで、題材が未定</li>\n            <li><strong>海外アフィリエイト</strong>：段階0。仕組みの学習資料があり、知識の蓄積は受験前から可</li>\n            <li><strong>有料note</strong>：段階0。作る工程（AIパイプライン）は設計済みで、題材が未定</li>\n          </ul>\n          <p>全部が段階0〜1の入口に並んでいるのは、受験期だからで、設計どおりの姿。受験期に進めるのは段階0の準備（知識・題材・型決め）までで、段階1の実践は受験後に、最大3つまで並行させる。</p>\n          <p class=\"firststep\"><strong>最初の一歩：</strong>受験後に回す最初のテストを、7つの事業から最大3つ選ぶ<br><strong>時期：</strong>受験後（2027年3月）。段階0の準備は受験前から可</p>\n          <p class=\"sources\">きっかけ・出典：本人の問い「実際のビジネスがどう始まって、どう進んで、どういう段階を経て最終的にお金を稼ぐか、その企業的な段取りを知りたい」（2026-11-20）。段階の分け方は、成功逆算マップ（Stage 0〜5）・検証のはしご（段0〜段4）・稼ぎプロジェクトのフェーズ設計に基づく。事務と入金の事実は、数字の式／各候補の実務に基づく</p>\n        </div>",

   "meta": "事業がゼロから稼ぐまでの5段階と、各段階の終わりの判定。並行する事務の段取りと、売れてから入金までの遅れ",

   "html": "<div class=\"detail-head\"><h2>ルール</h2></div>\n        <h3>評価の物差し（2つ）</h3>\n        <p>機会は「平均的な参加者の期待値」では測らない。上位を取る側として設計する。その上で問うのは2つ。</p>\n        <div class=\"judge\">\n          <div class=\"jq\"><span class=\"qn\">問い1</span><span><span class=\"qt\">その上位は、自分たちの実力で実際に取れる構造か</span><span class=\"qd\">参加者数と、審査が「質」か「最適化の削り合い」か</span></span></div>\n          <div class=\"jarrow\">↓</div>\n          <div class=\"jq\"><span class=\"qn\">問い2</span><span><span class=\"qt\">取った位置が、資産として残るか</span><span class=\"qd\">勝っても次の案件でゼロからなら、椅子は残らない</span></span></div>\n          <div class=\"jarrow\">↓</div>\n          <div class=\"jout\"><span class=\"jok\">2つとも通る → 上位を取りに行く</span><span class=\"jng\">1つでも欠ける → やらない</span></div>\n        </div>\n        <h3>禁止ライン（8つ）</h3>\n        <p>判定は「バレるか」ではない。<strong>revealテスト</strong>——将来、本名と顔を出して同じ売り方を説明できるか——を通らないものはやらない。</p>\n        <ul class=\"checklist\">\n          <li>裏付けのない／水増しした収入・実績・効果の数字を広告に使う</li>\n          <li>「絶対稼げる」等の断定的な表現で情報商材・スクール・コンサルを売る</li>\n          <li>ステマ（PRを隠す／広告主に隠させる）</li>\n          <li>無許可の反復継続転売、資格を偽った仕入れ、定価超チケット転売</li>\n          <li>わいせつ物の頒布・陳列にあたる成人向け販売</li>\n          <li>収益の無申告・過少申告</li>\n          <li>他人の著作物・商標・キャラ・肖像を無断で使った商品販売</li>\n          <li>買い手の不安・借金・焦りを煽る高額勧誘</li>\n        </ul>\n        <h3>やらないこと</h3>\n        <ul>\n          <li>株・FX（元手がない段階では再現性なし）</li>\n          <li>スクール事業（実績ができるまで封印）</li>\n          <li>アダルト（名前の履歴を守るため、原則やらない）</li>\n          <li>生活費を事業の成果に賭けること</li>\n          <li>図鑑エンジンのキット販売（仕組みの公開になるため）</li>\n        </ul>\n        <h3>実現のルール（2026-11-20）</h3>\n        <ol class=\"rules\">\n          <li>計画には最初の一歩と時期を付ける。実現したかどうかは、文書ができたかではなく、世の中の側が変わったか（出荷・出品・応募・最初の取引）で数える</li>\n        </ol>\n        <h3>知識のルール（2026-11-20）</h3>\n        <p><strong>「知識こそ土台であり金だ」</strong>——知識そのものが土台であり、資産だ。このアプリは計画の置き場ではなく、見て動ける知識の基盤として作る。稼ぐのは本人で、Muse の仕事はその知識を備えることにある。</p>\n        <ol class=\"rules\">\n          <li><strong>ノウハウの登録基準</strong>：本体は体系的な知識（手順・判断基準・数字・注意点まで、実行できる詳しさ）で書く。「大まかな流れ」の要約だけでは、登録したことにならない</li>\n          <li><strong>数字の裏付け</strong>：数字と事実は、公式・一次の出典で裏が取れるものだけを置く。裏の取れない収益数字や、煽りの結論は入れない</li>\n          <li><strong>出典の置き場所</strong>：きっかけ・出典は一番下に補足として小さく置く。本文の主役はノウハウのほうにする</li>\n          <li><strong>更新時の棚卸し</strong>：アプリを更新する時は、中身の古さ（過ぎた日付のままの文面、後の決定で置き換わった表現、数字の不整合）も同じ便で点検する。機械的に直せるものはその場で直し、計画の実質に関わる変更は本人の判断に回す</li>\n        </ol>\n        <h3>名前と顔の条件（2026-11-21 組み直し）</h3>\n        <p>旧条件（実写なし・顔出しなし・実名なし＝完全匿名）を組み直した（2026-11-21、とりあえず採用）。出発点は本人の自己診断——気にしていたのは身バレそのものではなく、<strong>名前に変な履歴がつくこと</strong>だった。守る対象が名前の履歴なら、条件はこう置き直せる。</p>\n        <ol class=\"rules\">\n          <li><strong>表の顔はハンドル</strong>：活動の表の顔はハンドルにし、画家としての名前とは分けて運営する</li>\n          <li><strong>顔は出さない</strong>：名前の問題とは別軸で、生活を守るための条件として残す</li>\n          <li><strong>実名の完全遮断はやめる</strong>：ストアの販売元など、制度上出てしまう場所は許容する。名前が出ること自体は履歴ではない</li>\n          <li><strong>履歴の管理を条件にする</strong>：将来、稼ぎ活動の履歴が画家としての本名に接続されても汚点にならない内容とやり方だけをやる。誇大な煽り・グレーな手段・炎上狙いを禁止する理由は、名前を守るため（禁止ラインの reveal テストと同じ考え方）</li>\n        </ol>",

   "html": "<div class=\"detail-head\"><h2>未決・保留</h2></div>\n        <p class=\"sec-lead\">ここにあるものは計画として確定していない。決まった計画のふりをして埋めていない項目の一覧。</p>\n        <ul class=\"pending-list\">\n          <li><span class=\"pt\">Cの段0——題材の一文が未確定</span><span class=\"pd\">「誰が・いつ・何に困って・今どう凌いでいるか」の一文。題材候補は作品台帳／制作ログ／画材在庫／シフトと収入の見える化。次の一歩はここ。</span>\n<p class=\"firststep\"><strong>最初の一歩：</strong>題材候補（作品台帳／制作ログ／画材在庫／シフトと収入の見える化）から1つを選び、「誰が・いつ・何に困って・今どう凌いでいるか」の一文を書く<br><strong>時期：</strong>今〜共通テスト（受験前から進めてよい決定作業）</p></li>\n          <li><span class=\"pt\">営業と集客を何から始めるか</span><span class=\"pd\">本人「わからない、またその時話そう」。受託の最初の1件の取り方と、横展開アプリの集客が対象。最大の未知数はここ。</span>\n<p class=\"firststep\"><strong>最初の一歩：</strong>受験後に、この保留を開いて話す場を1回持つ<br><strong>時期：</strong>受験後（2027年3月以降）。それまでは保留のまま置く</p></li>\n          <li><span class=\"pt\">受託の受け皿が未作成</span><span class=\"pd\">何を・いくらで・どのくらいで作れるかの一枚。価格は「安さ」ではなく「この形は他にない」で立てる方針だけ決まっている。</span>\n<p class=\"firststep\"><strong>最初の一歩：</strong>何を・いくらで・どのくらいで作れるかを、一枚に書き出す<br><strong>時期：</strong>受験後（2027年3月以降）</p></li>\n          <li><span class=\"pt\">横展開の最初の分野が未定</span><span class=\"pd\">候補は並んでいるが、どこから始めるかは決まっていない。</span>\n<p class=\"firststep\"><strong>最初の一歩：</strong>候補（スポーツ記録／声優・アイドル／漫画／名車／時計／スニーカー）から最初の1分野を選ぶ<br><strong>時期：</strong>受験後（2027年3月以降）</p></li>\n          <li><span class=\"pt\">マンダラチャート——保留中</span><span class=\"pd\">作り方が未確定で、保留中。</span>\n<p class=\"firststep\"><strong>最初の一歩：</strong>マンダラチャートの作り方を決める<br><strong>時期：</strong>受験後</p></li>\n          <li><span class=\"pt\">貯金への3万円の移動が未確認</span><span class=\"pd\">臨時収入5万円の分配（貯金3万／事業資金1万／浪費枠1万）は合意済みだが、移動が済んだかの確認が取れていない。</span>\n<p class=\"firststep\"><strong>最初の一歩：</strong>貯金用に分けた3万円を、実際に貯金側へ移す（済んでいたら、その確認だけ）<br><strong>時期：</strong>今すぐ（時期を選ばない小さな手続き）</p></li>\n          <li><span class=\"pt\">MacBookの復活テスト未実施</span><span class=\"pd\">型番・電源が入るか・ローン残額が未確認。復活すれば第2フェーズ（高単価の仕事）への橋になる。</span>\n<p class=\"firststep\"><strong>最初の一歩：</strong>名古屋の実家にいる時に、テレビに繋いで画面が映るか試す<br><strong>時期：</strong>次に実家へ帰った時</p></li>\n          <li><span class=\"pt\">Slavik分析の問いが未回答</span><span class=\"pd\">「虚構の蓄積は証明として機能するか」。学習シリーズ②「数字の式」も未実施。</span>\n<p class=\"firststep\"><strong>最初の一歩：</strong>Muse が用意する学習編「数字の式」を読む。Slavik の問いへの答えは、その時に一緒に考える<br><strong>時期：</strong>受験前から可（知識の蓄積）</p></li>\n          <li><span class=\"pt\">出品アプリでAI依存部分をどうするか</span><span class=\"pd\">彼のアプリは「AIは制作・キュレーションの時だけ働き、アプリ自体にはAIが入っていない」形で作ってきた。その形はそのままストアに出せる。ただし使用時にAIが要る機能（その場の生成・収集）を入れる場合、APIの鍵と利用料を誰が持つかが未決定——(a) サブスク収入で賄い、自前サーバー経由でAPIを使う形（サーバー費用と、ヘビーユーザーが来た時の利用料の膨らみを持つ）／(b) ユーザー自身のキーを持たせる形（摩擦が大きい）／(c) 使用時AIを入れない設計にする。アプリ事業の横展開にも、同じ論点を「AIの置き場所」として置いた。</span>\n<p class=\"firststep\"><strong>最初の一歩：</strong>横展開の最初の1本を決める時に、その題材が制作時のAIだけで成立するかどうかを判定する<br><strong>時期：</strong>横展開の分野を決める時（受験後）</p></li>\n          <li><span class=\"pt\">ストア出品の名義——匿名条件と本名表示の衝突</span><span class=\"pd\">横展開はストア（App Store / Google Play）に出す方針だが、ストアは個人登録だと本名が出る。App Store では販売元に本名（ローマ字）が表示され、Google Play では本名と国が公開され、収益化すると住所まで出る。旧条件（実名なし）とは正面からぶつかったが、2026-11-21の条件の組み直し（ルールの「名前と顔の条件」）で方向はとりあえず決着した——個人登録のまま出し、本名表示は許容する。法人化は必須ではない。表示の実例は2026-11-21に本人の実機で確認済み。最終確認は、横展開の最初の1本を出す時に行う。</span>\n<p class=\"firststep\"><strong>最初の一歩：</strong>横展開の最初の1本を出す時に、名義の最終確認をする（個人登録のまま・本名表示は許容、がとりあえずの決着。後から変えるにはアプリの登録し直しが要るため、出品の直前に必ず確認する）<br><strong>時期：</strong>横展開の最初の1本を出す時（受験後）</p></li>\n        </ul>\n",

   "html": "<div class=\"detail-head\"><h2>アイデアの網</h2></div>\n        <p class=\"sec-lead\">ここは計画ではない。案はどれも未決定で、決まったものだけが計画の側へ移る。</p>\n        <h3>起点——既にある資産</h3>\n        <div class=\"assets\">\n          <div class=\"asset\"><span class=\"an\">図鑑エンジン</span><span class=\"ad\">カード表示・年表・関係図・価格記録・Drive同期・データ収集と整形の型</span></div>\n          <div class=\"asset\"><span class=\"an\">蓄積データ</span><span class=\"ad\">作家・作品・展示・本・価格の記録と、制作ガイドや調査の文章</span></div>\n          <div class=\"asset\"><span class=\"an\">選定の目</span><span class=\"ad\">本人の目で選んだという編集。代表作の棚や関係の記録は他の誰の図鑑にもならない</span></div>\n          <div class=\"asset\"><span class=\"an\">集客ノウハウ</span><span class=\"ad\">調査7本分の実測知。結果画面の型、質問投稿、信用の橋渡し</span></div>\n          <div class=\"asset\"><span class=\"an\">アプリ群</span><span class=\"ad\">図鑑・日記・音楽・映画・食材など、実際に動いている自作アプリ</span></div>\n          <div class=\"asset\"><span class=\"an\">受託の形</span><span class=\"ad\">完成品だけを渡し、エンジンの権利は手元に残す渡し方</span></div>\n          <div class=\"asset\"><span class=\"an\">横展開</span><span class=\"ad\">同じ型を別ジャンルへ広げる進み方。音楽・映画・食材で実証済み</span></div>\n          <div class=\"asset\"><span class=\"an\">特許の検討</span><span class=\"ad\">「公開する前に中核だけ検討する」という判断軸</span></div>\n          <div class=\"asset\"><span class=\"an\">特殊素材への興味</span><span class=\"ad\">画材・支持体・材料への関心と知識。制作と地続きの発明の種</span></div>\n          <div class=\"asset\"><span class=\"an\">アートビジネスの階段</span><span class=\"ad\">価格の階段と、記録・認証の仕組み。作品を売る側の設計図</span></div>\n        </div>\n        <h3>派生するアイデア</h3>\n        <div class=\"idea\" id=\"idea-daicho\">\n          <h3>画家のための作品台帳アプリ</h3>\n          <div class=\"tags\"><span class=\"tl\">起点</span><span class=\"tag\">図鑑エンジン</span><span class=\"tag\">蓄積データの型</span><span class=\"tag\">アートビジネスの階段（記録・認証）</span></div>\n          <p>候補Cの具体形。自分の作品の記録・認証の仕組みを、そのまま同業者向けの道具にする。無人地帯（スマホ完結・日本語・私的な台帳）に置く。</p>\n          <p class=\"firststep\"><strong>最初の一歩：</strong>自分の作品1点を、台帳の型（作品1点カード）で試しに記録してみる<br><strong>時期：</strong>Cの段0が決まったら（今〜共通テストに決める）</p>\n          <p class=\"links\">つながる先：<a href=\"#idea-jutaku\" data-scroll=\"idea-jutaku\">受託パッケージ</a>の実演・見本になる／<a href=\"#idea-yoko\" data-scroll=\"idea-yoko\">横展開ライン</a>と同じ型で作れる</p>\n        </div>\n        <div class=\"idea\" id=\"idea-jutaku\">\n          <h3>画廊・画家向け「図鑑構築」受託パッケージ</h3>\n          <div class=\"tags\"><span class=\"tl\">起点</span><span class=\"tag\">図鑑エンジン</span><span class=\"tag\">受託の形</span><span class=\"tag\">選定の目</span></div>\n          <p>構築一式＋データ化＋運用代行の3段を、値段と納期の目安つきで一枚にまとめた受け皿。美術界との縁と実績が、金と同時に手に入る形。</p>\n          <p class=\"firststep\"><strong>最初の一歩：</strong>構築一式の値段と納期の目安を決めて、一枚に書く<br><strong>時期：</strong>受験後（2027年3月以降）</p>\n          <p class=\"links\">つながる先：受託で生まれた縁が、アートビジネスの<a href=\"#/art\" data-open-link=\"art\">「最初の買い手」「信用の橋渡し」</a>に効く／<a href=\"#idea-curation\" data-scroll=\"idea-curation\">キュレーション受託</a>へ広がる</p>\n        </div>\n        <div class=\"idea\" id=\"idea-yoko\">\n          <h3>ジャンル別図鑑の量産ライン</h3>\n          <div class=\"tags\"><span class=\"tl\">起点</span><span class=\"tag\">図鑑エンジン</span><span class=\"tag\">横展開</span><span class=\"tag\">集客ノウハウ</span></div>\n          <p>スポーツ記録・声優やアイドル・名車・時計・スニーカーなど、「人と作品と記録」の蓄積型で情報が散らかっている分野へ、同じ型で次々に出す。分野ごとに集客は必要だが、作るコストは型で下がる。</p>\n          <p class=\"firststep\"><strong>最初の一歩：</strong>最初に出す分野を1つ選ぶ<br><strong>時期：</strong>受験後（2027年3月以降）</p>\n          <p class=\"links\">つながる先：出た図鑑が増えるほど<a href=\"#idea-report\" data-scroll=\"idea-report\">集計レポート</a>の対象が広がる／当たった分野が<a href=\"#idea-daicho\" data-scroll=\"idea-daicho\">台帳</a>と同じ検証の階段に乗る</p>\n        </div>\n        <div class=\"idea\" id=\"idea-report\">\n          <h3>図鑑データの集計レポート</h3>\n          <div class=\"tags\"><span class=\"tl\">起点</span><span class=\"tag\">蓄積データ</span><span class=\"tag\">選定の目</span></div>\n          <p>権利がきれいな範囲の集計（展覧会や価格の動向）を、画廊やメディア向けに出す。ハードルは高いが、蓄積がそのまま商品になる形。</p>\n          <p class=\"firststep\"><strong>最初の一歩：</strong>権利がきれいな集計のテーマを1つ書き出す<br><strong>時期：</strong>受験後。横展開で図鑑が増えてから</p>\n          <p class=\"links\">つながる先：<a href=\"#idea-jutaku\" data-scroll=\"idea-jutaku\">受託</a>の客との接点になる／<a href=\"#idea-contents\" data-scroll=\"idea-contents\">受験生向けコンテンツ</a>と同じ「中身の切り売り」の系統</p>\n        </div>\n        <div class=\"idea\" id=\"idea-contents\">\n          <h3>ガイド・調査の受験生向けコンテンツ</h3>\n          <div class=\"tags\"><span class=\"tl\">起点</span><span class=\"tag\">蓄積データ（文章）</span><span class=\"tag\">集客ノウハウ</span></div>\n          <p>制作ガイドや美大カリキュラムの調査など、元々の文章の部分を、受験生向けに切り出して売る。図鑑の中身（作品画像や価格データ）とは別系統で、権利の問題が軽い。</p>\n          <p class=\"firststep\"><strong>最初の一歩：</strong>切り出して売る文章を1本選ぶ<br><strong>時期：</strong>受験後（2027年3月以降）</p>\n          <p class=\"links\">つながる先：発信が<a href=\"#idea-bokan\" data-scroll=\"idea-bokan\">送客の母艦</a>の一部になる</p>\n        </div>\n        <div class=\"idea\" id=\"idea-bokan\">\n          <h3>図鑑の発信を母艦にした作品販売</h3>\n          <div class=\"tags\"><span class=\"tl\">起点</span><span class=\"tag\">アプリ群</span><span class=\"tag\">集客ノウハウ</span><span class=\"tag\">アートビジネスの階段</span></div>\n          <p>図鑑まわりの発信が注目を集め、最終的に自分の作品の買い手につながる道。金そのものより、注目と縁の資産として効く。</p>\n          <p class=\"firststep\"><strong>最初の一歩：</strong>図鑑まわりの発信を1本出す<br><strong>時期：</strong>受験後。アートビジネス計画の提示（フェーズ1）と合わせて</p>\n          <p class=\"links\">つながる先：アートビジネスの<a href=\"#/art\" data-open-link=\"art\">価格の階段</a>の段0（無料の提示）と地続き</p>\n        </div>\n        <div class=\"idea\" id=\"idea-sozai\">\n          <h3>画材・支持体の実験から、小さな発明・商品へ</h3>\n          <div class=\"tags\"><span class=\"tl\">起点</span><span class=\"tag\">特殊素材への興味</span><span class=\"tag\">特許の検討</span></div>\n          <p>支持体の構造や材料の組み合わせは、特許の対象になりうる数少ない領域。制作の実験記録が、そのまま発明の種になる。出すなら公開する前に権利の検討を挟む。</p>\n          <p class=\"firststep\"><strong>最初の一歩：</strong>制作で素材の実験をしたら、材料と条件を記録に残す<br><strong>時期：</strong>今すぐ（普段の制作と一体で、負担を増やさない）</p>\n          <p class=\"links\">つながる先：商品化できればアートビジネスの<a href=\"#/art\" data-open-link=\"art\">価格の階段</a>の段1（素材・小物）に乗る</p>\n        </div>\n        <div class=\"idea\" id=\"idea-todo\">\n          <h3>Todoアプリの外部公開</h3>\n          <div class=\"tags\"><span class=\"tl\">起点</span><span class=\"tag\">アプリ群</span><span class=\"tag\">特許の検討</span><span class=\"tag\">集客ノウハウ</span></div>\n          <p>日記アプリのTodo（金額と写真の回収つき）を、友達向けから外へ出す候補。公開する前に、中核の仕組みだけ特許を検討するかどうかが論点になる。</p>\n          <p class=\"firststep\"><strong>最初の一歩：</strong>公開するかどうかを決め、公開するなら先に中核だけ特許の検討をする<br><strong>時期：</strong>受験後以降、公開を決めた時</p>\n          <p class=\"links\">つながる先：アプリ候補の<a href=\"#/business\" data-open-link=\"business\">検証の階段（段0〜段4）</a>に乗せて判定する</p>\n        </div>\n        <div class=\"idea\" id=\"idea-curation\">\n          <h3>他人のコレクションのキュレーション受託</h3>\n          <div class=\"tags\"><span class=\"tl\">起点</span><span class=\"tag\">選定の目</span><span class=\"tag\">受託の形</span><span class=\"tag\">図鑑エンジン</span></div>\n          <p>コレクターや店のコレクションを、テーマ別の「棚」として選び直し、図鑑の形に組む仕事。選定の目そのものが商品になる形。</p>\n          <p class=\"firststep\"><strong>最初の一歩：</strong>身近なコレクション1件を、テーマ別の「棚」に組み直した見本を作る<br><strong>時期：</strong>受験後。受託パッケージの受け皿ができてから</p>\n          <p class=\"links\">つながる先：<a href=\"#idea-jutaku\" data-scroll=\"idea-jutaku\">受託パッケージ</a>の上位メニューになる</p>\n        </div>\n        <p class=\"sec-lead\" style=\"margin-top:16px\">読み方：つながりの多い案ほど、既にある資産を無駄にしない。逆に、起点が1つしかない案は、それ単体の魅力で判断する。</p>",

   "html": "<div class=\"detail-head\"><h2>資産フェーズ</h2></div>\n                <div class=\"note\">\n          <p>木の家の購入／イギリス拠点／人を常勤で雇う／大金の貯金——この4つは、年1,000万円の収入があってもまだ先の話で、「収入」ではなく「資産」のフェーズに属する。収入の階段の外ではなく、最後のチェックポイントの先に置く。</p>\n          <p class=\"firststep\"><strong>最初の一歩：</strong>収入のうち資産に回す割合を決め、積立を始める<br><strong>時期：</strong>年1,000万円に届いてから</p>\n        </div>\n        ",

   "html": "<div class=\"detail-head\"><h2>夢と理想</h2></div>\n                <p>チェックポイントの根拠。2026-11-20に本人が語った内容を、短い一覧で残す。</p>\n        <ul>\n          <li>絵を描き続ける。大きい絵も描く</li>\n          <li>広めの部屋に住む（狭いと壁やら何やらにぶつかる）</li>\n          <li>工場跡地のような広い場所をアトリエにする（井田幸昌のアトリエのような）</li>\n          <li>服や香水などファッションアイテムを買うお金に困らない。高いものも</li>\n          <li>旅行は取材という名目ですぐ行けるくらいになる</li>\n          <li>木の家に住む</li>\n          <li>相棒となる犬がほしい</li>\n          <li>豊かな生活。バーにも通う</li>\n          <li>バイトはしない。画材は値段を見ずに買う</li>\n          <li>親族に恩返しをする</li>\n          <li>貯金は大金を</li>\n          <li>拠点は東京か京都かイギリス。ただし不利な土地は選ばない</li>\n          <li>人は雇ってみたい</li>\n        </ul>",
   "id": "dreams",

   "html": "<div class=\"detail-head\"><h2>ビジネス用語辞典</h2></div>\n        <div class=\"dgroup\"><div class=\"dgroup-h\">売る仕組み</div><ul class=\"terms\"><li class=\"term\"><span class=\"tt\">B2B</span><span class=\"td\">企業相手に売る商売の形。相手は会社なので、判断は個人の好みより論理と予算で進む。</span><span class=\"tm\">図鑑アプリの受託はこちら側。</span></li><li class=\"term\"><span class=\"tt\">B2C</span><span class=\"td\">一般の消費者相手に売る形。</span><span class=\"tm\">note・BOOTH・物販はこちら側。</span></li><li class=\"term\"><span class=\"tt\">D2C</span><span class=\"td\">メーカーが卸や小売を通さず、自分の店（ネット通販など）で消費者に直接売る形。間の取り分がない代わりに、集客は自分でやる。</span></li><li class=\"term\"><span class=\"tt\">サブスクリプション</span><span class=\"td\">月額など、期間ごとに料金を払い続ける売り方。売る側は収入が積み上がって先が読みやすい。</span><span class=\"tm\">noteの定期購読や、将来のアプリ課金の形。</span></li><li class=\"term\"><span class=\"tt\">フリーミアム</span><span class=\"td\">基本は無料で使わせ、有料の追加機能で稼ぐ形。無料の部分が集客の役目をする。</span></li><li class=\"term\"><span class=\"tt\">プラットフォーム</span><span class=\"td\">売る人と買う人が出会う「場」そのものを提供する事業。場の持ち主は手数料で稼ぐ。</span><span class=\"tm\">note・BOOTH・メルカリは全部これ。自分は場の上で売る側。</span></li><li class=\"term\"><span class=\"tt\">Merchant of Record（販売主体）</span><span class=\"td\">売り手に代わって「売主」として立つ事業者。決済だけでなく、買い手の国の売上税・VATや返金対応まで引き受ける。</span><span class=\"tm\">海外向けデジタル商品のGumroadやPaddleがこの形。海外販売の税務を肩代わりする。</span></li><li class=\"term\"><span class=\"tt\">マーケットプレイス</span><span class=\"td\">売り手と買い手が集まる市場型のプラットフォーム。</span><span class=\"tm\">物語のある物のテスト販売先（メルカリ）。</span></li><li class=\"term\"><span class=\"tt\">フランチャイズ</span><span class=\"td\">本部が看板とやり方を貸し、加盟店がロイヤリティを払って商売する仕組み。</span></li><li class=\"term\"><span class=\"tt\">卸売／小売</span><span class=\"td\">卸売は小売店など事業者へまとめて売ること、小売は消費者へ1つずつ売ること。間の差額がそれぞれの取り分になる。</span></li><li class=\"term\"><span class=\"tt\">OEM</span><span class=\"td\">他社に製造を委託し、自社のブランドで売る形。設備を持たずに商品を持てるが、品質の責任は自社ブランド側に残る。</span></li><li class=\"term\"><span class=\"tt\">フロー収入／ストック収入</span><span class=\"td\">フローは働いた分だけ入る一過性の収入、ストックは仕組みや資産から繰り返し入る収入。</span><span class=\"tm\">バイト代はフロー。目指すのはストック側。</span></li><li class=\"term\"><span class=\"tt\">エディション</span><span class=\"td\">版画や写真のように、部数を決めて複数制作する作品の売り方。部数と番号が価値の根拠になる。</span><span class=\"tm\">価格の階段の段2。</span></li><li class=\"term\"><span class=\"tt\">ライセンス</span><span class=\"td\">作品そのものではなく「使う権利」を貸して対価を得る形。手放さずに何度も稼げる。</span><span class=\"tm\">価格の階段の最終段。</span></li><li class=\"term\"><span class=\"tt\">号単価</span><span class=\"td\">日本画などで使われる、号（サイズの単位）あたりの価格。作家の格を表す物差しにもなる。</span><span class=\"tm\">原画価格の目安の置き方。</span></li></ul></div><div class=\"dgroup\"><div class=\"dgroup-h\">お金の数字</div><ul class=\"terms\"><li class=\"term\"><span class=\"tt\">粗利</span><span class=\"td\">売上から原価を引いた残り。商売の土台の儲けで、ここから人件費や家賃などを払う。</span></li><li class=\"term\"><span class=\"tt\">原価</span><span class=\"td\">商品や作品を作る・仕入れるのに直接かかった費用。画材代や印刷代など。</span></li><li class=\"term\"><span class=\"tt\">固定費／変動費</span><span class=\"td\">固定費は売上に関係なく毎月かかる費用（家賃など）、変動費は売れるほど増える費用（材料費など）。</span></li><li class=\"term\"><span class=\"tt\">限界利益</span><span class=\"td\">売上から変動費だけを引いた残り。固定費を賄う源泉で、限界利益率＝限界利益÷売上。損益分岐点の計算に使う。</span><span class=\"tm\">学習「数字の式」で使う式の部品。</span></li><li class=\"term\"><span class=\"tt\">営業利益</span><span class=\"td\">本業の儲け。粗利から、売るため・管理のためにかかる費用を引いたもの。</span></li><li class=\"term\"><span class=\"tt\">経常利益</span><span class=\"td\">営業利益に本業以外の損益（利息など）を足し引きした、会社の普段の実力。</span></li><li class=\"term\"><span class=\"tt\">純利益</span><span class=\"td\">税金など全部を引いた後に残る、最終の儲け。</span></li><li class=\"term\"><span class=\"tt\">キャッシュフロー</span><span class=\"td\">実際のお金の出入り。利益が出ていても現金が尽きれば商売は止まるので、利益とは別に見る。</span></li><li class=\"term\"><span class=\"tt\">運転資金</span><span class=\"td\">商売を回し続けるために手元に必要なお金。在庫や経費を先に払うための分。</span></li><li class=\"term\"><span class=\"tt\">種銭</span><span class=\"td\">事業や投資を始めるための、最初の元手になるお金。仕組みが回り出す前に必要な「点火」のお金で、作り方がその後の事業の形を決める。</span><span class=\"tm\">先駆者の型では、成功者の今の姿ではなく「最初の種銭の作り方」を見るという物差しで出てくる。</span></li><li class=\"term\"><span class=\"tt\">損益分岐点</span><span class=\"td\">売上がちょうど費用と等しくなり、儲けがゼロになる地点。ここを超えると黒字。</span></li><li class=\"term\"><span class=\"tt\">ROI（投資回収）</span><span class=\"td\">投資で得た利益÷かけた費用。お金や時間の使い方が良かったかを比べる物差し。</span><span class=\"tm\">テストの撤退判断にも使う。</span></li><li class=\"term\"><span class=\"tt\">EPC</span><span class=\"td\">アフィリエイトで、1クリックあたりの平均収益（総報酬÷クリック数）。記事や媒体の効率を比べる物差し。</span><span class=\"tm\">アフィリエイトの数字の見方。</span></li><li class=\"term\"><span class=\"tt\">CAC（顧客獲得コスト）</span><span class=\"td\">顧客1人を得るのにかける費用。広告費や紹介料がこれにあたる。</span></li><li class=\"term\"><span class=\"tt\">LTV（顧客生涯価値）</span><span class=\"td\">顧客1人が取引の全期間で払う合計額。CACより大きければ商売が回る。</span><span class=\"tm\">Semrushが1件$200を払える理由。</span></li><li class=\"term\"><span class=\"tt\">ロイヤリティ</span><span class=\"td\">権利や看板を使わせる対価として受け取る使用料。売上などの一定割合で払われることが多い。</span><span class=\"tm\">ライセンス収入の受け取り方の一つ。</span></li></ul></div><div class=\"dgroup\"><div class=\"dgroup-h\">会社と取引</div><ul class=\"terms\"><li class=\"term\"><span class=\"tt\">M&amp;A</span><span class=\"td\">会社や事業の売買。買う側は時間と実績を買い、売る側は出口（現金化）になる。</span></li><li class=\"term\"><span class=\"tt\">IPO（新規公開株）</span><span class=\"td\">会社が株式を証券取引所に上場し、誰でも株を買えるようにすること。大きな資金調達と信用につながる。</span></li><li class=\"term\"><span class=\"tt\">資金調達</span><span class=\"td\">事業に必要なお金を外部から集めること。借入、出資（株を渡す）、補助金などの形がある。</span></li><li class=\"term\"><span class=\"tt\">ベンチャーキャピタル</span><span class=\"td\">成長しそうな未上場企業に出資する専門の投資会社。将来の大きな値上がりで回収する。</span></li><li class=\"term\"><span class=\"tt\">エンジェル投資家</span><span class=\"td\">創業初期の小さな会社に、個人のお金で出資する投資家。</span></li><li class=\"term\"><span class=\"tt\">バリュエーション（企業価値評価）</span><span class=\"td\">会社全体の値段の見積もり。資金調達やM&amp;Aの交渉の土台になる。</span></li><li class=\"term\"><span class=\"tt\">デューデリジェンス</span><span class=\"td\">買収や出資の前に、相手の財務・法務・事業を詳しく調べること。値段とリスクの確認作業。</span></li><li class=\"term\"><span class=\"tt\">シナジー</span><span class=\"td\">2つの事業が合わさることで、単独の合計を超える効果が出ること。</span></li><li class=\"term\"><span class=\"tt\">子会社・持株会社</span><span class=\"td\">子会社は他社に経営を支配されている会社、持株会社は他社の株を持つことでグループ全体を支配する会社。</span></li><li class=\"term\"><span class=\"tt\">エスクロー</span><span class=\"td\">取引の間、第三者が代金を預かる仕組み。成果や納品が確認されてから、売り手に渡る。</span><span class=\"tm\">make.funの賞金はこの形で預けられる。</span></li></ul></div><div class=\"dgroup\"><div class=\"dgroup-h\">集客と商品</div><ul class=\"terms\"><li class=\"term\"><span class=\"tt\">アフィリエイト</span><span class=\"td\">成果報酬型の広告。紹介した商品が売れたら紹介料が入る。</span><span class=\"tm\">アフィリエイト事業の本体。</span></li><li class=\"term\"><span class=\"tt\">ASP</span><span class=\"td\">広告主と媒体の間に入り、計測・集計・支払いを代行する仲介会社。日本ではA8.netなど、海外ではImpactなど。</span></li><li class=\"term\"><span class=\"tt\">成果承認と否認</span><span class=\"td\">発生した成果を広告主が認めれば承認（報酬が確定）、キャンセルや規約違反などで認めなければ否認（報酬なし）。画面の発生額は確定収入ではない。</span></li><li class=\"term\"><span class=\"tt\">クッキー期間</span><span class=\"td\">読者がリンクを踏んでから、その期間内に買えば紹介者の成果になる計測の有効期間。プログラムごとに数日から120日超まで差がある。</span></li><li class=\"term\"><span class=\"tt\">ラストクリック</span><span class=\"td\">複数の紹介リンクを踏んだ場合、最後に踏んだリンクの媒体に成果が付く方式。購入直前に別の媒体に踏まれると成果を取られる。</span></li><li class=\"term\"><span class=\"tt\">ステマ規制</span><span class=\"td\">広告なのに広告と分からない宣伝を禁じる日本の規制（景品表示法、2023年10月施行）。アフィリエイト記事には「広告」「PR」の表示が要る。</span><span class=\"tm\">アフィリエイトとSNS運用の禁止ライン。</span></li><li class=\"term\"><span class=\"tt\">E-E-A-T</span><span class=\"td\">Googleがコンテンツの信頼性を測る考え方。経験・専門性・権威性・信頼性の頭文字。実際に使った経験と情報の正確さが問われる。</span></li><li class=\"term\"><span class=\"tt\">ブルーオーシャン</span><span class=\"td\">競争相手のいない未開拓の市場。逆に競争の激しい市場はレッドオーシャン。</span><span class=\"tm\">物差し②「取った位置が資産になるか」とセットで見る。</span></li><li class=\"term\"><span class=\"tt\">集客</span><span class=\"td\">お客さんを連れてくること全般。</span><span class=\"tm\">主にSNSや検索からの流入を指す。</span></li><li class=\"term\"><span class=\"tt\">ファネル</span><span class=\"td\">見込み客が、知る→興味を持つ→買う→続ける、と進んでいく流れ全体を指す言葉。漏斗（ろうと）の形に例えられ、入口は広く、進むごとに人数が絞られていく。</span><span class=\"tm\">集客から販売までの導線の読み方。お金とは何かの「次のレッスン」（集客と販売の実務）でも出てくる。</span></li><li class=\"term\"><span class=\"tt\">コンバージョン</span><span class=\"td\">サイトや記事に来た人が、購入・申込など狙った行動をすること。その割合がコンバージョン率。</span></li><li class=\"term\"><span class=\"tt\">痛み止め／ビタミン</span><span class=\"td\">痛み止めは「今の困りごとを消す」商品で買われやすく、ビタミンは「あったら良い」商品で買われにくい、という商品の性格の例え。</span><span class=\"tm\">事業を選ぶ時の物差し。</span></li><li class=\"term\"><span class=\"tt\">ブランディング</span><span class=\"td\">作り手や商品の「らしさ」を人の頭の中に作り、選ばれる理由にすること。</span></li><li class=\"term\"><span class=\"tt\">マーケティング</span><span class=\"td\">売れる仕組みづくり全体のこと。集客・価格・見せ方・届け方を含む広い言葉。</span></li><li class=\"term\"><span class=\"tt\">クラウドファンディング</span><span class=\"td\">ネットで不特定多数から少しずつ資金を集める方法。支援＝予約購入の形が多く、需要の確認にも使える。</span></li><li class=\"term\"><span class=\"tt\">切り抜き</span><span class=\"td\">長い配信や動画から一部を切り出して、短い動画として別アカウント・別媒体で拡散する手法。切り抜く側に収益機会を与えて「公認」にすると、切り抜きアカウントの群れがそのまま集客の装置になる。</span><span class=\"tm\">噂のタカハシの拡散の仕組みが代表例（先駆者の型）。</span></li></ul></div><div class=\"firststep\"><span class=\"fs-k\">最初の一歩</span>分からない言葉に出会ったら、まずここで引く<span class=\"fs-sep\">／</span><span class=\"fs-k\">時期</span>随時（新しい用語は都度追加する）</div><div class=\"src\">出典：学習資料（アフィリエイトの仕組み／個人アートビジネス全体設計）をもとに作成（2026-11-20）</div><div class=\"dgroup\"><div class=\"dgroup-h\">税金と制度</div><ul class=\"terms\"><li class=\"term\"><span class=\"tt\">累進課税</span><span class=\"td\">所得が多いほど高い税率がかかる仕組み。税率は所得の全部ではなく、区切りを超えた部分にだけかかる。</span></li><li class=\"term\"><span class=\"tt\">基礎控除</span><span class=\"td\">所得税の計算で、誰でも所得から差し引ける控除。令和7年分から本則58万円（所得に応じて上乗せあり）。</span></li><li class=\"term\"><span class=\"tt\">源泉徴収</span><span class=\"td\">給料や報酬を払う側が、税金を先に差し引いて国に納める仕組み。会社員の税金が自動で引かれるのはこれ。</span></li><li class=\"term\"><span class=\"tt\">年末調整</span><span class=\"td\">会社が1年分の給料の税金を精算する手続き。毎月の源泉徴収は概算なので、ここで過不足を合わせる。</span></li><li class=\"term\"><span class=\"tt\">確定申告</span><span class=\"td\">1年分の所得と税金を自分で計算して税務署に出す手続き。年末調整で完結しない控除や、副業の所得はここで扱う。</span><span class=\"tm\">ビジネスの段取り（事務の段取り）でも扱う。</span></li><li class=\"term\"><span class=\"tt\">医療費控除</span><span class=\"td\">1年間の医療費が一定額（原則10万円）を超えた分を、所得から差し引ける制度。確定申告が必要。</span></li><li class=\"term\"><span class=\"tt\">ふるさと納税</span><span class=\"td\">自治体への寄付で、自己負担2,000円を超える分が所得税・住民税から差し引かれる制度。返礼品は寄付額の3割以下がルール。</span></li><li class=\"term\"><span class=\"tt\">住民税</span><span class=\"td\">前年の所得にかかる地方税。所得割は約10%で、1年遅れで請求が来るのが特徴。</span></li><li class=\"term\"><span class=\"tt\">高額療養費制度</span><span class=\"td\">医療費の自己負担が1か月で上限を超えた分が戻る、健康保険の制度。上限は所得で決まる。</span></li><li class=\"term\"><span class=\"tt\">傷病手当金</span><span class=\"td\">病気やケガで働けない時に健康保険から出る給付。給料の約3分の2が通算1年6か月まで。国民健康保険には原則ない。</span></li><li class=\"term\"><span class=\"tt\">出産手当金</span><span class=\"td\">出産で休む期間（産前42日・産後56日）に健康保険から出る給付。1日あたり給料の約3分の2。</span></li><li class=\"term\"><span class=\"tt\">出産育児一時金</span><span class=\"td\">子ども1人の出産につき50万円が支給される制度。健康保険・国民健康保険のどちらでも出る。</span></li><li class=\"term\"><span class=\"tt\">育児休業給付金</span><span class=\"td\">育休中に雇用保険から出る給付。最初の180日は賃金の67%、以後は50%。税金はかからず、社会保険料も免除。</span></li><li class=\"term\"><span class=\"tt\">雇用保険</span><span class=\"td\">失業・育休などの時に給付を出す保険。いわゆる失業保険。保険料は働く人と会社が負担し、会社の割合の方が大きい。</span></li><li class=\"term\"><span class=\"tt\">労災保険</span><span class=\"td\">仕事中・通勤中のケガや病気に給付を出す保険。保険料は全額会社負担で、アルバイト・パートも対象。</span></li><li class=\"term\"><span class=\"tt\">国民年金</span><span class=\"td\">20歳から60歳までの全員が入る、年金の1階部分。保険料は収入によらず定額で、老齢基礎年金の土台になる。</span></li><li class=\"term\"><span class=\"tt\">厚生年金</span><span class=\"td\">会社員・公務員が入る、年金の2階部分。保険料は給料の18.3%を会社と折半し、受給額は給料と加入期間で決まる。</span></li><li class=\"term\"><span class=\"tt\">ねんきん定期便</span><span class=\"td\">誕生月に届く、年金の加入記録の通知。実績と見込額が書いてあり、50歳未満と以上で見込額の前提が違う。</span></li><li class=\"term\"><span class=\"tt\">付加年金</span><span class=\"td\">国民年金の第1号被保険者だけが使える上乗せ。月400円の付加保険料で、年金額が「200円×納付月数」ずつ増える。</span></li><li class=\"term\"><span class=\"tt\">児童手当</span><span class=\"td\">高校生年代までの子に出る手当。月10,000円、3歳未満は15,000円、第3子以降は30,000円。2024年10月から所得制限がなくなった。</span></li><li class=\"term\"><span class=\"tt\">複利</span><span class=\"td\">利息にも利息がつく増え方。時間が長いほど差が開く。借金の側では逆向きに効く。</span><span class=\"tm\">「数字の式」と「お金の常識」で使う。</span></li><li class=\"term\"><span class=\"tt\">72の法則</span><span class=\"td\">72÷金利（%）で、元本が2倍になる年数の目安が出る近似式。年3%なら約24年。</span></li><li class=\"term\"><span class=\"tt\">預金保険制度</span><span class=\"td\">銀行が破綻しても、預金が1人あたり・1銀行ごとに、元本1,000万円までとその利息が守られる仕組み。</span></li><li class=\"term\"><span class=\"tt\">NISA</span><span class=\"td\">投資の利益に税金がかからない国の制度。2024年からの新NISAは、年間360万円・生涯1,800万円の非課税枠で、期限は無期限。</span></li><li class=\"term\"><span class=\"tt\">iDeCo（イデコ）</span><span class=\"td\">自分で掛金を出す年金。掛金が全額所得控除になり運用益も非課税だが、原則60歳まで引き出せない。</span></li><li class=\"term\"><span class=\"tt\">インデックス投資</span><span class=\"td\">株価指数など市場全体に連動する商品を買う投資の形。広く分散し、低コストなのが前提。</span><span class=\"tm\">お金の常識（投資の常識）でも扱う。</span></li><li class=\"term\"><span class=\"tt\">信託報酬</span><span class=\"td\">投資信託を持っている間ずっとかかる、運用の手数料。年率で示され、長期では差が大きく開く。</span></li><li class=\"term\"><span class=\"tt\">リボ払い</span><span class=\"td\">クレジットカードの支払い方法。月々の支払額を一定にする代わりに、残高に金利（実質年率15%前後）がかかり続ける形。</span></li><li class=\"term\"><span class=\"tt\">ポンジ・スキーム</span><span class=\"td\">運用の実態がなく、後から集めたお金を先の出資者への「配当」に回す詐欺の構造。必ず破綻する。</span></li></ul></div>",

/* ---------- chapters (v3.2.0: the book rebuild) ----------
   His call: tear the tab classification down and rebuild the
   app as a book. The hierarchy is 章 (chapter) → 部 (the
   sections, ids unchanged) → グループ (the detail sub-tabs).
   Home is the book's table of contents: the theme strip and
   the checkpoint band stay at the top, the chapter list below
   them, and the settings (formerly the その他 tab) at the
   bottom. A chapter page lists its sections as cards, exactly
   as a tab list did. Sections carry their chapter in the tab
   attribute (ch1..ch7 / appendix); data written before the
   rebuild (tab = art / business / money / dict / other) keeps
   its place through CHAPTER_BY_ID, so an old cache or an old
   Drive file still lands every section in its chapter. An
   unknown section defaults to 第6章 決めごと — the chapter
   that holds 未決・保留, the book's inbox. The chapter map
   (his approved draft, 2026-11-21):
     第1章 お金の世界の仕組み — お金とは何か／お金の常識／数字の式
     第2章 稼ぐ形のカタログ — 事業形態（ビジネス）／事業形態（アート）
     第3章 画家として稼ぐ — アートビジネス計画
     第4章 自分の事業 — 事業リスト／ビジネス計画／AIパイプライン
     第5章 段取り — ビジネスの段取り
     第6章 決めごと — ルール／未決・保留／アイデアの網
     第7章 稼いだ先 — 資産フェーズ／夢と理想
     付録 — ビジネス用語辞典 */
var CHAPTERS = ['ch1', 'ch2', 'ch3', 'ch4', 'ch5', 'ch6', 'ch7', 'appendix'];
var CHAPTER_NAMES = { ch1: 'お金の世界の仕組み', ch2: '稼ぐ形のカタログ', ch3: '画家として稼ぐ', ch4: '自分の事業', ch5: '段取り', ch6: '決めごと', ch7: '稼いだ先', appendix: 'ビジネス用語辞典' };
var CHAPTER_NUMS = { ch1: '第1章', ch2: '第2章', ch3: '第3章', ch4: '第4章', ch5: '第5章', ch6: '第6章', ch7: '第7章', appendix: '付録' };
var CHAPTER_BY_ID = { money: 'ch1', literacy: 'ch1', numbers: 'ch1', forms: 'ch2', artforms: 'ch2', art: 'ch3', bizlist: 'ch4', appbiz: 'ch4', affiliate: 'ch4', digital: 'ch4', story: 'ch4', makefun: 'ch4', note: 'ch4', business: 'ch4', pipeline: 'ch4', lifecycle: 'ch5', rules: 'ch6', pending: 'ch6', ideas: 'ch6', assets: 'ch7', dreams: 'ch7', dict: 'appendix' };
var currentChapter = null; /* null = the table of contents */
var currentTab = null; /* v3.2.1: non-null while a pill-bar tab page is the list on show; chapter and tab are exclusive — exactly one list mode at a time */
var pillSel = 'business'; /* the tab the pill bar shows as chosen; a chapter page or a detail keeps the last tab's selection */
function secChapter(sec){
  if(sec && CHAPTERS.indexOf(sec.tab) >= 0) return sec.tab;
  if(sec && CHAPTER_BY_ID[sec.id]) return CHAPTER_BY_ID[sec.id];
  return 'ch6';
}
function chapterSections(ch){
  return DATA.sections.filter(function(s){ return secChapter(s) === ch; });
}
function renderCount(){
  if(currentTab){ $('topcount').textContent = '全' + DATA.sections.length + '件 ・ ' + TAB_NAMES[currentTab] + ' ' + tabSections(currentTab).length + '件'; return; }
  if(!currentChapter){ $('topcount').textContent = '全' + DATA.sections.length + '件'; return; }
  $('topcount').textContent = '全' + DATA.sections.length + '件 ・ ' + CHAPTER_NUMS[currentChapter] + ' ' + chapterSections(currentChapter).length + '件';
}
function renderTOC(){
  var h = '';
  CHAPTERS.forEach(function(ch){
    var secs = chapterSections(ch);
    if(!secs.length) return;
    /* sections sharing a title inside one chapter (第2章's two
       事業形態） carry their tag in the subs line so the two
       parts stay tellable apart on the contents page */
    var seenTitles = {};
    secs.forEach(function(s){ seenTitles[s.title] = (seenTitles[s.title] || 0) + 1; });
    var subs = secs.map(function(s){ return seenTitles[s.title] > 1 && s.tag ? s.title + '（' + s.tag + '）' : s.title; }).join('／');
    h += '<button class="tocrow" data-chapter="' + ch + '"><span class="toc-num">' + CHAPTER_NUMS[ch] + '</span>' +
      '<span class="toc-main"><span class="toc-title">' + esc(CHAPTER_NAMES[ch]) + '</span>' +
      '<span class="toc-subs">' + esc(subs) + '</span></span><span class="toc-chev">›</span></button>';
  });
  $('chapterList').innerHTML = h;
  renderSettings();
}

/* ---------- toast (the zukan app's, ported) ---------- */
function toast(msg, ms){
  var t = $('toast'); if(!t) return;
  $('toastmsg').textContent = msg;
  var act = $('toastact'); act.classList.add('hidden'); act.onclick = null;
  t.classList.add('on');
  clearTimeout(toast._tm); toast._tm = setTimeout(function(){ t.classList.remove('on'); }, ms || 2600);
}

/* ---------- fetch with timeout + content hash (the zukan app's
   fetchT / syncHashOfStr, ported verbatim) ---------- */
function fetchT(url, opts, ms){
  return new Promise(function(resolve, reject){
    var ctl = null;
    try{ ctl = new AbortController(); }catch(e){}
    var to = setTimeout(function(){ try{ if(ctl) ctl.abort(); }catch(e){} reject(new Error('通信がタイムアウトしました')); }, ms || 30000);
    var o = Object.assign({}, opts || {}); if(ctl) o.signal = ctl.signal;
    fetch(url, o).then(function(r){ clearTimeout(to); resolve(r); }, function(e){ clearTimeout(to); reject(e); });
  });
}
function syncHashOfStr(s){
  var h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for(var i = 0; i < s.length; i++){ var ch = s.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return s.length + ':' + (h2 >>> 0).toString(16) + (h1 >>> 0).toString(16);

/* ---------- relay transport (the zukan app's, ported) ----------
   The relay spec is frozen (ping/stat/get/put + a filename
   pattern); bizplan.json matches the pattern, so the relay works
   for this app with NO relay-side change. getSince is NOT used:
   server-side it only splits the artists / exhibitions keys and
   returns every other root key (here: sections, home) wholesale,
   so stat + get is equivalent and simpler.
   The config lives in this app's own key. When it is absent, the
   zukan app's same-origin config is adopted read-only, so a
   device that already runs Arcanum's relay needs no new setup
   here. The secret is never embedded in this file. */
var LS_RELAY = 'bizplan.relay';
var RELAY_URL_DEFAULT = 'https://script.google.com/macros/s/AKfycbziV1Wpv7AWSUJJgaKyRzFeBR81Td4CjryGGuq4avt1xAo-e2mbeyS2vBpCuqx4_KI/exec';
function relayCfgInfo(){
  var own = null;
  try{ own = JSON.parse(localStorage.getItem(LS_RELAY) || 'null'); }catch(e){}
  if(own && own.disabled) return null;
  if(own && own.secret) return { url: own.url || RELAY_URL_DEFAULT, secret: own.secret, adopted: false };
  try{
    var z = JSON.parse(localStorage.getItem('zukan.relay') || 'null');
    if(z && z.secret) return { url: z.url || RELAY_URL_DEFAULT, secret: z.secret, adopted: true };
  }catch(e){}
  return null;
}
function relayCfg(){ var i = relayCfgInfo(); return i ? { url: i.url, secret: i.secret } : null; }
function relayReady(){ return !!relayCfg(); }
async function relayCall(op, name, content, extra){
  var c = relayCfg(); if(!c) throw new Error('中継が未設定です');
  var body = JSON.stringify(Object.assign({ secret: c.secret, op: op, name: name, content: content }, extra || {}));
  var healed = false;
  for(;;){
    var res = await fetchT(c.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body }, 60000);
    if(!res.ok) throw new Error('中継 HTTP ' + res.status);
    var text = await res.text();
    var ctype = (res.headers && res.headers.get) ? (res.headers.get('content-type') || '') : '';
    var trimmed = text.replace(/^\s+/, '');
    /* sentinel self-heal (zukan v27.11 B): a body opening with the
       relay's doGet text — or any non-JSON text/plain body — proves
       the POST was re-driven as a GET in the redirect chain.
       Re-issue the POST once, silently, right here. */
    var sentinel = trimmed.indexOf('Muse relay is alive') === 0 || (/^text\/plain/i.test(ctype) && trimmed.charAt(0) !== '{');
    if(sentinel && !healed){ healed = true; continue; }
    var j = null;
    try{ j = JSON.parse(text); }catch(e){}
    if(!j || typeof j !== 'object' || typeof j.ok === 'undefined'){
      /* envelope discipline (zukan v27.11 A): a body that is not
         the JSON envelope is a transport error — never surfaced
         raw to the user. */
      var err = new Error('中継の応答が正しく届きませんでした');
      err.code = 'RELAY_BAD_BODY';
      throw err;
    }
    if(!j.ok) throw new Error('中継エラー：' + ((j && j.error) || 'unknown'));
    return j;
  }
}
function relaySave(url, secret){
  url = String(url || '').trim() || RELAY_URL_DEFAULT; secret = String(secret || '').trim();
  if(!secret){ toast('シークレットを入力してください'); return false; }
  try{ localStorage.setItem(LS_RELAY, JSON.stringify({ url: url, secret: secret })); }catch(e){}
  renderSyncStatus();
  return true;
}
function relayForget(){
  var info = relayCfgInfo();
  try{
    if(info && !info.adopted) localStorage.removeItem(LS_RELAY);
    else localStorage.setItem(LS_RELAY, JSON.stringify({ disabled: true }));
  }catch(e){}
  renderSyncStatus();

}

}

/* ---------- GIS token (popup only — never a redirect on iOS) --- */
function waitGis(){
  return new Promise(function(res, rej){
    var n = 0;
    var iv = setInterval(function(){
      if(window.google && google.accounts && google.accounts.oauth2){ clearInterval(iv); res(); }
      else if(++n > 40){ clearInterval(iv); rej(new Error('gis-timeout')); }
    }, 250);
  });
}
/* the token lives in sessionStorage with its expiry (the zukan
   app's storeToken), so an in-session reload does not need a new
   GIS round-trip */
function storeToken(tok, expiresInSec){
  accessToken = tok;
  tokenExp = Date.now() + (expiresInSec ? expiresInSec * 1000 : 3000000);
  try{ sessionStorage.setItem('bizplan.token', tok); sessionStorage.setItem('bizplan.tokenExp', String(tokenExp)); }catch(e){}
}
function tokenFromSession(){
  if(accessToken && Date.now() < tokenExp - 30000) return accessToken;
  try{
    var t = sessionStorage.getItem('bizplan.token'), x = Number(sessionStorage.getItem('bizplan.tokenExp') || 0);
    if(t && Date.now() < x - 30000){ accessToken = t; tokenExp = x; return t; }
  }catch(e){}
  return null;
}
function clearToken(){
  accessToken = null; tokenExp = 0;
  try{ sessionStorage.removeItem('bizplan.token'); sessionStorage.removeItem('bizplan.tokenExp'); }catch(e){}
}
function requestToken(interactive){
  return new Promise(function(res, rej){
    waitGis().then(function(){
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: 'https://www.googleapis.com/auth/drive.file',
        callback: function(resp){
          if(resp && resp.access_token){ storeToken(resp.access_token, resp.expires_in); res(accessToken); }
          else rej(new Error('no-token'));
        },
        error_callback: function(err){ rej(new Error(err && err.type ? err.type : 'gis-error')); }
      });
      /* the zukan v5.71.2 rule: an explicit connect ALWAYS shows
         the account chooser — he holds two Google accounts, and a
         silent pick once synced the wrong account's Drive */
      tokenClient.requestAccessToken({ prompt: interactive ? 'select_account' : '' });
    }).catch(rej);
  });
}
function getValidToken(interactive){
  var t = tokenFromSession();
  if(t) return Promise.resolve(t);
  return requestToken(interactive);
}
/* silent reconnect (the zukan app's): only on a device that has
   connected before, throttled to one silent attempt a minute,
   and a failure never becomes an error state */
var silentTryAt = 0;
function trySilentReconnect(){
  if(!isConnected() || relayReady()) return;
  if(tokenFromSession()) return;
  var now = Date.now();
  if(now - silentTryAt < 60000) return;
  silentTryAt = now;
  requestToken(false).then(function(){ appSync(false); }).catch(function(){});
}
function connectDrive(){
  getValidToken(true).then(function(){
    setConnected(true); syncError = null;
    renderSyncStatus();
    appSync(true);

    renderSyncStatus();
  });
}
function disconnectDrive(){

  setConnected(false); syncError = null;

}

/* ---------- Drive (GIS) primitives ---------- */
function driveFetch(url, opts){
  return getValidToken(false).then(function(token){
    var headers = Object.assign({}, (opts && opts.headers) || {}, { 'Authorization': 'Bearer ' + token });
    return fetchT(url, Object.assign({}, opts || {}, { headers: headers }), 60000);
  }).then(function(res){
    if(res.status === 401){ clearToken(); throw new Error('auth-401'); }
    if(!res.ok) throw new Error('drive-' + res.status);

  });
}
function ensureFileId(){
  if(fileId) return Promise.resolve(fileId);

    .then(function(res){ return res.json(); })
    .then(function(j){
      if(j.files && j.files.length){ fileId = j.files[0].id; return fileId; }
      return driveFetch('https://www.googleapis.com/drive/v3/files', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: FILE_NAME, mimeType: 'application/json' })
      }).then(function(cres){ return cres.json(); }).then(function(cj){
        fileId = cj.id;

        return uploadData(DATA).then(function(){ return fileId; });
      });
    });
}

    return driveFetch('https://www.googleapis.com/drive/v3/files/' + id + '?fields=modifiedTime');
  }).then(function(res){ return res.json(); }).then(function(j){ return j && j.modifiedTime ? String(j.modifiedTime) : null; });
}
function normalizeData(j){

}

    .then(function(res){ return res.text(); })

      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
